<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Monster World AR</title>

<style>

* {
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body {
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#10141b;
    font-family:Arial,sans-serif;
}

canvas {
    position:fixed;
    inset:0;
}

#ui {
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
}

.panel {
    background:rgba(10,15,22,.78);
    color:white;
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(10px);
    border-radius:16px;
}

#topbar {
    position:absolute;
    top:12px;
    left:12px;
    right:12px;
    display:flex;
    justify-content:space-between;
    gap:10px;
}

#title {
    padding:11px 15px;
    font-size:18px;
    font-weight:bold;
}

#xpbox {
    padding:10px 14px;
    min-width:170px;
}

#xpbar {
    height:7px;
    background:#303641;
    border-radius:10px;
    overflow:hidden;
    margin-top:5px;
}

#xpfill {
    width:0%;
    height:100%;
    background:#55e77b;
    transition:.3s;
}

#bottom {
    position:absolute;
    left:12px;
    right:12px;
    bottom:15px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
}

#status {
    padding:10px 15px;
    text-align:center;
    max-width:95%;
}

button {
    pointer-events:auto;
    border:0;
    border-radius:14px;
    padding:13px 18px;
    font-weight:bold;
    font-size:16px;
}

#start {
    background:#4de477;
    color:#08200f;
}

#catch {
    display:none;
    background:#ffd331;
    color:#161200;
}

#collectionButton {
    background:#5968ff;
    color:white;
}

#collection {
    display:none;
    pointer-events:auto;
    position:absolute;
    inset:55px 12px 90px;
    overflow:auto;
    padding:15px;
}

#collection h2 {
    margin-top:0;
}

.monsterCard {
    background:rgba(255,255,255,.08);
    border-radius:14px;
    padding:12px;
    margin-bottom:10px;
    color:white;
}

.cardHead {
    display:flex;
    justify-content:space-between;
    font-weight:bold;
}

.small {
    font-size:13px;
    opacity:.75;
}

.stat {
    margin-top:7px;
}

#unsupported {
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:#111820;
    color:white;
    padding:30px;
    text-align:center;
}

#unsupported h1 {
    margin-top:60px;
}

#closeCollection {
    background:#444d5b;
    color:white;
    width:100%;
}

</style>
</head>

<body>

<div id="ui">

    <div id="topbar">

        <div id="title" class="panel">
            👾 Monster World
        </div>

        <div id="xpbox" class="panel">

            <div>
                Level <b id="playerLevel">1</b>
            </div>

            <div class="small">
                XP:
                <span id="xpText">0 / 100</span>
            </div>

            <div id="xpbar">
                <div id="xpfill"></div>
            </div>

        </div>

    </div>


    <div id="collection" class="panel">

        <h2>🎒 Sammlung</h2>

        <div id="collectionList"></div>

        <button id="closeCollection">
            Schließen
        </button>

    </div>


    <div id="bottom">

        <div id="status" class="panel">
            Bereit für dein erstes Monster.
        </div>

        <button id="start">
            AR starten
        </button>

        <button id="catch">
            👾 Monster fangen
        </button>

        <button id="collectionButton">
            🎒 Sammlung
        </button>

    </div>

</div>


<div id="unsupported">

    <h1>AR nicht verfügbar</h1>

    <p>
        Dieses Gerät unterstützt momentan kein
        echtes WebXR-AR mit Hit-Test.
    </p>

    <p>
        Das Spiel verwendet absichtlich keine
        künstliche Bildschirmpositionierung.
    </p>

</div>

/* =====================================================
   ORTE
   Eine Zeile = ein Spawnpunkt
===================================================== */

const LOCATIONS = [];

function addLocation(
    name,
    latitude,
    longitude,
    monster
) {

    LOCATIONS.push({
        name,
        latitude,
        longitude,
        monster
    });

}


/*
   Beispiel für eigene Orte:

   addLocation(
       "Mein Spielplatz",
       48.12345,
       11.12345,
       "gruenling"
   );

   Für die Demo wird GPS ignoriert.
*/


/* =====================================================
   SPIELER
===================================================== */

let player = JSON.parse(
    localStorage.getItem("monsterPlayer") ||
    "null"
);

if (!player) {

    player = {

        level:1,

        xp:0,

        totalCaught:0,

        collection:{}

    };

}


function savePlayer() {

    localStorage.setItem(
        "monsterPlayer",
        JSON.stringify(player)
    );

}


/* =====================================================
   XP / LEVEL
===================================================== */

function xpNeeded() {

    return 100 +
        (player.level - 1) * 40;

}


function addXP(amount) {

    player.xp += amount;

    while (
        player.xp >= xpNeeded()
    ) {

        player.xp -= xpNeeded();

        player.level++;

        status(
            "⭐ Level Up! Du bist jetzt Level " +
            player.level + "!"
        );

    }

    savePlayer();

    updateUI();

}


function updateUI() {

    document.getElementById(
        "playerLevel"
    ).textContent =
        player.level;

    document.getElementById(
        "xpText"
    ).textContent =
        player.xp +
        " / " +
        xpNeeded();

    document.getElementById(
        "xpfill"
    ).style.width =
        (
            player.xp /
            xpNeeded() *
            100
        ) + "%";

}


updateUI();


/* =====================================================
   THREE.JS
===================================================== */

const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(
        70,
        innerWidth / innerHeight,
        .01,
        100
    );


const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        alpha:true
    });


renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.xr.enabled = true;

renderer.xr.setReferenceSpaceType(
    "local"
);

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   LICHT
===================================================== */

    new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        2.4

);


const light =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

light.position.set(
    2,
    5,
    3
);

scene.add(light);


/* =====================================================
   3D-HILFSFUNKTIONEN
===================================================== */

function mat(color, metal=0) {

    return new THREE.MeshStandardMaterial({

        color,

        roughness:.55,

        metalness:metal

    });

}


function sphere(
    group,
    radius,
    color,
    x,
    y,
    z,
    sx=1,
    sy=1,
    sz=1
) {

    const m =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                radius,
                24,
                18
            ),
            mat(color)
        );

    m.position.set(
        x,y,z
    );

    m.scale.set(
        sx,sy,sz
    );

    group.add(m);

    return m;

}


function box(
    group,
    x,
    y,
    z,
    sx,
    sy,
    sz,
    color
) {

    const m =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                sx,sy,sz
            ),
            mat(color)
        );

    m.position.set(
        x,y,z
    );

    group.add(m);

    return m;

}


function cone(
    group,
    radius,
    height,
    color,
    x,
    y,
    z
) {

    const m =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                radius,
                height,
                20
            ),
            mat(color)
        );

    m.position.set(
        x,y,z
    );

    group.add(m);

    return m;

}


function eye(
    group,
    x,
    y,
    z
) {

    sphere(
        group,
        .055,
        0xffffff,
        x,y,z
    );

    sphere(
        group,
        .025,
        0x111111,
        x,
        y,
        z+.045
    );

}

/* =====================================================
   MODELL-AUSWAHL
===================================================== */

const MODEL_FUNCTIONS = {

    gruenling,
    flamiro,
    aquini,
    funkel,
    frostel,
    steinix,
    windli,
    schatto,
    blattin,
    kristalix

};


/* =====================================================
   MONSTER LEVEL / ENTWICKLUNG
===================================================== */

function getStage(level) {

    if(level >= 25)
        return 3;

    if(level >= 10)
        return 2;

    return 1;

}


function getMonsterName(
    id,
    level
) {

    const data =
        MONSTERS[id];

    const stage =
        getStage(level);

    if(stage === 1)
        return data.name;

    if(stage === 2)
        return data.evolution1;

    return data.evolution2;

}


/* =====================================================
   STÄRKE-SYSTEM
===================================================== */

function calculateStrength(
    id,
    level
) {

    const base = {

        gruenling:18,
        flamiro:22,
        aquini:20,
        funkel:24,
        frostel:23,
        steinix:28,
        windli:19,
        schatto:27,
        blattin:21,
        kristalix:31

    }[id];

    const randomBonus =
        0;

    return Math.floor(
        base +
        level * 2.4 +
        randomBonus
    );

}


/* =====================================================
   MONSTER ERSTELLEN
===================================================== */

let activeMonster = null;

let monsterAnimationTime = 0;


function createMonster(
    id,
    level
) {

    const stage =
        getStage(level);

    const fn =
        MODEL_FUNCTIONS[id];

    const model =
        fn(stage);

    model.userData.id =
        id;

    model.userData.level =
        level;

    model.userData.stage =
        stage;

    model.userData.strength =
        calculateStrength(
            id,
            level
        );

    return model;

}


/* =====================================================
   TESTMONSTER
===================================================== */

const TEST_MODE = true;

const TEST_MONSTER_ID =
    "gruenling";

const TEST_MONSTER_LEVEL =
    7;


/* =====================================================
   AR
===================================================== */

let session = null;

let hitTestSource = null;

let referenceSpace = null;

let monsterPlaced = false;


async function startAR() {

    if(!navigator.xr) {

        document
            .getElementById("unsupported")
            .style.display =
            "block";

        return;

    }


    let supported = false;

    try {

        supported =
            await navigator.xr
                .isSessionSupported(
                    "immersive-ar"
                );

    } catch(e) {

        supported = false;

    }


    if(!supported) {

        document
            .getElementById("unsupported")
            .style.display =
            "block";

        return;

    }


    try {

        session =
            await navigator.xr.requestSession(
                "immersive-ar",
                {
                    requiredFeatures:[
                        "hit-test"
                    ],

                    optionalFeatures:[
                        "dom-overlay"
                    ],

                    domOverlay:{
                        root:
                        document.body
                    }

                }
            );


        renderer.xr.setSession(
            session
        );


        referenceSpace =
            await session.requestReferenceSpace(
                "local"
            );


        const viewer =
            await session.requestReferenceSpace(
                "viewer"
            );


        hitTestSource =
            await session.requestHitTestSource({
                space:viewer
            });


        session.addEventListener(
            "end",
            () => {

                hitTestSource = null;

                session = null;

                renderer.setAnimationLoop(
                    null
                );

            }
        );


        document.getElementById(
            "start"
        ).style.display =
            "none";


        status(
            "🔎 Suche eine echte horizontale Fläche..."
        );


        renderer.setAnimationLoop(
            render
        );

    } catch(error) {

        console.error(error);

        status(
            "AR konnte nicht gestartet werden."
        );

    }

}


/* =====================================================
   MONSTER AUF BODEN SETZEN
===================================================== */

function placeMonster(
    matrix
) {

    if(monsterPlaced)
        return;


    activeMonster =
        createMonster(
            TEST_MONSTER_ID,
            TEST_MONSTER_LEVEL
        );


    activeMonster.matrixAutoUpdate =
        false;


    activeMonster.matrix.fromArray(
        matrix
    );


    scene.add(
        activeMonster
    );


    monsterPlaced = true;


    document.getElementById(
        "catch"
    ).style.display =
        "block";


    status(
        "👾 " +
        getMonsterName(
            TEST_MONSTER_ID,
            TEST_MONSTER_LEVEL
        ) +
        " ist erschienen!"
    );

}


/* =====================================================
   AR LOOP
===================================================== */

function render(
    timestamp,
    frame
) {

    if(frame && hitTestSource) {

        const hits =
            frame.getHitTestResults(
                hitTestSource
            );


        if(
            hits.length > 0 &&
            !monsterPlaced
        ) {

            const pose =
                hits[0].getPose(
                    referenceSpace
                );


            if(pose) {

                /*
                  Automatischer Test-Spawn.
                  Das Monster wird nur gesetzt,
                  wenn das AR-System eine reale
                  Fläche liefert.
                */

                placeMonster(
                    pose.transform.matrix
                );

            }

        }

    }


    if(activeMonster) {

        monsterAnimationTime += .025;

        /*
          Leichte Idle-Animation.
          Die Position auf dem Boden
          bleibt trotzdem unverändert.
        */

        const scale =
            1 +
            Math.sin(
                monsterAnimationTime
            ) * .025;


        activeMonster.scale.set(
            scale,
            scale,
            scale
        );

    }


    renderer.render(
        scene,
        camera
    );

}


/* =====================================================
   FANGEN
===================================================== */

document
    .getElementById("catch")
    .addEventListener(
        "click",
        catchMonster
    );


function catchMonster() {

    if(!activeMonster)
        return;


    const id =
        activeMonster.userData.id;

    const level =
        activeMonster.userData.level;

    const strength =
        activeMonster.userData.strength;


    if(!player.collection[id]) {

        player.collection[id] = {

            name:
                getMonsterName(
                    id,
                    level
                ),

            level,

            strength,

            count:1

        };

    } else {

        const owned =
            player.collection[id];

        owned.count++;

        /*
          Besseres Exemplar behalten
        */

        if(
            strength >
            owned.strength
        ) {

            owned.level =
                level;

            owned.strength =
                strength;

            owned.name =
                getMonsterName(
                    id,
                    level
                );

        }

    }


    player.totalCaught++;


    scene.remove(
        activeMonster
    );


    activeMonster = null;

    monsterPlaced = false;


    document.getElementById(
        "catch"
    ).style.display =
        "none";


    const xp =
        20 + level * 2;

    addXP(xp);

    savePlayer();

    updateCollection();


    status(
        "🎉 Gefangen! +" +
        xp +
        " XP"
    );

}


/* =====================================================
   SAMMLUNG
===================================================== */

function updateCollection() {

    const list =
        document.getElementById(
            "collectionList"
        );


    list.innerHTML = "";


    const entries =
        Object.entries(
            player.collection
        );


    if(entries.length === 0) {

        list.innerHTML =
            "<p>Noch keine Monster gefangen.</p>";

        return;

    }


    for(
        const [id, data]
        of entries
    ) {

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "monsterCard";


        card.innerHTML = `

            <div class="cardHead">

                <span>
                    ${data.name}
                </span>

                <span>
                    Lv. ${data.level}
                </span>

            </div>

            <div class="small">
                ${MONSTERS[id].type}
            </div>

            <div class="stat">
                Stärke:
                <b>${data.strength}</b>
            </div>

            <div class="small">
                Gefangen:
                ${data.count}×
            </div>

        `;


        list.appendChild(
            card
        );

    }

}


updateCollection();

}


/* =====================================================
   START
===================================================== */

document
    .getElementById("start")
    .addEventListener(

    );


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(

    () => {

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);
