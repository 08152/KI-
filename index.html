<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FPS Weapon Camera Position</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#111;
    font-family:Arial;
}

#info{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    background:rgba(0,0,0,.6);
    padding:10px 16px;
    border-radius:10px;
    z-index:10;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:12px;
    height:12px;
    z-index:10;
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
}

#crosshair:before{
    width:12px;
    height:2px;
    top:5px;
}

#crosshair:after{
    width:2px;
    height:12px;
    left:5px;
}
</style>
</head>

<body>

<div id="info">Klicken und mit WASD bewegen</div>
<div id="crosshair"></div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { PointerLockControls } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/PointerLockControls.js";

import { GLTFLoader } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";


/* =====================================================
   SCENE
===================================================== */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x87ceeb);


/* =====================================================
   CAMERA
===================================================== */

const camera =
    new THREE.PerspectiveCamera(

        75,

        window.innerWidth /
        window.innerHeight,

        0.01,

        1000

    );

camera.position.set(
    0,
    1.7,
    5
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
    new THREE.WebGLRenderer({

        antialias:true

    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   LIGHT
===================================================== */

const light =
    new THREE.HemisphereLight(

        0xffffff,
        0x444444,
        2

    );

scene.add(light);


const sun =
    new THREE.DirectionalLight(

        0xffffff,
        2

    );

sun.position.set(
    5,
    10,
    5
);

scene.add(sun);


/* =====================================================
   FLOOR
===================================================== */

const floor =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            1000,
            1000
        ),

        new THREE.MeshStandardMaterial({

            color:0x4d8f3a

        })

    );

floor.rotation.x =
    -Math.PI / 2;

scene.add(floor);


/* =====================================================
   POINTER LOCK
===================================================== */

const controls =
    new PointerLockControls(

        camera,
        document.body

    );


document.body.addEventListener(
    "click",
    () => {

        controls.lock();

    }
);


/* =====================================================
   WASD
===================================================== */

const keys = {

    w:false,
    a:false,
    s:false,
    d:false

};


window.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();

        if(key in keys){

            keys[key] = true;

        }

    }
);


window.addEventListener(
    "keyup",
    event => {

        const key =
            event.key.toLowerCase();

        if(key in keys){

            keys[key] = false;

        }

    }
);


/* =====================================================
   WEAPON
===================================================== */

const loader =
    new GLTFLoader();


let weapon = null;


/*
   HIER DEINE GLB-DATEI EINTRAGEN
*/

const WEAPON_URL =
    "weapon.glb";


loader.load(

    WEAPON_URL,

    gltf => {

        weapon =
            gltf.scene;


        /* =============================================
           SICHERHEIT:
           ALLE VORHERIGEN ROTATIONEN ENTFERNEN
        ============================================= */

        weapon.rotation.set(
            0,
            0,
            0
        );


        weapon.quaternion.identity();


        /* =============================================
           AUTOMATISCHE ZENTRIERUNG DES MODELLS
        ============================================= */

        const box =
            new THREE.Box3()
            .setFromObject(weapon);


        const center =
            box.getCenter(
                new THREE.Vector3()
            );


        weapon.position.sub(center);


        /* =============================================
           WAFFE ZUR KAMERA
           
           WICHTIG:
           Dadurch folgt sie IMMER der Kamera.
        ============================================= */

        camera.add(weapon);


        /* =============================================
           STARTPOSITION:
           GENAU MITTIG UND DIREKT VOR DER KAMERA
        ============================================= */

        weapon.position.set(

            0,      // Mitte

            0,      // Höhe Mitte

            -0.5    // Vor der Kamera

        );


        /*
           SICHERHEIT:
           Waffe schaut in die gleiche Richtung
           wie die Kamera.
        */

        weapon.rotation.set(

            0,
            0,
            0

        );


        weapon.quaternion.identity();


        /* =============================================
           NACH 1 SEKUNDE
           -> RECHTS
           -> UNTEN
           -> ETWAS WEITER NACH VORNE
        ============================================= */

        setTimeout(() => {

            animateWeaponToFPSPosition();

        }, 1000);

    },

    undefined,

    error => {

        console.error(
            "Weapon GLB konnte nicht geladen werden:",
            error
        );

    }

);


/* =====================================================
   WAFFEN ANIMATION
===================================================== */

function animateWeaponToFPSPosition(){

    if(!weapon) return;


    const startPosition =
        weapon.position.clone();


    /*
       FPS ZIELPOSITION

       X = Rechts

       Y = Unten

       Z = Vor Kamera
    */

    const targetPosition =
        new THREE.Vector3(

            0.35,

            -0.35,

            -0.65

        );


    const duration =
        600;


    const startTime =
        performance.now();


    function animate(time){

        const progress =
            Math.min(

                (time - startTime)
                /
                duration,

                1

            );


        /*
           Smoothstep
        */

        const smooth =
            progress *
            progress *
            (3 - 2 * progress);


        weapon.position.lerpVectors(

            startPosition,

            targetPosition,

            smooth

        );


        /*
           SICHERHEIT:
           ROTATION BLEIBT IMMER GERADEAUS.

           Dadurch wird verhindert,
           dass die Waffe sich während
           der Animation verdreht.
        */

        weapon.rotation.set(

            0,
            0,
            0

        );


        if(progress < 1){

            requestAnimationFrame(
                animate
            );

        }

    }


    requestAnimationFrame(
        animate
    );

}


/* =====================================================
   GAME LOOP
===================================================== */

const clock =
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );


    const delta =
        clock.getDelta();


    const speed =
        5;


    if(
        controls.isLocked
    ){

        if(keys.w){

            controls.moveForward(
                speed * delta
            );

        }


        if(keys.s){

            controls.moveForward(
                -speed * delta
            );

        }


        if(keys.a){

            controls.moveRight(
                -speed * delta
            );

        }


        if(keys.d){

            controls.moveRight(
                speed * delta
            );

        }

    }


    /*
       ZUSÄTZLICHE SICHERHEIT:

       Solange die Waffe existiert,
       bleibt ihre lokale Rotation
       auf geradeaus.

       Die Kamera dreht sie automatisch
       mit, weil weapon ein Kind
       der Kamera ist.
    */

    if(weapon){

        weapon.rotation.set(

            0,
            0,
            0

        );

    }


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,
            window.innerHeight

        );

    }
);

</script>

</body>
</html>
