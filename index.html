<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WORLD NAVI 3D</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#9edcff}
#map{position:fixed;inset:0}

#top{
position:fixed;
top:15px;
left:15px;
right:15px;
z-index:10;
display:flex;
gap:10px;
}

#search{
flex:1;
max-width:550px;
height:52px;
border:0;
border-radius:15px;
padding:0 20px;
font-size:17px;
box-shadow:0 4px 18px #0003;
outline:none;
}

button{
height:52px;
padding:0 20px;
border:0;
border-radius:15px;
background:#1677ff;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
box-shadow:0 4px 18px #0003;
}

#panel{
position:fixed;
left:15px;
top:82px;
width:310px;
max-height:75vh;
overflow:auto;
z-index:9;
background:#ffffffed;
backdrop-filter:blur(12px);
border-radius:18px;
padding:15px;
box-shadow:0 8px 30px #0003;
}

h2{margin:4px 0 12px;font-size:20px}
h3{margin:18px 0 8px;font-size:15px}

.place{
padding:12px;
margin:7px 0;
background:#f1f5f9;
border-radius:12px;
cursor:pointer;
}

.place:hover{background:#dbeafe}

#info{
position:fixed;
right:15px;
bottom:15px;
z-index:10;
background:#ffffffed;
padding:12px 16px;
border-radius:14px;
box-shadow:0 5px 20px #0003;
font-size:13px;
}

#compass{
position:fixed;
right:20px;
top:90px;
width:60px;
height:60px;
z-index:10;
border-radius:50%;
background:#ffffffdd;
box-shadow:0 5px 20px #0003;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
font-size:22px;
}

#loading{
position:fixed;
inset:0;
z-index:100;
display:flex;
align-items:center;
justify-content:center;
background:#9edcff;
font-size:25px;
font-weight:bold;
}
</style>
</head>

<body>

<div id="loading">Weltkarte wird geladen...</div>
<div id="map"></div>

<div id="top">
<input id="search" placeholder="Ort, Straße oder Stadt suchen...">
<button onclick="searchLocation()">Suchen</button>
</div>

<div id="panel">
<h2>🌍 Weltkarte</h2>

<h3>Europa</h3>
<div class="place" onclick="flyTo(10,0,20)">🇩🇪 Deutschland</div>
<div class="place" onclick="flyTo(2,0,35)">🇫🇷 Frankreich</div>
<div class="place" onclick="flyTo(25,0,20)">🇵🇱 Polen</div>
<div class="place" onclick="flyTo(15,0,5)">🇮🇹 Italien</div>
<div class="place" onclick="flyTo(-3,0,40)">🇬🇧 Großbritannien</div>

<h3>Nordamerika</h3>
<div class="place" onclick="flyTo(-100,0,10)">🇺🇸 USA</div>
<div class="place" onclick="flyTo(-110,0,35)">🇨🇦 Kanada</div>
<div class="place" onclick="flyTo(-102,0,-15)">🇲🇽 Mexiko</div>

<h3>Asien</h3>
<div class="place" onclick="flyTo(105,0,25)">🇨🇳 China</div>
<div class="place" onclick="flyTo(138,0,20)">🇯🇵 Japan</div>
<div class="place" onclick="flyTo(78,0,5)">🇮🇳 Indien</div>

<h3>Sehenswürdigkeiten</h3>
<div class="place" onclick="flyTo(10.75,0,28.5)">Brandenburger Tor</div>
<div class="place" onclick="flyTo(2.35,0,46.7)">Eiffelturm</div>
<div class="place" onclick="flyTo(-74,0,40.7)">New York</div>
<div class="place" onclick="flyTo(139.7,0,35.7)">Tokio</div>
</div>

<div id="compass">N</div>

<div id="info">
Weltkarte · 3D
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>

<script>

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x9edcff);
scene.fog = new THREE.Fog(0x9edcff,180,650);

const camera = new THREE.PerspectiveCamera(
55,
innerWidth/innerHeight,
0.1,
2000
);

camera.position.set(0,260,220);

const renderer = new THREE.WebGLRenderer({
antialias:true
});

renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
document.getElementById("map").appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.08;
controls.maxPolarAngle=Math.PI/2.05;
controls.minDistance=15;
controls.maxDistance=650;

scene.add(new THREE.HemisphereLight(0xffffff,0x668899,2));

const sun = new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(100,300,100);
sun.castShadow=true;
scene.add(sun);


/* =========================
   WELTKARTE
========================= */

const WORLD_W=620;
const WORLD_H=320;

function height(x,z){

    const a=Math.sin(x*.035)*3;
    const b=Math.cos(z*.045)*3;
    const c=Math.sin((x+z)*.025)*4;

    const europe=
        Math.exp(-((x-10)**2+(z-10)**2)/2500)*15;

    const asia=
        Math.exp(-((x-130)**2+(z-5)**2)/6000)*12;

    const america=
        Math.exp(-((x+110)**2+(z-5)**2)/7000)*10;

    return Math.max(0,a+b+c+europe+asia+america);
}


/* Meer */

const waterGeo=new THREE.PlaneGeometry(
WORLD_W,
WORLD_H,
1,
1
);

const waterMat=new THREE.MeshPhongMaterial({
color:0x319bd8,
transparent:true,
opacity:.78
});

const water=new THREE.Mesh(waterGeo,waterMat);
water.rotation.x=-Math.PI/2;
water.position.y=-1;
scene.add(water);


/* Kontinente */

function createLand(x,z,w,d,color){

    const geo=new THREE.PlaneGeometry(w,d,35,25);
    const pos=geo.attributes.position;

    for(let i=0;i<pos.count;i++){

        const lx=pos.getX(i);
        const lz=pos.getY(i);

        pos.setZ(
            i,
            height(x+lx,z+lz)
        );
    }

    geo.computeVertexNormals();

    const mat=new THREE.MeshStandardMaterial({
        color,
        roughness:1
    });

    const mesh=new THREE.Mesh(geo,mat);

    mesh.rotation.x=-Math.PI/2;
    mesh.position.set(x,0,z);

    mesh.receiveShadow=true;

    scene.add(mesh);
}


/* große Landflächen */

createLand(-105,10,180,125,0x78a957);
createLand(5,10,155,110,0x86ad62);
createLand(105,15,210,135,0x91ae68);
createLand(155,-100,150,100,0x78a957);
createLand(-25,-95,90,90,0x83a95c);


/* =========================
   STRASSEN
========================= */

const roads=[];

function road(name,x,z,length,width,rotation=0){

    const group=new THREE.Group();

    const segments=30;

    for(let i=0;i<segments;i++){

        const t=(i/(segments-1))-.5;

        const px=t*length;

        const localZ=px;

        const geo=new THREE.BoxGeometry(
            width,
            .35,
            length/segments+1
        );

        const mat=new THREE.MeshStandardMaterial({
            color:0x45484c
        });

        const r=new THREE.Mesh(geo,mat);

        r.position.set(
            Math.sin(rotation)*localZ,
            1.5,
            Math.cos(rotation)*localZ
        );

        r.rotation.y=rotation;

        r.castShadow=true;
        r.receiveShadow=true;

        group.add(r);
    }

    group.position.set(x,0,z);

    scene.add(group);

    roads.push({
        name,
        x,
        z,
        length,
        width,
        rotation
    });

    createStreetLabel(
        name,
        x,
        z,
        rotation
    );
}


/* Europa */

road("Unter den Linden",10,8,65,5,.0);
road("Friedrichstraße",17,8,60,5,Math.PI/2);
road("Kantstraße",5,20,55,5,.15);
road("Hauptstraße",10,-5,90,6,0);
road("Bahnhofstraße",-15,5,65,5,.7);
road("Bergstraße",28,0,55,5,-.4);
road("Seestraße",5,32,70,5,.1);
road("Waldstraße",-25,20,80,5,-.3);


/* Frankreich */

road("Rue de Rivoli", -5,45,65,5,.15);
road("Avenue de Paris",0,35,70,5,.8);


/* Polen */

road("Aleje Jerozolimskie",38,5,70,5,.1);
road("Marszałkowska",45,5,60,5,Math.PI/2);


/* USA */

road("Broadway",-110,8,75,5,.2);
road("5th Avenue",-100,10,70,5,Math.PI/2);
road("Main Street",-120,0,90,5,0);


/* Asien */

road("Nanjing Road",105,15,85,5,.2);
road("Central Avenue",120,5,80,5,Math.PI/2);
road("Tokyo Avenue",145,20,75,5,.5);


/* =========================
   STRASSENNAMEN
========================= */

function createStreetLabel(text,x,z,rotation){

    const canvas=document.createElement("canvas");
    canvas.width=700;
    canvas.height=120;

    const ctx=canvas.getContext("2d");

    ctx.clearRect(0,0,700,120);

    ctx.fillStyle="rgba(255,255,255,.9)";
    ctx.roundRect(10,20,680,80,20);
    ctx.fill();

    ctx.fillStyle="#222";
    ctx.font="bold 38px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(text,350,60);

    const texture=new THREE.CanvasTexture(canvas);

    const material=new THREE.SpriteMaterial({
        map:texture,
        transparent:true,
        depthTest:false
    });

    const sprite=new THREE.Sprite(material);

    sprite.scale.set(30,5.2,1);

    sprite.position.set(x,7,z);

    sprite.rotation.z=-rotation;

    scene.add(sprite);
}


/* =========================
   STÄDTE
========================= */

const cities=[
["Berlin",10,10],
["Paris",-2,45],
["London",-25,48],
["Rom",15,-5],
["Warschau",38,8],
["New York",-110,8],
["Los Angeles",-140,-5],
["Mexiko-Stadt",-125,-35],
["Peking",130,20],
["Tokio",150,20],
["Delhi",100,-5]
];

function city(name,x,z){

    const group=new THREE.Group();

    const tower=new THREE.Mesh(
        new THREE.BoxGeometry(4,10,4),
        new THREE.MeshStandardMaterial({color:0xbcc6d1})
    );

    tower.position.y=5;

    group.add(tower);

    const roof=new THREE.Mesh(
        new THREE.ConeGeometry(3.5,4,4),
        new THREE.MeshStandardMaterial({color:0x8c4037})
    );

    roof.position.y=12;

    group.add(roof);

    group.position.set(x,height(x,z),z);

    scene.add(group);

    createCityLabel(name,x,z);
}

function createCityLabel(name,x,z){

    const canvas=document.createElement("canvas");
    canvas.width=500;
    canvas.height=100;

    const ctx=canvas.getContext("2d");

    ctx.fillStyle="#ffffff";
    ctx.roundRect(10,10,480,80,18);
    ctx.fill();

    ctx.fillStyle="#111";
    ctx.font="bold 34px Arial";
    ctx.textAlign="center";
    ctx.fillText(name,250,62);

    const tex=new THREE.CanvasTexture(canvas);

    const sprite=new THREE.Sprite(
        new THREE.SpriteMaterial({
            map:tex,
            transparent:true,
            depthTest:false
        })
    );

    sprite.scale.set(24,4.8,1);
    sprite.position.set(x,18,z);

    scene.add(sprite);
}

cities.forEach(c=>city(...c));


/* =========================
   BIBLIOTHEKEN
========================= */

const libraries=[
["Stadtbibliothek Berlin",12,13],
["Bibliothèque Centrale",-4,43],
["New York Public Library",-108,10],
["Bibliothek Warschau",40,10],
["Tokyo City Library",153,22]
];

function createLibrary(name,x,z){

    const group=new THREE.Group();

    const building=new THREE.Mesh(
        new THREE.BoxGeometry(7,5,6),
        new THREE.MeshStandardMaterial({
            color:0xd8c8a8
        })
    );

    building.position.y=2.5;
    building.castShadow=true;

    group.add(building);

    for(let i=-2;i<=2;i++){

        const col=new THREE.Mesh(
            new THREE.CylinderGeometry(.25,.25,6,10),
            new THREE.MeshStandardMaterial({
                color:0xf2eee5
            })
        );

        col.position.set(i*1.3,3.2,3.1);

        group.add(col);
    }

    const roof=new THREE.Mesh(
        new THREE.BoxGeometry(8,1,7),
        new THREE.MeshStandardMaterial({
            color:0x6d5542
        })
    );

    roof.position.y=5.5;
    group.add(roof);

    group.position.set(
        x,
        height(x,z),
        z
    );

    scene.add(group);

    createCityLabel(name,x,z);
}

libraries.forEach(x=>createLibrary(...x));


/* =========================
   MARKER
========================= */

let marker=null;

function createMarker(x,z){

    if(marker)scene.remove(marker);

    marker=new THREE.Group();

    const pole=new THREE.Mesh(
        new THREE.CylinderGeometry(.5,.5,12,16),
        new THREE.MeshStandardMaterial({
            color:0xff2020
        })
    );

    pole.position.y=6;

    const ball=new THREE.Mesh(
        new THREE.SphereGeometry(2.2,20,20),
        new THREE.MeshStandardMaterial({
            color:0xff2020
        })
    );

    ball.position.y=13;

    marker.add(pole,ball);

    marker.position.set(
        x,
        height(x,z),
        z
    );

    scene.add(marker);
}


/* =========================
   NAVIGATION
========================= */

function flyTo(x,y,z){

    const target=new THREE.Vector3(x,y,z);

    camera.position.set(
        x+35,
        65,
        z+35
    );

    controls.target.copy(target);

    createMarker(x,z);
}

function searchLocation(){

    const query=document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();

    if(!query)return;

    for(const c of cities){

        if(c[0].toLowerCase().includes(query)){

            flyTo(c[1],20,c[2]);
            return;
        }
    }

    for(const r of roads){

        if(r.name.toLowerCase().includes(query)){

            flyTo(r.x,20,r.z);
            return;
        }
    }

    for(const l of libraries){

        if(l[0].toLowerCase().includes(query)){

            flyTo(l[1],20,l[2]);
            return;
        }
    }
}

document
.getElementById("search")
.addEventListener("keydown",e=>{
    if(e.key==="Enter")searchLocation();
});


/* =========================
   MOUSE POSITION
========================= */

const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();

renderer.domElement.addEventListener("mousemove",e=>{

    mouse.x=(e.clientX/innerWidth)*2-1;
    mouse.y=-(e.clientY/innerHeight)*2+1;

});


/* =========================
   START
========================= */

setTimeout(()=>{
    document.getElementById("loading").style.display="none";
},800);


/* =========================
   RESIZE
========================= */

addEventListener("resize",()=>{

    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );
});


/* =========================
   LOOP
========================= */

function animate(){

    requestAnimationFrame(animate);

    controls.update();

    if(marker){

        marker.rotation.y+=.01;

    }

    renderer.render(
        scene,
        camera
    );
}

animate();

</script>
</body>
</html>
