<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>3D White Room</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:white;
}

canvas{
    display:block;
}

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    width:18px;
    height:18px;
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:20;
}

#crosshair::before,
#crosshair::after{
    content:"";
    position:absolute;
    background:#000;
}

#crosshair::before{
    width:2px;
    height:18px;
    left:8px;
    top:0;
}

#crosshair::after{
    width:18px;
    height:2px;
    left:0;
    top:8px;
}

#start{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    padding:15px 30px;
    background:white;
    border:2px solid black;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    z-index:30;
}
</style>
</head>

<body>

<div id="crosshair"></div>
<button id="start">START</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script>

/* =================================
   SZENE
================================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0xffffff);


/* =================================
   KAMERA
================================= */

const camera = new THREE.PerspectiveCamera(
    75,
    innerWidth / innerHeight,
    0.1,
    1000
);

camera.position.set(
    0,
    1.7,
    6
);


/* =================================
   RENDERER
================================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

document.body.appendChild(
    renderer.domElement
);


/* =================================
   LICHT
================================= */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        1.5
    )
);

const light =
    new THREE.DirectionalLight(
        0xffffff,
        1.5
    );

light.position.set(
    5,
    10,
    5
);

scene.add(light);


/* =================================
   WANDTEXTUR
   CC0
================================= */

const textureLoader =
    new THREE.TextureLoader();

const wallTexture =
    textureLoader.load(
        "https://opengameart.org/sites/default/files/8bs-wall_seamless_a_2048.png"
    );


/*
   Textur kacheln
*/

wallTexture.wrapS =
    THREE.RepeatWrapping;

wallTexture.wrapT =
    THREE.RepeatWrapping;


/*
   Schärferes Rendering
*/

wallTexture.anisotropy =
    renderer.capabilities.getMaxAnisotropy();


/* =================================
   MATERIAL
================================= */

const wallMaterial =
    new THREE.MeshStandardMaterial({

        map:wallTexture,

        color:0xffffff,

        roughness:0.9,

        metalness:0

    });


/* =================================
   BODEN
================================= */

const floor =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            20,
            0.2,
            20
        ),

        wallMaterial

    );

floor.position.set(
    0,
    -0.1,
    0
);


/*
   Boden etwas größer kacheln
*/

floor.material =
    wallMaterial.clone();

floor.material.map =
    wallTexture.clone();

floor.material.map.wrapS =
    THREE.RepeatWrapping;

floor.material.map.wrapT =
    THREE.RepeatWrapping;

floor.material.map.repeat.set(
    6,
    6
);

scene.add(floor);


/* =================================
   DECKE
================================= */

const ceiling =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            20,
            0.2,
            20
        ),

        wallMaterial.clone()

    );

ceiling.position.set(
    0,
    6,
    0
);

ceiling.material.map =
    wallTexture.clone();

ceiling.material.map.wrapS =
    THREE.RepeatWrapping;

ceiling.material.map.wrapT =
    THREE.RepeatWrapping;

ceiling.material.map.repeat.set(
    6,
    6
);

scene.add(ceiling);


/* =================================
   RÜCKWAND
================================= */

const backWall =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            20,
            6,
            0.2
        ),

        wallMaterial.clone()

    );

backWall.position.set(
    0,
    3,
    -10
);

backWall.material.map =
    wallTexture.clone();

backWall.material.map.wrapS =
    THREE.RepeatWrapping;

backWall.material.map.wrapT =
    THREE.RepeatWrapping;

backWall.material.map.repeat.set(
    4,
    2
);

scene.add(backWall);


/* =================================
   VORDERWAND
================================= */

const frontWall =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            20,
            6,
            0.2
        ),

        wallMaterial.clone()

    );

frontWall.position.set(
    0,
    3,
    10
);

frontWall.material.map =
    wallTexture.clone();

frontWall.material.map.wrapS =
    THREE.RepeatWrapping;

frontWall.material.map.wrapT =
    THREE.RepeatWrapping;

frontWall.material.map.repeat.set(
    4,
    2
);

scene.add(frontWall);


/* =================================
   LINKE WAND
================================= */

const leftWall =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            0.2,
            6,
            20
        ),

        wallMaterial.clone()

    );

leftWall.position.set(
    -10,
    3,
    0
);

leftWall.material.map =
    wallTexture.clone();

leftWall.material.map.wrapS =
    THREE.RepeatWrapping;

leftWall.material.map.wrapT =
    THREE.RepeatWrapping;

leftWall.material.map.repeat.set(
    4,
    2
);

scene.add(leftWall);


/* =================================
   RECHTE WAND
================================= */

const rightWall =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            0.2,
            6,
            20
        ),

        wallMaterial.clone()

    );

rightWall.position.set(
    10,
    3,
    0
);

rightWall.material.map =
    wallTexture.clone();

rightWall.material.map.wrapS =
    THREE.RepeatWrapping;

rightWall.material.map.wrapT =
    THREE.RepeatWrapping;

rightWall.material.map.repeat.set(
    4,
    2
);

scene.add(rightWall);


/* =================================
   POINTER LOCK
================================= */

let locked = false;

const start =
    document.getElementById("start");

start.addEventListener(
    "click",
    function(){

        renderer.domElement.requestPointerLock();

    }
);


document.addEventListener(
    "pointerlockchange",
    function(){

        locked =
            document.pointerLockElement ===
            renderer.domElement;

        start.style.display =
            locked ? "none" : "block";

    }
);


/* =================================
   MOUSE LOOK
================================= */

let yaw = 0;
let pitch = 0;

document.addEventListener(
    "mousemove",
    function(e){

        if(!locked) return;

        const sensitivity =
            0.0025;

        yaw -=
            e.movementX *
            sensitivity;

        pitch -=
            e.movementY *
            sensitivity;

        const limit =
            Math.PI / 2 - 0.05;

        pitch =
            Math.max(
                -limit,
                Math.min(
                    limit,
                    pitch
                )
            );

        camera.rotation.order =
            "YXZ";

        camera.rotation.y =
            yaw;

        camera.rotation.x =
            pitch;

    }
);


/* =================================
   TASTEN
================================= */

const keys = {};

document.addEventListener(
    "keydown",
    function(e){

        keys[e.code] = true;

    }
);

document.addEventListener(
    "keyup",
    function(e){

        keys[e.code] = false;

    }
);


/* =================================
   SPIELER
================================= */

const player =
    new THREE.Object3D();

player.position.set(
    0,
    1.7,
    6
);

scene.add(player);


/* =================================
   BEWEGUNG
================================= */

const velocity =
    new THREE.Vector3();

let onGround = true;

const speed = 5;
const gravity = 18;
const jumpPower = 7;

const clock =
    new THREE.Clock();


/* =================================
   LOOP
================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    const delta =
        Math.min(
            clock.getDelta(),
            0.05
        );


    if(locked){

        /*
           Blickrichtung
        */

        const forward =
            new THREE.Vector3();

        camera.getWorldDirection(
            forward
        );

        forward.y = 0;

        forward.normalize();


        /*
           Seitwärtsrichtung
        */

        const right =
            new THREE.Vector3(
                forward.z,
                0,
                -forward.x
            );


        /*
           W
        */

        if(keys["KeyW"]){

            player.position.x +=
                forward.x *
                speed *
                delta;

            player.position.z +=
                forward.z *
                speed *
                delta;

        }


        /*
           S
        */

        if(keys["KeyS"]){

            player.position.x -=
                forward.x *
                speed *
                delta;

            player.position.z -=
                forward.z *
                speed *
                delta;

        }


        /*
           A
        */

        if(keys["KeyA"]){

            player.position.x -=
                right.x *
                speed *
                delta;

            player.position.z -=
                right.z *
                speed *
                delta;

        }


        /*
           D
        */

        if(keys["KeyD"]){

            player.position.x +=
                right.x *
                speed *
                delta;

            player.position.z +=
                right.z *
                speed *
                delta;

        }


        /*
           SPRINGEN
        */

        if(
            keys["Space"] &&
            onGround
        ){

            velocity.y =
                jumpPower;

            onGround = false;

        }


        /*
           GRAVITATION
        */

        velocity.y -=
            gravity *
            delta;

        player.position.y +=
            velocity.y *
            delta;


        /*
           BODEN
        */

        if(
            player.position.y <= 1.7
        ){

            player.position.y =
                1.7;

            velocity.y = 0;

            onGround = true;

        }


        /*
           WÄNDE
        */

        player.position.x =
            Math.max(
                -9.3,
                Math.min(
                    9.3,
                    player.position.x
                )
            );

        player.position.z =
            Math.max(
                -9.3,
                Math.min(
                    9.3,
                    player.position.z
                )
            );

    }


    /*
       Kamera
    */

    camera.position.copy(
        player.position
    );


    renderer.render(
        scene,
        camera
    );

}

animate();


/* =================================
   RESIZE
================================= */

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>

</body>
</html>
