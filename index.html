<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GPS Text Position</title>

<style>
*{
box-sizing:border-box;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,sans-serif;
background:#111;
}

#world{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
background:
linear-gradient(45deg,#1b2730,#0d1218);
}

#player{
position:absolute;
left:50%;
top:50%;
width:18px;
height:18px;
border-radius:50%;
background:#00aaff;
transform:translate(-50%,-50%);
box-shadow:0 0 20px #00aaff;
z-index:5;
}

#text{
position:absolute;
left:50%;
top:42%;
transform:translate(-50%,-50%);
color:white;
font-size:28px;
font-weight:bold;
text-align:center;
white-space:nowrap;
text-shadow:
0 2px 4px black,
0 0 15px #00aaff;
}

#info{
position:fixed;
left:10px;
bottom:10px;
z-index:10;
background:#000c;
color:white;
padding:12px;
border-radius:10px;
font-family:monospace;
}

#start{
position:fixed;
left:50%;
top:50%;
transform:translate(-50%,-50%);
z-index:100;

padding:18px 30px;
border:0;
border-radius:12px;

font-size:20px;
font-weight:bold;

cursor:pointer;
}
</style>
</head>

<body>

<div id="world">

<div id="player"></div>

<div id="text">
📍 DEINE POSITION
</div>

</div>

<button id="start">
📍 POSITION STARTEN
</button>

<div id="info">
Noch nicht gestartet
</div>

<script>

let startLatitude=null;
let startLongitude=null;

const info=
document.getElementById("info");

const text=
document.getElementById("text");

const start=
document.getElementById("start");


start.onclick=function(){

if(!navigator.geolocation){

info.innerHTML=
"❌ GPS wird nicht unterstützt";

return;

}


info.innerHTML=
"📡 Suche Position...";


navigator.geolocation.watchPosition(

function(position){

const latitude=
position.coords.latitude;

const longitude=
position.coords.longitude;

const accuracy=
position.coords.accuracy;


/* =========================
   ERSTE POSITION
========================= */

if(
startLatitude===null
){

startLatitude=
latitude;

startLongitude=
longitude;


/*
Der Text wird
an deiner Startposition
platziert.
*/

text.innerHTML=
"📍 STARTPOSITION";


start.style.display=
"none";


}


/* =========================
   ENTFERNUNG BERECHNEN
========================= */

const R=
6371000;


const lat1=
startLatitude*Math.PI/180;

const lat2=
latitude*Math.PI/180;

const deltaLat=
(latitude-startLatitude)
*Math.PI/180;

const deltaLon=
(longitude-startLongitude)
*Math.PI/180;


const a=

Math.sin(deltaLat/2)*
Math.sin(deltaLat/2)

+

Math.cos(lat1)*
Math.cos(lat2)

*

Math.sin(deltaLon/2)*
Math.sin(deltaLon/2);


const c=

2*Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);


const distance=
R*c;


/* =========================
   TEXT RELATIV BEWEGEN
========================= */


/*
Der Spieler bleibt
in der Bildschirmmitte.

Die Startposition
wird je nach Entfernung
verschoben dargestellt.
*/


const scale=5;


let y=

42 + distance*scale;


/*
Nicht aus dem Bildschirm
verschwinden lassen
*/

y=Math.max(
5,
Math.min(
95,
y
)
);


text.style.top=
y+"%";


info.innerHTML=

"📍 AKTUELLE POSITION<br>" +

"Breite: "+
latitude.toFixed(6)+
"<br>" +

"Länge: "+
longitude.toFixed(6)+
"<br>" +

"GPS Genauigkeit: "+
accuracy.toFixed(1)+
" m<br>" +

"<br>" +

"🚶 Entfernung vom Start:<br>" +

distance.toFixed(1)+
" m";


},

function(error){

info.innerHTML=

"❌ Position nicht verfügbar<br>" +

error.message;

},

{

enableHighAccuracy:true,

maximumAge:0,

timeout:10000

}

);

};

</script>

</body>
</html>
