
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Optimized Block World</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial}
#ui{
position:fixed;top:10px;left:10px;z-index:5;
background:#000b;color:white;padding:12px;
border:2px solid #555;border-radius:8px
}
button{padding:10px;margin-top:7px}
#crosshair{
position:fixed;top:50%;left:50%;color:white;
font-size:24px;transform:translate(-50%,-50%);
pointer-events:none
}
</style>
</head>
<body>

<div id="ui">
<b>BLOCK WORLD</b><br>
<span id="info">Lade Welt...</span><br>
<button id="newWorld">Neue Welt</button>
</div>
<div id="crosshair">+</div>

<script type="importmap">
{
"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
}
}
</script>

<script type="module">
import * as THREE from "three";
import {PointerLockControls} from
"three/addons/controls/PointerLockControls.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,40,110);

const camera=new THREE.PerspectiveCamera(
75,innerWidth/innerHeight,.1,200
);
camera.position.set(0,10,5);

const renderer=new THREE.WebGLRenderer({
antialias:false,powerPreference:"high-performance"
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls=new PointerLockControls(camera,document.body);
scene.add(controls.object);

document.body.addEventListener("click",()=>{
if(!controls.isLocked)controls.lock();
});

const light=new THREE.HemisphereLight(0xffffff,0x556677,2);
scene.add(light);

const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(30,50,20);
scene.add(sun);

// ORIGINAL MINECRAFT TEXTURES
const loader=new THREE.TextureLoader();

function loadTexture(url){
const t=loader.load(url);
t.magFilter=THREE.NearestFilter;
t.minFilter=THREE.NearestFilter;
t.colorSpace=THREE.SRGBColorSpace;
return t;
}

const dirtTexture=loadTexture(
"https://assets.mcasset.cloud/1.21.4/assets/minecraft/textures/block/dirt.png"
);

const stoneTexture=loadTexture(
"https://assets.mcasset.cloud/1.21.4/assets/minecraft/textures/block/stone.png"
);

const dirtMaterial=new THREE.MeshLambertMaterial({
map:dirtTexture
});

const stoneMaterial=new THREE.MeshLambertMaterial({
map:stoneTexture
});

// ONE ORIGINAL BLOCK GEOMETRY
// EVERY BLOCK IS A CLONE INSTANCE
const geometry=new THREE.BoxGeometry(1,1,1);

let dirtMesh;
let stoneMesh;

const WORLD_SIZE=64;
const WORLD_HEIGHT=18;

function terrainHeight(x,z){
return Math.max(1,Math.min(
WORLD_HEIGHT-1,
Math.floor(
7+
Math.sin(x*.12)*2+
Math.cos(z*.15)*2+
Math.sin((x+z)*.08)*2+
Math.sin(x*.3+z*.2)*1.3
)
));
}

function generateWorld(){

if(dirtMesh){
scene.remove(dirtMesh);
scene.remove(stoneMesh);
dirtMesh.dispose();
stoneMesh.dispose();
}

let dirtCount=0;
let stoneCount=0;

const heights=[];

for(let x=-WORLD_SIZE/2;x<WORLD_SIZE/2;x++){
for(let z=-WORLD_SIZE/2;z<WORLD_SIZE/2;z++){

const h=terrainHeight(x,z);
heights.push(h);

for(let y=0;y<h;y++){
if(y<h-3)stoneCount++;
else dirtCount++;
}

}
}

// INSTANCED MESH = MUCH LESS DRAW CALLS
dirtMesh=new THREE.InstancedMesh(
geometry,dirtMaterial,dirtCount
);

stoneMesh=new THREE.InstancedMesh(
geometry,stoneMaterial,stoneCount
);

dirtMesh.frustumCulled=false;
stoneMesh.frustumCulled=false;

dirtMesh.instanceMatrix.setUsage(THREE.StaticDrawUsage);
stoneMesh.instanceMatrix.setUsage(THREE.StaticDrawUsage);

const matrix=new THREE.Matrix4();

let di=0;
let si=0;
let index=0;

for(let x=-WORLD_SIZE/2;x<WORLD_SIZE/2;x++){
for(let z=-WORLD_SIZE/2;z<WORLD_SIZE/2;z++){

const h=heights[index++];

for(let y=0;y<h;y++){

matrix.makeTranslation(x,y,z);

if(y<h-3){
stoneMesh.setMatrixAt(si++,matrix);
}else{
dirtMesh.setMatrixAt(di++,matrix);
}

}
}
}

dirtMesh.instanceMatrix.needsUpdate=true;
stoneMesh.instanceMatrix.needsUpdate=true;

scene.add(dirtMesh);
scene.add(stoneMesh);

document.getElementById("info").textContent=
"Blöcke: "+(dirtCount+stoneCount)+
" | Instancing aktiv";
}

generateWorld();

document.getElementById("newWorld").onclick=()=>{
generateWorld();
};

// FIRST PERSON MOVEMENT
const keys={};
addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

const velocity=new THREE.Vector3();
const direction=new THREE.Vector3();
const clock=new THREE.Clock();

function animate(){

requestAnimationFrame(animate);

const dt=Math.min(clock.getDelta(),.05);

direction.set(0,0,0);

if(keys.KeyW)direction.z-=1;
if(keys.KeyS)direction.z+=1;
if(keys.KeyA)direction.x-=1;
if(keys.KeyD)direction.x+=1;

if(direction.length()>0)direction.normalize();

const speed=8;

controls.moveRight(direction.x*speed*dt);
controls.moveForward(-direction.z*speed*dt);

if(keys.Space)controls.object.position.y+=speed*dt;
if(keys.ShiftLeft)controls.object.position.y-=speed*dt;

renderer.render(scene,camera);
}

animate();

addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
