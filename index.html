<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Ghost Maps</title>

<link rel="stylesheet"
href="https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.css">

<style>
*{box-sizing:border-box}

html,body,#map{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

body{
    touch-action:none;
}

#map{
    position:absolute;
    inset:0;
}

/* SUCHLEISTE */

.search{
    position:absolute;
    z-index:20;
    top:12px;
    left:12px;
    right:12px;
    max-width:600px;
    height:54px;
    background:white;
    border-radius:13px;
    box-shadow:0 2px 12px #0004;
    display:flex;
    overflow:hidden;
}

.search input{
    min-width:0;
    flex:1;
    border:0;
    outline:0;
    padding:0 15px;
    font-size:16px;
}

.search button{
    width:55px;
    border:0;
    background:white;
    font-size:20px;
}

/* ROUTING */

.route-panel{
    position:absolute;
    z-index:30;
    top:78px;
    left:12px;
    width:360px;
    max-width:calc(100% - 24px);
    background:white;
    border-radius:13px;
    padding:12px;
    box-shadow:0 3px 15px #0004;
    display:none;
}

.route-panel.show{
    display:block;
}

.route-panel input{
    width:100%;
    height:43px;
    margin-bottom:8px;
    border:1px solid #ddd;
    border-radius:8px;
    padding:0 12px;
    font-size:15px;
}

.route-buttons{
    display:flex;
    gap:8px;
}

.route-buttons button{
    flex:1;
    height:42px;
    border:0;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.start{
    background:#1a73e8;
    color:white;
}

.close{
    background:#eee;
}

.route-info{
    margin-top:10px;
    font-size:14px;
    line-height:1.5;
}

/* BUTTONS */

.buttons{
    position:absolute;
    z-index:20;
    right:12px;
    bottom:25px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.buttons button{
    width:48px;
    height:48px;
    border:0;
    border-radius:10px;
    background:white;
    box-shadow:0 2px 10px #0004;
    font-size:22px;
    cursor:pointer;
}

.buttons button:active{
    transform:scale(.94);
}

/* ROUTE BUTTON */

.route-open{
    position:absolute;
    z-index:20;
    right:12px;
    bottom:185px;
    width:48px;
    height:48px;
    border:0;
    border-radius:50%;
    background:#1a73e8;
    color:white;
    box-shadow:0 3px 10px #0005;
    font-size:21px;
}

/* MOBILE */

@media(max-width:600px){

    .search{
        top:10px;
        left:10px;
        right:10px;
        height:52px;
    }

    .route-panel{
        top:72px;
        left:10px;
        width:auto;
        right:10px;
    }

    .buttons{
        right:10px;
        bottom:18px;
    }

    .route-open{
        right:10px;
        bottom:190px;
    }
}

.maplibregl-ctrl-attrib{
    font-size:10px;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="search">
    <input
        id="search"
        type="text"
        placeholder="Adresse oder Ort suchen..."
        autocomplete="off"
    >
    <button id="searchButton">🔍</button>
</div>

<div id="routePanel" class="route-panel">

    <input
        id="from"
        placeholder="Startadresse"
        autocomplete="off"
    >

    <input
        id="to"
        placeholder="Zieladresse"
        autocomplete="off"
    >

    <div class="route-buttons">
        <button class="start" id="routeButton">
            Route starten
        </button>

        <button class="close" id="closeRoute">
            Schließen
        </button>
    </div>

    <div id="routeInfo" class="route-info"></div>

</div>

<button class="route-open" id="openRoute">
    ➤
</button>

<div class="buttons">

    <button id="locate">
        📍
    </button>

    <button id="plus">
        +
    </button>

    <button id="minus">
        −
    </button>

</div>

<script src="https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.js"></script>

<script>

const map = new maplibregl.Map({

    container:"map",

    style:"https://tiles.openfreemap.org/styles/bright",

    center:[10.4515,51.1657],

    zoom:5,

    attributionControl:true
});


/* MOBILE-TOUCH */

map.dragPan.enable();
map.touchZoomRotate.enable();
map.doubleClickZoom.enable();


/* ZOOM */

document.getElementById("plus").onclick=()=>{
    map.zoomIn();
};

document.getElementById("minus").onclick=()=>{
    map.zoomOut();
};


/* ROUTEN-PANEL */

const panel=document.getElementById("routePanel");

document.getElementById("openRoute").onclick=()=>{
    panel.classList.add("show");
};

document.getElementById("closeRoute").onclick=()=>{
    panel.classList.remove("show");
};


/* GEOCODING */

async function geocode(address){

    const url=
        "https://nominatim.openstreetmap.org/search"+
        "?format=json"+
        "&limit=1"+
        "&addressdetails=1"+
        "&q="+
        encodeURIComponent(address);

    const response=await fetch(url,{
        headers:{
            "Accept":"application/json"
        }
    });

    const data=await response.json();

    if(!data.length){
        throw new Error("Adresse nicht gefunden");
    }

    return {
        lng:parseFloat(data[0].lon),
        lat:parseFloat(data[0].lat),
        name:data[0].display_name
    };
}


/* NORMALE SUCHE */

async function searchPlace(){

    const value=
        document.getElementById("search").value.trim();

    if(!value)return;

    try{

        const place=await geocode(value);

        map.flyTo({
            center:[place.lng,place.lat],
            zoom:17,
            speed:1.2
        });

        new maplibregl.Marker()
            .setLngLat([place.lng,place.lat])
            .setPopup(
                new maplibregl.Popup()
                .setHTML(
                    "<b>"+escapeHTML(place.name)+"</b>"
                )
            )
            .addTo(map)
            .togglePopup();

    }catch(error){

        alert("Adresse nicht gefunden.");

    }
}

document
.getElementById("searchButton")
.addEventListener("click",searchPlace);

document
.getElementById("search")
.addEventListener("keydown",e=>{
    if(e.key==="Enter"){
        searchPlace();
    }
});


/* ROUTE */

let routeLayerAdded=false;

async function startRoute(){

    const fromText=
        document.getElementById("from").value.trim();

    const toText=
        document.getElementById("to").value.trim();

    const info=
        document.getElementById("routeInfo");

    if(!fromText || !toText){
        info.innerHTML="Bitte Start und Ziel eingeben.";
        return;
    }

    info.innerHTML="Route wird berechnet...";

    try{

        const from=await geocode(fromText);
        const to=await geocode(toText);

        const url=
            "https://router.project-osrm.org/route/v1/driving/"+
            from.lng+","+from.lat+";"+
            to.lng+","+to.lat+
            "?overview=full&geometries=geojson&steps=true";

        const response=await fetch(url);

        const data=await response.json();

        if(data.code!=="Ok"){
            throw new Error("Keine Route gefunden");
        }

        const route=data.routes[0];

        const coordinates=
            route.geometry.coordinates;

        const geojson={
            type:"Feature",
            properties:{},
            geometry:{
                type:"LineString",
                coordinates:coordinates
            }
        };


        if(map.getSource("route")){

            map.getSource("route")
                .setData(geojson);

        }else{

            map.addSource("route",{
                type:"geojson",
                data:geojson
            });

            map.addLayer({

                id:"route",

                type:"line",

                source:"route",

                layout:{
                    "line-cap":"round",
                    "line-join":"round"
                },

                paint:{
                    "line-color":"#1976d2",
                    "line-width":6,
                    "line-opacity":0.9
                }

            });

        }


        /* START MARKER */

        if(window.startMarker){
            window.startMarker.remove();
        }

        if(window.endMarker){
            window.endMarker.remove();
        }

        window.startMarker=
            new maplibregl.Marker()
            .setLngLat([from.lng,from.lat])
            .setPopup(
                new maplibregl.Popup()
                .setHTML("<b>Start</b><br>"+escapeHTML(from.name))
            )
            .addTo(map);


        /* ZIEL MARKER */

        window.endMarker=
            new maplibregl.Marker()
            .setLngLat([to.lng,to.lat])
            .setPopup(
                new maplibregl.Popup()
                .setHTML("<b>Ziel</b><br>"+escapeHTML(to.name))
            )
            .addTo(map);


        /* KARTE AUF ROUTE ZOOMEN */

        const bounds=
            new maplibregl.LngLatBounds();

        coordinates.forEach(c=>{
            bounds.extend(c);
        });

        map.fitBounds(bounds,{
            padding:80,
            duration:1200
        });


        const km=
            route.distance/1000;

        const minutes=
            Math.round(route.duration/60);

        info.innerHTML=
            "<b>Route gefunden</b><br>"+
            km.toFixed(1)+" km · "+
            formatTime(minutes);

    }catch(error){

        info.innerHTML=
            "Route konnte nicht berechnet werden.";

        console.error(error);

    }
}

document
.getElementById("routeButton")
.addEventListener("click",startRoute);


/* ZEIT */

function formatTime(minutes){

    if(minutes<60){
        return minutes+" Min.";
    }

    const h=Math.floor(minutes/60);
    const m=minutes%60;

    return h+" Std. "+m+" Min.";
}


/* STANDORT */

document.getElementById("locate").onclick=()=>{

    if(!navigator.geolocation){
        alert("Standort wird nicht unterstützt.");
        return;
    }

    navigator.geolocation.getCurrentPosition(

        position=>{

            const lng=
                position.coords.longitude;

            const lat=
                position.coords.latitude;

            map.flyTo({
                center:[lng,lat],
                zoom:17,
                speed:1.2
            });

            if(window.userMarker){
                window.userMarker.remove();
            }

            window.userMarker=
                new maplibregl.Marker({
                    color:"#1976d2"
                })
                .setLngLat([lng,lat])
                .setPopup(
                    new maplibregl.Popup()
                    .setHTML("<b>Dein Standort</b>")
                )
                .addTo(map);

        },

        ()=>{
            alert(
                "Standort konnte nicht ermittelt werden."
            );
        },

        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:5000
        }
    );
};


/* HTML SICHERN */

function escapeHTML(text){

    return text
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

</script>

</body>
</html>
