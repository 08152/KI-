function createBox(
    w,h,d,
    material,
    x,y,z,
    parent=scene
){

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,h,d
            ),
            material
        );

    mesh.position.set(
        x,y,z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    parent.add(mesh);

    return mesh;
}

function createCylinder(
    radius,
    height,
    material,
    x,y,z,
    parent=scene,
    segments=16
){

    const mesh =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                radius,
                radius,
                height,
                segments
            ),
            material
        );

    mesh.position.set(
        x,y,z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    parent.add(mesh);

    return mesh;
}

function worldPosition(object){

    const p =
        new THREE.Vector3();

    object.getWorldPosition(p);

    return p;
}

let doorOpen=false;
let doorMoving=false;

function toggleDoor(){

    if(doorMoving)
        return;

    doorMoving=true;

    const start =
        doorOpen ? 1 : 0;

    const end =
        doorOpen ? 0 : 1;

    let t=0;

    function animateDoor(){

        t+=.08;

        const p=
            Math.min(t,1);

        const e=
            p<.5
            ?2*p*p
            :1-Math.pow(-2*p+2,2)/2;

        cabinDoor.rotation.y=
            -(start+(end-start)*e)
            *Math.PI/2;

        if(p<1){

            requestAnimationFrame(
                animateDoor
            );

        }else{

            doorOpen=!doorOpen;
            doorMoving=false;
        }
    }

    animateDoor();
}

let craneLowered=false;
let craneAnimationRunning=false;

function animateCrane(){

    if(craneAnimationRunning)
        return;

    craneAnimationRunning=true;

    const from=
        craneLowered ? 1 : 0;

    const to=
        craneLowered ? 0 : 1;

    let t=0;

    function step(){

        t+=.025;

        const p=
            Math.min(t,1);

        const eased=
            p<.5
            ?2*p*p
            :1-Math.pow(-2*p+2,2)/2;

        const value=
            from+
            (to-from)*eased;

        boom.rotation.z=
            -value*.45;

        rope.scale.y=
            1+value*2;

        rope.position.y=
            -2-value*2;

        hook.position.y=
            -4-value*2;

        hangingNet.position.y=
            -.3-value*1.5;

        if(p<1){

            requestAnimationFrame(step);

        }else{

            craneLowered=
                !craneLowered;

            craneAnimationRunning=false;
        }
    }

    step();
}

/*
0 = Hafen
1 = in Hand
2 = aufgestellt
3 = auf Boot
*/

let bridgeState=0;

let bridgeVelocity=
    new THREE.Vector3();

let bridgeRotation=0;

const BRIDGE_LENGTH=7;
const BRIDGE_WIDTH=2.4;


/* =========================================================
   BRÜCKEN-PHYSIK
========================================================= */

function getBridgeEnds(){

    const direction=
        new THREE.Vector3(
            0,
            0,
            1
        );

    direction.applyQuaternion(
        bridge.quaternion
    );

    return {
        a:bridge.position.clone()
            .addScaledVector(
                direction,
                -BRIDGE_LENGTH/2
            ),

        b:bridge.position.clone()
            .addScaledVector(
                direction,
                BRIDGE_LENGTH/2
            )
    };
}

function boatLocalPosition(world){

    const p=
        world.clone()
        .sub(boat.position);

    p.applyAxisAngle(
        new THREE.Vector3(0,1,0),
        -boat.rotation.y
    );

    return p;
}

function isOnBoatDeckPoint(p){

    const q=
        boatLocalPosition(p);

    return (
        Math.abs(q.x)<4.15 &&
        q.z>-9.5 &&
        q.z<9.5 &&
        p.y>boat.position.y+1.1 &&
        p.y<boat.position.y+4
    );
}

function updateBridgePhysics(dt){

    if(bridgeState!==2)
        return;

    bridgeVelocity.y-=14*dt;

    bridge.position.addScaledVector(
        bridgeVelocity,
        dt
    );

    /*
      Hafenboden
    */

    if(
        bridge.position.y<.16
    ){

        bridge.position.y=.16;

        if(
            Math.abs(
                bridgeVelocity.y
            )>.3
        ){

            bridgeVelocity.y*=-.22;

        }else{

            bridgeVelocity.y=0;
        }
    }

    /*
      BOOTDECK:
      Die Brücke wird NICHT mehr
      durch das Boot fallen.
    */

    const ends=
        getBridgeEnds();

    let onBoatA=
        isOnBoatDeckPoint(ends.a);

    let onBoatB=
        isOnBoatDeckPoint(ends.b);

    if(
        onBoatA ||
        onBoatB
    ){

        const deckY=
            boat.position.y+1.66;

        /*
          Wenn mindestens ein Ende
          das Boot berührt, bleibt die
          Brücke auf Deckhöhe.
        */

        if(
            bridge.position.y<
            deckY
        ){

            bridge.position.y=
                deckY;

            bridgeVelocity.y=0;
        }
    }

    /*
      Wenn die Brücke genau zwischen
      Hafen und Boot liegt, wird sie
      automatisch zur Rampe.
    */

    const nearBoat=
        bridge.position.distanceTo(
            boat.position
        )<9;

    if(nearBoat){

        const q=
            boatLocalPosition(
                bridge.position
            );

        /*
          Bereich hinter dem Boot
        */

        if(
            q.z>7 &&
            q.z<12 &&
            Math.abs(q.x)<5
        ){

            const deckY=
                boat.position.y+1.66;

            if(
                bridge.position.y<
                deckY-.1
            ){

                bridge.position.y=
                    deckY-.05;

                bridgeVelocity.y=0;
            }
        }
    }
}

========================================================= */

function pickupBridge(){

    bridgeState=1;

    bridge.visible=false;

    bridgeVelocity.set(
        0,0,0
    );

    document.getElementById(
        "bridgeStatus"
    ).textContent=
        "in der Hand";
}


/* =========================================================
   BRÜCKE PLATZIEREN
========================================================= */

function dropBridge(){

    const forward=
        new THREE.Vector3();

    camera.getWorldDirection(
        forward
    );

    forward.y=0;

    if(
        forward.lengthSq()<.01
    )
        return;

    forward.normalize();

    bridge.parent=scene;

    bridge.visible=true;

    bridge.position.copy(
        camera.position
    );

    bridge.position.addScaledVector(
        forward,
        4
    );

    bridge.position.y=
        Math.max(
            .8,
            camera.position.y-.8
        );

    bridge.rotation.set(
        0,
        Math.atan2(
            forward.x,
            forward.z
        )+bridgeRotation,
        0
    );

    bridgeVelocity.set(
        0,
        -1.5,
        0
    );

    bridgeState=2;

    document.getElementById(
        "bridgeStatus"
    ).textContent=
        "aufgestellt";
}

    );

    bridgeVelocity.set(
        0,
        0,
        0
    );

    bridge.visible=true;

    document.getElementById(
        "bridgeStatus"
    ).textContent=
        "auf dem Boot";
}


/* =========================================================
   SPIELER
========================================================= */

camera.position.set(
    0,
    2.2,
    6
);

let velocityY=0;
let onGround=true;

const keys={};

let eLocked=false;

addEventListener(
    "keydown",
    event=>{

        keys[event.code]=true;

        /*
          E nur einmal pro Tastendruck
        */

        if(
            event.code==="KeyE" &&
            !eLocked
        ){

            eLocked=true;

            interact();
        }

        if(
            event.code==="KeyR" &&
            bridgeState===1
        ){

            bridgeRotation+=
                Math.PI/2;
        }

        if(
            event.code==="Space" &&
            onGround &&
            !steering
        ){

            velocityY=7;
            onGround=false;
        }
    }
);

addEventListener(
    "keyup",
    event=>{

        keys[event.code]=false;

        if(
            event.code==="KeyE"
        ){

            eLocked=false;
        }
    }
);


/* =========================================================
   STEUERSTAND
========================================================= */

let steering=false;
let boatSpeed=0;
let boatRotation=0;

function enterBoatControl(){

    if(
        bridgeState!==3
    )
        return;

    steering=true;

    controls.unlock();

    document.getElementById(
        "boatControls"
    ).style.display="block";
}

function leaveBoatControl(){

    steering=false;

    boatSpeed=0;

    document.getElementById(
        "boatControls"
    ).style.display="none";

    /*
      Sichere Position auf dem Boot.
    */

    const exit=
        new THREE.Vector3(
            -3.2,
            0,
            1
        );

    exit.applyAxisAngle(
        new THREE.Vector3(0,1,0),
        boat.rotation.y
    );

    camera.position.copy(
        boat.position
    ).add(exit);

    camera.position.y=
        boat.position.y+2.65;

    controls.lock();
}


/* =========================================================
   BOOT FAHREN
========================================================= */

function driveBoat(dt){

    if(!steering)
        return;

    if(keys.KeyW)
        boatSpeed+=6*dt;

    if(keys.KeyS)
        boatSpeed-=6*dt;

    boatSpeed*=.985;

    boatSpeed=
        Math.max(
            -3,
            Math.min(
                14,
                boatSpeed
            )
        );

    if(keys.KeyA)
        boatRotation+=
            1.1*dt;

    if(keys.KeyD)
        boatRotation-=
            1.1*dt;

    boat.rotation.y=
        boatRotation;

    const direction=
        new THREE.Vector3(
            0,
            0,
            -1
        );

    direction.applyAxisAngle(
        new THREE.Vector3(0,1,0),
        boat.rotation.y
    );

    boat.position.addScaledVector(
        direction,
        boatSpeed*dt
    );

    /*
      Boot darf nicht auf den Hafen.
    */

    if(
        boat.position.z>1
    ){

        boat.position.z=1;
        boatSpeed=0;
    }

    /*
      Kamera dreht sich mit dem Boot.
    */

    const cameraOffset=
        new THREE.Vector3(
            0,
            4.5,
            5
        );

    cameraOffset.applyAxisAngle(
        new THREE.Vector3(0,1,0),
        boat.rotation.y
    );

    camera.position.copy(
        boat.position
    ).add(
        cameraOffset
    );

    const look=
        new THREE.Vector3(
            0,
            2,
            -5
        );

    look.applyAxisAngle(
        new THREE.Vector3(0,1,0),
        boat.rotation.y
    );

    camera.lookAt(
        boat.position.clone()
        .add(look)
    );
}


/* =========================================================
   SPIELER AUF BOOT / BRÜCKE
========================================================= */

function playerOnBoat(){

    const q=
        boatLocalPosition(
            camera.position
        );

    return (
        Math.abs(q.x)<4.0 &&
        q.z>-9.2 &&
        q.z<9.2 &&
        camera.position.y>
        boat.position.y+2
    );
}

function playerOnBridge(){

    if(bridgeState!==2)
        return false;

    const q=
        camera.position.clone()
        .sub(bridge.position);

    q.applyEuler(
        new THREE.Euler(
            0,
            -bridge.rotation.y,
            0
        )
    );

    return (
        Math.abs(q.x)<
            BRIDGE_WIDTH/2+.4 &&
        Math.abs(q.z)<
            BRIDGE_LENGTH/2+.4
    );
}


/* =========================================================
   BEWEGUNG
========================================================= */

function canMoveTo(p){

    /*
      Hafen
    */

    if(
        p.x<-32 ||
        p.x>32 ||
        p.z>16
    )
        return false;

    /*
      Wasser darf nur mit Boot
      oder Brücke betreten werden.
    */

    if(
        p.z<-2.8 &&
        !playerOnBridge() &&
        !playerOnBoat()
    ){

        /*
          Zielposition prüfen
        */

        if(
            p.z<-2.8
        )
            return false;
    }

    /*
      Auf Boot:
      Seitenbegrenzung
    */

    const q=
        boatLocalPosition(p);

    if(
        Math.abs(q.x)>4.05 &&
        q.z>-9 &&
        q.z<9
    ){

        return false;
    }

    /*
      Kabine:
      Türbereich bleibt frei.
    */

    if(
        playerOnBoat()
    ){

        if(
            q.z>0 &&
            q.z<6 &&
            Math.abs(q.x)<3.3
        ){

            /*
              Steuerstand und Innenraum
              betreten erlaubt, wenn Tür offen.
            */

            if(
                !doorOpen &&
                q.z<5.2 &&
                Math.abs(q.x+1.1)>1.1
            ){

                return false;
            }
        }
    }

    return true;
}

function movePlayer(dt){

    if(steering)
        return;

    const speed=
        (
            keys.ShiftLeft ||
            keys.ShiftRight
        )
        ?8
        :4.5;

    const direction=
        new THREE.Vector3();

    if(keys.KeyW)
        direction.z-=1;

    if(keys.KeyS)
        direction.z+=1;

    if(keys.KeyA)
        direction.x-=1;

    if(keys.KeyD)
        direction.x+=1;

    if(direction.lengthSq()>0){

        direction.normalize();

        const forward=
            new THREE.Vector3();

        camera.getWorldDirection(
            forward
        );

        forward.y=0;
        forward.normalize();

        const right=
            new THREE.Vector3();

        right.crossVectors(
            forward,
            new THREE.Vector3(0,1,0)
        ).normalize();

        const movement=
            new THREE.Vector3();

        movement.addScaledVector(
            forward,
            direction.z*speed*dt
        );

        movement.addScaledVector(
            right,
            direction.x*speed*dt
        );

        /*
          X
        */

        const px=
            camera.position.clone();

        px.x+=movement.x;

        if(
            canMoveTo(px)
        ){

            camera.position.x=
                px.x;
        }

        /*
          Z
        */

        const pz=
            camera.position.clone();

        pz.z+=movement.z;

        if(
            canMoveTo(pz)
        ){

            camera.position.z=
                pz.z;
        }
    }


    /*
      Bodenhöhe
    */

    let floor=2.2;

    if(
        playerOnBoat()
    ){

        floor=
            boat.position.y+2.65;
    }

    if(
        playerOnBridge()
    ){

        floor=
            Math.max(
                2.2,
                bridge.position.y+1.25
            );
    }

    /*
      Gravitation
    */

    velocityY-=18*dt;

    camera.position.y+=
        velocityY*dt;

    if(
        camera.position.y<=floor
    ){

        camera.position.y=floor;

        velocityY=0;

        onGround=true;

    }else{

        onGround=false;
    }
}


/* =========================================================
   INTERAKTION
========================================================= */

function interact(){

    const player=
        camera.position.clone();


    /*
      1. STEUERUNG VERLASSEN
      MUSS GANZ OBEN STEHEN.
    */

    if(steering){

        leaveBoatControl();

        return;
    }


    /*
      2. BRÜCKE IN HAND
    */

    if(
        bridgeState===1
    ){

        /*
          Wenn Spieler auf dem Boot ist,
          wird sie direkt auf das Boot gelegt.
        */

        if(
            playerOnBoat()
        ){

            putBridgeOnBoat();

        }else{

            dropBridge();
        }

        return;
    }


    /*
      3. BRÜCKE AM HAFEN AUFNEHMEN
    */

    if(
        bridgeState===0 &&
        player.distanceTo(
            bridge.position
        )<4
    ){

        pickupBridge();

        return;
    }


    /*
      4. BRÜCKE AUF DEM WASSER
      aufnehmen, wenn man auf dem
      Boot steht und sie erreicht.
    */

    if(
        bridgeState===2 &&
        playerOnBoat() &&
        player.distanceTo(
            bridge.position
        )<5
    ){

        pickupBridge();

        return;
    }


    /*
      5. TÜR
    */

    const doorPoint=
        worldPosition(
            cabinDoor
        );

    if(
        player.distanceTo(
            doorPoint
        )<4
    ){

        toggleDoor();

        return;
    }


    /*
      6. LENKRAD
    */

    const wheelPoint=
        worldPosition(
            wheel
        );

    if(
        bridgeState===3 &&
        player.distanceTo(
            wheelPoint
        )<4.5
    ){

        enterBoatControl();

        return;
    }


    /*
      7. KRAN
    */

    const cranePoint=
        worldPosition(
            crane
        );

    if(
        bridgeState===3 &&
        player.distanceTo(
            cranePoint
        )<5
    ){

        animateCrane();

        return;
    }
}


/* =========================================================
   PROMPT
========================================================= */

function showPrompt(text){

    const p=
        document.getElementById(
            "prompt"
        );

    p.innerHTML=text;

    p.style.display="block";
}

function hidePrompt(){

    document.getElementById(
        "prompt"
    ).style.display="none";
}

function updatePrompt(){

    if(steering){

        hidePrompt();

        return;
    }

    const player=
        camera.position;


    /*
      Brücke am Hafen
    */

    if(
        bridgeState===0 &&
        player.distanceTo(
            bridge.position
        )<4
    ){

        showPrompt(
            "E – Eisenbrücke aufnehmen"
        );

        return;
    }


    /*
      Brücke in Hand
    */

    if(
        bridgeState===1
    ){

        if(
            playerOnBoat()
        ){

            showPrompt(
                "E – Brücke aufs Boot legen<br>R – drehen"
            );

        }else{

            showPrompt(
                "E – Brücke ablegen<br>R – drehen"
            );
        }

        return;
    }


    /*
      Brücke aufgestellt
    */

    if(
        bridgeState===2 &&
        playerOnBoat() &&
        player.distanceTo(
            bridge.position
        )<5
    ){

        showPrompt(
            "E – Brücke aufnehmen"
        );

        return;
    }


    /*
      Tür
    */

    const doorPoint=
        worldPosition(
            cabinDoor
        );

    if(
        player.distanceTo(
            doorPoint
        )<4
    ){

        showPrompt(
            doorOpen
            ? "E – Tür schließen"
            : "E – Tür öffnen"
        );

        return;
    }


    /*
      Lenkrad
    */

    if(
        bridgeState===3
    ){

        const wheelPoint=
            worldPosition(
                wheel
            );

        if(
            player.distanceTo(
                wheelPoint
            )<4.5
        ){

            showPrompt(
                "E – Steuerstand betreten"
            );

            return;
        }
    }


    /*
      Kran
    */

    if(
        bridgeState===3
    ){

        const cranePoint=
            worldPosition(
                crane
            );

        if(
            player.distanceTo(
                cranePoint
            )<5
        ){

            showPrompt(
                craneLowered
                ? "E – Netz hochziehen"
                : "E – Netz ins Wasser lassen"
            );

            return;
        }
    }

    hidePrompt();
}


/* =========================================================
   START
========================================================= */

document.getElementById(
    "startButton"
).addEventListener(
    "click",
    function(){

        document.getElementById(
            "start"
        ).style.display="none";

        controls.lock();
    }
);


/*
  Pointer-Lock nicht mehr dauerhaft
  erzwingen.
*/

controls.addEventListener(
    "unlock",
    function(){

        if(!steering){

            /*
              Spieler darf danach
              weiterhin E/WASD benutzen.
            */

        }
    }
);


/* =========================================================
   LOOP
========================================================= */

let last=
    performance.now();

function animate(now){

    requestAnimationFrame(
        animate
    );

    const dt=
        Math.min(
            (now-last)/1000,
            .033
        );

    last=now;

    movePlayer(dt);

    updateBridgePhysics(dt);

    driveBoat(dt);

    updatePrompt();

    renderer.render(
        scene,
        camera
    );
}

animate(
    performance.now()
);


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    function(){

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);
