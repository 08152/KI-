<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MAXE RUNNER – ELEVATOR INTRO</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

/* DUNKLE FILMATMOSPHÄRE */
#vignette{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:10;
    background:
        radial-gradient(
            ellipse at center,
            transparent 25%,
            rgba(0,0,0,.15) 50%,
            rgba(0,0,0,.85) 100%
        );
}

/* UNSCHÄRFE */
#blur{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:9;
    backdrop-filter:blur(0px);
}

/* AUGENLIDER */
#eyelidTop,
#eyelidBottom{
    position:fixed;
    left:0;
    width:100%;
    height:0%;
    background:#050505;
    z-index:20;
    pointer-events:none;
}

#eyelidTop{
    top:0;
}

#eyelidBottom{
    bottom:0;
}

/* CINEMA TEXT */
#text{
    position:fixed;
    left:50%;
    bottom:8%;
    transform:translateX(-50%);
    z-index:30;

    color:white;
    font-size:14px;
    letter-spacing:4px;

    opacity:0;
    transition:opacity 1s;

    text-shadow:0 0 10px black;
}

#start{
    position:fixed;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:100;

    color:#ddd;
    background:#000;

    font-size:18px;
    letter-spacing:3px;

    cursor:pointer;
}

</style>
</head>

<body>

<div id="start">KLICKEN ZUM STARTEN</div>

<div id="blur"></div>

<div id="vignette"></div>

<div id="eyelidTop"></div>
<div id="eyelidBottom"></div>

<div id="text"></div>


<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script>

/* =====================================================
   SCENE
===================================================== */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x000000);

scene.fog = new THREE.Fog(
    0x000000,
    5,
    120
);


/* =====================================================
   CAMERA
===================================================== */

const camera = new THREE.PerspectiveCamera(
    70,
    innerWidth / innerHeight,
    0.1,
    1000
);

camera.position.set(
    0,
    1.7,
    0
);


/* =====================================================
   RENDERER
===================================================== */

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);

renderer.outputEncoding =
    THREE.sRGBEncoding;

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   ELEVATOR
===================================================== */

const elevator =
    new THREE.Group();

scene.add(
    elevator
);


/* FLOOR */

const floor =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            4,
            0.15,
            4
        ),

        new THREE.MeshStandardMaterial({
            color:0x111111,
            roughness:.8
        })

    );

floor.position.y =
    -1.7;

elevator.add(
    floor
);


/* WALLS */

function createWall(
    x,
    y,
    z,
    sx,
    sy,
    sz
){

    const wall =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                sx,
                sy,
                sz
            ),

            new THREE.MeshStandardMaterial({
                color:0x090909,
                roughness:1
            })

        );

    wall.position.set(
        x,
        y,
        z
    );

    elevator.add(
        wall
    );

}


/* LEFT */
createWall(
    -2,
    1,
    0,
    .15,
    5,
    5
);

/* RIGHT */
createWall(
    2,
    1,
    0,
    .15,
    5,
    5
);

/* BACK */
createWall(
    0,
    1,
    2,
    4,
    5,
    .15
);


/* =====================================================
   ELEVATOR SHAFT
===================================================== */

const shaft =
    new THREE.Group();

scene.add(
    shaft
);


/* DUNKLE SEITEN */

function shaftWall(
    x
){

    const wall =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .3,
                500,
                10
            ),

            new THREE.MeshStandardMaterial({
                color:0x030303
            })

        );

    wall.position.set(
        x,
        250,
        0
    );

    shaft.add(
        wall
    );

}

shaftWall(
    -5
);

shaftWall(
    5
);


/* =====================================================
   VORBEIRASENDE LICHTER
===================================================== */

const lights =
    [];

const lightMaterial =
    new THREE.MeshBasicMaterial({
        color:0xff3333
    });


for(
    let i=0;
    i<80;
    i++
){

    const light =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .15,
                1,
                .1
            ),

            lightMaterial.clone()

        );


    light.position.set(

        Math.random() > .5
        ?
        -4.7
        :
        4.7,

        Math.random()*250-50,

        -2 + Math.random()*4

    );


    shaft.add(
        light
    );


    lights.push(
        light
    );

}


/* =====================================================
   ROTES LICHT OBEN
===================================================== */

const redLight =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .18,
            32,
            32
        ),

        new THREE.MeshBasicMaterial({
            color:0xff0000
        })

    );

redLight.position.set(
    0,
    120,
    -1
);

scene.add(
    redLight
);


/* ROTES GLOW */

const redGlow =
    new THREE.PointLight(
        0xff0000,
        4,
        15
    );

redGlow.position.copy(
    redLight.position
);

scene.add(
    redGlow
);


/* =====================================================
   TOR
===================================================== */

const gate =
    new THREE.Group();

gate.position.set(
    0,
    123,
    -5
);

scene.add(
    gate
);


const gateMaterial =
    new THREE.MeshStandardMaterial({
        color:0x181818,
        roughness:.7
    });


const gateLeft =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            3,
            4,
            .2
        ),

        gateMaterial

    );


const gateRight =
    gateLeft.clone();


gateLeft.position.x =
    -1.5;

gateRight.position.x =
    1.5;


gate.add(
    gateLeft
);

gate.add(
    gateRight
);


/* =====================================================
   NEUTRALE MENSCHLICHE SILHOUETTEN
===================================================== */

const people =
    [];

function createPerson(
    angle,
    radius
){

    const person =
        new THREE.Group();


    const body =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .25,
                .32,
                1.4,
                8
            ),

            new THREE.MeshStandardMaterial({
                color:0x090909
            })

        );


    body.position.y =
        .7;


    const head =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .28,
                12,
                12
            ),

            new THREE.MeshStandardMaterial({
                color:0x111111
            })

        );


    head.position.y =
        1.65;


    person.add(
        body
    );

    person.add(
        head
    );


    person.position.set(

        Math.cos(angle)*radius,

        121,

        -5 +
        Math.sin(angle)*radius

    );


    person.lookAt(
        0,
        121,
        -5
    );


    scene.add(
        person
    );


    people.push(
        person
    );

}


/* KREIS */

for(
    let i=0;
    i<7;
    i++
){

    createPerson(

        i /
        7 *
        Math.PI *
        2,

        4

    );

}


/* =====================================================
   AMBIENT LIGHT
===================================================== */

const ambient =
    new THREE.AmbientLight(
        0x111111,
        .3
    );

scene.add(
    ambient
);


/* =====================================================
   INTRO STATE
===================================================== */

let started =
    false;

let introTime =
    0;

let elevatorY =
    0;

let speed =
    0;

let stopped =
    false;


/* =====================================================
   UI
===================================================== */

const startScreen =
    document.getElementById(
        "start"
    );

const text =
    document.getElementById(
        "text"
    );

const blur =
    document.getElementById(
        "blur"
    );

const eyelidTop =
    document.getElementById(
        "eyelidTop"
    );

const eyelidBottom =
    document.getElementById(
        "eyelidBottom"
    );


startScreen.addEventListener(
    "click",
    ()=>{

        started =
            true;

        startScreen.style.display =
            "none";

    }
);


/* =====================================================
   ANIMATION
===================================================== */

const clock =
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    if(
        started
    ){

        introTime +=
            delta;


        /*
        =====================================
        0–3 SEKUNDEN
        =====================================
        */

        if(
            introTime <
            3
        ){

            speed =
                0;

        }


        /*
        =====================================
        AUFZUG BESCHLEUNIGT
        =====================================
        */

        else
        if(
            introTime <
            8
        ){

            speed +=
                7 *
                delta;


            speed =
                Math.min(
                    speed,
                    30
                );

        }


        /*
        =====================================
        SCHNELLE FAHRT
        =====================================
        */

        else
        if(
            introTime <
            10
        ){

            speed =
                30;

        }


        /*
        =====================================
        ABRUPTER STOPP
        =====================================
        */

        else
        if(
            introTime <
            10.25
        ){

            speed *=
                .1;


            stopped =
                true;

        }


        /*
        =====================================
        AUFZUG BEWEGUNG
        =====================================
        */

        elevatorY +=
            speed *
            delta;


        elevator.position.y =
            elevatorY;


        /*
        Kamera fährt mit.
        Der Schacht bleibt fest.
        */

        camera.position.y =
            1.7;


        /*
        =====================================
        LICHTER RASEN VORBEI
        =====================================
        */

        if(
            speed >
            0
        ){

            lights.forEach(
                light=>{

                    light.position.y -=
                        speed *
                        delta;


                    if(
                        light.position.y <
                        elevatorY -
                        20
                    ){

                        light.position.y +=
                            250;

                    }

                }
            );

        }


        /*
        =====================================
        KAMERA VIBRATION
        =====================================
        */

        if(
            speed >
            10
        ){

            camera.position.x =
                Math.sin(
                    introTime*
                    45
                )*
                .012;


            camera.position.z =
                Math.cos(
                    introTime*
                    37
                )*
                .012;

        }


        /*
        =====================================
        AUF ROTES LICHT ZOOMEN
        =====================================
        */

        if(
            introTime >
            3 &&
            introTime <
            10
        ){

            const target =
                new THREE.Vector3(
                    0,
                    120 -
                    elevatorY,
                    -1
                );


            camera.lookAt(
                target
            );

        }


        /*
        =====================================
        STOPP
        =====================================
        */

        if(
            introTime >
            10 &&
            introTime <
            10.5
        ){

            camera.position.z =
                Math.sin(
                    introTime*
                    150
                )*
                .12;

        }


        /*
        =====================================
        AUGEN SCHLIESSEN
        =====================================
        */

        if(
            introTime >
            10.5 &&
            introTime <
            13
        ){

            const p =
                Math.min(
                    1,
                    (
                        introTime-
                        10.5
                    )/
                    2.5
                );


            eyelidTop.style.height =
                (
                    p*
                    50
                )+
                "%";


            eyelidBottom.style.height =
                (
                    p*
                    50
                )+
                "%";


            blur.style.backdropFilter =
                "blur("+
                (
                    p*
                    12
                )+
                "px)";


            redLight.visible =
                p <
                .65;


            redGlow.visible =
                p <
                .65;

        }


        /*
        =====================================
        TOR ÖFFNET SICH
        =====================================
        */

        if(
            introTime >
            13
        ){

            eyelidTop.style.height =
                "38%";

            eyelidBottom.style.height =
                "38%";

            blur.style.backdropFilter =
                "blur(7px)";


            gateLeft.position.x -=
                delta*
                .5;


            gateRight.position.x +=
                delta*
                .5;


            text.style.opacity =
                "1";

            text.textContent =
                "WILLKOMMEN";


        }

    }


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>

</body>
</html>
