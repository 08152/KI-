<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fishing Simulator</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#75ccef;font-family:Arial}
canvas{display:block}
#crosshair{
position:fixed;left:50%;top:50%;width:8px;height:8px;
transform:translate(-50%,-50%);border:2px solid white;
border-radius:50%;z-index:10;pointer-events:none
}
#hud,#status,#prompt,#drive{
position:fixed;color:white;background:rgba(0,0,0,.72);
border-radius:10px;z-index:20
}
#hud{top:12px;left:12px;padding:12px;line-height:1.5}
#status{top:12px;right:12px;padding:12px}
#prompt{
left:50%;bottom:55px;transform:translateX(-50%);
padding:13px 22px;font-size:18px;display:none;text-align:center
}
#drive{
bottom:15px;left:50%;transform:translateX(-50%);
padding:12px 25px;text-align:center;display:none
}
#start{
position:fixed;inset:0;z-index:100;background:#06131ddd;
display:flex;align-items:center;justify-content:center;
flex-direction:column;color:white
}
#start h1{font-size:48px}
button{padding:15px 35px;border:0;border-radius:10px;font-size:20px;cursor:pointer}
</style>
</head>
<body>

<div id="start">
<h1>🎣 FISHING SIMULATOR</h1>
<button id="startBtn">START</button>
</div>

<div id="crosshair"></div>

<div id="hud">
<b>🎣 FISHING SIMULATOR</b><br>
WASD = Laufen<br>
Maus = Umschauen<br>
E = Interagieren<br>
R = Brücke drehen<br>
Shift = Rennen<br>
Space = Springen
</div>

<div id="status">
🔩 Brücke: <b id="bridgeText">am Hafen</b>
</div>

<div id="prompt"></div>

<div id="drive">
🚤 <b>BOOT STEUERN</b><br>
W/S = Gas &nbsp; A/D = Lenken<br>
E = Steuerstand verlassen
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

<script>
/* =========================================================
   ENGINE
========================================================= */

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x83ccef);
scene.fog=new THREE.Fog(0x83ccef,45,180);

const camera=new THREE.PerspectiveCamera(
75,innerWidth/innerHeight,.1,300
);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

const controls=new THREE.PointerLockControls(camera,document.body);

scene.add(new THREE.HemisphereLight(0xbfeeff,0x39444a,1.5));

const sun=new THREE.DirectionalLight(0xffffff,1.8);
sun.position.set(-30,50,20);
sun.castShadow=true;
sun.shadow.mapSize.width=1024;
sun.shadow.mapSize.height=1024;
scene.add(sun);


/* =========================================================
   MATERIALIEN
========================================================= */

function mat(color,rough=.8,metalness=0,transparent=false,opacity=1){
return new THREE.MeshStandardMaterial({
color,
roughness:rough,
metalness,
transparent,
opacity
});
}

const M={
ground:mat(0x565b5e),
wood:mat(0x704521),
darkWood:mat(0x342016),
metal:mat(0x747d82,.25,.85),
darkMetal:mat(0x252b2f,.25,.9),
white:mat(0xe6e4d9),
glass:mat(0x55b6d3,.1,.1,true,.55),
water:mat(0x147da8,.25),
net:mat(0x34464d,.8,.2,true,.7),
yellow:mat(0xe0aa22,.3,.7)
};

function box(w,h,d,m,x,y,z,parent=scene){
const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
o.position.set(x,y,z);
o.castShadow=true;
o.receiveShadow=true;
parent.add(o);
return o;
}

function cyl(r,h,m,x,y,z,parent=scene){
const o=new THREE.Mesh(
new THREE.CylinderGeometry(r,r,h,16),
m
);
o.position.set(x,y,z);
o.castShadow=true;
o.receiveShadow=true;
parent.add(o);
return o;
}


/* =========================================================
   HAFEN
========================================================= */

box(90,.5,60,M.ground,0,-.25,8);

const water=new THREE.Mesh(
new THREE.PlaneGeometry(180,180),
M.water
);
water.rotation.x=-Math.PI/2;
water.position.set(0,-.7,-55);
scene.add(water);

/* Hafenfläche */

box(70,.4,2,M.darkWood,0,.1,-1.2);
box(70,.4,2,M.darkWood,0,.1,13);

for(let x=-30;x<=30;x+=10){
cyl(.35,1,M.darkMetal,x,.55,1);
cyl(.35,1,M.darkMetal,x,.55,10);
}


/* =========================================================
   BOOT
========================================================= */

const boat=new THREE.Group();
boat.position.set(0,.15,-7);
scene.add(boat);

/* Rumpf */

box(
9,
1.35,
21,
M.darkMetal,
0,
.55,
0,
boat
);

/* Deck */

box(
8.7,
.25,
20,
M.wood,
0,
1.35,
0,
boat
);

/* Bug */

const bow=new THREE.Mesh(
new THREE.ConeGeometry(4.5,6,4),
M.darkMetal
);
bow.rotation.x=Math.PI/2;
bow.rotation.y=Math.PI/4;
bow.position.set(0,.65,-11);
bow.scale.z=1.2;
bow.castShadow=true;
boat.add(bow);


/* =========================================================
   BOOT-REELING
========================================================= */

for(let z=-9;z<=9;z+=3){

box(.14,1,.14,M.metal,-4.3,2,z,boat);
box(.14,1,.14,M.metal,4.3,2,z,boat);
}

box(8.6,.12,.12,M.metal,0,2.5,-9.5,boat);
box(8.6,.12,.12,M.metal,0,2.5,9.5,boat);


/* =========================================================
   KABINE
========================================================= */

const cabin=new THREE.Group();
cabin.position.set(0,1.45,2.8);
boat.add(cabin);

/*
   Keine massive Frontwand.
   Dadurch funktioniert die Tür wirklich.
*/

box(7,3.3,.3,M.white,0,1.65,2.4,cabin);
box(.3,3.3,4.5,M.white,-3.35,1.65,0,cabin);
box(.3,3.3,4.5,M.white,3.35,1.65,0,cabin);
box(7,3.3,.3,M.white,0,1.65,-2.4,cabin);
box(7.6,.35,5.1,M.darkWood,0,3.45,0,cabin);

/* Fenster */

box(2.2,1.2,.08,M.glass,-1.8,2.25,-2.56,cabin);
box(2.2,1.2,.08,M.glass,1.8,2.25,-2.56,cabin);


/* =========================================================
   TÜR
========================================================= */

const door=new THREE.Group();
door.position.set(-.9,1.35,2.42);
cabin.add(door);

box(1.8,2.7,.14,M.darkWood,.9,0,0,door);

let doorOpen=false;
let doorAnim=false;

function toggleDoor(){

if(doorAnim)return;

doorAnim=true;

const start=doorOpen?1:0;
const end=doorOpen?0:1;

let t=0;

function a(){

t+=.06;
const p=Math.min(t,1);

const e=p<.5
?2*p*p
:1-Math.pow(-2*p+2,2)/2;

door.rotation.y=
-(start+(end-start)*e)*Math.PI/2;

if(p<1)requestAnimationFrame(a);
else{
doorOpen=!doorOpen;
doorAnim=false;
}
}

a();
}


/* =========================================================
   STEUERRAD
========================================================= */

const wheel=new THREE.Group();
wheel.position.set(0,2.55,.7);
boat.add(wheel);

const ring=new THREE.Mesh(
new THREE.TorusGeometry(1,.13,10,24),
M.darkWood
);
ring.rotation.x=Math.PI/2;
wheel.add(ring);

for(let i=0;i<8;i++){
const a=i*Math.PI/4;
const s=box(
.12,.12,1.7,
M.metal,
Math.sin(a)*.75,
0,
Math.cos(a)*.75,
wheel
);
s.rotation.y=a;
}

box(3,.8,1.1,M.darkMetal,0,2.05,1.15,boat);

box(3,.4,1.1,M.darkWood,0,2.3,2.2,boat);


/* =========================================================
   REAR
========================================================= */

const rear=new THREE.Group();
rear.position.set(0,0,7.5);
boat.add(rear);

box(8,.2,4.5,M.wood,0,1.55,0,rear);


/* =========================================================
   NETZ
========================================================= */

const net=new THREE.Group();
net.position.set(0,1.75,7.5);
boat.add(net);

const netPlane=new THREE.Mesh(
new THREE.PlaneGeometry(5,3.5,12,8),
M.net
);
netPlane.rotation.x=-Math.PI/2;
net.add(netPlane);

for(let x=-2.4;x<=2.4;x+=.4)
box(.025,.025,3.5,M.metal,x,.04,0,net);

for(let z=-1.5;z<=1.5;z+=.4)
box(5,.025,.025,M.metal,0,.05,z,net);


/* =========================================================
   KRAN
========================================================= */

const crane=new THREE.Group();
crane.position.set(3,1.65,8);
boat.add(crane);

box(1,.45,1,M.darkMetal,0,0,0,crane);

const craneArm=new THREE.Group();
craneArm.position.set(0,.2,0);
crane.add(craneArm);

box(.5,4,.5,M.darkMetal,0,2,0,craneArm);

const boom=new THREE.Group();
boom.position.set(0,4,0);
craneArm.add(boom);

box(4,.4,.4,M.darkMetal,1.7,0,0,boom);

const rope=new THREE.Mesh(
new THREE.CylinderGeometry(.055,.055,4,8),
M.metal
);
rope.position.set(3.5,-2,0);
boom.add(rope);

const hook=new THREE.Group();
hook.position.set(3.5,-4,0);
boom.add(hook);

cyl(.16,.5,M.yellow,0,0,0,hook);

const hangingNet=new THREE.Group();
hangingNet.position.set(0,-.4,0);
hook.add(hangingNet);

const basket=new THREE.Mesh(
new THREE.CylinderGeometry(1.5,.8,1.4,12,1,true),
M.net
);
hangingNet.add(basket);

let craneDown=false;
let craneBusy=false;

function moveCrane(){

if(craneBusy)return;

craneBusy=true;

const from=craneDown?1:0;
const to=craneDown?0:1;

let t=0;

function a(){

t+=.025;

const p=Math.min(t,1);

const e=p<.5
?2*p*p
:1-Math.pow(-2*p+2,2)/2;

const v=from+(to-from)*e;

boom.rotation.z=-v*.45;

rope.scale.y=1+v*2;
rope.position.y=-2-v*2;

hook.position.y=-4-v*2;
hangingNet.position.y=-.4-v*1.5;

if(p<1)requestAnimationFrame(a);
else{
craneDown=!craneDown;
craneBusy=false;
}
}

a();
}


/* =========================================================
   BRÜCKE
========================================================= */

const bridge=new THREE.Group();

box(2.2,.22,6,M.darkMetal,0,0,0,bridge);

for(let z=-2.5;z<=2.5;z+=1)
box(2.2,.12,.13,M.metal,0,.15,z,bridge);

scene.add(bridge);

bridge.position.set(0,.45,-1.9);

let bridgeState=0;
/*
0 Hafen
1 in Hand
2 liegt zwischen Hafen und Boot
3 auf Boot
*/

let bridgeVel=new THREE.Vector3();
let bridgeSpin=0;

const BRIDGE_LENGTH=6;
const BRIDGE_WIDTH=2.2;


/* =========================================================
   BRÜCKEN-PHYSIK
========================================================= */

function bridgeEnds(){

const dir=new THREE.Vector3(0,0,1);
dir.applyEuler(bridge.rotation);

const a=bridge.position.clone()
.addScaledVector(dir,-BRIDGE_LENGTH/2);

const b=bridge.position.clone()
.addScaledVector(dir,BRIDGE_LENGTH/2);

return {a,b};
}

function boatDeckHeight(){
return boat.position.y+1.48;
}

function pointOnBoatDeck(p){

const q=p.clone()
.sub(boat.position);

q.applyAxisAngle(
new THREE.Vector3(0,1,0),
-boat.rotation.y
);

return (
Math.abs(q.x)<4.0 &&
Math.abs(q.z)<9.0 &&
p.y>=boatDeckHeight()-.4 &&
p.y<=boatDeckHeight()+2
);
}

function updateBridgePhysics(dt){

if(bridgeState!==2)return;

bridgeVel.y-=16*dt;

bridge.position.addScaledVector(
bridgeVel,
dt
);

bridge.rotation.y+=bridgeSpin*dt;

bridgeSpin*=.985;


/*
  Die Brücke kann nicht durch das
  Bootdeck fallen.
*/

const ends=bridgeEnds();

let supportA=.11;
let supportB=.11;

if(pointOnBoatDeck(ends.a))
supportA=boatDeckHeight();

if(pointOnBoatDeck(ends.b))
supportB=boatDeckHeight();


/*
  Wenn beide Seiten auf dem Hafen
  liegen.
*/

if(
Math.abs(supportA-.11)<.01 &&
Math.abs(supportB-.11)<.01
){

if(bridge.position.y<.13){

bridge.position.y=.13;
bridgeVel.y=0;
bridgeSpin*=.5;

}

return;
}


/*
  Wenn eine Seite auf dem Boot
  und eine auf dem Hafen liegt:
  Brücke wird zu einer Rampe.
*/

const targetY=
(supportA+supportB)/2+.11;

if(
bridge.position.y<targetY
){

bridge.position.y=targetY;

bridgeVel.y=0;
bridgeSpin*=.3;

const difference=
supportB-supportA;

bridge.rotation.x=
Math.atan2(
difference,
BRIDGE_LENGTH
);

}


/*
  Wenn die Brücke komplett auf dem
  Boot liegt.
*/

if(
supportA>1 &&
supportB>1
){

bridge.position.y=
boatDeckHeight()+.12;

bridge.rotation.x=0;

bridgeVel.set(0,0,0);
bridgeSpin=0;

}
}


/* =========================================================
   BRÜCKE AUFNEHMEN / ABLEGEN
========================================================= */

function pickupBridge(){

bridgeState=1;
bridge.visible=false;

bridgeVel.set(0,0,0);
bridgeSpin=0;

document.getElementById(
"bridgeText"
).textContent="in der Hand";
}

function dropBridge(){

bridgeState=2;
bridge.visible=true;

const forward=new THREE.Vector3();
camera.getWorldDirection(forward);
forward.y=0;
forward.normalize();

bridge.position.copy(camera.position)
.addScaledVector(forward,3.5);

bridge.position.y=Math.max(
.8,
camera.position.y-.8
);

bridge.rotation.set(
0,
Math.atan2(forward.x,forward.z),
0
);

bridgeVel.set(0,-1.5,0);
bridgeSpin=0;

document.getElementById(
"bridgeText"
).textContent="liegt auf dem Boden";
}

function putBridgeOnBoat(){

bridgeState=3;

bridge.parent=boat;

bridge.position.set(
0,
1.85,
7
);

bridge.rotation.set(
0,
0,
0
);

bridgeVel.set(0,0,0);
bridgeSpin=0;

bridge.visible=true;

document.getElementById(
"bridgeText"
).textContent="auf dem Boot";
}


/* =========================================================
   SPIELER
========================================================= */

camera.position.set(
0,
2.2,
6
);

let velY=0;
let grounded=true;
let steering=false;

const keys={};

addEventListener("keydown",e=>{

keys[e.code]=true;

if(
e.code==="Space" &&
grounded &&
!steering
){

velY=7;
grounded=false;
}

if(
e.code==="KeyR" &&
bridgeState===1
){

bridgeRotation+=Math.PI/2;
}

if(e.code==="KeyE")
interact();

});

addEventListener("keyup",e=>{
keys[e.code]=false;
});


/* =========================================================
   SPIELER-KOLLISION
========================================================= */

const PLAYER_RADIUS=.38;

function localBoatPoint(world){

const p=world.clone()
.sub(boat.position);

p.applyAxisAngle(
new THREE.Vector3(0,1,0),
-boat.rotation.y
);

return p;
}

function insideBoatDeck(p){

const q=localBoatPoint(p);

return (
Math.abs(q.x)<4.05 &&
q.z>-9.2 &&
q.z<9.3
);
}

function insideBridge(p){

if(bridgeState!==2)return false;

const q=p.clone()
.sub(bridge.position);

q.applyEuler(
new THREE.Euler(
-bridge.rotation.x,
-bridge.rotation.y,
-bridge.rotation.z
)
);

return (
Math.abs(q.x)<BRIDGE_WIDTH/2+.45 &&
Math.abs(q.z)<BRIDGE_LENGTH/2+.4
);
}

function onBoat(p){

return insideBoatDeck(p);
}

function onBridge(p){

return insideBridge(p);
}


/*
  Prüft, ob Spieler auf einer
  erlaubten Fläche steht.
*/

function getFloor(p){

/*
  Hafen
*/

let floor=1.95;


/*
  Boot
*/

if(onBoat(p)){
floor=boatDeckHeight()+1.05;
}


/*
  Brücke
*/

if(onBridge(p)){

const local=p.clone()
.sub(bridge.position);

local.applyAxisAngle(
new THREE.Vector3(0,1,0),
-bridge.rotation.y
);

const slope=
Math.tan(bridge.rotation.x);

floor=
bridge.position.y+
.18+
local.z*slope+
1.05;

}


return floor;
}


/* =========================================================
   HINDERNISSE
========================================================= */

function blockedByCabin(p){

const q=localBoatPoint(p);

if(
q.z>-.1 &&
q.z<5.3 &&
Math.abs(q.x)<3.55
){

/*
  Türöffnung.
*/

const doorX=-.9;

if(
Math.abs(q.x-doorX)<1.05 &&
q.z>4.9
){

if(doorOpen)
return false;
}

return true;
}

return false;
}

function blockedByRail(p){

const q=localBoatPoint(p);

if(
Math.abs(q.x)>4.05 &&
q.z>-9 &&
q.z<9
)return true;

return false;
}

function canMove(p){

/*
  Hafen außerhalb
*/

if(
p.x<-32 ||
p.x>32 ||
p.z>16
)
return false;


/*
  Wasser:
  Nur Brücke oder Boot.
*/

if(
p.z<-2.3 &&
!onBridge(p) &&
!onBoat(p)
)
return false;


/*
  Boot-Kollision.
  Auf dem Deck darf man laufen.
*/

if(
onBoat(p)
){

if(blockedByCabin(p))
return false;

if(blockedByRail(p))
return false;

return true;
}


/*
  Brücke erlaubt.
*/

if(onBridge(p))
return true;


/*
  Hafen.
*/

if(p.z>-2.3)
return true;

return false;
}


/* =========================================================
   SPIELERBEWEGUNG
========================================================= */

function movePlayer(dt){

if(steering)return;

const speed=
(keys.ShiftLeft||keys.ShiftRight)
?8
:4.5;

const input=new THREE.Vector3();

if(keys.KeyW)input.z-=1;
if(keys.KeyS)input.z+=1;
if(keys.KeyA)input.x-=1;
if(keys.KeyD)input.x+=1;

if(input.lengthSq()>0){

input.normalize();

const forward=new THREE.Vector3();
camera.getWorldDirection(forward);
forward.y=0;
forward.normalize();

const right=new THREE.Vector3();
right.crossVectors(
forward,
new THREE.Vector3(0,1,0)
).normalize();

const move=new THREE.Vector3();

move.addScaledVector(
forward,
input.z*speed*dt
);

move.addScaledVector(
right,
input.x*speed*dt
);


/*
  X
*/

const px=camera.position.clone();
px.x+=move.x;

if(canMove(px))
camera.position.x=px.x;


/*
  Z
*/

const pz=camera.position.clone();
pz.z+=move.z;

if(canMove(pz))
camera.position.z=pz.z;
}


/*
  Gravitation
*/

velY-=18*dt;

camera.position.y+=velY*dt;

const floor=
getFloor(camera.position);

if(
camera.position.y<=floor
){

camera.position.y=floor;
velY=0;
grounded=true;

}else{
grounded=false;
}
}


/* =========================================================
   STEUERSTAND
========================================================= */

let boatSpeed=0;
let boatYaw=0;

function enterSteering(){

if(bridgeState!==3)return;

steering=true;

controls.unlock();

document.getElementById(
"drive"
).style.display="block";
}

function exitSteering(){

steering=false;

document.getElementById(
"drive"
).style.display="none";


/*
  Spieler sicher auf das Deck setzen.
*/

const exit=
new THREE.Vector3(
-3.2,
1.1,
2
);

exit.applyAxisAngle(
new THREE.Vector3(0,1,0),
boat.rotation.y
);

camera.position.copy(
boat.position
).add(exit);

camera.position.y=
boatDeckHeight()+1.05;

boatSpeed=0;

controls.lock();
}


/* =========================================================
   BOOTFAHREN
========================================================= */

function driveBoat(dt){

if(!steering)return;

if(keys.KeyW)
boatSpeed+=7*dt;

if(keys.KeyS)
boatSpeed-=7*dt;

boatSpeed*=.985;

boatSpeed=Math.max(
-3,
Math.min(14,boatSpeed)
);

if(keys.KeyA)
boatYaw+=1.1*dt;

if(keys.KeyD)
boatYaw-=1.1*dt;

boat.rotation.y=boatYaw;

const forward=new THREE.Vector3(
0,0,-1
);

forward.applyAxisAngle(
new THREE.Vector3(0,1,0),
boat.rotation.y
);

boat.position.addScaledVector(
forward,
boatSpeed*dt
);


/*
  Nicht zurück auf den Hafen.
*/

if(boat.position.z>1){
boat.position.z=1;
boatSpeed=0;
}


/*
  Kamera hinter dem Steuerstand.
*/

const offset=new THREE.Vector3(
0,
4.5,
5.5
);

offset.applyAxisAngle(
new THREE.Vector3(0,1,0),
boat.rotation.y
);

camera.position.copy(
boat.position
).add(offset);

camera.lookAt(
boat.position.clone().add(
new THREE.Vector3(0,1,-4)
.applyAxisAngle(
new THREE.Vector3(0,1,0),
boat.rotation.y
)
);
}


/* =========================================================
   INTERAKTION
========================================================= */

function distanceToBoat(){

return camera.position.distanceTo(
boat.position
);
}

function interact(){

/*
  WICHTIG:
  E verlässt den Steuerstand
  IMMER zuerst.
*/

if(steering){
exitSteering();
return;
}


/*
  Brücke am Hafen
*/

if(
bridgeState===0 &&
camera.position.distanceTo(
bridge.position
)<3.5
){

pickupBridge();
return;
}


/*
  Brücke ablegen
*/

if(bridgeState===1){

dropBridge();
return;
}


/*
  Brücke aufnehmen, wenn sie
  am Boot liegt.
*/

if(
bridgeState===2 &&
onBoat(camera.position) &&
camera.position.distanceTo(
bridge.position
)<5
){

pickupBridge();
return;
}


/*
  Brücke aufs Boot legen.
*/

if(
bridgeState===1 &&
onBoat(camera.position)
){

putBridgeOnBoat();
return;
}


/*
  Tür
*/

const doorWorld=
new THREE.Vector3();

door.getWorldPosition(
doorWorld
);

if(
camera.position.distanceTo(
doorWorld
)<4
){

toggleDoor();
return;
}


/*
  Lenkrad
*/

const wheelWorld=
new THREE.Vector3();

wheel.getWorldPosition(
wheelWorld
);

if(
bridgeState===3 &&
camera.position.distanceTo(
wheelWorld
)<4
){

enterSteering();
return;
}


/*
  Kran
*/

const craneWorld=
new THREE.Vector3();

crane.getWorldPosition(
craneWorld
);

if(
bridgeState===3 &&
camera.position.distanceTo(
craneWorld
)<5
){

moveCrane();
return;
}
}


/* =========================================================
   PROMPTS
========================================================= */

function prompt(t){
const el=document.getElementById("prompt");
el.innerHTML=t;
el.style.display="block";
}

function noPrompt(){
document.getElementById("prompt").style.display="none";
}

function updatePrompt(){

if(steering){
noPrompt();
return;
}


/*
  Brücke am Hafen
*/

if(
bridgeState===0 &&
camera.position.distanceTo(
bridge.position
)<3.5
){

prompt("E – Eisenbrücke aufnehmen");
return;
}


/*
  Brücke in Hand
*/

if(bridgeState===1){

if(onBoat(camera.position)){

prompt(
"E – Brücke auf dem Boot ablegen<br>R – drehen"
);

}else{

prompt(
"E – Brücke ablegen<br>R – drehen"
);

}

return;
}


/*
  Brücke auf dem Boden
*/

if(
bridgeState===2 &&
onBoat(camera.position) &&
camera.position.distanceTo(
bridge.position
)<5
){

prompt(
"E – Brücke aufnehmen"
);

return;
}


/*
  Tür
*/

const dw=new THREE.Vector3();
door.getWorldPosition(dw);

if(
camera.position.distanceTo(dw)<4
){

prompt(
doorOpen
?"E – Tür schließen"
:"E – Tür öffnen"
);

return;
}


/*
  Steuerstand
*/

if(bridgeState===3){

const ww=new THREE.Vector3();
wheel.getWorldPosition(ww);

if(
camera.position.distanceTo(ww)<4
){

prompt("E – Steuerstand betreten");
return;
}
}


/*
  Kran
*/

if(bridgeState===3){

const cw=new THREE.Vector3();
crane.getWorldPosition(cw);

if(
camera.position.distanceTo(cw)<5
){

prompt(
craneDown
?"E – Netz hochziehen"
:"E – Netz ins Wasser lassen"
);

return;
}
}

noPrompt();
}


/* =========================================================
   START
========================================================= */

document.getElementById(
"startBtn"
).onclick=()=>{

document.getElementById(
"start"
).style.display="none";

controls.lock();
};


/* =========================================================
   LOOP
========================================================= */

let last=performance.now();

function loop(now){

requestAnimationFrame(loop);

const dt=Math.min(
(now-last)/1000,
.033
);

last=now;

movePlayer(dt);
updateBridgePhysics(dt);
driveBoat(dt);
updatePrompt();

renderer.render(
scene,
camera
);
}

loop(performance.now());


/* =========================================================
   RESIZE
========================================================= */

addEventListener("resize",()=>{

camera.aspect=
innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

});
</script>
</body>
</html>
