<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FPS - weapon.glb</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87cfff;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    width:16px;
    height:16px;
    transform:translate(-50%,-50%);
    z-index:20;
    pointer-events:none;
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 0 3px #000;
}

#crosshair:before{
    width:2px;
    height:16px;
    left:7px;
}

#crosshair:after{
    width:16px;
    height:2px;
    top:7px;
}

#status{
    position:fixed;
    left:10px;
    top:10px;
    z-index:50;
    color:white;
    background:rgba(0,0,0,.75);
    padding:10px 14px;
    border-radius:8px;
    font:13px monospace;
}

#coords{
    position:fixed;
    right:10px;
    bottom:10px;
    z-index:50;
    color:white;
    background:rgba(0,0,0,.6);
    padding:8px;
    border-radius:7px;
    font:12px monospace;
    white-space:pre;
}

#health{
    position:fixed;
    left:10px;
    bottom:10px;
    width:220px;
    height:20px;
    border:2px solid white;
    background:#222;
    z-index:50;
}

#healthFill{
    width:100%;
    height:100%;
    background:#20dd50;
}

#hitmarker{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:38px;
    display:none;
    z-index:60;
    pointer-events:none;
}

#chatBox{
    position:fixed;
    left:10px;
    bottom:55px;
    width:300px;
    display:none;
    flex-direction:column;
    z-index:100;
}

#chatLog{
    height:120px;
    overflow:auto;
    background:rgba(0,0,0,.7);
    color:white;
    padding:7px;
    font:12px monospace;
}

#chatInput{
    padding:9px;
    border:0;
    outline:0;
}
</style>
</head>

<body>

<div id="status">Lade weapon.glb...</div>
<div id="crosshair"></div>
<div id="hitmarker">✖</div>

<div id="coords"></div>

<div id="health">
    <div id="healthFill"></div>
</div>

<div id="chatBox">
    <div id="chatLog"></div>
    <input id="chatInput" placeholder="Command...">
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>

/* =========================================================
   ENGINE
========================================================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x87cfff);


const camera =
    new THREE.PerspectiveCamera(
        75,
        innerWidth / innerHeight,
        0.01,
        5000
    );


const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.outputEncoding =
    THREE.sRGBEncoding;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LIGHT
========================================================= */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        1.8
    )
);

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2.5
    );

sun.position.set(
    10,
    30,
    20
);

scene.add(sun);


/* =========================================================
   GROUND
========================================================= */

const grassTexture =
    new THREE.TextureLoader().load(
        "https://threejs.org/examples/textures/terrain/grasslight-big.jpg"
    );

grassTexture.wrapS =
    THREE.RepeatWrapping;

grassTexture.wrapT =
    THREE.RepeatWrapping;

grassTexture.repeat.set(
    100,
    100
);

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            5000,
            5000
        ),
        new THREE.MeshStandardMaterial({
            map:grassTexture
        })
    );

ground.rotation.x =
    -Math.PI / 2;

scene.add(ground);


/* =========================================================
   PLAYER
========================================================= */

const player =
    new THREE.Object3D();

scene.add(player);

player.position.set(
    0,
    0,
    0
);

player.add(camera);


/*
   WICHTIG:

   Die Kamera bleibt bei 0,2.2,0.

   Die Waffe hängt direkt an einem
   eigenen Holder unter der Kamera.

   Dadurch bewegt sie sich automatisch
   mit Blickrichtung und Kamera mit.
*/

camera.position.set(
    0,
    2.2,
    0
);


/* =========================================================
   WEAPON HOLDER
========================================================= */

const weaponHolder =
    new THREE.Object3D();

camera.add(
    weaponHolder
);


/*
   Position relativ zur Kamera.

   X = rechts
   Y = unten
   Z = vor die Kamera

   Negatives Z bedeutet VOR der Kamera.
*/

weaponHolder.position.set(
    0,
    0,
    0
);


/* =========================================================
   PLAYER INPUT
========================================================= */

const keys = {};

window.addEventListener(
    "keydown",
    function(e){

        keys[
            e.key.toLowerCase()
        ] = true;

        if(e.code === "Space"){

            e.preventDefault();

            jump();

        }

        if(
            e.key.toLowerCase() === "t"
        ){

            toggleChat();

        }

    }
);

window.addEventListener(
    "keyup",
    function(e){

        keys[
            e.key.toLowerCase()
        ] = false;

    }
);


/* =========================================================
   POINTER LOCK
========================================================= */

document.body.addEventListener(
    "click",
    function(){

        if(!chatOpen){

            document.body.requestPointerLock();

        }

    }
);


/* =========================================================
   LOOK
========================================================= */

let yaw = 0;
let pitch = 0;

document.addEventListener(
    "mousemove",
    function(e){

        if(
            document.pointerLockElement !==
            document.body
        ){

            return;

        }

        if(chatOpen)
            return;


        yaw -=
            e.movementX * 0.002;


        pitch -=
            e.movementY * 0.002;


        pitch =
            Math.max(
                -1.2,
                Math.min(
                    1.2,
                    pitch
                )
            );


        player.rotation.y =
            yaw;


        camera.rotation.x =
            pitch;

    }
);


/* =========================================================
   MOVEMENT
========================================================= */

function move(){

    const speed = 0.15;

    let input =
        new THREE.Vector3();


    if(keys["w"])
        input.z -= 1;

    if(keys["s"])
        input.z += 1;

    if(keys["a"])
        input.x -= 1;

    if(keys["d"])
        input.x += 1;


    if(input.lengthSq() === 0)
        return;


    input.normalize();


    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    forward.applyEuler(
        player.rotation
    );

    forward.y = 0;

    forward.normalize();


    const right =
        new THREE.Vector3()
        .crossVectors(
            forward,
            new THREE.Vector3(
                0,
                1,
                0
            )
        )
        .negate();


    player.position.addScaledVector(
        forward,
        input.z * speed
    );


    player.position.addScaledVector(
        right,
        input.x * speed
    );

}


/* =========================================================
   GRAVITY
========================================================= */

let velocityY = 0;
let onGround = true;

function gravity(){

    velocityY -= 0.015;

    player.position.y +=
        velocityY;


    if(player.position.y <= 0){

        player.position.y = 0;

        velocityY = 0;

        onGround = true;

    }

}


/* =========================================================
   JUMP
========================================================= */

function jump(){

    if(!onGround)
        return;

    velocityY =
        0.25;

    onGround =
        false;

}


/* =========================================================
   WEAPON
========================================================= */

const loader =
    new THREE.GLTFLoader();

let weapon = null;

let weaponReady = false;


/*
   DAS SIND DIE FIRST-PERSON-WAFFENWERTE.

   Das Modell wird später automatisch
   skaliert.

   Diese Position ist relativ zur Kamera.
*/

const WEAPON_X = 0.48;
const WEAPON_Y = -0.52;
const WEAPON_Z = -1.25;


/* =========================================================
   LOAD WEAPON
========================================================= */

const weaponURL =
    "./weapon.glb";


loader.load(

    weaponURL,

    function(gltf){

        console.log(
            "WEAPON GLB GELADEN"
        );


        weapon =
            gltf.scene;


        weaponReady =
            true;


        /*
           ==================================================
           MATERIALIEN
           ==================================================
        */

        weapon.traverse(
            function(object){

                if(object.isMesh){

                    object.visible = true;

                    object.frustumCulled =
                        false;


                    if(object.material){

                        if(
                            Array.isArray(
                                object.material
                            )
                        ){

                            object.material.forEach(
                                function(mat){

                                    mat.needsUpdate =
                                        true;

                                }
                            );

                        }
                        else{

                            object.material.needsUpdate =
                                true;

                        }

                    }

                }

            }
        );


        /*
           ==================================================
           ORIGINAL BOUNDING BOX
           ==================================================
        */

        let box =
            new THREE.Box3()
            .setFromObject(
                weapon
            );


        let center =
            new THREE.Vector3();


        box.getCenter(
            center
        );


        /*
           MODELL MITTELPUNKT
           AUF 0,0,0
        */

        weapon.position.sub(
            center
        );


        /*
           ==================================================
           GRÖSSE ERMITTELN
           ==================================================
        */

        let size =
            new THREE.Vector3();


        box.getSize(
            size
        );


        let maxDimension =
            Math.max(
                size.x,
                size.y,
                size.z
            );


        console.log(
            "GLB Größe:",
            size.x,
            size.y,
            size.z
        );


        /*
           ==================================================
           AUTOMATISCHE SCALE
           ==================================================

           Zielgröße ungefähr 1.5 Welt-Einheiten.

           Egal ob das GLB winzig oder riesig
           gespeichert wurde.
        */

        const TARGET_SIZE = 1.5;


        if(
            maxDimension > 0 &&
            isFinite(maxDimension)
        ){

            const scale =
                TARGET_SIZE /
                maxDimension;


            weapon.scale.set(
                scale,
                scale,
                scale
            );

        }


        /*
           ==================================================
           NACH SCALE NOCHMAL ZENTRIEREN
           ==================================================
        */

        box =
            new THREE.Box3()
            .setFromObject(
                weapon
            );


        center =
            new THREE.Vector3();


        box.getCenter(
            center
        );


        weapon.position.sub(
            center
        );


        /*
           ==================================================
           FIRST PERSON POSITION
           ==================================================

           Die Waffe befindet sich jetzt
           DIREKT VOR DER KAMERA.
        */

        weapon.position.set(
            WEAPON_X,
            WEAPON_Y,
            WEAPON_Z
        );


        /*
           ==================================================
           ROTATION
           ==================================================

           Falls dein Modell falsch herum steht,
           wird es hier gedreht.
        */

        weapon.rotation.set(
            0,
            Math.PI,
            0
        );


        /*
           ==================================================
           DIREKT AN KAMERA-HOLDER
           ==================================================
        */

        weaponHolder.add(
            weapon
        );


        /*
           ==================================================
           SICHERSTELLEN, DASS ES SICHTBAR IST
           ==================================================
        */

        weapon.visible =
            true;


        /*
           ==================================================
           STATUS
           ==================================================
        */

        document.getElementById(
            "status"
        ).textContent =
            "✅ weapon.glb geladen";


        console.log(
            "Weapon Scale:",
            weapon.scale
        );

        console.log(
            "Weapon Position:",
            weapon.position
        );

        console.log(
            "Weapon Parent:",
            weapon.parent
        );

    },

    function(xhr){

        if(
            xhr.total
        ){

            const percent =
                Math.round(
                    xhr.loaded /
                    xhr.total *
                    100
                );

            document.getElementById(
                "status"
            ).textContent =
                "⏳ weapon.glb " +
                percent +
                "%";

        }

    },

    function(error){

        console.error(
            "WEAPON ERROR:",
            error
        );


        document.getElementById(
            "status"
        ).textContent =
            "❌ weapon.glb konnte nicht geladen werden";

    }

);


/* =========================================================
   WEAPON SHOOT ANIMATION
========================================================= */

let recoil = 0;

let shootCooldown = false;


function shoot(){

    if(shootCooldown)
        return;


    shootCooldown =
        true;


    recoil =
        0.18;


    /*
       HITMARKER
    */

    checkHit();


    /*
       FLASH
    */

    const flash =
        new THREE.PointLight(
            0xffaa33,
            15,
            4
        );


    flash.position.set(
        0,
        0,
        -1
    );


    camera.add(
        flash
    );


    setTimeout(
        function(){

            camera.remove(
                flash
            );

        },
        45
    );


    /*
       TRACER
    */

    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    direction.applyQuaternion(
        camera.quaternion
    );


    const start =
        camera.getWorldPosition(
            new THREE.Vector3()
        );


    const end =
        start.clone()
        .add(
            direction.multiplyScalar(
                100
            )
        );


    const geometry =
        new THREE.BufferGeometry()
        .setFromPoints([
            start,
            end
        ]);


    const material =
        new THREE.LineBasicMaterial({
            color:0xffff00
        });


    const line =
        new THREE.Line(
            geometry,
            material
        );


    scene.add(
        line
    );


    setTimeout(
        function(){

            scene.remove(
                line
            );

            geometry.dispose();

            material.dispose();

        },
        50
    );


    setTimeout(
        function(){

            shootCooldown =
                false;

        },
        120
    );

}


window.addEventListener(
    "mousedown",
    function(e){

        if(
            e.button === 0 &&
            !chatOpen
        ){

            shoot();

        }

    }
);


/* =========================================================
   HIT CHECK
========================================================= */

const enemies = [];

const hitRay =
    new THREE.Raycaster();


function addEnemy(
    x,
    y,
    z
){

    const enemy =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1,
                2,
                1
            ),
            new THREE.MeshStandardMaterial({
                color:0xff2222
            })
        );


    enemy.position.set(
        x,
        y,
        z
    );


    enemy.health =
        100;


    scene.add(
        enemy
    );


    enemies.push(
        enemy
    );

}


addEnemy(
    5,
    1,
    -20
);

addEnemy(
    -3,
    1,
    -15
);

addEnemy(
    8,
    1,
    -30
);


function checkHit(){

    hitRay.setFromCamera(
        new THREE.Vector2(
            0,
            0
        ),
        camera
    );


    const hits =
        hitRay.intersectObjects(
            enemies,
            false
        );


    if(!hits.length)
        return;


    const enemy =
        hits[0].object;


    enemy.health -=
        25;


    const marker =
        document.getElementById(
            "hitmarker"
        );


    marker.style.display =
        "block";


    setTimeout(
        function(){

            marker.style.display =
                "none";

        },
        100
    );


    if(
        enemy.health <= 0
    ){

        scene.remove(
            enemy
        );


        const index =
            enemies.indexOf(
                enemy
            );


        if(index >= 0){

            enemies.splice(
                index,
                1
            );

        }

    }

}


/* =========================================================
   CHAT
========================================================= */

const chatBox =
    document.getElementById(
        "chatBox"
    );

const chatInput =
    document.getElementById(
        "chatInput"
    );

const chatLog =
    document.getElementById(
        "chatLog"
    );

let chatOpen =
    false;


function toggleChat(){

    chatOpen =
        !chatOpen;


    chatBox.style.display =
        chatOpen
        ? "flex"
        : "none";


    if(chatOpen){

        document.exitPointerLock();

        setTimeout(
            function(){

                chatInput.focus();

            },
            50
        );

    }

}


chatInput.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            const command =
                chatInput.value.trim();

            if(command){

                executeCommand(
                    command
                );

            }

            chatInput.value = "";

        }

    }
);


function logChat(text){

    chatLog.innerHTML +=
        text +
        "<br>";

    chatLog.scrollTop =
        chatLog.scrollHeight;

}


function executeCommand(command){

    const cmd =
        command.toLowerCase();


    if(cmd === "/help"){

        logChat(
            "/help /place barrier /save"
        );

        return;

    }


    if(
        cmd === "/place barrier"
    ){

        logChat(
            "Barrier command erkannt."
        );

        return;

    }


    if(cmd === "/save"){

        logChat(
            "Spiel gespeichert."
        );

        return;

    }


    logChat(
        "Unbekannter Command: " +
        command
    );

}


/* =========================================================
   UPDATE
========================================================= */

function update(){

    move();

    gravity();


    /*
       ======================================================
       WEAPON RECOIL
       ======================================================
    */

    if(weapon){

        if(recoil > 0){

            /*
               Z bleibt grundsätzlich
               immer vor der Kamera.
            */

            weapon.position.z =
                WEAPON_Z +
                recoil;


            weapon.rotation.x =
                recoil *
                0.5;


            recoil *=
                0.72;

        }
        else{

            weapon.position.z +=
                (
                    WEAPON_Z -
                    weapon.position.z
                ) * 0.3;


            weapon.rotation.x +=
                (
                    0 -
                    weapon.rotation.x
                ) * 0.25;

        }

    }


    /*
       ======================================================
       KOORDINATEN
       ======================================================
    */

    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        ).applyEuler(
            player.rotation
        );


    document.getElementById(
        "coords"
    ).textContent =

`X: ${player.position.x.toFixed(2)}
Y: ${player.position.y.toFixed(2)}
Z: ${player.position.z.toFixed(2)}

DIR X: ${direction.x.toFixed(2)}
DIR Z: ${direction.z.toFixed(2)}`;


    document.getElementById(
        "healthFill"
    ).style.width =
        health + "%";

}


/* =========================================================
   RENDER LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    update();


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            innerWidth /
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>

</body>
</html>
