<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>3D Burger Simulator</title>
<style>
*{box-sizing:border-box}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#111;
}
canvas{display:block}

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    width:16px;
    height:16px;
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:20;
}
#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:#fff;
    box-shadow:0 0 3px #000;
}
#crosshair:before{
    width:16px;
    height:2px;
    top:7px;
}
#crosshair:after{
    width:2px;
    height:16px;
    left:7px;
}

#hud{
    position:fixed;
    top:12px;
    left:12px;
    color:white;
    text-shadow:2px 2px 3px #000;
    z-index:30;
    line-height:1.5;
    font-weight:bold;
}

#help{
    position:fixed;
    top:12px;
    right:12px;
    padding:10px 14px;
    background:rgba(0,0,0,.45);
    color:white;
    border-radius:8px;
    text-align:right;
    z-index:30;
    line-height:1.45;
}

#start{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:linear-gradient(#f7c46a,#fff0c7);
}

#start h1{
    color:white;
    font-size:52px;
    margin:0 0 10px;
    text-shadow:4px 4px #6b351b;
}

#start p{
    font-size:19px;
    color:#432516;
}

#start button{
    border:0;
    border-radius:8px;
    padding:15px 45px;
    background:#d94a32;
    color:white;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
}

#area{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    background:rgba(0,0,0,.5);
    color:white;
    padding:8px 16px;
    border-radius:20px;
    z-index:30;
    font-weight:bold;
}
</style>
</head>

<body>

<div id="start">
    <h1>🍔 BURGER SIMULATOR</h1>
    <p>Baue deine eigene Burger-Küche</p>
    <button id="startButton">STARTEN</button>
</div>

<div id="hud">
    <div id="position">X: 0 | Y: 0 | Z: 0</div>
    <div id="areaText">Essraum</div>
</div>

<div id="help">
    WASD – Bewegen<br>
    SHIFT – Sprinten<br>
    SPACE – Springen<br>
    Maus – Umsehen<br>
    ESC – Maus freigeben
</div>

<div id="area">ESSRAUM</div>
<div id="crosshair"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

<script>
/* =========================================================
   SZENE
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0xbfe8ff);

scene.fog = new THREE.Fog(
    0xbfe8ff,
    25,
    80
);

const camera = new THREE.PerspectiveCamera(
    75,
    innerWidth / innerHeight,
    0.1,
    150
);

const renderer = new THREE.WebGLRenderer({
    antialias:false,
    powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));

document.body.appendChild(renderer.domElement);

const controls = new THREE.PointerLockControls(
    camera,
    document.body
);

/* Licht */

const ambient = new THREE.HemisphereLight(
    0xffffff,
    0x555555,
    1.2
);

scene.add(ambient);

const light = new THREE.DirectionalLight(
    0xffffff,
    1
);

light.position.set(10,20,10);
scene.add(light);

/* =========================================================
   MATERIALIEN
========================================================= */

const floorDining = new THREE.MeshLambertMaterial({
    color:0xd8b27c
});

const floorKitchen = new THREE.MeshLambertMaterial({
    color:0xbfc3c7
});

const wallMat = new THREE.MeshLambertMaterial({
    color:0xf1eee5
});

const wallAccent = new THREE.MeshLambertMaterial({
    color:0xd84b35
});

const darkMat = new THREE.MeshLambertMaterial({
    color:0x333333
});

const woodMat = new THREE.MeshLambertMaterial({
    color:0x8b542d
});

const tableMat = new THREE.MeshLambertMaterial({
    color:0x9a6337
});

const metalMat = new THREE.MeshLambertMaterial({
    color:0x777b80
});

const steelMat = new THREE.MeshLambertMaterial({
    color:0xc7cbd0
});

const redMat = new THREE.MeshLambertMaterial({
    color:0xc82d25
});

const yellowMat = new THREE.MeshLambertMaterial({
    color:0xffd42a
});

const greenMat = new THREE.MeshLambertMaterial({
    color:0x48a83c
});

/* =========================================================
   HELFER
========================================================= */

function cube(
    x,y,z,
    sx,sy,sz,
    material
){
    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(
            sx,sy,sz
        ),
        material
    );

    mesh.position.set(x,y,z);
    scene.add(mesh);

    return mesh;
}

function cylinder(
    x,y,z,
    radius,height,
    material,
    segments=20
){
    const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(
            radius,
            radius,
            height,
            segments
        ),
        material
    );

    mesh.position.set(x,y,z);
    scene.add(mesh);

    return mesh;
}

/* =========================================================
   RAUM
========================================================= */

/*
    Raum:
    Länge = 48
    Breite = 18

    3/4 = Essraum
    1/4 = Küche

    Küche liegt hinten.
*/

const ROOM_LENGTH = 48;
const ROOM_WIDTH = 18;

const KITCHEN_START = 36;

/* Essraum */

cube(
    0,
    -0.25,
    0,
    ROOM_LENGTH,
    0.5,
    ROOM_WIDTH,
    floorDining
);

/* Küchenboden */

cube(
    18,
    0.02,
    0,
    12,
    0.54,
    ROOM_WIDTH,
    floorKitchen
);

/* Außenwände */

cube(
    0,
    3,
    -9,
    ROOM_LENGTH,
    6,
    0.4,
    wallMat
);

cube(
    0,
    3,
    9,
    ROOM_LENGTH,
    6,
    0.4,
    wallMat
);

cube(
    -24,
    3,
    0,
    0.4,
    6,
    18,
    wallMat
);

cube(
    24,
    3,
    0,
    0.4,
    6,
    18,
    wallMat
);

/* Decke */

cube(
    0,
    6,
    0,
    ROOM_LENGTH,
    0.3,
    ROOM_WIDTH,
    new THREE.MeshLambertMaterial({
        color:0xffffff
    })
);

/* =========================================================
   TRENNWAND ZWISCHEN ESSRAUM UND KÜCHE
========================================================= */

const dividerX = 12;

/* Linker Wandteil */

cube(
    dividerX,
    3,
    -6,
    0.35,
    6,
    6,
    wallMat
);

/* Rechter Wandteil */

cube(
    dividerX,
    3,
    6,
    0.35,
    6,
    6,
    wallMat
);

/* Öffnung zur Küche */

cube(
    dividerX,
    5.2,
    0,
    0.35,
    1.6,
    6,
    wallAccent
);

/* Schild */

function sign(text,x,y,z){

    const canvas=
        document.createElement("canvas");

    canvas.width=512;
    canvas.height=128;

    const ctx=canvas.getContext("2d");

    ctx.fillStyle="#333";
    ctx.fillRect(0,0,512,128);

    ctx.fillStyle="white";
    ctx.font="bold 52px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(
        text,
        256,
        64
    );

    const texture=
        new THREE.CanvasTexture(canvas);

    const material=
        new THREE.MeshBasicMaterial({
            map:texture
        });

    const board=cube(
        x,y,z,
        4,.9,.12,
        material
    );

    return board;
}

sign(
    "KÜCHE",
    11.7,
    4.2,
    0
);

/* =========================================================
   ESSRAUM – TISCHE
========================================================= */

function table(x,z){

    cube(
        x,
        1.05,
        z,
        4.2,
        0.25,
        2.2,
        tableMat
    );

    const legs=[
        [-1.7,-.8],
        [1.7,-.8],
        [-1.7,.8],
        [1.7,.8]
    ];

    for(const p of legs){

        cube(
            x+p[0],
            .5,
            z+p[1],
            .25,
            1,
            .25,
            darkMat
        );
    }
}

table(-17,-4);
table(-17,4);

table(-8,-4);
table(-8,4);

table(1,-4);
table(1,4);

/* Stühle */

function chair(x,z){

    cube(
        x,
        .55,
        z,
        .9,
        .15,
        .9,
        redMat
    );

    cube(
        x,
        1.2,
        z+.38,
        .9,
        1.3,
        .15,
        redMat
    );
}

for(const x of [-17,-8,1]){

    chair(x,-6.1);
    chair(x,6.1);
}

/* =========================================================
   KASSE
========================================================= */

cube(
    7,
    1.15,
    0,
    3,
    2.3,
    2,
    woodMat
);

cube(
    7,
    2.35,
    0,
    2.4,
    .15,
    1.5,
    darkMat
);

/* Bildschirm */

cube(
    7,
    2.8,
    0,
    .15,
    .9,
    1.2,
    darkMat
);

/* =========================================================
   KÜCHE
========================================================= */

/* Küchenarbeitsplatte */

cube(
    18,
    1.15,
    -5.5,
    10,
    2.3,
    2.8,
    darkMat
);

cube(
    18,
    2.35,
    -5.5,
    10.5,
    .18,
    3,
    steelMat
);

/* zweite Arbeitsfläche */

cube(
    18,
    1.15,
    5.5,
    10,
    2.3,
    2.8,
    darkMat
);

cube(
    18,
    2.35,
    5.5,
    10.5,
    .18,
    3,
    steelMat
);

/* =========================================================
   GRILL
========================================================= */

cube(
    17,
    2.65,
    -5.5,
    4,
    .35,
    2,
    metalMat
);

for(let i=0;i<7;i++){

    cube(
        15.5+i*.5,
        2.85,
        -5.5,
        .12,
        .08,
        1.7,
        darkMat
    );
}

/* Grillknöpfe */

for(let i=0;i<3;i++){

    cylinder(
        15.8+i*.8,
        2.48,
        -7,
        .16,
        .15,
        redMat
    );

}

/* =========================================================
   FRITÖSE
========================================================= */

cube(
    22,
    2.5,
    -5.5,
    3,
    .3,
    1.8,
    darkMat
);

cube(
    22,
    2.7,
    -5.5,
    2.3,
    .12,
    1.2,
    steelMat
);

cylinder(
    21.2,
    2.9,
    -5.5,
    .45,
    .15,
    darkMat
);

cylinder(
    22.7,
    2.9,
    -5.5,
    .45,
    .15,
    darkMat
);

/* =========================================================
   KÜHLSCHRANK
========================================================= */

cube(
    14,
    2.5,
    5.5,
    2.5,
    5,
    2.2,
    steelMat
);

cube(
    14,
    2.5,
    4.35,
    2.1,
    4.7,
    .08,
    new THREE.MeshLambertMaterial({
        color:0xdfe3e6
    })
);

/* Griff */

cube(
    15.05,
    2.5,
    4.25,
    .08,
    2,
    .12,
    darkMat
);

/* =========================================================
   BURGER-VORBEREITUNG
========================================================= */

cube(
    18,
    2.55,
    5.5,
    4,
    .25,
    2,
    woodMat
);

/* Burger-Dummy */

function burger(
    x,
    y,
    z
){

    /* Untere Hälfte */

    cylinder(
        x,
        y,
        z,
        .8,
        .3,
        new THREE.MeshLambertMaterial({
            color:0xd68b3b
        })
    );

    /* Fleisch */

    cylinder(
        x,
        y+.22,
        z,
        .72,
        .28,
        new THREE.MeshLambertMaterial({
            color:0x6d351d
        })
    );

    /* Käse */

    cube(
        x,
        y+.43,
        z,
        1.3,
        .1,
        1.3,
        yellowMat
    );

    /* Salat */

    cylinder(
        x,
        y+.55,
        z,
        .75,
        .12,
        greenMat
    );

    /* Tomate */

    cylinder(
        x,
        y+.68,
        z,
        .7,
        .13,
        redMat
    );

    /* Oberseite */

    cylinder(
        x,
        y+.93,
        z,
        .82,
        .42,
        new THREE.MeshLambertMaterial({
            color:0xe2a04c
        })
    );
}

burger(
    18,
    2.75,
    5.5
);

/* =========================================================
   DEKORATION
========================================================= */

/* Wandbilder */

function picture(x,y,z,color){

    cube(
        x,y,z,
        2.8,
        2,
        .08,
        new THREE.MeshLambertMaterial({
            color:color
        })
    );
}

picture(
    -5,3,-8.75,
    0xd84b35
);

picture(
    -15,3,-8.75,
    0xffc928
);

picture(
    5,3,8.75,
    0x48a83c
);

/* Lampen */

for(const x of [-16,-7,2,18]){

    cylinder(
        x,
        5.55,
        0,
        .55,
        .1,
        new THREE.MeshLambertMaterial({
            color:0xffffcc
        })
    );
}

/* =========================================================
   SPIELER
========================================================= */

camera.position.set(
    -18,
    2.2,
    0
);

const player={
    speed:4.5,
    sprint:7,
    velocityY:0,
    grounded:false
};

const keys={
    w:false,
    a:false,
    s:false,
    d:false,
    shift:false
};

document.addEventListener(
    "keydown",
    e=>{

        if(e.code==="KeyW")keys.w=true;
        if(e.code==="KeyA")keys.a=true;
        if(e.code==="KeyS")keys.s=true;
        if(e.code==="KeyD")keys.d=true;

        if(
            e.code==="ShiftLeft"||
            e.code==="ShiftRight"
        ){
            keys.shift=true;
        }

        if(
            e.code==="Space"&&
            player.grounded
        ){
            player.velocityY=7;
            player.grounded=false;
        }
    }
);

document.addEventListener(
    "keyup",
    e=>{

        if(e.code==="KeyW")keys.w=false;
        if(e.code==="KeyA")keys.a=false;
        if(e.code==="KeyS")keys.s=false;
        if(e.code==="KeyD")keys.d=false;

        if(
            e.code==="ShiftLeft"||
            e.code==="ShiftRight"
        ){
            keys.shift=false;
        }
    }
);

/* =========================================================
   BEWEGUNG
========================================================= */

function updatePlayer(dt){

    let mx=0;
    let mz=0;

    if(keys.w)mz-=1;
    if(keys.s)mz+=1;
    if(keys.a)mx-=1;
    if(keys.d)mx+=1;

    if(mx||mz){

        const len=Math.hypot(mx,mz);

        mx/=len;
        mz/=len;

        const direction=
            new THREE.Vector3();

        camera.getWorldDirection(
            direction
        );

        direction.y=0;
        direction.normalize();

        const right=
            new THREE.Vector3()
            .crossVectors(
                direction,
                new THREE.Vector3(0,1,0)
            )
            .normalize();

        const speed=
            keys.shift?
            player.sprint:
            player.speed;

        camera.position.x+=
            (
                direction.x*mz+
                right.x*mx
            )*speed*dt;

        camera.position.z+=
            (
                direction.z*mz+
                right.z*mx
            )*speed*dt;
    }

    /* Raumbegrenzung */

    camera.position.x=
        Math.max(
            -22.5,
            Math.min(
                22.5,
                camera.position.x
            )
        );

    camera.position.z=
        Math.max(
            -7.8,
            Math.min(
                7.8,
                camera.position.z
            )
        );

    /* einfache Schwerkraft */

    player.velocityY-=20*dt;

    camera.position.y+=
        player.velocityY*dt;

    if(camera.position.y<=2.2){

        camera.position.y=2.2;
        player.velocityY=0;
        player.grounded=true;
    }
}

/* =========================================================
   BEREICH
========================================================= */

function updateArea(){

    let text;

    if(camera.position.x>12){
        text="KÜCHE";
    }else{
        text="ESSRAUM";
    }

    document.getElementById(
        "area"
    ).textContent=text;

    document.getElementById(
        "areaText"
    ).textContent=text;

    document.getElementById(
        "position"
    ).textContent=
        "X: "+
        camera.position.x.toFixed(1)+
        " | Y: "+
        camera.position.y.toFixed(1)+
        " | Z: "+
        camera.position.z.toFixed(1);
}

/* =========================================================
   START
========================================================= */

document.getElementById(
    "startButton"
).onclick=()=>{

    document.getElementById(
        "start"
    ).style.display="none";

    controls.lock();
};

/* =========================================================
   LOOP
========================================================= */

let last=performance.now();

function animate(){

    requestAnimationFrame(animate);

    const now=performance.now();

    let dt=(now-last)/1000;

    last=now;

    dt=Math.min(dt,.05);

    if(controls.isLocked){

        updatePlayer(dt);
        updateArea();
    }

    renderer.render(
        scene,
        camera
    );
}

animate();

/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);
</script>

</body>
</html>
