<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FPS GLB Viewer</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87cfff;
    font-family:Arial,sans-serif;
}

canvas{display:block}

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    width:16px;
    height:16px;
    transform:translate(-50%,-50%);
    z-index:10;
    pointer-events:none;
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 0 3px black;
}

#crosshair:before{
    width:2px;
    height:16px;
    left:7px;
    top:0;
}

#crosshair:after{
    width:16px;
    height:2px;
    left:0;
    top:7px;
}

#status{
    position:fixed;
    top:10px;
    left:10px;
    z-index:100;
    background:rgba(0,0,0,.75);
    color:white;
    padding:8px 12px;
    border-radius:6px;
    font:13px monospace;
    pointer-events:none;
}
</style>
</head>

<body>

<div id="status">Lade weapon.glb...</div>
<div id="crosshair"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87cfff);

const camera = new THREE.PerspectiveCamera(
    75,
    innerWidth / innerHeight,
    0.01,
    5000
);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding = THREE.sRGBEncoding;

document.body.appendChild(renderer.domElement);


/* LIGHT */

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x445566,
        2
    )
);

const sun = new THREE.DirectionalLight(
    0xffffff,
    3
);

sun.position.set(10,20,10);

scene.add(sun);


/* GROUND */

const ground = new THREE.Mesh(

    new THREE.PlaneGeometry(
        5000,
        5000
    ),

    new THREE.MeshStandardMaterial({
        color:0x228822
    })

);

ground.rotation.x = -Math.PI / 2;

scene.add(ground);


/* PLAYER */

const player = new THREE.Object3D();

scene.add(player);

player.add(camera);

camera.position.set(
    0,
    2.2,
    0
);


/* MODEL HOLDER */

const weaponHolder = new THREE.Group();

camera.add(weaponHolder);


/* POSITION: RECHTS UNTEN VOR DER KAMERA */

weaponHolder.position.set(
    0.72,
    -0.55,
    -1.15
);


/* MODEL ROOT */

const weaponRoot = new THREE.Group();

weaponHolder.add(weaponRoot);


/* GLB LOADER */

const loader = new THREE.GLTFLoader();

let weapon = null;


loader.load(

    "./weapon.glb",

    function(gltf){

        weapon = gltf.scene;


        weapon.traverse(function(obj){

            if(!obj.isMesh) return;

            obj.visible = true;

            obj.frustumCulled = false;


            if(obj.material){

                if(Array.isArray(obj.material)){

                    obj.material.forEach(function(mat){

                        mat.side =
                            THREE.DoubleSide;

                        mat.needsUpdate =
                            true;

                    });

                }else{

                    obj.material.side =
                        THREE.DoubleSide;

                    obj.material.needsUpdate =
                        true;

                }

            }

        });


        /*
           ===============================
           ROTATION 180 GRAD
           ===============================

           Das Modell wird um 180 Grad
           auf der Y-Achse gedreht.
        */

        weapon.rotation.set(

            0,

            Math.PI,

            0

        );


        weapon.updateMatrixWorld(true);


        /* ORIGINAL BOUNDS */

        let box =
            new THREE.Box3()
            .setFromObject(weapon);


        let size =
            new THREE.Vector3();


        box.getSize(size);


        const largest =
            Math.max(
                size.x,
                size.y,
                size.z
            );


        /* SCALE */

        const targetSize = 3.0;


        if(
            largest > 0 &&
            isFinite(largest)
        ){

            const scale =
                targetSize /
                largest;


            weapon.scale.set(
                scale,
                scale,
                scale
            );

        }


        weapon.updateMatrixWorld(true);


        /* BOUNDS NACH SCALE */

        box =
            new THREE.Box3()
            .setFromObject(weapon);


        const center =
            new THREE.Vector3();


        box.getCenter(center);


        /* CENTER MODEL */

        weapon.position.sub(center);


        weapon.position.y -= 0.15;


        /* ADD TO CAMERA */

        weaponRoot.add(weapon);


        document.getElementById(
            "status"
        ).textContent =
            "✓ weapon.glb geladen";

    },


    function(xhr){

        if(xhr.total){

            const percent =
                Math.round(
                    xhr.loaded /
                    xhr.total *
                    100
                );


            document.getElementById(
                "status"
            ).textContent =
                "Lade weapon.glb " +
                percent +
                "%";

        }

    },


    function(error){

        console.error(error);

        document.getElementById(
            "status"
        ).textContent =
            "❌ weapon.glb Fehler";

    }

);


/* INPUT */

const keys = {};

let yaw = 0;
let pitch = 0;

let velocityY = 0;
let onGround = true;


window.addEventListener(
    "keydown",
    function(e){

        keys[
            e.key.toLowerCase()
        ] = true;


        if(
            e.code === "Space" &&
            onGround
        ){

            e.preventDefault();

            velocityY = 0.25;

            onGround = false;

        }

    }
);


window.addEventListener(
    "keyup",
    function(e){

        keys[
            e.key.toLowerCase()
        ] = false;

    }
);


/* POINTER LOCK */

document.body.addEventListener(
    "click",
    function(){

        document.body.requestPointerLock();

    }
);


/* MOUSE LOOK */

document.addEventListener(
    "mousemove",
    function(e){

        if(
            document.pointerLockElement !==
            document.body
        ) return;


        yaw -=
            e.movementX *
            0.002;


        pitch -=
            e.movementY *
            0.002;


        pitch =
            Math.max(
                -1.2,
                Math.min(
                    1.2,
                    pitch
                )
            );


        player.rotation.y =
            yaw;


        camera.rotation.x =
            pitch;

    }
);


/* MOVEMENT */

function move(){

    const speed = 0.15;

    const direction =
        new THREE.Vector3();


    if(keys["w"])
        direction.z -= 1;

    if(keys["s"])
        direction.z += 1;

    if(keys["a"])
        direction.x -= 1;

    if(keys["d"])
        direction.x += 1;


    if(
        direction.lengthSq() === 0
    ) return;


    direction.normalize();


    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    forward.applyEuler(
        player.rotation
    );


    forward.y = 0;

    forward.normalize();


    const right =
        new THREE.Vector3()
        .crossVectors(
            forward,
            new THREE.Vector3(
                0,
                1,
                0
            )
        )
        .negate();


    player.position.addScaledVector(
        forward,
        direction.z *
        speed
    );


    player.position.addScaledVector(
        right,
        direction.x *
        speed
    );

}


/* GRAVITY */

function gravity(){

    velocityY -= 0.015;

    player.position.y +=
        velocityY;


    if(
        player.position.y <= 0
    ){

        player.position.y = 0;

        velocityY = 0;

        onGround = true;

    }

}


/* LOOP */

function animate(){

    requestAnimationFrame(animate);

    move();

    gravity();

    renderer.render(
        scene,
        camera
    );

}

animate();


/* RESIZE */

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>

</body>
</html>
