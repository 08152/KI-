<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Lockpicking Set Generator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(30, 30, 30, 0.85);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            max-width: 320px;
        }
        h1 { margin: 0 0 5px 0; font-size: 18px; color: #00adb5; }
        p { margin: 0 0 15px 0; font-size: 13px; opacity: 0.7; line-height: 1.4; }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 5px;
        }
        button {
            background: #222831;
            color: #eee;
            border: 1px solid #393e46;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        button:hover {
            background: #00adb5;
            color: #fff;
            border-color: #00adb5;
        }
        .download-icon { font-size: 12px; opacity: 0.6; }
        #canvas-container { width: 100vw; height: 100vh; }
    </style>
    <!-- Three.js, OrbitControls und STLExporter für den 3D-Druck -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div id="ui-container">
        <h1>Lockpicking 3D-Preview</h1>
        <p>Bediene die Vorschau mit der Maus. Jedes Tool hat ein 11mm Loch und ist 2mm dick. Klicke zum STL-Download:</p>
        <div class="btn-group" id="controls">
            <!-- Buttons werden dynamisch per JS erzeugt -->
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x121212);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
        camera.position.set(0, 120, 180);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Chromebook-Schonung
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Licht-Setup für gute Plastizität der Werkzeuge
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(40, 100, 40);
        scene.add(dirLight);

        // Grid zur Orientierung (Druckbett-Sim)
        const grid = new THREE.GridHelper(200, 20, 0x393e46, 0x222831);
        grid.position.y = -0.1;
        scene.add(grid);

        // Filament-Material (Silber/Grau)
        const material = new THREE.MeshStandardMaterial({
            color: 0x8892b0,
            metalness: 0.5,
            roughness: 0.4
        });

        // Basis-Form: Griff mit präzisem 11mm Schlüsselbund-Loch
        function createBaseShape() {
            const shape = new THREE.Shape();
            const width = 15;
            const length = 40;
            const radius = 7.5;

            shape.moveTo(-width/2, 0);
            shape.lineTo(-width/2, length - radius);
            shape.quadraticCurveTo(-width/2, length, 0, length);
            shape.quadraticCurveTo(width/2, length, width/2, length - radius);
            shape.lineTo(width/2, 0);
            shape.lineTo(-width/2, 0);

            // Loch: Durchmesser 11mm -> Radius 5.5mm
            const hole = new THREE.Path();
            hole.absarc(0, length - 10, 5.5, 0, Math.PI * 2, true);
            shape.holes.push(hole);
            return shape;
        }

        const extrudeSettings = { depth: 2, bevelEnabled: false, curveSegments: 32 };
        const exporter = new THREE.STLExporter();
        const tools = {};

        // Hilfsfunktion zum Erstellen & Platzieren im Raum
        function addTool(name, shape, posX, posZ) {
            const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            const mesh = new THREE.Mesh(geometry, material);
            mesh.rotation.x = -Math.PI / 2; // Flach hinlegen
            mesh.position.set(posX, 0, posZ);
            scene.add(mesh);
            tools[name] = mesh;

            // UI Button erstellen
            const btn = document.createElement('button');
            btn.innerHTML = `<span>${name}</span> <span class="download-icon">💾 STL</span>`;
            btn.onclick = () => downloadSTL(name);
            document.getElementById('controls').appendChild(btn);
        }

        // --- 4 DIETRICHE (PICKS) ---
        const pickXStart = -45;
        
        // 1. Hook
        const hook = createBaseShape();
        hook.moveTo(-1.5, 0); hook.lineTo(-1.5, -40);
        hook.quadraticCurveTo(-1.5, -45, -5, -45); hook.lineTo(-5, -43);
        hook.quadraticCurveTo(1.5, -42, 1.5, -40); hook.lineTo(1.5, 0);
        addTool('Dietrich: Hook', hook, pickXStart, 0);

        // 2. Snake
        const snake = createBaseShape();
        snake.moveTo(-1.5, 0); snake.lineTo(-1.5, -38);
        snake.quadraticCurveTo(2.5, -41, -1.5, -44);
        snake.quadraticCurveTo(2.5, -47, 1.5, -47); snake.lineTo(1.5, 0);
        addTool('Dietrich: Snake', snake, pickXStart + 22, 0);

        // 3. Half-Diamond
        const diamond = createBaseShape();
        diamond.moveTo(-1.5, 0); diamond.lineTo(-1.5, -40);
        diamond.lineTo(-4.5, -43); diamond.lineTo(1.5, -40); diamond.lineTo(1.5, 0);
        addTool('Dietrich: Half-Diamond', diamond, pickXStart + 44, 0);

        // 4. City-Rake
        const rake = createBaseShape();
        rake.moveTo(-1.5, 0); rake.lineTo(-1.5, -38);
        rake.lineTo(-3.5, -40); rake.lineTo(1.5, -41);
        rake.lineTo(-3.5, -43); rake.lineTo(1.5, -44);
        rake.lineTo(1.5, 0);
        addTool('Dietrich: City-Rake', rake, pickXStart + 66, 0);


        // --- 3 SPANNER (TENSION WRENCHES) ---
        const tensionZ = 50;
        const tensionXStart = -22;
        const widths = [2.0, 2.8, 3.5];
        const names = ['Schmal (2.0mm)', 'Medium (2.8mm)', 'Breit (3.5mm)'];

        widths.forEach((w, i) => {
            const spanner = createBaseShape();
            spanner.moveTo(-w/2, 0);
            spanner.lineTo(-w/2, -35);
            spanner.lineTo(-w/2 - 10, -35); // 10mm Hebelarm zum Spannen
            spanner.lineTo(-w/2 - 10, -35 + w);
            spanner.lineTo(w/2, -35 + w);
            spanner.lineTo(w/2, 0);
            addTool(`Spanner: ${names[i]}`, spanner, tensionXStart + (i * 22), tensionZ);
        });

        // STL Download Logik
        function downloadSTL(name) {
            const mesh = tools[name];
            
            // Temporär auf den Nullpunkt setzen für sauberen STL-Nullpunkt im Slicer
            const origX = mesh.position.x;
            const origZ = mesh.position.z;
            mesh.position.set(0,0,0);
            
            const result = exporter.parse(mesh, { binary: true });
            
            // Position zurücksetzen
            mesh.position.set(origX, 0, origZ);

            const blob = new Blob([result], { type: 'application/octet-stream' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${name.replace(/[^a-zA-Z0-9]/g, "_")}.stl`;
            link.click();
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Resize Handling
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
