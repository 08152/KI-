<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>MONSTER GO</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#111;
}

canvas{
    display:block;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:10;
}

#top{
    position:absolute;
    top:15px;
    left:15px;
    right:15px;
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.panel{
    background:rgba(0,0,0,.68);
    color:white;
    padding:10px 14px;
    border-radius:14px;
    backdrop-filter:blur(8px);
    box-shadow:0 4px 20px rgba(0,0,0,.25);
}

#title{
    font-size:18px;
    font-weight:bold;
}

#status{
    font-size:13px;
    margin-top:3px;
    opacity:.85;
}

#counter{
    font-weight:bold;
}

#start{
    pointer-events:auto;
    position:absolute;
    left:50%;
    bottom:35px;
    transform:translateX(-50%);
    border:0;
    border-radius:18px;
    padding:16px 25px;
    font-size:17px;
    font-weight:bold;
    background:#fff;
    color:#111;
    box-shadow:0 8px 30px rgba(0,0,0,.35);
}

#start:active{
    transform:translateX(-50%) scale(.96);
}

#message{
    position:absolute;
    left:50%;
    bottom:100px;
    transform:translateX(-50%);
    width:max-content;
    max-width:90%;
    text-align:center;
    color:white;
    background:rgba(0,0,0,.72);
    padding:10px 15px;
    border-radius:13px;
    font-size:14px;
    opacity:0;
    transition:.2s;
}

#message.show{
    opacity:1;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:35px;
    height:35px;
    transform:translate(-50%,-50%);
    border:2px solid rgba(255,255,255,.75);
    border-radius:50%;
    opacity:.7;
    display:none;
}

#hint{
    position:absolute;
    left:50%;
    top:65%;
    transform:translateX(-50%);
    color:white;
    background:rgba(0,0,0,.65);
    padding:9px 14px;
    border-radius:12px;
    font-size:13px;
    display:none;
}
</style>
</head>

<body>

<div id="ui">

    <div id="top">

        <div class="panel">
            <div id="title">👾 MONSTER GO</div>
            <div id="status">Bereit</div>
        </div>

        <div class="panel">
            Monster: <span id="counter">0</span>
        </div>

    </div>

    <div id="crosshair"></div>

    <div id="hint">
        Suche eine flache Fläche...
    </div>

    <div id="message"></div>

    <button id="start">
        📷 AR STARTEN
    </button>

</div>


<script type="module">

/* =========================================================
   MONSTER GO
   =========================================================

   DEINE ORTE:

   Füge hier einfach weitere Zeilen hinzu:

   addLocation(
       "Name des Ortes",
       BREITENGRAD,
       LÄNGENGRAD,
       "Monstername"
   );

   Beispiel:

   addLocation("Park", 48.1234, 11.5678, "Grünling");

   ========================================================= */


const LOCATIONS = [];


/* Beispiel:
   Diese Zeilen sind auskommentiert.
   Trage deine eigenen Koordinaten ein.
*/

// addLocation("Mein Ort", 48.1234, 11.5678, "Flamino");
// addLocation("Park", 48.1250, 11.5700, "Grünling");
// addLocation("See", 48.1280, 11.5750, "Wassaro");


function addLocation(name, latitude, longitude, monster){
    LOCATIONS.push({
        name,
        latitude,
        longitude,
        monster,
        spawned:false
    });
}


/* =========================================================
   THREE.JS
   ========================================================= */

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


let camera;
let scene;
let renderer;

let xrSession = null;
let hitTestSource = null;
let hitTestSourceRequested = false;

let monster = null;
let monsterLocation = null;

let caught = 0;

let currentPosition = null;

const statusElement =
    document.getElementById("status");

const counterElement =
    document.getElementById("counter");

const startButton =
    document.getElementById("start");

const messageElement =
    document.getElementById("message");

const hintElement =
    document.getElementById("hint");

const crosshair =
    document.getElementById("crosshair");


/* =========================================================
   SZENE
   ========================================================= */

scene = new THREE.Scene();

camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.01,
    100
);


renderer = new THREE.WebGLRenderer({
    antialias:true,
    alpha:true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.xr.enabled = true;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LICHT
   ========================================================= */

const ambient =
    new THREE.HemisphereLight(
        0xffffff,
        0x555555,
        2
    );

scene.add(ambient);


const light =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

light.position.set(
    2,
    5,
    2
);

scene.add(light);


/* =========================================================
   MONSTER
   ========================================================= */

function createMonster(name){

    const group =
        new THREE.Group();

    group.name = name;


    /* Körper */

    const bodyGeometry =
        new THREE.SphereGeometry(
            0.28,
            24,
            16
        );

    const bodyMaterial =
        new THREE.MeshStandardMaterial({
            color:0x55dd77,
            roughness:.8
        });

    const body =
        new THREE.Mesh(
            bodyGeometry,
            bodyMaterial
        );

    body.scale.y = 1.15;

    body.position.y = .32;

    group.add(body);


    /* Kopf */

    const headGeometry =
        new THREE.SphereGeometry(
            0.24,
            24,
            16
        );

    const headMaterial =
        new THREE.MeshStandardMaterial({
            color:0x66ee88,
            roughness:.8
        });

    const head =
        new THREE.Mesh(
            headGeometry,
            headMaterial
        );

    head.position.y = .65;

    group.add(head);


    /* Augen */

    const eyeGeometry =
        new THREE.SphereGeometry(
            .045,
            12,
            12
        );

    const eyeMaterial =
        new THREE.MeshBasicMaterial({
            color:0x111111
        });


    const eye1 =
        new THREE.Mesh(
            eyeGeometry,
            eyeMaterial
        );

    eye1.position.set(
        -.09,
        .69,
        -.205
    );

    group.add(eye1);


    const eye2 =
        new THREE.Mesh(
            eyeGeometry,
            eyeMaterial
        );

    eye2.position.set(
        .09,
        .69,
        -.205
    );

    group.add(eye2);


    /* Ohren */

    const earGeometry =
        new THREE.ConeGeometry(
            .08,
            .2,
            4
        );

    const earMaterial =
        new THREE.MeshStandardMaterial({
            color:0x44bb66
        });


    const ear1 =
        new THREE.Mesh(
            earGeometry,
            earMaterial
        );

    ear1.position.set(
        -.15,
        .9,
        0
    );

    ear1.rotation.z = -.25;

    group.add(ear1);


    const ear2 =
        new THREE.Mesh(
            earGeometry,
            earMaterial
        );

    ear2.position.set(
        .15,
        .9,
        0
    );

    ear2.rotation.z = .25;

    group.add(ear2);


    /* kleiner Schatten */

    const shadowGeometry =
        new THREE.CircleGeometry(
            .3,
            24
        );

    const shadowMaterial =
        new THREE.MeshBasicMaterial({
            color:0x000000,
            transparent:true,
            opacity:.22,
            depthWrite:false
        });

    const shadow =
        new THREE.Mesh(
            shadowGeometry,
            shadowMaterial
        );

    shadow.rotation.x =
        -Math.PI / 2;

    shadow.position.y =
        .015;

    group.add(shadow);


    /* Name */

    group.userData.monsterName =
        name;


    return group;
}


/* =========================================================
   GPS
   ========================================================= */

function startGPS(){

    if(!navigator.geolocation){

        showMessage(
            "Dieses Gerät unterstützt kein GPS."
        );

        return;
    }


    navigator.geolocation.watchPosition(
        position => {

            currentPosition = {
                latitude:
                    position.coords.latitude,

                longitude:
                    position.coords.longitude
            };

            checkLocations();

        },

        error => {

            statusElement.textContent =
                "GPS konnte nicht gelesen werden";

        },

        {
            enableHighAccuracy:true,
            maximumAge:3000,
            timeout:10000
        }
    );
}


/* =========================================================
   ENTFERNUNG
   ========================================================= */

function distanceMeters(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R = 6371000;

    const p1 =
        lat1 * Math.PI / 180;

    const p2 =
        lat2 * Math.PI / 180;

    const dp =
        (lat2-lat1) *
        Math.PI / 180;

    const dl =
        (lon2-lon1) *
        Math.PI / 180;


    const a =
        Math.sin(dp/2) *
        Math.sin(dp/2)
        +
        Math.cos(p1) *
        Math.cos(p2) *
        Math.sin(dl/2) *
        Math.sin(dl/2);


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );


    return R*c;
}


/* =========================================================
   ORTE PRÜFEN
   ========================================================= */

function checkLocations(){

    if(!currentPosition)
        return;


    for(const location of LOCATIONS){

        const distance =
            distanceMeters(
                currentPosition.latitude,
                currentPosition.longitude,
                location.latitude,
                location.longitude
            );


        if(distance < 50 && !location.spawned){

            location.spawned = true;

            monsterLocation =
                location;

            statusElement.textContent =
                "Monster gefunden: " +
                location.monster;

            showMessage(
                "👾 " +
                location.monster +
                " wurde hier entdeckt!"
            );

            hintElement.style.display =
                "block";

            return;
        }
    }


    if(LOCATIONS.length > 0){

        let nearest = Infinity;

        for(const location of LOCATIONS){

            const d =
                distanceMeters(
                    currentPosition.latitude,
                    currentPosition.longitude,
                    location.latitude,
                    location.longitude
                );

            nearest =
                Math.min(nearest,d);
        }


        statusElement.textContent =
            "Nächster Fangort: " +
            Math.round(nearest) +
            " m";
    }
}


/* =========================================================
   AR START
   ========================================================= */

async function startAR(){

    if(!navigator.xr){

        showMessage(
            "AR wird von diesem Browser/Gerät nicht unterstützt."
        );

        return;
    }


    try{

        const supported =
            await navigator.xr.isSessionSupported(
                "immersive-ar"
            );


        if(!supported){

            showMessage(
                "Dieses Gerät unterstützt kein WebXR-AR."
            );

            return;
        }


        xrSession =
            await navigator.xr.requestSession(
                "immersive-ar",
                {
                    requiredFeatures:[
                        "hit-test"
                    ],

                    optionalFeatures:[
                        "dom-overlay"
                    ],

                    domOverlay:{
                        root:document.body
                    }
                }
            );


        renderer.xr.setReferenceSpaceType(
            "local"
        );

        await renderer.xr.setSession(
            xrSession
        );


        startButton.style.display =
            "none";

        crosshair.style.display =
            "block";

        hintElement.style.display =
            "block";


        statusElement.textContent =
            "AR aktiv – suche eine Fläche";


        xrSession.addEventListener(
            "end",
            () => {

                xrSession = null;

                hitTestSource = null;

                hitTestSourceRequested =
                    false;

                startButton.style.display =
                    "block";

                crosshair.style.display =
                    "none";

                hintElement.style.display =
                    "none";

                statusElement.textContent =
                    "AR beendet";
            }
        );


        startGPS();


    }catch(error){

        console.error(error);

        showMessage(
            "AR konnte nicht gestartet werden."
        );
    }
}


/* =========================================================
   HIT TEST
   ========================================================= */

function requestHitTestSource(
    frame
){

    if(hitTestSourceRequested)
        return;


    const session =
        renderer.xr.getSession();


    session.requestReferenceSpace(
        "viewer"
    ).then(
        referenceSpace => {

            session.requestHitTestSource({
                space:referenceSpace
            }).then(
                source => {

                    hitTestSource =
                        source;
                }
            );
        }
    );


    session.addEventListener(
        "end",
        () => {

            hitTestSourceRequested =
                false;

            hitTestSource =
                null;
        }
    );


    hitTestSourceRequested =
        true;
}


/* =========================================================
   MONSTER AUF FLÄCHE SETZEN
   ========================================================= */

function placeMonsterFromHit(
    hit
){

    if(!monsterLocation)
        return;

    if(monster)
        return;


    monster =
        createMonster(
            monsterLocation.monster
        );


    monster.position.setFromMatrixPosition(
        hit.getPose(
            renderer.xr.getReferenceSpace()
        ).transform.matrix
    );


    /*
       Wichtig:

       Das Monster wird auf die erkannte
       horizontale Fläche gesetzt.

       Es wird NICHT einfach vor die Kamera
       gesetzt.
    */


    scene.add(monster);


    hintElement.textContent =
        "👾 Tippe auf das Monster zum Fangen";

    statusElement.textContent =
        monsterLocation.monster +
        " steht auf der Fläche";


    monsterLocation = null;
}


/* =========================================================
   AR LOOP
   ========================================================= */

renderer.setAnimationLoop(
    (time,frame) => {

        if(frame){

            const session =
                renderer.xr.getSession();


            if(session){

                requestHitTestSource(
                    frame
                );


                if(
                    hitTestSource &&
                    !monster &&
                    monsterLocation
                ){

                    const referenceSpace =
                        renderer.xr
                            .getReferenceSpace();


                    const hits =
                        frame.getHitTestResults(
                            hitTestSource
                        );


                    if(hits.length > 0){

                        const hit =
                            hits[0];


                        const pose =
                            hit.getPose(
                                referenceSpace
                            );


                        if(pose){

                            /*
                               Noch kein Monster automatisch
                               platzieren, solange keine Fläche
                               stabil erkannt wurde.

                               Bei einem gültigen Hit wird
                               es auf genau dieser Fläche
                               platziert.
                            */

                            placeMonsterFromHit(
                                hit
                            );
                        }
                    }
                }
            }
        }


        /* Monster-Animation */

        if(monster){

            const t =
                performance.now() *
                .002;

            monster.position.y +=
                Math.sin(t) *
                .0005;

            monster.rotation.y =
                Math.sin(t*.5) *
                .12;
        }


        renderer.render(
            scene,
            camera
        );
    }
);


/* =========================================================
   FANGEN
   ========================================================= */

function catchMonster(){

    if(!monster)
        return;


    caught++;

    counterElement.textContent =
        caught;


    showMessage(
        "🎉 " +
        monster.userData.monsterName +
        " gefangen!"
    );


    scene.remove(
        monster
    );


    monster = null;


    hintElement.textContent =
        "Gehe zu einem anderen Fangort.";


    statusElement.textContent =
        "Monster gefangen";


    /*
       Ort wieder freigeben,
       damit man später erneut
       ein Monster finden kann.
    */

    if(currentPosition){

        /*
           Monster kommt nicht sofort wieder.
        */
    }
}


/* =========================================================
   TOUCH / KLICK
   ========================================================= */

renderer.domElement.addEventListener(
    "click",
    event => {

        if(!monster)
            return;


        /*
           Wir benutzen einen Raycaster,
           damit nur das Monster anklickbar ist.
        */

        const rect =
            renderer.domElement
                .getBoundingClientRect();


        const x =
            ((event.clientX -
              rect.left) /
             rect.width) * 2 - 1;


        const y =
            -((event.clientY -
               rect.top) /
              rect.height) * 2 + 1;


        const raycaster =
            new THREE.Raycaster();


        raycaster.setFromCamera(
            new THREE.Vector2(x,y),
            camera
        );


        const objects =
            raycaster.intersectObjects(
                monster.children,
                true
            );


        if(objects.length > 0){

            catchMonster();
        }
    }
);


/* =========================================================
   HINWEIS
   ========================================================= */

function showMessage(text){

    messageElement.textContent =
        text;

    messageElement.classList.add(
        "show"
    );


    clearTimeout(
        showMessage.timeout
    );


    showMessage.timeout =
        setTimeout(
            () => {

                messageElement.classList.remove(
                    "show"
                );

            },
            3000
        );
}


/* =========================================================
   START
   ========================================================= */

startButton.addEventListener(
    "click",
    startAR
);


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =========================================================
   STARTSTATUS
   ========================================================= */

if(!navigator.xr){

    statusElement.textContent =
        "AR-Unterstützung wird geprüft...";
}

</script>

</body>
</html>
