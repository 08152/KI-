<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Ghost Maps</title>

<link rel="stylesheet"
href="https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.css">

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,sans-serif
}

#map{
position:absolute;
inset:0
}

.search{
position:absolute;
z-index:10;
top:18px;
left:18px;
width:390px;
height:56px;
display:flex;
background:white;
border-radius:12px;
box-shadow:0 2px 10px #0004;
overflow:hidden
}

.search input{
flex:1;
border:0;
outline:0;
padding:0 18px;
font-size:16px
}

.search button{
width:60px;
border:0;
background:white;
font-size:21px;
cursor:pointer
}

.search button:hover{
background:#eee
}

.logo{
position:absolute;
z-index:10;
top:88px;
left:18px;
background:white;
padding:10px 14px;
border-radius:8px;
box-shadow:0 2px 8px #0004;
font-weight:bold
}

.controls{
position:absolute;
right:18px;
bottom:80px;
z-index:10;
display:flex;
flex-direction:column;
gap:8px
}

.controls button{
width:48px;
height:48px;
border:0;
border-radius:9px;
background:white;
box-shadow:0 2px 9px #0004;
font-size:23px;
cursor:pointer
}

.controls button:hover{
background:#eee
}

#status{
position:absolute;
z-index:50;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:14px 20px;
border-radius:10px;
box-shadow:0 3px 15px #0004
}

.hidden{
display:none
}
</style>
</head>

<body>

<div id="map"></div>

<div class="search">
<input id="search" placeholder="Ort suchen...">
<button id="searchBtn">🔍</button>
</div>

<div class="logo">
🌍 Ghost Maps
</div>

<div class="controls">
<button id="location">📍</button>
<button id="plus">+</button>
<button id="minus">−</button>
</div>

<div id="status">
Karte wird geladen...
</div>

<script src="https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.js"></script>

<script>

const status=document.getElementById("status");

const map=new maplibregl.Map({
container:"map",

style:{
version:8,

sources:{
osm:{
type:"raster",
tiles:[
"https://tile.openstreetmap.org/{z}/{x}/{y}.png"
],
tileSize:256,
attribution:"© OpenStreetMap-Mitwirkende"
}
},

layers:[
{
id:"osm",
type:"raster",
source:"osm"
}
]
},

center:[10.4515,51.1657],
zoom:5
});

map.addControl(
new maplibregl.NavigationControl(),
"bottom-right"
);

map.on("load",()=>{
status.classList.add("hidden");
});

map.on("error",()=>{
status.textContent="Karte konnte nicht geladen werden";
});

document.getElementById("plus").onclick=()=>{
map.zoomIn();
};

document.getElementById("minus").onclick=()=>{
map.zoomOut();
};

document.getElementById("location").onclick=()=>{
if(!navigator.geolocation){
alert("Standort wird nicht unterstützt");
return;
}

navigator.geolocation.getCurrentPosition(
position=>{
const lng=position.coords.longitude;
const lat=position.coords.latitude;

map.flyTo({
center:[lng,lat],
zoom:15,
speed:1.2
});

new maplibregl.Marker()
.setLngLat([lng,lat])
.setPopup(
new maplibregl.Popup()
.setHTML("<b>Dein Standort</b>")
)
.addTo(map)
.togglePopup();
},
()=>{
alert("Standort konnte nicht ermittelt werden");
}
);
};

async function searchPlace(){

const input=document.getElementById("search");
const query=input.value.trim();

if(!query)return;

try{

const response=await fetch(
"https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+
encodeURIComponent(query)
);

const data=await response.json();

if(!data.length){
alert("Ort nicht gefunden");
return;
}

const place=data[0];

const lng=parseFloat(place.lon);
const lat=parseFloat(place.lat);

map.flyTo({
center:[lng,lat],
zoom:14,
speed:1.2
});

new maplibregl.Marker()
.setLngLat([lng,lat])
.setPopup(
new maplibregl.Popup()
.setHTML(
"<b>"+escapeHTML(place.display_name)+"</b>"
)
)
.addTo(map)
.togglePopup();

}catch(error){
alert("Suche fehlgeschlagen");
}

}

function escapeHTML(text){
return text
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

document.getElementById("searchBtn")
.addEventListener("click",searchPlace);

document.getElementById("search")
.addEventListener("keydown",e=>{
if(e.key==="Enter"){
searchPlace();
}
});

</script>

</body>
</html>
