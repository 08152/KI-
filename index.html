<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GHOST PRINT</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>GHOST PRINT</h1>
  <p>A1 MINI CONTROL CENTER</p>
</header>

<main>

  <section class="card">
    <h2>🖨️ Drucker</h2>

    <div class="status">
      <span id="statusDot"></span>
      <span id="printerStatus">Nicht verbunden</span>
    </div>

    <button onclick="checkPrinter()">
      Drucker suchen
    </button>
  </section>


  <section class="card">
    <h2>📦 Druckauftrag</h2>

    <input
      type="file"
      id="fileInput"
      accept=".3mf,.gcode,.gcode.3mf"
    >

    <p id="fileName">
      Keine Datei ausgewählt
    </p>
  </section>


  <section class="card">
    <h2>📊 Status</h2>

    <div class="progressBox">
      <div id="progressBar"></div>
    </div>

    <p id="progressText">0%</p>
  </section>


  <section class="card">
    <h2>⚙️ Verbindung</h2>

    <input
      id="connectorUrl"
      placeholder="Connector URL"
      value="http://localhost:3000"
    >

    <button onclick="saveConnector()">
      Connector speichern
    </button>
  </section>

</main>

<script src="app.js"></script>

</body>
</html>
