
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Random Minecraft Block World</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial}
#ui{
position:fixed;top:12px;left:12px;z-index:10;
background:#000b;color:white;padding:12px;
border:2px solid #555;border-radius:8px
}
button{padding:10px;margin-top:6px;cursor:pointer}
#crosshair{
position:fixed;top:50%;left:50%;color:white;
font-size:24px;transform:translate(-50%,-50%);
pointer-events:none
}
</style>
</head>
<body>

<div id="ui">
<b>RANDOM BLOCK WORLD</b><br>
<span id="info">Welt wird geladen...</span><br>
<button onclick="generateWorld()">Neue Welt</button>
</div>

<div id="crosshair">+</div>

<script type="importmap">
{
"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
}
}
</script>

<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,35,100);

const camera=new THREE.PerspectiveCamera(
70,innerWidth/innerHeight,.1,200
);
camera.position.set(18,18,22);

const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,4,0);
controls.enableDamping=true;
controls.maxPolarAngle=Math.PI/2-.03;
controls.minDistance=5;
controls.maxDistance=65;

scene.add(new THREE.HemisphereLight(0xffffff,0x667788,2));

const sun=new THREE.DirectionalLight(0xffffff,3);
sun.position.set(20,40,15);
sun.castShadow=true;
scene.add(sun);

const loader=new THREE.TextureLoader();

function texture(url){
const t=loader.load(url);
t.magFilter=THREE.NearestFilter;
t.minFilter=THREE.NearestFilter;
t.colorSpace=THREE.SRGBColorSpace;
return t;
}

// Minecraft vanilla-style block textures
const dirt=texture(
"https://assets.mcasset.cloud/1.21.4/assets/minecraft/textures/block/dirt.png"
);
const stone=texture(
"https://assets.mcasset.cloud/1.21.4/assets/minecraft/textures/block/stone.png"
);

const dirtMat=new THREE.MeshLambertMaterial({map:dirt});
const stoneMat=new THREE.MeshLambertMaterial({map:stone});

const cube=new THREE.BoxGeometry(1,1,1);
let blocks=[];
const SIZE=24;
const HEIGHT=12;

function clearWorld(){
for(const b of blocks){
scene.remove(b);
b.geometry.dispose();
}
blocks=[];
}

function addBlock(x,y,z,material){
const mesh=new THREE.Mesh(cube,material);
mesh.position.set(x,y,z);
mesh.castShadow=true;
mesh.receiveShadow=true;
scene.add(mesh);
blocks.push(mesh);
}

function generateWorld(){
clearWorld();

for(let x=-SIZE/2;x<SIZE/2;x++){
for(let z=-SIZE/2;z<SIZE/2;z++){

const distance=Math.sqrt(x*x+z*z);
let h=Math.floor(
4+
Math.sin(x*.35)*1.5+
Math.cos(z*.27)*1.5+
Math.sin((x+z)*.18)*1.2+
Math.random()*2
);

h=Math.max(1,Math.min(HEIGHT,h));

for(let y=0;y<h;y++){
const material=y<h-2?stoneMat:dirtMat;
addBlock(x,y,z,material);
}

}
}

document.getElementById("info").textContent=
blocks.length+" Blöcke";
}

generateWorld();

function animate(){
requestAnimationFrame(animate);
controls.update();
renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
