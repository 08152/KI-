<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fishing Boat 3D</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#72bde8;
    font-family:Arial,sans-serif;
}

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    width:8px;
    height:8px;
    margin:-4px;
    border:2px solid white;
    border-radius:50%;
    box-sizing:border-box;
    pointer-events:none;
    z-index:10;
}

#info{
    position:fixed;
    left:15px;
    top:15px;
    padding:12px 15px;
    color:white;
    background:rgba(0,0,0,.55);
    border-radius:10px;
    z-index:20;
    line-height:1.5;
}

#interaction{
    position:fixed;
    left:50%;
    bottom:70px;
    transform:translateX(-50%);
    color:white;
    background:rgba(0,0,0,.65);
    padding:10px 18px;
    border-radius:10px;
    display:none;
    z-index:20;
}

#boatStatus{
    position:fixed;
    right:15px;
    top:15px;
    padding:10px 14px;
    color:white;
    background:rgba(0,0,0,.55);
    border-radius:10px;
    z-index:20;
    display:none;
}
</style>
</head>

<body>

<div id="crosshair"></div>

<div id="info">
<b>FISCHERBOOT</b><br>
WASD – Bewegen<br>
Maus – Umschauen<br>
E – Interagieren<br>
ESC – Maus freigeben
</div>

<div id="interaction"></div>
<div id="boatStatus">⚓ Am Steuer</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/PointerLockControls.js"></script>

<script>
/* =========================================================
   SZENE
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x79c8ed);

scene.fog = new THREE.Fog(
    0x79c8ed,
    45,
    130
);

const camera = new THREE.PerspectiveCamera(
    75,
    innerWidth/innerHeight,
    0.05,
    300
);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;

document.body.appendChild(renderer.domElement);


/* =========================================================
   LICHT
========================================================= */

const sun = new THREE.DirectionalLight(
    0xffffff,
    2
);

sun.position.set(
    20,
    35,
    10
);

sun.castShadow=true;

scene.add(sun);

scene.add(
    new THREE.HemisphereLight(
        0xbfefff,
        0x31566b,
        1.4
    )
);


/* =========================================================
   WASSER
========================================================= */

const waterGeo = new THREE.PlaneGeometry(
    300,
    300,
    50,
    50
);

const waterMat = new THREE.MeshPhongMaterial({
    color:0x247ca5,
    transparent:true,
    opacity:.88,
    shininess:100
});

const water = new THREE.Mesh(
    waterGeo,
    waterMat
);

water.rotation.x=-Math.PI/2;
water.position.y=-1.1;

scene.add(water);


/* =========================================================
   MATERIALIEN
========================================================= */

const wood = new THREE.MeshStandardMaterial({
    color:0x70451f
});

const woodLight = new THREE.MeshStandardMaterial({
    color:0x9b6330
});

const darkWood = new THREE.MeshStandardMaterial({
    color:0x3e2716
});

const metal = new THREE.MeshStandardMaterial({
    color:0x555b60,
    metalness:.8,
    roughness:.3
});

const white = new THREE.MeshStandardMaterial({
    color:0xe6e2d7
});

const red = new THREE.MeshStandardMaterial({
    color:0xa83225
});

const glass = new THREE.MeshStandardMaterial({
    color:0x65a9c6,
    transparent:true,
    opacity:.55
});


/* =========================================================
   HILFSFUNKTIONEN
========================================================= */

function box(
    x,y,z,
    sx,sy,sz,
    material,
    parent=scene
){
    const mesh=new THREE.Mesh(
        new THREE.BoxGeometry(sx,sy,sz),
        material
    );

    mesh.position.set(x,y,z);
    mesh.castShadow=true;
    mesh.receiveShadow=true;

    parent.add(mesh);

    return mesh;
}

function cylinder(
    x,y,z,
    radius,
    height,
    material,
    segments=16
){
    const mesh=new THREE.Mesh(
        new THREE.CylinderGeometry(
            radius,
            radius,
            height,
            segments
        ),
        material
    );

    mesh.position.set(x,y,z);
    mesh.castShadow=true;

    scene.add(mesh);

    return mesh;
}


/* =========================================================
   BOOT
========================================================= */

const boat=new THREE.Group();

scene.add(boat);

boat.position.set(0,0,0);


/* Rumpf */

box(
    0,
    0,
    0,
    15,
    1.8,
    5.8,
    wood,
    boat
);


/* Bugspitze */

const bow=new THREE.Mesh(
    new THREE.ConeGeometry(
        3.2,
        5,
        4
    ),
    wood
);

bow.rotation.y=Math.PI/4;
bow.rotation.z=Math.PI/2;
bow.position.set(8,0,0);

boat.add(bow);


/* Deck */

box(
    0,
    1.05,
    0,
    14.5,
    .35,
    5.2,
    woodLight,
    boat
);


/* Reling */

for(let x=-6;x<=6;x+=2){
    cylinder(
        x,
        1.9,
        -2.45,
        .06,
        1.6,
        metal
    );

    cylinder(
        x,
        1.9,
        2.45,
        .06,
        1.6,
        metal
    );
}

box(
    0,
    2.55,
    -2.45,
    13,
    .08,
    .08,
    metal,
    boat
);

box(
    0,
    2.55,
    2.45,
    13,
    .08,
    .08,
    metal,
    boat
);


/* =========================================================
   KAJÜTE
========================================================= */

const cabin=new THREE.Group();

cabin.position.set(-4,1.2,0);

boat.add(cabin);


/* Wände */

box(
    0,
    1.8,
    -1.8,
    5,
    3.4,
    .25,
    white,
    cabin
);

box(
    0,
    1.8,
    1.8,
    5,
    3.4,
    .25,
    white,
    cabin
);

box(
    -2.35,
    1.8,
    0,
    .25,
    3.4,
    3.4,
    white,
    cabin
);


/* Dach */

box(
    0,
    3.55,
    0,
    5.2,
    .25,
    4,
    red,
    cabin
);


/* Frontfenster */

box(
    2.45,
    2.35,
    0,
    .12,
    1.15,
    2.4,
    glass,
    cabin
);


/* =========================================================
   KAJÜTENTÜR
========================================================= */

const doorPivot=new THREE.Group();

doorPivot.position.set(
    2.48,
    1.75,
    -1.15
);

cabin.add(doorPivot);

const door=box(
    0,
    0,
    .65,
    .12,
    2.5,
    1.3,
    darkWood,
    doorPivot
);

let doorOpen=false;


/* =========================================================
   STEUERSTAND
========================================================= */

const steeringGroup=new THREE.Group();

steeringGroup.position.set(
    0,
    1.3,
    0
);

boat.add(steeringGroup);


/* Sitz */

box(
    1.3,
    .9,
    0,
    1.4,
    .25,
    1.2,
    darkWood,
    steeringGroup
);

box(
    .65,
    1.65,
    0,
    .25,
    1.5,
    1.2,
    darkWood,
    steeringGroup
);


/* Armaturenbrett */

box(
    2.2,
    1.9,
    0,
    .35,
    1.1,
    2.2,
    darkWood,
    steeringGroup
);


/* Lenkrad */

const wheel=new THREE.Mesh(
    new THREE.TorusGeometry(
        .65,
        .09,
        12,
        24
    ),
    metal
);

wheel.rotation.y=Math.PI/2;
wheel.position.set(
    1.95,
    2.35,
    0
);

steeringGroup.add(wheel);


/* =========================================================
   KRAN
========================================================= */

const crane=new THREE.Group();

crane.position.set(
    3,
    1.3,
    -1.5
);

boat.add(crane);


/* Sockel */

cylinder(
    0,
    .4,
    0,
    .65,
    .8,
    metal
);


/* Mast */

box(
    0,
    3,
    0,
    .3,
    4,
    .3,
    metal,
    crane
);


/* Arm */

box(
    1.8,
    4.5,
    0,
    3.6,
    .25,
    .25,
    metal,
    crane
);


/* Seil */

const rope=box(
    3.55,
    2.8,
    0,
    .05,
    3.2,
    .05,
    darkWood,
    crane
);


/* Haken */

const hook=new THREE.Mesh(
    new THREE.TorusGeometry(
        .22,
        .06,
        10,
        20,
        Math.PI*1.5
    ),
    metal
);

hook.position.set(
    3.55,
    1.15,
    0
);

crane.add(hook);


/* =========================================================
   ARBEITSTISCH
========================================================= */

const table=new THREE.Group();

table.position.set(
    3,
    1.25,
    1.5
);

boat.add(table);


/* Tischplatte */

box(
    0,
    1,
    0,
    2.5,
    .25,
    1.4,
    darkWood,
    table
);


/* Beine */

for(const x of [-.9,.9]){
    for(const z of [-.45,.45]){
        box(
            x,
            .45,
            z,
            .18,
            .9,
            .18,
            darkWood,
            table
        );
    }
}


/* Kisten auf Tisch */

box(
    -.55,
    1.28,
    0,
    .65,
    .35,
    .5,
    woodLight,
    table
);

box(
    .45,
    1.3,
    0,
    .45,
    .4,
    .4,
    red,
    table
);


/* =========================================================
   HITBOXEN
========================================================= */

const hitboxes=[];

function addHitbox(
    x,z,w,d,
    name=""
){
    hitboxes.push({
        x:x,
        z:z,
        w:w,
        d:d,
        name:name
    });
}


/*
   Bootskörper
*/
addHitbox(
    0,
    0,
    14.5,
    5,
    "Boot"
);


/*
   Kajüte
*/
addHitbox(
    -4,
    1.8,
    4.8,
    .3,
    "Kajütenwand"
);

addHitbox(
    -4,
    -1.8,
    4.8,
    .3,
    "Kajütenwand"
);


/*
   Tisch
*/
addHitbox(
    3,
    1.5,
    2.5,
    1.4,
    "Tisch"
);


/*
   Kran
*/
addHitbox(
    3,
    -1.5,
    1.4,
    1.4,
    "Kran"
);


/* =========================================================
   SPIELER
========================================================= */

const controls=new THREE.PointerLockControls(
    camera,
    document.body
);

scene.add(controls.getObject());

controls.getObject().position.set(
    0,
    2.3,
    3.5
);

document.body.addEventListener(
    "click",
    ()=>{
        controls.lock();
    }
);


/* =========================================================
   BEWEGUNG
========================================================= */

const keys={};

addEventListener(
    "keydown",
    e=>{
        keys[e.code]=true;
    }
);

addEventListener(
    "keyup",
    e=>{
        keys[e.code]=false;
    }
);

const playerRadius=.35;

function collision(x,z){

    /*
       Außenkante des Bootes.
    */

    if(x < -6.8) return true;
    if(x > 6.8) return true;
    if(z < -2.15) return true;
    if(z > 2.15) return true;


    /*
       Objekte
    */

    for(const h of hitboxes){

        if(
            x > h.x-h.w/2-playerRadius &&
            x < h.x+h.w/2+playerRadius &&
            z > h.z-h.d/2-playerRadius &&
            z < h.z+h.d/2+playerRadius
        ){
            return true;
        }
    }

    return false;
}


let velocityY=0;
let onGround=true;

function updateMovement(){

    if(!controls.isLocked) return;

    const speed=
        keys["ShiftLeft"] ? .105 : .065;

    let dx=0;
    let dz=0;

    if(keys["KeyW"]) dz-=speed;
    if(keys["KeyS"]) dz+=speed;
    if(keys["KeyA"]) dx-=speed;
    if(keys["KeyD"]) dx+=speed;

    const obj=controls.getObject();

    /*
       Vorwärtsrichtung
    */

    const forward=new THREE.Vector3();

    camera.getWorldDirection(forward);

    forward.y=0;
    forward.normalize();

    const right=new THREE.Vector3()
        .crossVectors(
            forward,
            new THREE.Vector3(0,1,0)
        )
        .normalize();

    const movement=new THREE.Vector3();

    movement.addScaledVector(
        forward,
        -dz
    );

    movement.addScaledVector(
        right,
        dx
    );

    const nx=
        obj.position.x+
        movement.x;

    const nz=
        obj.position.z+
        movement.z;


    if(!collision(nx,nz)){
        obj.position.x=nx;
        obj.position.z=nz;
    }


    /*
       Springen
    */

    if(
        keys["Space"] &&
        onGround
    ){
        velocityY=.16;
        onGround=false;
    }

    velocityY-=.008;

    obj.position.y+=velocityY;

    if(obj.position.y<=2.3){
        obj.position.y=2.3;
        velocityY=0;
        onGround=true;
    }
}


/* =========================================================
   INTERAKTION
========================================================= */

const interaction=
    document.getElementById("interaction");

const boatStatus=
    document.getElementById("boatStatus");

let steering=false;

function distanceTo(
    x,z
){
    const p=controls.getObject().position;

    return Math.hypot(
        p.x-x,
        p.z-z
    );
}


function updateInteraction(){

    const p=controls.getObject().position;

    /*
       Tür
    */

    const doorDistance=
        Math.hypot(
            p.x-(-1.5),
            p.z-(-1.15)
        );

    if(doorDistance<2){

        interaction.style.display="block";
        interaction.textContent=
            doorOpen
            ? "E – Tür schließen"
            : "E – Kajütentür öffnen";

        interaction.dataset.action="door";

        return;
    }


    /*
       Steuerstand
    */

    const steeringDistance=
        Math.hypot(
            p.x-1.3,
            p.z
        );

    if(steeringDistance<2){

        interaction.style.display="block";
        interaction.textContent=
            steering
            ? "E – Steuerstand verlassen"
            : "E – Auf den Steuerstand setzen";

        interaction.dataset.action="steering";

        return;
    }


    /*
       Kran
    */

    const craneDistance=
        Math.hypot(
            p.x-3,
            p.z+1.5
        );

    if(craneDistance<2){

        interaction.style.display="block";
        interaction.textContent=
            "E – Kran bedienen";

        interaction.dataset.action="crane";

        return;
    }


    /*
       Tisch
    */

    const tableDistance=
        Math.hypot(
            p.x-3,
            p.z-1.5
        );

    if(tableDistance<2){

        interaction.style.display="block";
        interaction.textContent=
            "E – Arbeitstisch benutzen";

        interaction.dataset.action="table";

        return;
    }


    interaction.style.display="none";
    interaction.dataset.action="";
}


/* =========================================================
   E INTERAKTION
========================================================= */

addEventListener(
    "keydown",
    e=>{

        if(e.code!=="KeyE") return;

        const action=
            interaction.dataset.action;

        if(action==="door"){

            doorOpen=!doorOpen;

            if(doorOpen){

                doorPivot.rotation.y=
                    -Math.PI/2;

            }else{

                doorPivot.rotation.y=0;
            }
        }


        if(action==="steering"){

            steering=!steering;

            if(steering){

                controls.getObject().position.set(
                    1.3,
                    2.2,
                    0
                );

                boatStatus.style.display="block";

            }else{

                controls.getObject().position.set(
                    2.8,
                    2.3,
                    0
                );

                boatStatus.style.display="none";
            }
        }


        if(action==="crane"){

            alert(
                "Kran aktiviert!\n\nHier kann später die Kransteuerung eingebaut werden."
            );
        }


        if(action==="table"){

            alert(
                "Arbeitstisch\n\nHier können später Fischerei- und Reparaturfunktionen eingebaut werden."
            );
        }
    }
);


/* =========================================================
   WASSERBEWEGUNG
========================================================= */

let time=0;

function animateWater(){

    time+=.01;

    const pos=
        water.geometry.attributes.position;

    for(
        let i=0;
        i<pos.count;
        i++
    ){

        const x=pos.getX(i);
        const z=pos.getY(i);

        pos.setZ(
            i,
            Math.sin(
                x*.08+time
            )*.12+
            Math.cos(
                z*.06+time*.7
            )*.1
        );
    }

    pos.needsUpdate=true;
}


/* =========================================================
   LOOP
========================================================= */

function animate(){

    requestAnimationFrame(animate);

    updateMovement();
    updateInteraction();
    animateWater();

    renderer.render(
        scene,
        camera
    );
}

animate();


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    ()=>{
        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);
</script>

</body>
</html>s
