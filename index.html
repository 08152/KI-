<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lokaler Video Maler</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#181818;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
}

header{
    width:100%;
    padding:20px;
    text-align:center;
    background:#242424;
    border-bottom:1px solid #444;
}

h1{
    margin:0;
    font-size:24px;
}

p{
    color:#aaa;
}

#container{
    width:min(95vw,900px);
    margin-top:20px;
}

#cameraBox{
    position:relative;
    width:100%;
    background:#000;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
}

canvas{
    width:100%;
    display:block;
}

video{
    display:none;
}

#controls{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    padding:20px;
}

button{
    border:none;
    padding:13px 18px;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    background:#444;
    color:white;
}

button:hover{
    background:#666;
}

.start{
    background:#1685ff;
}

.start:hover{
    background:#006fe8;
}

.record{
    background:#d92525;
}

.recording{
    animation:pulse 1s infinite;
}

@keyframes pulse{
    50%{
        opacity:.5;
    }
}

.download{
    background:#18a84c;
}

#settings{
    margin:10px 0 30px 0;
    padding:20px;
    background:#242424;
    border-radius:15px;
}

.setting{
    margin:15px 0;
}

label{
    display:flex;
    justify-content:space-between;
    gap:15px;
    margin-bottom:8px;
}

input[type="range"]{
    width:100%;
}

select{
    width:100%;
    padding:10px;
    border-radius:8px;
    background:#333;
    color:white;
    border:1px solid #555;
}

#status{
    text-align:center;
    min-height:25px;
    color:#aaa;
}

#recordDot{
    position:absolute;
    top:15px;
    left:15px;
    width:15px;
    height:15px;
    background:red;
    border-radius:50%;
    display:none;
    box-shadow:0 0 15px red;
}

#recordTime{
    position:absolute;
    top:12px;
    left:42px;
    display:none;
    font-size:18px;
    text-shadow:0 2px 5px black;
}
</style>
</head>

<body>

<header>
    <h1>🎨 Lokaler Video Maler</h1>
    <p>Echte Kamera → gemalter Effekt → Videoaufnahme</p>
</header>

<div id="container">

    <div id="cameraBox">
        <video id="video" autoplay playsinline muted></video>

        <canvas id="canvas"></canvas>

        <div id="recordDot"></div>
        <div id="recordTime">00:00</div>
    </div>

    <div id="controls">
        <button class="start" id="startCamera">
            📷 Kamera starten
        </button>

        <button class="record" id="recordButton" disabled>
            ⏺ Aufnahme starten
        </button>

        <button class="download" id="downloadButton" disabled>
            ⬇ Video herunterladen
        </button>
    </div>

    <div id="settings">

        <div class="setting">
            <label>
                Effekt
            </label>

            <select id="effect">
                <option value="paint">Gemalt</option>
                <option value="watercolor">Aquarell</option>
                <option value="sketch">Bleistiftzeichnung</option>
                <option value="cartoon">Comic</option>
                <option value="soft">Weich gemalt</option>
            </select>
        </div>

        <div class="setting">
            <label>
                <span>Farbstärke</span>
                <span id="saturationValue">140%</span>
            </label>

            <input
                type="range"
                id="saturation"
                min="0"
                max="250"
                value="140"
            >
        </div>

        <div class="setting">
            <label>
                <span>Kontrast</span>
                <span id="contrastValue">120%</span>
            </label>

            <input
                type="range"
                id="contrast"
                min="50"
                max="250"
                value="120"
            >
        </div>

        <div class="setting">
            <label>
                <span>Helligkeit</span>
                <span id="brightnessValue">100%</span>
            </label>

            <input
                type="range"
                id="brightness"
                min="50"
                max="180"
                value="100"
            >
        </div>

    </div>

    <div id="status">
        Kamera noch nicht gestartet.
    </div>

</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {
    willReadFrequently:true
});

const startCamera = document.getElementById("startCamera");
const recordButton = document.getElementById("recordButton");
const downloadButton = document.getElementById("downloadButton");

const effectSelect = document.getElementById("effect");

const saturation = document.getElementById("saturation");
const contrast = document.getElementById("contrast");
const brightness = document.getElementById("brightness");

const saturationValue = document.getElementById("saturationValue");
const contrastValue = document.getElementById("contrastValue");
const brightnessValue = document.getElementById("brightnessValue");

const status = document.getElementById("status");

const recordDot = document.getElementById("recordDot");
const recordTime = document.getElementById("recordTime");


let stream = null;
let recorder = null;
let chunks = [];

let recording = false;
let recordingStart = 0;
let animationFrame = null;


saturation.addEventListener("input",()=>{
    saturationValue.textContent =
        saturation.value + "%";
});

contrast.addEventListener("input",()=>{
    contrastValue.textContent =
        contrast.value + "%";
});

brightness.addEventListener("input",()=>{
    brightnessValue.textContent =
        brightness.value + "%";
});


startCamera.addEventListener("click",async()=>{

    try{

        stream = await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:"environment",
                width:{ideal:1280},
                height:{ideal:720}
            },

            audio:true

        });

        video.srcObject = stream;

        await video.play();

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        recordButton.disabled = false;

        status.textContent =
            "Kamera läuft. Wähle einen Effekt.";

        draw();

    }
    catch(error){

        console.error(error);

        status.textContent =
            "Kamera konnte nicht gestartet werden.";

    }

});


function draw(){

    if(!video.videoWidth){
        animationFrame = requestAnimationFrame(draw);
        return;
    }


    const w = canvas.width;
    const h = canvas.height;


    const sat = saturation.value;
    const con = contrast.value;
    const bri = brightness.value;


    ctx.clearRect(0,0,w,h);


    const effect = effectSelect.value;


    if(effect === "paint"){

        ctx.filter =
            `brightness(${bri}%)
             contrast(${con + 20}%)
             saturate(${sat + 30}%)
             blur(0.6px)`;

        ctx.drawImage(video,0,0,w,h);

        ctx.globalAlpha = 0.25;

        ctx.filter =
            "blur(2px) saturate(180%)";

        ctx.drawImage(video,0,0,w,h);

        ctx.globalAlpha = 1;

    }


    else if(effect === "watercolor"){

        ctx.filter =
            `brightness(${bri + 5}%)
             contrast(${con - 10}%)
             saturate(${sat + 50}%)
             blur(1.2px)`;

        ctx.drawImage(video,0,0,w,h);

        ctx.globalAlpha = 0.3;

        ctx.filter =
            "blur(4px) saturate(180%)";

        ctx.drawImage(video,0,0,w,h);

        ctx.globalAlpha = 1;

    }


    else if(effect === "soft"){

        ctx.filter =
            `brightness(${bri + 10}%)
             contrast(${con - 10}%)
             saturate(${sat + 20}%)
             blur(1px)`;

        ctx.drawImage(video,0,0,w,h);

    }


    else if(effect === "cartoon"){

        ctx.filter =
            `brightness(${bri}%)
             contrast(${con + 60}%)
             saturate(${sat + 70}%)`;

        ctx.drawImage(video,0,0,w,h);

    }


    else if(effect === "sketch"){

        ctx.filter =
            "grayscale(100%) contrast(250%) invert(100%)";

        ctx.drawImage(video,0,0,w,h);

        ctx.globalCompositeOperation = "multiply";

        ctx.filter =
            "grayscale(100%) contrast(250%)";

        ctx.drawImage(video,2,0,w,h);

        ctx.globalCompositeOperation = "source-over";

    }


    if(recording){

        const seconds =
            Math.floor(
                (Date.now() - recordingStart) / 1000
            );

        const min =
            String(Math.floor(seconds / 60))
            .padStart(2,"0");

        const sec =
            String(seconds % 60)
            .padStart(2,"0");

        recordTime.textContent =
            min + ":" + sec;

    }


    animationFrame =
        requestAnimationFrame(draw);

}


recordButton.addEventListener("click",()=>{

    if(!recording){

        chunks = [];


        const canvasStream =
            canvas.captureStream(30);


        if(stream && stream.getAudioTracks().length > 0){

            stream.getAudioTracks().forEach(track=>{

                canvasStream.addTrack(
                    track
                );

            });

        }


        let mimeType =
            "video/webm;codecs=vp9,opus";


        if(!MediaRecorder.isTypeSupported(mimeType)){

            mimeType =
                "video/webm";

        }


        recorder =
            new MediaRecorder(
                canvasStream,
                {
                    mimeType:mimeType,
                    videoBitsPerSecond:8000000
                }
            );


        recorder.ondataavailable = event=>{

            if(event.data.size > 0){

                chunks.push(event.data);

            }

        };


        recorder.onstop = ()=>{

            const blob =
                new Blob(
                    chunks,
                    {
                        type:"video/webm"
                    }
                );


            window.recordedVideo =
                URL.createObjectURL(blob);


            downloadButton.disabled = false;

            status.textContent =
                "Aufnahme fertig!";

        };


        recorder.start(100);


        recording = true;

        recordingStart = Date.now();


        recordButton.textContent =
            "⏹ Aufnahme stoppen";

        recordButton.classList.add(
            "recording"
        );

        recordDot.style.display =
            "block";

        recordTime.style.display =
            "block";

        status.textContent =
            "🔴 Aufnahme läuft...";

    }


    else{

        recorder.stop();


        recording = false;


        recordButton.textContent =
            "⏺ Aufnahme starten";

        recordButton.classList.remove(
            "recording"
        );


        recordDot.style.display =
            "none";

        recordTime.style.display =
            "none";

    }

});


downloadButton.addEventListener("click",()=>{

    if(!window.recordedVideo){
        return;
    }


    const a =
        document.createElement("a");


    a.href =
        window.recordedVideo;


    a.download =
        "gemaltes-video.webm";


    document.body.appendChild(a);

    a.click();

    a.remove();

});


window.addEventListener("beforeunload",()=>{

    if(animationFrame){

        cancelAnimationFrame(
            animationFrame
        );

    }


    if(stream){

        stream.getTracks().forEach(track=>{
            track.stop();
        });

    }

});

</script>

</body>
</html>
