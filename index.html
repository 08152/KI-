<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FPS Weapon FIX</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87cfff;
}

canvas{
    display:block;
}

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    width:18px;
    height:18px;
    transform:translate(-50%,-50%);
    z-index:10;
    pointer-events:none;
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 0 3px black;
}

#crosshair:before{
    width:2px;
    height:18px;
    left:8px;
}

#crosshair:after{
    width:18px;
    height:2px;
    top:8px;
}

#status{
    position:fixed;
    top:10px;
    left:10px;
    z-index:100;
    padding:8px 12px;
    color:white;
    background:rgba(0,0,0,.7);
    font:13px monospace;
    border-radius:6px;
}

#coords{
    position:fixed;
    right:10px;
    bottom:10px;
    z-index:100;
    color:white;
    background:rgba(0,0,0,.6);
    padding:8px;
    font:12px monospace;
    white-space:pre;
}

#hitmarker{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font:bold 36px Arial;
    display:none;
    z-index:100;
}

#health{
    position:fixed;
    left:10px;
    bottom:10px;
    width:220px;
    height:18px;
    border:2px solid white;
    background:#222;
    z-index:100;
}

#healthFill{
    width:100%;
    height:100%;
    background:#21d94d;
}
</style>
</head>

<body>

<div id="status">Lade weapon.glb...</div>
<div id="crosshair"></div>
<div id="hitmarker">✖</div>

<div id="health">
<div id="healthFill"></div>
</div>

<div id="coords"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>

/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x87cfff);


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        75,
        window.innerWidth /
        window.innerHeight,
        0.01,
        5000
    );


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.outputEncoding =
    THREE.sRGBEncoding;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LIGHT
========================================================= */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        2
    )
);

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

sun.position.set(
    10,
    30,
    20
);

scene.add(sun);


/* =========================================================
   GROUND
========================================================= */

const texture =
    new THREE.TextureLoader().load(
        "https://threejs.org/examples/textures/terrain/grasslight-big.jpg"
    );

texture.wrapS =
    THREE.RepeatWrapping;

texture.wrapT =
    THREE.RepeatWrapping;

texture.repeat.set(
    100,
    100
);

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            5000,
            5000
        ),
        new THREE.MeshStandardMaterial({
            map:texture
        })
    );

ground.rotation.x =
    -Math.PI / 2;

scene.add(ground);


/* =========================================================
   PLAYER
========================================================= */

const player =
    new THREE.Object3D();

scene.add(player);

player.add(camera);

camera.position.set(
    0,
    2.2,
    0
);


/* =========================================================
   WEAPON ROOT
========================================================= */

/*
   WICHTIG:

   Die Waffe bekommt einen eigenen Root.

   Dieser Root sitzt direkt an der Kamera.

   Das GLB selbst wird DARUNTER gesetzt.

   Dadurch kann die interne Position des GLB
   nicht mehr dafür sorgen, dass die ganze
   Waffe links außerhalb des Bildes sitzt.
*/

const weaponRoot =
    new THREE.Object3D();

camera.add(
    weaponRoot
);


/* =========================================================
   FESTE FIRST-PERSON POSITION
========================================================= */

/*
   Diese Werte sind RELATIV zur Kamera.

   X = rechts
   Y = unten
   Z = vor der Kamera
*/

const HAND_X = 0.65;
const HAND_Y = -0.55;
const HAND_Z = -1.15;


/* =========================================================
   WEAPON
========================================================= */

const loader =
    new THREE.GLTFLoader();

let weapon = null;


/* =========================================================
   LOAD GLB
========================================================= */

loader.load(

    "./weapon.glb",

    function(gltf){

        console.log(
            "weapon.glb geladen"
        );


        /*
           ================================================
           GLB
           ================================================
        */

        weapon =
            gltf.scene;


        /*
           ================================================
           RESET
           ================================================
        */

        weapon.position.set(
            0,
            0,
            0
        );

        weapon.rotation.set(
            0,
            0,
            0
        );

        weapon.scale.set(
            1,
            1,
            1
        );


        /*
           ================================================
           ALLE MESHES
           ================================================
        */

        weapon.traverse(
            function(obj){

                if(obj.isMesh){

                    obj.visible =
                        true;

                    obj.frustumCulled =
                        false;


                    if(obj.material){

                        if(
                            Array.isArray(
                                obj.material
                            )
                        ){

                            obj.material.forEach(
                                function(mat){

                                    mat.side =
                                        THREE.DoubleSide;

                                    mat.needsUpdate =
                                        true;

                                }
                            );

                        }
                        else{

                            obj.material.side =
                                THREE.DoubleSide;

                            obj.material.needsUpdate =
                                true;

                        }

                    }

                }

            }
        );


        /*
           ================================================
           SCHRITT 1:
           ECHTE BOX DES GLB
           ================================================
        */

        let box =
            new THREE.Box3()
            .setFromObject(
                weapon
            );


        let size =
            new THREE.Vector3();

        box.getSize(
            size
        );


        let center =
            new THREE.Vector3();

        box.getCenter(
            center
        );


        console.log(
            "Original BOX:",
            box
        );

        console.log(
            "Original SIZE:",
            size
        );

        console.log(
            "Original CENTER:",
            center
        );


        /*
           ================================================
           SCHRITT 2:
           ALLE GLB-INTERNEN POSITIONEN ZENTRIEREN
           ================================================
        */

        weapon.position.x =
            -center.x;

        weapon.position.y =
            -center.y;

        weapon.position.z =
            -center.z;


        /*
           ================================================
           SCHRITT 3:
           SCALE
           ================================================
        */

        const largest =
            Math.max(
                size.x,
                size.y,
                size.z
            );


        const TARGET =
            1.25;


        if(
            largest > 0 &&
            isFinite(largest)
        ){

            const scale =
                TARGET /
                largest;


            weapon.scale.set(
                scale,
                scale,
                scale
            );

        }


        /*
           ================================================
           SCHRITT 4:
           NACH SCALE ERNEUT ZENTRIEREN
           ================================================
        */

        box =
            new THREE.Box3()
            .setFromObject(
                weapon
            );


        center =
            new THREE.Vector3();


        box.getCenter(
            center
        );


        weapon.position.x -=
            center.x;

        weapon.position.y -=
            center.y;

        weapon.position.z -=
            center.z;


        /*
           ================================================
           SCHRITT 5:
           AUSRICHTUNG
           ================================================

           Standard:
           Die lange Seite zeigt nach vorne.

           Wir drehen das Modell hier NICHT
           über den Root.

           So bleibt die Position unabhängig.
        */

        weapon.rotation.set(
            0,
            Math.PI,
            0
        );


        /*
           ================================================
           SCHRITT 6:
           GLB IN ROOT
           ================================================
        */

        weaponRoot.add(
            weapon
        );


        /*
           ================================================
           SCHRITT 7:
           ROOT NACH RECHTS UNTEN VOR KAMERA
           ================================================
        */

        weaponRoot.position.set(
            HAND_X,
            HAND_Y,
            HAND_Z
        );


        /*
           ================================================
           ROOT ROTATION
           ================================================
        */

        weaponRoot.rotation.set(
            0,
            0,
            0
        );


        /*
           ================================================
           WICHTIG:
           DAS GLB BLEIBT ZENTRIERT
           ================================================
        */

        weapon.visible =
            true;


        /*
           ================================================
           STATUS
           ================================================
        */

        document.getElementById(
            "status"
        ).textContent =
            "✓ Waffe rechts vor Kamera";


        console.log(
            "Weapon Root:",
            weaponRoot
        );

        console.log(
            "Weapon:",
            weapon
        );

        console.log(
            "Final Scale:",
            weapon.scale
        );

        console.log(
            "Final Root Position:",
            weaponRoot.position
        );

    },

    function(xhr){

        if(xhr.total){

            const percent =
                Math.round(
                    xhr.loaded /
                    xhr.total *
                    100
                );

            document.getElementById(
                "status"
            ).textContent =
                "Lade weapon.glb " +
                percent +
                "%";

        }

    },

    function(error){

        console.error(
            "weapon.glb ERROR",
            error
        );

        document.getElementById(
            "status"
        ).textContent =
            "✕ weapon.glb Fehler";

    }

);


/* =========================================================
   INPUT
========================================================= */

const keys = {};

window.addEventListener(
    "keydown",
    function(e){

        keys[
            e.key.toLowerCase()
        ] = true;


        if(
            e.code === "Space"
        ){

            e.preventDefault();

            jump();

        }

    }
);

window.addEventListener(
    "keyup",
    function(e){

        keys[
            e.key.toLowerCase()
        ] = false;

    }
);


/* =========================================================
   MOUSE LOOK
========================================================= */

let yaw = 0;
let pitch = 0;

document.body.addEventListener(
    "click",
    function(){

        document.body.requestPointerLock();

    }
);

document.addEventListener(
    "mousemove",
    function(e){

        if(
            document.pointerLockElement !==
            document.body
        ){

            return;

        }


        yaw -=
            e.movementX *
            0.002;


        pitch -=
            e.movementY *
            0.002;


        pitch =
            Math.max(
                -1.2,
                Math.min(
                    1.2,
                    pitch
                )
            );


        player.rotation.y =
            yaw;


        camera.rotation.x =
            pitch;

    }
);


/* =========================================================
   MOVEMENT
========================================================= */

function move(){

    const speed =
        0.15;


    let dir =
        new THREE.Vector3();


    if(keys["w"])
        dir.z -= 1;

    if(keys["s"])
        dir.z += 1;

    if(keys["a"])
        dir.x -= 1;

    if(keys["d"])
        dir.x += 1;


    if(dir.lengthSq() === 0)
        return;


    dir.normalize();


    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    forward.applyEuler(
        player.rotation
    );


    forward.y = 0;

    forward.normalize();


    const right =
        new THREE.Vector3()
        .crossVectors(
            forward,
            new THREE.Vector3(
                0,
                1,
                0
            )
        )
        .negate();


    player.position.addScaledVector(
        forward,
        dir.z *
        speed
    );


    player.position.addScaledVector(
        right,
        dir.x *
        speed
    );

}


/* =========================================================
   GRAVITY
========================================================= */

let velocityY = 0;
let onGround = true;

function gravity(){

    velocityY -=
        0.015;


    player.position.y +=
        velocityY;


    if(
        player.position.y <= 0
    ){

        player.position.y =
            0;

        velocityY =
            0;

        onGround =
            true;

    }

}


/* =========================================================
   JUMP
========================================================= */

function jump(){

    if(!onGround)
        return;


    velocityY =
        0.25;


    onGround =
        false;

}


/* =========================================================
   ENEMIES
========================================================= */

const enemies = [];


function addEnemy(
    x,
    y,
    z
){

    const enemy =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1,
                2,
                1
            ),
            new THREE.MeshStandardMaterial({
                color:0xff2222
            })
        );


    enemy.position.set(
        x,
        y,
        z
    );


    enemy.health =
        100;


    scene.add(
        enemy
    );


    enemies.push(
        enemy
    );

}


addEnemy(
    5,
    1,
    -20
);

addEnemy(
    -3,
    1,
    -15
);

addEnemy(
    8,
    1,
    -30
);


/* =========================================================
   SHOOT
========================================================= */

const raycaster =
    new THREE.Raycaster();

let recoil =
    0;

let cooldown =
    false;


function shoot(){

    if(cooldown)
        return;


    cooldown =
        true;


    recoil =
        0.15;


    raycaster.setFromCamera(
        new THREE.Vector2(
            0,
            0
        ),
        camera
    );


    const hits =
        raycaster.intersectObjects(
            enemies
        );


    if(hits.length){

        const enemy =
            hits[0].object;


        enemy.health -=
            25;


        document.getElementById(
            "hitmarker"
        ).style.display =
            "block";


        setTimeout(
            function(){

                document.getElementById(
                    "hitmarker"
                ).style.display =
                    "none";

            },
            100
        );


        if(
            enemy.health <= 0
        ){

            scene.remove(
                enemy
            );


            const index =
                enemies.indexOf(
                    enemy
                );


            if(index >= 0)
                enemies.splice(
                    index,
                    1
                );

        }

    }


    setTimeout(
        function(){

            cooldown =
                false;

        },
        120
    );

}


window.addEventListener(
    "mousedown",
    function(e){

        if(
            e.button === 0
        ){

            shoot();

        }

    }
);


/* =========================================================
   UPDATE
========================================================= */

function update(){

    move();

    gravity();


    /*
       ================================================
       WAFFE:
       IMMER FEST RELATIV ZUR KAMERA
       ================================================
    */

    if(weaponRoot){

        weaponRoot.position.x =
            HAND_X;

        weaponRoot.position.y =
            HAND_Y;

        weaponRoot.position.z =
            HAND_Z +
            recoil;


        /*
           leichte Schussbewegung
        */

        weaponRoot.rotation.x =
            recoil *
            0.3;


        recoil *=
            0.7;


        if(
            Math.abs(recoil) < 0.001
        ){

            recoil =
                0;

            weaponRoot.rotation.x =
                0;

        }

    }


    /*
       ================================================
       COORDS
       ================================================
    */

    const dir =
        new THREE.Vector3(
            0,
            0,
            -1
        ).applyEuler(
            player.rotation
        );


    document.getElementById(
        "coords"
    ).textContent =

`X: ${player.position.x.toFixed(2)}
Y: ${player.position.y.toFixed(2)}
Z: ${player.position.z.toFixed(2)}

DIR X: ${dir.x.toFixed(2)}
DIR Z: ${dir.z.toFixed(2)}`;


    document.getElementById(
        "healthFill"
    ).style.width =
        "100%";

}


/* =========================================================
   LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    update();


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            innerWidth /
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>

</body>
</html>
