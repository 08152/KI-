<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D GLB Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
            font-family: sans-serif;
        }
        model-viewer {
            width: 90%;
            height: 90%;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
    </style>
    <!-- Lädt die Model-Viewer Komponente von Google -->
    <script type="module" src="https://googleapis.com"></script>
</head>
<body>

    <!-- Der Viewer für deine Datei 1.glb -->
    <model-viewer 
        src="1.glb" 
        alt="Mein 3D Modell" 
        ar 
        camera-controls 
        touch-action="pan-y" 
        shadow-intensity="1" 
        autoplay>
    </model-viewer>

</body>
</html>
