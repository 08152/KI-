<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Simple FPS World</title>

<style>
body{
margin:0;
overflow:hidden;
background:#000;
}

canvas{
display:block;
}

#hud{
position:fixed;
top:10px;
left:10px;
z-index:9999;
background:rgba(0,0,0,.75);
color:white;
padding:10px;
font-family:monospace;
font-size:14px;
border-radius:6px;
pointer-events:none;
}
</style>
</head>

<body>

<div id="hud">Start...</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";


const hud = document.getElementById("hud");


function log(msg){

hud.innerHTML += "<br>" + msg;

}


const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);


const camera = new THREE.PerspectiveCamera(

75,
window.innerWidth / window.innerHeight,
0.1,
2000

);

camera.position.set(

0,
8,
20

);

camera.lookAt(

0,
3,
0

);


const renderer = new THREE.WebGLRenderer({

antialias:true

});

renderer.setSize(

window.innerWidth,
window.innerHeight

);

renderer.setPixelRatio(

Math.min(window.devicePixelRatio,2)

);

document.body.appendChild(

renderer.domElement

);


const hemiLight = new THREE.HemisphereLight(

0xffffff,
0x445544,
2

);

scene.add(

hemiLight

);


const sun = new THREE.DirectionalLight(

0xffffff,
3

);

sun.position.set(

20,
30,
20

);

scene.add(

sun
);


const groundGeometry = new THREE.PlaneGeometry(

500,
500

);


const groundMaterial = new THREE.MeshStandardMaterial({

color:0x228822

});


const ground = new THREE.Mesh(

groundGeometry,
groundMaterial

);


ground.rotation.x = -Math.PI / 2;

scene.add(

ground

);


const loader = new GLTFLoader();

let model = null;


log("Lade 1.glb ...");


loader.load(

"1.glb",

(gltf)=>{

model = gltf.scene;


model.position.set(

0,
0,
0

);


model.scale.set(

1,
1,
1

);


scene.add(

model

);


const box = new THREE.Box3().setFromObject(model);

const size = box.getSize(

new THREE.Vector3()

);

const center = box.getCenter(

new THREE.Vector3()

);


model.position.x -= center.x;

model.position.z -= center.z;

model.position.y -= box.min.y;


log("1.glb geladen");

},

(xhr)=>{

if(xhr.total){

const percent = Math.round(

(xhr.loaded / xhr.total) * 100

);

hud.innerHTML =

"Lade 1.glb: " +
percent +
"%";

}

},

(error)=>{

log("FEHLER: 1.glb nicht geladen");

log("Pruefe: Datei heisst exakt 1.glb");

}

);


const keys = {

forward:false,
back:false,
left:false,
right:false

};


document.addEventListener(

"keydown",

(e)=>{

if(e.code==="KeyW"){

keys.forward=true;

}

if(e.code==="KeyS"){

keys.back=true;

}

if(e.code==="KeyA"){

keys.left=true;

}

if(e.code==="KeyD"){

keys.right=true;

}

}

);


document.addEventListener(

"keyup",

(e)=>{

if(e.code==="KeyW"){

keys.forward=false;

}

if(e.code==="KeyS"){

keys.back=false;

}

if(e.code==="KeyA"){

keys.left=false;

}

if(e.code==="KeyD"){

keys.right=false;

}

}

);


function animate(){

requestAnimationFrame(

animate

);


const speed = 0.2;


if(keys.forward){

camera.position.z -= speed;

}


if(keys.back){

camera.position.z += speed;

}


if(keys.left){

camera.position.x -= speed;

}


if(keys.right){

camera.position.x += speed;

}


renderer.render(

scene,
camera

);

}


animate();


window.addEventListener(

"resize",

()=>{

camera.aspect =

window.innerWidth /
window.innerHeight;


camera.updateProjectionMatrix();


renderer.setSize(

window.innerWidth,
window.innerHeight

);

}

);

</script>

</body>
</html>
