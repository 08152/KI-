<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ULTIMATE FPS ENGINE</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87cfff;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    width:16px;
    height:16px;
    transform:translate(-50%,-50%);
    z-index:20;
    pointer-events:none;
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 0 3px black;
}

#crosshair:before{
    width:2px;
    height:16px;
    left:7px;
}

#crosshair:after{
    width:16px;
    height:2px;
    top:7px;
}

#status{
    position:fixed;
    left:10px;
    top:10px;
    z-index:30;
    color:white;
    background:rgba(0,0,0,.7);
    padding:9px 12px;
    border-radius:7px;
    font:13px monospace;
    max-width:80%;
}

#coords{
    position:fixed;
    right:10px;
    bottom:10px;
    z-index:30;
    color:white;
    background:rgba(0,0,0,.55);
    padding:8px;
    border-radius:7px;
    white-space:pre;
    font:12px monospace;
}

#health{
    position:fixed;
    left:10px;
    bottom:10px;
    width:220px;
    height:20px;
    border:2px solid white;
    background:#222;
    z-index:30;
}

#healthFill{
    width:100%;
    height:100%;
    background:#20d84b;
}

#hitmarker{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:38px;
    display:none;
    z-index:40;
    pointer-events:none;
}

#chatBox{
    position:fixed;
    left:10px;
    bottom:50px;
    width:300px;
    display:none;
    flex-direction:column;
    z-index:50;
}

#chatLog{
    height:120px;
    overflow:auto;
    background:rgba(0,0,0,.65);
    color:white;
    padding:6px;
    font:12px monospace;
}

#chatInput{
    border:0;
    outline:0;
    padding:8px;
}
</style>
</head>

<body>

<div id="status">⏳ Lade weapon.glb...</div>
<div id="crosshair"></div>
<div id="hitmarker">✖</div>

<div id="coords"></div>

<div id="health">
    <div id="healthFill"></div>
</div>

<div id="chatBox">
    <div id="chatLog"></div>
    <input id="chatInput" placeholder="Command...">
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>

/* =========================================================
   CORE ENGINE
========================================================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x87cfff);


/* CAMERA */

const camera =
    new THREE.PerspectiveCamera(
        75,
        innerWidth / innerHeight,
        0.1,
        5000
    );


/* RENDERER */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LIGHT
========================================================= */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        1.4
    )
);

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sun.position.set(
    20,
    30,
    10
);

scene.add(sun);


/* =========================================================
   GROUND
========================================================= */

const grassTexture =
    new THREE.TextureLoader().load(
        "https://threejs.org/examples/textures/terrain/grasslight-big.jpg"
    );

grassTexture.wrapS =
    THREE.RepeatWrapping;

grassTexture.wrapT =
    THREE.RepeatWrapping;

grassTexture.repeat.set(
    100,
    100
);

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            5000,
            5000
        ),
        new THREE.MeshStandardMaterial({
            map:grassTexture
        })
    );

ground.rotation.x =
    -Math.PI / 2;

scene.add(ground);


/* =========================================================
   PLAYER
========================================================= */

const player =
    new THREE.Object3D();

scene.add(player);

player.add(camera);

camera.position.set(
    0,
    2.2,
    0
);

let velY = 0;
let onGround = true;
let health = 100;


/* =========================================================
   INPUT
========================================================= */

const keys = {};

let yaw = 0;
let pitch = 0;
let chatOpen = false;

window.addEventListener(
    "keydown",
    e => {

        keys[e.key.toLowerCase()] = true;

        if(e.code === "Space"){
            e.preventDefault();
            jump();
        }

        if(e.key.toLowerCase() === "t"){
            openChat();
        }

    }
);

window.addEventListener(
    "keyup",
    e => {
        keys[e.key.toLowerCase()] = false;
    }
);


/* =========================================================
   POINTER LOCK
========================================================= */

document.body.addEventListener(
    "click",
    () => {

        if(!chatOpen){

            document.body.requestPointerLock();

        }

    }
);


/* =========================================================
   MOUSE LOOK
========================================================= */

document.addEventListener(
    "mousemove",
    e => {

        if(
            document.pointerLockElement !== document.body ||
            chatOpen
        ){
            return;
        }

        yaw -= e.movementX * 0.002;

        pitch -= e.movementY * 0.002;

        pitch =
            Math.max(
                -1.2,
                Math.min(1.2,pitch)
            );

        player.rotation.y = yaw;

        camera.rotation.x = pitch;

    }
);


/* =========================================================
   MOVEMENT
========================================================= */

function move(){

    const speed = 0.15;

    let dir =
        new THREE.Vector3();

    if(keys["w"])
        dir.z -= 1;

    if(keys["s"])
        dir.z += 1;

    if(keys["a"])
        dir.x -= 1;

    if(keys["d"])
        dir.x += 1;

    if(dir.lengthSq() === 0)
        return;

    dir.normalize();


    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        ).applyEuler(
            player.rotation
        );

    forward.y = 0;
    forward.normalize();


    const right =
        new THREE.Vector3()
        .crossVectors(
            forward,
            new THREE.Vector3(0,1,0)
        )
        .negate();


    player.position.addScaledVector(
        forward,
        dir.z * speed
    );

    player.position.addScaledVector(
        right,
        dir.x * speed
    );

}


/* =========================================================
   JUMP
========================================================= */

function jump(){

    if(!onGround)
        return;

    velY = 0.25;

    onGround = false;

}


/* =========================================================
   GRAVITY
========================================================= */

function gravity(){

    velY -= 0.015;

    player.position.y += velY;

    if(player.position.y <= 0){

        player.position.y = 0;

        velY = 0;

        onGround = true;

    }

}


/* =========================================================
   WEAPON
========================================================= */

const loader =
    new THREE.GLTFLoader();

let weapon = null;

let weaponBaseX = 0.55;
let weaponBaseY = -0.55;
let weaponBaseZ = -1.5;

let recoil = 0;
let shooting = false;


/* =========================================================
   WEAPON.GLB AUTOMATISCH LADEN
========================================================= */

const weaponURL =
    new URL(
        "./weapon.glb",
        window.location.href
    ).href;

console.log(
    "WEAPON URL:",
    weaponURL
);


loader.load(

    weaponURL,

    function(gltf){

        console.log(
            "================================"
        );

        console.log(
            "✅ weapon.glb GELADEN"
        );

        console.log(
            gltf
        );

        console.log(
            "================================"
        );


        weapon =
            gltf.scene;


        /* =================================================
           ALLE MESHES SICHTBAR MACHEN
        ================================================= */

        weapon.traverse(
            function(obj){

                if(obj.isMesh){

                    obj.frustumCulled = false;

                    obj.visible = true;

                    if(obj.material){

                        obj.material.needsUpdate = true;

                    }

                }

            }
        );


        /* =================================================
           MODELL VOR DEM POSITIONIEREN ZENTRIEREN
        ================================================= */

        const originalBox =
            new THREE.Box3()
            .setFromObject(weapon);

        const originalCenter =
            new THREE.Vector3();

        originalBox.getCenter(
            originalCenter
        );

        weapon.position.sub(
            originalCenter
        );


        /* =================================================
           AUTOMATISCHE SKALIERUNG
        ================================================= */

        const size =
            new THREE.Vector3();

        originalBox.getSize(
            size
        );

        const maxSize =
            Math.max(
                size.x,
                size.y,
                size.z
            );


        if(maxSize > 0){

            const targetSize = 2.0;

            const scale =
                targetSize / maxSize;

            weapon.scale.set(
                scale,
                scale,
                scale
            );

        }


        /* =================================================
           NACH SCALE ERNEUT ZENTRIEREN
        ================================================= */

        const scaledBox =
            new THREE.Box3()
            .setFromObject(weapon);

        const scaledCenter =
            new THREE.Vector3();

        scaledBox.getCenter(
            scaledCenter
        );

        weapon.position.sub(
            scaledCenter
        );


        /* =================================================
           FIRST PERSON POSITION
        ================================================= */

        weapon.position.set(
            weaponBaseX,
            weaponBaseY,
            weaponBaseZ
        );


        /* =================================================
           ROTATION
        ================================================= */

        weapon.rotation.set(
            0,
            Math.PI,
            0
        );


        /* =================================================
           KAMERA
        ================================================= */

        camera.add(
            weapon
        );


        document.getElementById(
            "status"
        ).textContent =
            "✅ weapon.glb sichtbar geladen";


        console.log(
            "Originalgröße:",
            size
        );

        console.log(
            "Scale:",
            weapon.scale
        );

        console.log(
            "Position:",
            weapon.position
        );

    },

    function(progress){

        document.getElementById(
            "status"
        ).textContent =
            "⏳ weapon.glb lädt...";

    },

    function(error){

        console.error(
            "================================"
        );

        console.error(
            "❌ weapon.glb FEHLER"
        );

        console.error(
            error
        );

        console.error(
            "URL:",
            weaponURL
        );

        console.error(
            "================================"
        );

        document.getElementById(
            "status"
        ).textContent =
            "❌ weapon.glb Fehler";

    }

);


/* =========================================================
   SCHUSS
========================================================= */

function shoot(){

    if(shooting)
        return;

    shooting = true;

    recoil = 0.22;


    /* MUZZLE FLASH */

    const flash =
        new THREE.PointLight(
            0xffaa33,
            10,
            4
        );

    flash.position.set(
        0,
        0,
        -1
    );

    camera.add(flash);

    setTimeout(
        () => {

            camera.remove(
                flash
            );

        },
        50
    );


    /* TRACER */

    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    direction.applyQuaternion(
        camera.quaternion
    );


    const start =
        camera.getWorldPosition(
            new THREE.Vector3()
        );

    const end =
        start.clone()
        .add(
            direction.multiplyScalar(100)
        );


    const geometry =
        new THREE.BufferGeometry()
        .setFromPoints([
            start,
            end
        ]);


    const material =
        new THREE.LineBasicMaterial({
            color:0xffff00
        });


    const tracer =
        new THREE.Line(
            geometry,
            material
        );

    scene.add(tracer);


    setTimeout(
        () => {

            scene.remove(
                tracer
            );

            geometry.dispose();

            material.dispose();

        },
        50
    );


    checkShoot();


    setTimeout(
        () => {

            shooting = false;

        },
        100
    );

}


window.addEventListener(
    "mousedown",
    e => {

        if(
            e.button === 0 &&
            !chatOpen
        ){

            shoot();

        }

    }
);


/* =========================================================
   ENEMIES
========================================================= */

const enemies = [];


function addEnemy(
    x,
    y,
    z
){

    const enemy =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1,
                2,
                1
            ),
            new THREE.MeshStandardMaterial({
                color:0xff2222
            })
        );

    enemy.position.set(
        x,
        y,
        z
    );

    enemy.health = 100;

    scene.add(enemy);

    enemies.push(enemy);

}


addEnemy(
    5,
    1,
    -20
);

addEnemy(
    -3,
    1,
    -15
);

addEnemy(
    8,
    1,
    -35
);


/* =========================================================
   HIT CHECK
========================================================= */

const raycaster =
    new THREE.Raycaster();


function checkShoot(){

    raycaster.setFromCamera(
        new THREE.Vector2(0,0),
        camera
    );

    const hits =
        raycaster.intersectObjects(
            enemies,
            false
        );

    if(!hits.length)
        return;


    const enemy =
        hits[0].object;

    enemy.health -= 25;


    const marker =
        document.getElementById(
            "hitmarker"
        );

    marker.style.display =
        "block";

    setTimeout(
        () => {

            marker.style.display =
                "none";

        },
        100
    );


    if(enemy.health <= 0){

        scene.remove(enemy);

        const index =
            enemies.indexOf(enemy);

        if(index !== -1){

            enemies.splice(
                index,
                1
            );

        }

    }

}


/* =========================================================
   BARRIERS
========================================================= */

const barriers = [];


function addBarrier(
    x,
    y,
    z,
    scale = 1
){

    loader.load(
        "./barrier.glb",

        function(gltf){

            const obj =
                gltf.scene.clone();

            obj.scale.set(
                scale,
                scale,
                scale
            );

            obj.position.set(
                x,
                y,
                z
            );

            scene.add(obj);

            barriers.push(obj);

        },

        undefined,

        function(error){

            console.warn(
                "barrier.glb nicht geladen",
                error
            );

        }
    );

}


function placeBarrier(){

    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        ).applyEuler(
            player.rotation
        );


    addBarrier(

        player.position.x +
        direction.x * 3,

        0,

        player.position.z +
        direction.z * 3,

        1

    );

}


/* =========================================================
   CHAT
========================================================= */

const chatBox =
    document.getElementById(
        "chatBox"
    );

const chatInput =
    document.getElementById(
        "chatInput"
    );

const chatLog =
    document.getElementById(
        "chatLog"
    );


function openChat(){

    chatOpen =
        !chatOpen;

    chatBox.style.display =
        chatOpen
        ? "flex"
        : "none";


    if(chatOpen){

        document.exitPointerLock();

        setTimeout(
            () => {

                chatInput.focus();

            },
            50
        );

    }

}


function log(msg){

    chatLog.innerHTML +=
        msg + "<br>";

    chatLog.scrollTop =
        chatLog.scrollHeight;

}


chatInput.addEventListener(
    "keydown",
    e => {

        if(e.key !== "Enter")
            return;

        handleCommand(
            chatInput.value
        );

        chatInput.value = "";

    }
);


/* =========================================================
   COMMANDS
========================================================= */

function handleCommand(cmd){

    cmd =
        cmd.trim()
        .toLowerCase();


    if(cmd === "/save"){

        saveGame();

        log(
            "Saved ✔"
        );

        return;

    }


    if(cmd === "/place barrier"){

        placeBarrier();

        log(
            "Barrier placed ✔"
        );

        return;

    }


    if(cmd === "/help"){

        log(
            "/save /place barrier /help"
        );

        return;

    }


    log(
        "Unknown: " + cmd
    );

}


/* =========================================================
   SAVE
========================================================= */

function saveGame(){

    const html =
        "<!DOCTYPE html>\n" +
        document.documentElement.outerHTML;

    const blob =
        new Blob(
            [html],
            {
                type:"text/html"
            }
        );

    const url =
        URL.createObjectURL(
            blob
        );

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        "ultimate-fps.html";

    a.click();

    setTimeout(
        () => {

            URL.revokeObjectURL(
                url
            );

        },
        1000
    );

}


/* =========================================================
   GAME UPDATE
========================================================= */

function updateGame(){

    move();

    gravity();


    /* WEAPON RECOIL */

    if(weapon){

        if(recoil > 0){

            weapon.position.z =
                weaponBaseZ +
                recoil;

            weapon.rotation.x =
                recoil * 0.35;

            recoil *= 0.72;

        }
        else{

            weapon.position.z +=
                (
                    weaponBaseZ -
                    weapon.position.z
                ) * 0.25;

            weapon.rotation.x +=
                (
                    0 -
                    weapon.rotation.x
                ) * 0.25;

        }

    }


    /* CAMERA HEIGHT */

    camera.position.y +=
        (
            2.2 +
            player.position.y -
            camera.position.y
        ) * 0.15;


    /* COORDS */

    const dir =
        new THREE.Vector3(
            0,
            0,
            -1
        ).applyEuler(
            player.rotation
        );


    document.getElementById(
        "coords"
    ).textContent =

`X: ${player.position.x.toFixed(2)}
Y: ${player.position.y.toFixed(2)}
Z: ${player.position.z.toFixed(2)}

DIR X: ${dir.x.toFixed(2)}
DIR Z: ${dir.z.toFixed(2)}`;


    document.getElementById(
        "healthFill"
    ).style.width =
        health + "%";

}


/* =========================================================
   MAIN LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    updateGame();

    renderer.render(
        scene,
        camera
    );

}

animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>

</body>
</html>
