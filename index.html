<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Springtrap 3D Mesh - GitHub Showcase</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0b0f0b;
            font-family: 'Courier New', Courier, monospace;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #39ff14;
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.6);
            pointer-events: none;
            z-index: 10;
        }
        h1 { 
            margin: 0 0 5px 0; 
            font-size: 22px; 
            letter-spacing: 2px;
        }
        p { 
            margin: 0; 
            font-size: 12px; 
            color: #88be88;
        }
    </style>
    <!-- Sichere CDN-Links für maximale GitHub-Kompatibilität -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div id="ui-layer">
        <h1>SPRINGTRAP_MESH // ONLINE</h1>
        <p>● Maus/Touchpad ziehen zum Rotieren</p>
        <p>● Scrollen zum Zoomen</p>
    </div>

    <script>
        // --- 1. Szene & Kamera ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x070a07);
        scene.fog = new THREE.FogExp2(0x070a07, 0.07);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2.5, 4.5);

        // --- 2. WebGL Renderer ---
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Performance-Limit für Chromebooks
        document.body.appendChild(renderer.domElement);

        // --- 3. Steuerung ---
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1; // Kamera kann nicht unter den Boden fliegen
        controls.target.set(0, 1.3, 0);

        // --- 4. Beleuchtung ---
        const ambientLight = new THREE.AmbientLight(0x112211, 1.5);
        scene.add(ambientLight);

        const greenSpot = new THREE.SpotLight(0x39ff14, 5, 15, Math.PI / 4, 0.5, 1);
        greenSpot.position.set(3, 5, 3);
        scene.add(greenSpot);

        const backLight = new THREE.DirectionalLight(0xff3300, 0.8); // Rotes Warnlicht von hinten
        backLight.position.set(-3, 2, -4);
        scene.add(backLight);

        // --- 5. Materialien (Solid + Leuchtendes Gitter/Mesh) ---
        const suitMaterial = new THREE.MeshStandardMaterial({
            color: 0x3d4f28,       // Verrottetes Olivgrün
            roughness: 0.8,
            metalness: 0.3
        });

        const meshOverlayMaterial = new THREE.MeshBasicMaterial({
            color: 0x55ff55,       // Hellgrünes Gitternetz
            wireframe: true,
            transparent: true,
            opacity: 0.35
        });

        // Helfer-Funktion für Bauteile
        function addSuitPart(geometry, position, rotation =, parent = scene) {
            const group = new THREE.Group();
            
            const baseMesh = new THREE.Mesh(geometry, suitMaterial);
            const wireMesh = new THREE.Mesh(geometry, meshOverlayMaterial);
            
            group.add(baseMesh);
            group.add(wireMesh);
            group.position.set(...position);
            group.rotation.set(...rotation);
            
            parent.add(group);
            return group;
        }

        // --- 6. Prozeduraler Springtrap-Anzug ---
        const springtrap = new THREE.Group();

        // Torso & Bauch-Ausschnitt
        const torsoGeo = new THREE.CylinderGeometry(0.5, 0.4, 1.2, 12, 4);
        addSuitPart(torsoGeo, [0, 1.2, 0], [0,0,0], springtrap);

        // Kopf
        const headGeo = new THREE.SphereGeometry(0.38, 12, 12);
        headGeo.scale(1, 1.1, 0.9);
        const head = addSuitPart(headGeo, [0, 2.05, 0], [0,0,0], springtrap);

        // Kiefer / Schnauze
        const jawGeo = new THREE.BoxGeometry(0.35, 0.15, 0.25, 4, 2, 2);
        addSuitPart(jawGeo, [0, -0.15, 0.2], [0,0,0], head);

        // Ohren (Das rechte ist lang, das linke abgebrochen)
        const earSegmentGeo = new THREE.CylinderGeometry(0.06, 0.07, 0.35, 6, 2);
        
        // Rechtes Ohr (Komplett)
        const earR1 = addSuitPart(earSegmentGeo, [0.18, 0.45, 0], [0, 0, -0.1], head);
        addSuitPart(earSegmentGeo, [0, 0.3, 0], [0, 0, -0.1], earR1);

        // Linkes Ohr (Zerstörter Stumpf)
        const earL1 = addSuitPart(earSegmentGeo, [-0.18, 0.42, 0], [0, 0, 0.1], head);
        const stubGeo = new THREE.CylinderGeometry(0.02, 0.06, 0.1, 4, 1);
        addSuitPart(stubGeo, [-0.02, 0.2, 0], [0, 0, 0.2], earL1);

        // Arme (Schultern & Unterarme)
        const armGeo = new THREE.CylinderGeometry(0.14, 0.12, 0.5, 8, 3);
        
        const leftArm = addSuitPart(armGeo, [-0.7, 1.5, 0], [0, 0, 0.5], springtrap);
        addSuitPart(armGeo, [0, -0.4, 0.1], [0.3, 0, 0], leftArm);

        const rightArm = addSuitPart(armGeo, [0.7, 1.5, 0], [0, 0, -0.5], springtrap);
        addSuitPart(armGeo, [0, -0.4, 0.1], [0.3, 0, 0], rightArm);

        // Beine
        const legGeo = new THREE.CylinderGeometry(0.16, 0.14, 0.6, 8, 3);
        
        const leftLeg = addSuitPart(legGeo, [-0.25, 0.4, 0], [0, 0, 0.05], springtrap);
        addSuitPart(legGeo, [0, -0.5, 0], [-0.1, 0, 0], leftLeg);

        const rightLeg = addSuitPart(legGeo, [0.25, 0.4, 0], [0, 0, -0.05], springtrap);
        addSuitPart(legGeo, [0, -0.5, 0], [-0.1, 0, 0], rightLeg);

        scene.add(springtrap);

        // --- 7. Boden-Gitter ---
        const grid = new THREE.GridHelper(16, 16, 0x1f3d1f, 0x0d1a0d);
        grid.position.y = -0.4;
        scene.add(grid);

        // --- 8. Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const time = clock.getElapsedTime();
            
            // Subtiles mechanisches "Zittern" und langsame Rotation
            springtrap.rotation.y = Math.sin(time * 0.15) * 0.25;
            head.rotation.y = Math.sin(time * 0.8) * 0.08;
            head.rotation.x = (Math.cos(time * 0.5) * 0.05) + 0.05;

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- 9. Fenster-Resize-Management ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
