<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Offline Chat Hub</title>
    <style>
        :root {
            --gemini-gradient: linear-gradient(135deg, #4285f4 0%, #9b51e0 50%, #e051b8 100%);
            --bg-color: #f8fafd;
            --card-bg: #ffffff;
            --text-main: #1f1f1f;
            --text-sub: #5f6368;
            --border-color: #dadce0;
            --accent-blue: #1a73e8;
            --active-blue: #e8f0fe;
        }

        body { font-family: 'Segoe UI', -apple-system, sans-serif; background-color: var(--bg-color); margin: 0; padding: 24px; color: var(--text-main); }
        .container { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; height: calc(100vh - 48px); }
        
        header { margin-bottom: 20px; }
        h1 { font-size: 26px; font-weight: 400; margin: 0; background: var(--gemini-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* Extrem stabiles Upload-Feld */
        .upload-bar { background: var(--card-bg); border: 2px dashed var(--border-color); border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 20px; }
        .upload-bar p { margin: 0 0 10px 0; font-size: 14px; color: var(--text-sub); }
        
        /* Sichtbarer, klassischer Button für maximalen Erfolg beim Klicken */
        .real-upload-btn { background: #f1f3f4; color: var(--text-main); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13.5px; font-weight: 500; }
        .real-upload-btn:hover { background: #e8eaed; }
        
        input[type="file"] { display: block; margin: 10px auto 0 auto; font-size: 13px; }

        .chat-window { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 24px; padding: 24px; flex-grow: 1; display: flex; flex-direction: column; box-shadow: 0 2px 6px rgba(0,0,0,0.02); overflow: hidden; }
        .chat-container { flex-grow: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 16px; margin-bottom: 16px; }
        
        .chat-message { max-width: 80%; padding: 14px 18px; border-radius: 18px; font-size: 14.5px; line-height: 1.6; word-break: break-word; }
        .user-message { background: #e3f2fd; color: #0d47a1; align-self: flex-end; border-bottom-right-radius: 4px; }
        .gemini-message { background: #f1f3f4; color: var(--text-main); align-self: flex-start; border-bottom-left-radius: 4px; }

        .chat-input-wrapper { display: flex; gap: 12px; align-items: center; position: relative; }
        .chat-input-wrapper input { flex-grow: 1; padding: 14px 20px; border: 1px solid var(--border-color); border-radius: 100px; outline: none; font-size: 15px; }
        .chat-input-wrapper input:focus { border-color: var(--accent-blue); }
        
        .ask-btn { background: var(--accent-blue); color: white; border: none; padding: 14px 28px; border-radius: 100px; cursor: pointer; font-weight: 500; font-size: 15px; }
        .ask-btn:hover { background: #1557b0; }
        .ask-btn:disabled { background: #cbd5e1; cursor: not-allowed; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Gemini Space Knowledge Chat</h1>
    </header>

    <!-- Der neue, sichere Upload-Bereich -->
    <div class="upload-bar" id="dropZone">
        <p id="uploadPrompt">Wähle deine <strong>1.json</strong>-Datei über das Feld aus, um dein Wissen zu aktivieren:</p>
        <!-- Direkter, unmaskierter HTML-Datei-Auswähler für 100% Erfolgsgarantie -->
        <input type="file" id="uploadInput" accept=".json" onchange="handleFileSelect(this)">
    </div>

    <div class="chat-window">
        <div class="chat-container" id="chatContainer">
            <div class="chat-message gemini-message">
                Hallo! Bitte wähle oben über den Button deine <strong>1.json</strong> aus. Sobald das erledigt ist, können wir sofort loslegen!
            </div>
        </div>
        <div class="chat-input-wrapper">
            <input type="text" id="questionInput" disabled placeholder="Bitte zuerst die 1.json oben hochladen...">
            <button id="askBtn" class="ask-btn" disabled onclick="askQuestion()">Senden</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
