
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Block World 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial}
#menu{
position:fixed;inset:0;z-index:5;
display:flex;flex-direction:column;
align-items:center;justify-content:center;
background:#0009;color:white
}
h1{font-size:48px;text-shadow:4px 4px #222}
button{padding:15px 60px;font-size:20px;cursor:pointer}
#cross{position:fixed;left:50%;top:50%;color:white;font-size:25px;z-index:3}
#info{position:fixed;top:10px;left:10px;color:white;background:#0008;padding:10px;z-index:3}
</style>
</head>
<body>

<div id="menu">
<h1>BLOCK WORLD</h1>
<button id="start">Spielen</button>
</div>

<div id="cross">+</div>
<div id="info">WASD · Maus · Leertaste</div>

<script type="importmap">
{
"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}
}
</script>

<script type="module">
import * as THREE from "three";
import {PointerLockControls} from "three/addons/controls/PointerLockControls.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,15,45);

const camera=new THREE.PerspectiveCamera(
75,innerWidth/innerHeight,.1,1000
);

const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

const controls=new PointerLockControls(camera,document.body);
const menu=document.getElementById("menu");

document.getElementById("start").onclick=()=>{
controls.lock();
};

controls.addEventListener("lock",()=>{
menu.style.display="none";
});

controls.addEventListener("unlock",()=>{
menu.style.display="flex";
});

scene.add(new THREE.HemisphereLight(0xffffff,0x555555,2));

const light=new THREE.DirectionalLight(0xffffff,2);
light.position.set(20,40,10);
scene.add(light);

function pixelTexture(base,detail){
const c=document.createElement("canvas");
c.width=16;c.height=16;
const ctx=c.getContext("2d");
ctx.fillStyle=base;
ctx.fillRect(0,0,16,16);

for(let i=0;i<45;i++){
ctx.fillStyle=Math.random()>.5?detail:"#00000022";
ctx.fillRect(
Math.floor(Math.random()*16),
Math.floor(Math.random()*16),1,1
);
}

const t=new THREE.CanvasTexture(c);
t.magFilter=THREE.NearestFilter;
t.minFilter=THREE.NearestFilter;
return t;
}

const materials={
grass:new THREE.MeshLambertMaterial({
map:pixelTexture("#55a832","#347c25")
}),
dirt:new THREE.MeshLambertMaterial({
map:pixelTexture("#80532f","#59351f")
}),
stone:new THREE.MeshLambertMaterial({
map:pixelTexture("#858585","#555555")
})
};

const geometry=new THREE.BoxGeometry(1,1,1);
const blocks=new Map();
const objects=[];

function blockKey(x,y,z){
return `${x},${y},${z}`;
}

function addBlock(x,y,z,type){
blocks.set(blockKey(x,y,z),type);
}

function generateWorld(){
for(let x=-16;x<16;x++){
for(let z=-16;z<16;z++){

const height=5+
Math.floor(
Math.sin(x*.3)+Math.cos(z*.25)
);

for(let y=0;y<=height;y++){
let type="stone";

if(y===height)type="grass";
else if(y>height-3)type="dirt";

addBlock(x,y,z,type);

const cube=new THREE.Mesh(
geometry,materials[type]
);

cube.position.set(x,y,z);
scene.add(cube);
objects.push(cube);
}
}
}
}

generateWorld();
camera.position.set(0,14,0);

const keys={};
let velocityY=0;
let grounded=false;

addEventListener("keydown",e=>{
keys[e.code]=true;

if(e.code==="Space"&&grounded){
velocityY=7;
grounded=false;
}
});

addEventListener("keyup",e=>{
keys[e.code]=false;
});

function collision(){
const x=Math.floor(camera.position.x);
const y=Math.floor(camera.position.y-1.7);
const z=Math.floor(camera.position.z);

return blocks.has(blockKey(x,y,z));
}

let last=performance.now();

function animate(now){
requestAnimationFrame(animate);

const dt=Math.min((now-last)/1000,.05);
last=now;

if(controls.isLocked){

const speed=5;

if(keys.KeyW)controls.moveForward(speed*dt);
if(keys.KeyS)controls.moveForward(-speed*dt);
if(keys.KeyA)controls.moveRight(-speed*dt);
if(keys.KeyD)controls.moveRight(speed*dt);

velocityY-=20*dt;
camera.position.y+=velocityY*dt;

if(collision()){
if(velocityY<0){
camera.position.y=Math.floor(camera.position.y-1.7)+2.7;
grounded=true;
}
velocityY=0;
}else{
grounded=false;
}

if(camera.position.y<0){
camera.position.set(0,14,0);
velocityY=0;
}
}

renderer.render(scene,camera);
}

animate(performance.now());

addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
