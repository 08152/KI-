<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Voxel World + GLB Fix</title>

<style>
body { margin:0; overflow:hidden; }
canvas { display:block; }
</style>
</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>

<script>

let scene, camera, renderer, loader;
let treeModel = null;

init();
animate();

function init() {

scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);

camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0, 8, 15);

renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// LIGHT
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(10, 20, 10);
scene.add(light);

loader = new THREE.GLTFLoader();

// ===================== FIX: LOAD GLB ONCE =====================
loader.load("baum.glb",
(gltf) => {
treeModel = gltf.scene;
console.log("GLB loaded ✔");
},
undefined,
(err) => {
console.error("GLB ERROR:", err);
}
);

// ===================== GRASS TEXTURE =====================
const tex = createGrass();
const mat = new THREE.MeshLambertMaterial({ map: tex });
const geo = new THREE.BoxGeometry(1,1,1);

// ===================== WORLD =====================
for (let x = -20; x < 20; x++) {
for (let z = -20; z < 20; z++) {

const h =
Math.floor(Math.sin(x * 0.2) * 2 +
Math.cos(z * 0.2) * 2);

for (let y = 0; y <= h; y++) {
const cube = new THREE.Mesh(geo, mat);
cube.position.set(x, y, z);
scene.add(cube);
}

// trees
if (Math.random() < 0.03) {
spawnTree(x, h + 1, z);
}

}
}

// ===================== CONTROLS =====================
document.body.addEventListener("click", () => {
document.body.requestPointerLock();
});

let rotX = 0, rotY = 0;

document.addEventListener("mousemove", (e) => {
if (document.pointerLockElement !== document.body) return;

rotY -= e.movementX * 0.002;
rotX -= e.movementY * 0.002;

rotX = Math.max(-1.5, Math.min(1.5, rotX));

camera.rotation.x = rotX;
camera.rotation.y = rotY;
});

// ===================== MOVEMENT =====================
let keys = {};

document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

function move() {
requestAnimationFrame(move);

let speed = 0.2;

let forward = new THREE.Vector3(
Math.sin(camera.rotation.y),
0,
Math.cos(camera.rotation.y)
);

let right = new THREE.Vector3(
Math.sin(camera.rotation.y + Math.PI/2),
0,
Math.cos(camera.rotation.y + Math.PI/2)
);

if (keys["w"]) camera.position.addScaledVector(forward, -speed);
if (keys["s"]) camera.position.addScaledVector(forward, speed);
if (keys["a"]) camera.position.addScaledVector(right, -speed);
if (keys["d"]) camera.position.addScaledVector(right, speed);

renderer.render(scene, camera);
}

move();

window.addEventListener("resize", () => {
camera.aspect = innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth, innerHeight);
});

}

// ===================== FIXED TREE SPAWN =====================
function spawnTree(x, y, z) {

if (!treeModel) return; // IMPORTANT FIX

const tree = treeModel.clone();

tree.position.set(x, y, z);
tree.scale.set(1,1,1);

scene.add(tree);
}

// ===================== GRASS TEXTURE =====================
function createGrass() {
const c = document.createElement("canvas");
c.width = 64;
c.height = 64;
const ctx = c.getContext("2d");

ctx.fillStyle = "#3cb043";
ctx.fillRect(0,0,64,64);

for (let i=0;i<400;i++) {
ctx.fillStyle = `rgb(0,${100+Math.random()*100},0)`;
ctx.fillRect(Math.random()*64, Math.random()*64, 2, 2);
}

return new THREE.CanvasTexture(c);
}

</script>

</body>
</html>
