<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>3D-Visualisierung: Magazin-Modell</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 overflow:hidden;
 background:#1a1a1a;
 touch-action:none;
}
canvas{display:block}
#info{
 position:fixed;
 top:15px;
 left:50%;
 transform:translateX(-50%);
 background:#000b;
 color:white;
 padding:12px 18px;
 border-radius:8px;
 font:16px Arial;
 z-index:2;
 text-align:center;
}
</style>
</head>
<body>

<div id="info">📐 3D-Visualisierung: Magazin-Komponenten<br><small>Ziehen zum Drehen | Scrollen zum Zoomen</small></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1a);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 5, 25);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// Lichtquellen für bessere räumliche Tiefe
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight1.position.set(5, 10, 7);
scene.add(dirLight1);
const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
dirLight2.position.set(-5, -5, -5);
scene.add(dirLight2);

// Hauptgruppe für die Rotation
const magazinGruppe = new THREE.Group();
scene.add(magazinGruppe);

// Materialien
const metallMaterial = new THREE.MeshStandardMaterial({
    color: 0x333333,
    roughness: 0.5,
    metalness: 0.8
});
const federMaterial = new THREE.MeshStandardMaterial({
    color: 0x888888,
    roughness: 0.3,
    metalness: 0.9,
    wireframe: true
});
const zubringerMaterial = new THREE.MeshStandardMaterial({
    color: 0x555555,
    roughness: 0.6,
    metalness: 0.2
});

// 1. Gehäuse (Gekrümmte Form über Extrusion entlang eines Pfades angedeutet)
const xBreite = 1.3, yTiefe = 3.2; // Proportionen angelehnt an Originalmaße im Maßstab
const magazinForm = new THREE.Shape();
magazinForm.moveTo(-xBreite/2, -yTiefe/2);
magazinForm.lineTo(xBreite/2, -yTiefe/2);
magazinForm.lineTo(xBreite/2, yTiefe/2);
magazinForm.lineTo(-xBreite/2, yTiefe/2);
magazinForm.lineTo(-xBreite/2, -yTiefe/2);

const extrudeSettings = {
    steps: 20,
    depth: 10,
    bevelEnabled: true,
    bevelThickness: 0.1,
    bevelSize: 0.05,
    bevelSegments: 3
};

const gehaeuseGeo = new THREE.ExtrudeGeometry(magazinForm, extrudeSettings);
// Gehäuse leicht krümmen/kippen zur typischen Banasenform
gehaeuseGeo.translate(0, 0, -5);
const gehaeuseMesh = new THREE.Mesh(gehaeuseGeo, metallMaterial);
gehaeuseMesh.rotation.x = Math.PI / 2;
gehaeuseMesh.position.y = -5;
magazinGruppe.add(gehaeuseMesh);

// 2. Magazinboden (Floor Plate)
const bodenGeo = new THREE.BoxGeometry(1.6, 0.2, 3.6);
const bodenMesh = new THREE.Mesh(bodenGeo, metallMaterial);
bodenMesh.position.set(0, -5.1, 0.2);
magazinGruppe.add(bodenMesh);

// 3. Interne Feder (Visualisiert als Helix/Spirale)
const federGruppe = new THREE.Group();
const windungen = 12;
const punkteProWindung = 30;
const federPunkte = [];
for (let i = 0; i < windungen * punkteProWindung; i++) {
    const t = i / punkteProWindung;
    const winkel = t * Math.PI * 2;
    const x = Math.sin(winkel) * 0.4;
    const y = (i / (windungen * punkteProWindung)) * 9 - 4.8;
    const z = Math.cos(winkel) * 1.0;
    federPunkte.push(new THREE.Vector3(x, y, z));
}
const federKurve = new THREE.CatmullRomCurve3(federPunkte);
const federGeo = new THREE.TubeGeometry(federKurve, 200, 0.04, 8, false);
const federMesh = new THREE.Mesh(federGeo, federMaterial);
magazinGruppe.add(federMesh);

// 4. Zubringer (Follower - sitzt oben auf der Feder)
const zubringerGeo = new THREE.BoxGeometry(1.1, 0.5, 2.8);
const zubringerMesh = new THREE.Mesh(zubringerGeo, zubringerMaterial);
zubringerMesh.position.set(0, 4.4, 0);
magazinGruppe.add(zubringerMesh);

// Zentriere die Gruppe in der Szene
magazinGruppe.position.y = 0;

// Interaktion: Drehen mit Maus und Touch
let dragging = false;
let lastX = 0, lastY = 0;

renderer.domElement.addEventListener("pointerdown", e => {
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener("pointermove", e => {
    if (!dragging) return;

    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;

    magazinGruppe.rotation.y += dx * 0.01;
    magazinGruppe.rotation.x += dy * 0.01;

    lastX = e.clientX;
    lastY = e.clientY;
});

renderer.domElement.addEventListener("pointerup", () => { dragging = false; });
renderer.domElement.addEventListener("pointercancel", () => { dragging = false; });

// Zoom-Funktion per Scrollrad hinzufügen
window.addEventListener("wheel", e => {
    camera.position.z += e.deltaY * 0.02;
    camera.position.z = Math.max(5, Math.min(camera.position.z, 50));
});

// Animationsschleife
function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
}
animate();

// Anpassung bei Größenänderung des Fensters
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
