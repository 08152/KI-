<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FPS GLB TEST</title>

<style>
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#87cfff;
font-family:Arial;
}

canvas{
display:block;
}

#crosshair{
position:fixed;
left:50%;
top:50%;
width:16px;
height:16px;
transform:translate(-50%,-50%);
pointer-events:none;
z-index:10;
}

#crosshair:before,
#crosshair:after{
content:"";
position:absolute;
background:white;
box-shadow:0 0 3px black;
}

#crosshair:before{
width:2px;
height:16px;
left:7px;
}

#crosshair:after{
width:16px;
height:2px;
top:7px;
}

#status{
position:fixed;
top:10px;
left:10px;
color:white;
background:#000a;
padding:8px;
z-index:20;
font-family:monospace;
}
</style>
</head>

<body>

<div id="crosshair"></div>
<div id="status">Lade 1.glb...</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>

/* =========================
   SCENE
========================= */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x87cfff);


/* =========================
   CAMERA
========================= */

const camera=new THREE.PerspectiveCamera(
75,
innerWidth/innerHeight,
0.01,
5000
);

camera.position.set(0,2.2,0);


/* =========================
   RENDERER
========================= */

const renderer=new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
innerWidth,
innerHeight
);

renderer.setPixelRatio(
Math.min(devicePixelRatio,2)
);

document.body.appendChild(
renderer.domElement
);


/* =========================
   LIGHT
========================= */

scene.add(
new THREE.HemisphereLight(
0xffffff,
0x445566,
2
)
);

const sun=new THREE.DirectionalLight(
0xffffff,
2
);

sun.position.set(
10,
20,
10
);

scene.add(sun);


/* =========================
   GROUND
========================= */

const ground=new THREE.Mesh(

new THREE.PlaneGeometry(
5000,
5000
),

new THREE.MeshStandardMaterial({
color:0x228822
})

);

ground.rotation.x=-Math.PI/2;

scene.add(ground);


/* =========================
   PLAYER
========================= */

const player=new THREE.Object3D();

scene.add(player);

player.add(camera);


/* =========================
   WEAPON HOLDER
========================= */

/*
   Dieser Container ist direkt
   an der Kamera.

   X:
   + = rechts
   - = links

   Y:
   + = oben
   - = unten

   Z:
   negativ = vor Kamera
*/

const weaponHolder=new THREE.Group();

camera.add(
weaponHolder
);


/*
   GROSS UND RECHTS UNTEN
*/

weaponHolder.position.set(

0.75,   /* rechts */

-0.55,  /* unten */

-1.35   /* vor Kamera */

);


/* =========================
   GLB LOADER
========================= */

const loader=new THREE.GLTFLoader();

let weapon=null;


loader.load(

"./1.glb",

function(gltf){

weapon=gltf.scene;


/* =========================
   MATERIALS SICHTBAR
========================= */

weapon.traverse(function(obj){

if(obj.isMesh){

obj.frustumCulled=false;

if(obj.material){

if(Array.isArray(obj.material)){

obj.material.forEach(function(mat){

mat.side=THREE.DoubleSide;
mat.needsUpdate=true;

});

}else{

obj.material.side=
THREE.DoubleSide;

obj.material.needsUpdate=true;

}

}

}

});


/* =========================
   ORIGINAL BOUNDS
========================= */

weapon.updateMatrixWorld(true);

const box=new THREE.Box3().setFromObject(
weapon
);

const size=new THREE.Vector3();

box.getSize(size);

const center=new THREE.Vector3();

box.getCenter(center);


/* =========================
   ZENTRIEREN
========================= */

weapon.position.set(

-center.x,
-center.y,
-center.z

);


/* =========================
   AUTOMATISCHE SKALIERUNG
========================= */

const largest=Math.max(

size.x,
size.y,
size.z

);


/*
   Das Modell soll etwa
   2 Einheiten groß sein.
*/

const targetSize=2.4;


if(largest>0){

const scale=

targetSize/largest;


/*
   Hier wird die Größe
   automatisch berechnet.
*/

weapon.scale.set(

scale,
scale,
scale

);

}


/* =========================
   ROTATION
========================= */

/*
   Starte mit einer Drehung.

   Wenn das Modell falsch
   herum ist, ändere nur
   diese Werte.
*/

weapon.rotation.set(

0,

Math.PI,

0

);


/* =========================
   HINZUFÜGEN
========================= */

weaponHolder.add(
weapon
);


/* =========================
   STATUS
========================= */

document.getElementById(
"status"
).innerHTML=

"✓ 1.glb geladen<br>"+
"Größe: "+largest.toFixed(2);

console.log(
"GLB geladen",
weapon
);

console.log(
"Originalgröße",
size
);

},

undefined,

function(error){

console.error(error);

document.getElementById(
"status"
).innerHTML=

"❌ Fehler beim Laden von 1.glb";

}

);


/* =========================
   INPUT
========================= */

const keys={};

let yaw=0;

let pitch=0;


window.addEventListener(
"keydown",
function(e){

keys[
e.key.toLowerCase()
]=true;

}
);


window.addEventListener(
"keyup",
function(e){

keys[
e.key.toLowerCase()
]=false;

}
);


document.body.addEventListener(
"click",
function(){

document.body.requestPointerLock();

}
);


document.addEventListener(
"mousemove",
function(e){

if(
document.pointerLockElement
!==document.body
)return;


yaw-=

e.movementX*
0.002;


pitch-=

e.movementY*
0.002;


pitch=Math.max(

-1.2,

Math.min(
1.2,
pitch
)

);


player.rotation.y=yaw;

camera.rotation.x=pitch;

}
);


/* =========================
   MOVEMENT
========================= */

function move(){

const speed=.15;

const dir=new THREE.Vector3();


if(keys["w"])
dir.z-=1;

if(keys["s"])
dir.z+=1;

if(keys["a"])
dir.x-=1;

if(keys["d"])
dir.x+=1;


if(dir.lengthSq()===0)
return;


dir.normalize();


const forward=new THREE.Vector3(
0,
0,
-1
);


forward.applyEuler(
player.rotation
);


forward.y=0;

forward.normalize();


const right=new THREE.Vector3()

.crossVectors(

forward,

new THREE.Vector3(
0,
1,
0
)

)

.negate();


player.position.addScaledVector(

forward,

dir.z*
speed

);


player.position.addScaledVector(

right,

dir.x*
speed

);

}


/* =========================
   ANIMATION
========================= */

function animate(){

requestAnimationFrame(
animate
);


move();


renderer.render(

scene,

camera

);

}


animate();


/* =========================
   RESIZE
========================= */

window.addEventListener(
"resize",
function(){

camera.aspect=

innerWidth/
innerHeight;


camera.updateProjectionMatrix();


renderer.setSize(

innerWidth,

innerHeight

);

}
);

</script>

</body>
</html>
