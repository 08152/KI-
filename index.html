<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Springtrap Mesh Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: #00ff00;
            font-weight: bold;
            text-shadow: 1px 1px 3px #000;
            pointer-events: none;
        }
    </style>
    <!-- Three.js für die 3D-Grafik -->
    <script src="https://cloudflare.com"></script>
    <!-- OrbitControls für die Maus-Steuerung -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div id="info">3D Springtrap Mesh Viewer<br><small>Mit der Maus ziehen zum Drehen | Scrollen zum Zoomen</small></div>

    <script>
        // 1. Szene, Kamera und Renderer aufsetzen
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        scene.fog = new THREE.FogExp2(0x1a1a1a, 0.05);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 2. Steuerung (Kompatibel mit Touchpad, Maus und Touchscreen)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 2, 0);

        // 3. Beleuchtung (Düstere FNAF-Atmosphäre)
        const ambientLight = new THREE.AmbientLight(0x333333);
        scene.add(ambientLight);

        const spotLight = new THREE.SpotLight(0x00ff00, 2);
        spotLight.position.set(5, 10, 5);
        spotLight.castShadow = true;
        scene.add(spotLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(-5, 5, -5);
        scene.add(directionalLight);

        // 4. Material für den Anzug (Dunkelgrün, metallisch, mit sichtbarem Gitter/Mesh)
        const armorMaterial = new THREE.MeshStandardMaterial({
            color: 0x4a5d32,       // Springtrap-Grün
            roughness: 0.7,
            metalness: 0.6,
            wireframe: false       // Auf true setzen, wenn NUR das Gittermodell sichtbar sein soll
        });

        // Ein zweites Material, um das Drahtgitter (Mesh) über den Körper zu legen
        const wireframeMaterial = new THREE.MeshBasicMaterial({
            color: 0x00ff00,
            wireframe: true,
            transparent: true,
            opacity: 0.15          // Zeigt das Gitter dezent an
        });

        // 5. Erstellung einer vereinfachten Springtrap-Figur aus Geometrien
        const springtrapGroup = new THREE.Group();

        function createPart(geometry, y, x = 0, z = 0) {
            const mesh = new THREE.Mesh(geometry, armorMaterial);
            const wire = new THREE.Mesh(geometry, wireframeMaterial);
            
            const partGroup = new THREE.Group();
            partGroup.add(mesh);
            partGroup.add(wire);
            partGroup.position.set(x, y, z);
            
            springtrapGroup.add(partGroup);
            return partGroup;
        }

        // Beine
        createPart(new THREE.CylinderGeometry(0.2, 0.2, 1.2), 0.6, -0.4, 0);
        createPart(new THREE.CylinderGeometry(0.2, 0.2, 1.2), 0.6, 0.4, 0);

        // Torso (Körper)
        createPart(new THREE.CylinderGeometry(0.6, 0.5, 1.5, 8), 2, 0, 0);

        // Kopf
        const head = createPart(new THREE.BoxGeometry(0.8, 0.9, 0.8), 3.2, 0, 0);

        // Ohren (Springtraps charakteristische kaputte Ohren)
        createPart(new THREE.CylinderGeometry(0.08, 0.08, 0.6), 3.9, -0.25, 0); // Rechtes Ohr
        createPart(new THREE.CylinderGeometry(0.08, 0.08, 0.3), 3.7, 0.25, 0);  // Linkes Ohr (abgerissen/kurz)

        // Arme
        createPart(new THREE.CylinderGeometry(0.15, 0.15, 1), 2.2, -0.8, 0).rotation.z = 0.2;
        createPart(new THREE.CylinderGeometry(0.15, 0.15, 1), 2.2, 0.8, 0).rotation.z = -0.2;

        scene.add(springtrapGroup);

        // Bodenplatte
        const floorGeo = new THREE.PlaneGeometry(10, 10);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // 6. Animations-Schleife
        function animate() {
            requestAnimationFrame(animate);

            // Langsame automatische Drehung zur Demonstration
            springtrapGroup.rotation.y += 0.005;

            controls.update();
            renderer.render(scene, camera);
        }

        // Fenstergröße automatisch anpassen
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
