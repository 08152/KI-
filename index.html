<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lokaler Video Cutter</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #333; margin-bottom: 20px; }
        .input-group { margin: 20px 0; }
        input[type="file"] { display: none; }
        .custom-file-upload {
            border: 2px dashed #007bff;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-block;
            color: #007bff;
            font-weight: bold;
            transition: 0.3s;
        }
        .custom-file-upload:hover { background: #007bff; color: white; }
        video { width: 100%; margin-top: 15px; border-radius: 8px; background: #000; }
        .time-inputs {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }
        .time-inputs label { display: flex; flex-direction: column; text-align: left; font-size: 14px; color: #555; }
        input[type="number"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-top: 5px;
            width: 80px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            width: 100%;
        }
        button:hover { background-color: #218838; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #status { margin-top: 15px; font-weight: bold; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h1>Video zuschneiden</h1>
    
    <div class="input-group">
        <label class="custom-file-upload">
            <input type="file" id="video-input" accept="video/*">
            📁 Video auswählen
        </label>
        <div id="file-name" style="margin-top: 10px; font-size: 14px; color: #666;"></div>
    </div>

    <video id="video-preview" controls style="display:none;"></video>

    <div class="time-inputs" id="controls-group" style="display:none;">
        <label>
            Start (Sekunden):
            <input type="number" id="start-time" value="0" min="0" step="1">
        </label>
        <label>
            Ende (Sekunden):
            <input type="number" id="end-time" value="10" min="1" step="1">
        </label>
    </div>

    <button id="cut-button" style="display:none;">Video jetzt kürzen</button>
    <div id="status">Initialisiere App... Bitte warten.</div>
</div>

<!-- Nutzt das moderne ESM Modulsystem statt alten unpkg Skript-Tags -->
<script type="module">
    import { FFmpeg } from "https://jsdelivr.net";
    import { toBlobURL } from "https://jsdelivr.net";

    const ffmpeg = new FFmpeg();
    
    const videoInput = document.getElementById('video-input');
    const videoPreview = document.getElementById('video-preview');
    const startTimeInput = document.getElementById('start-time');
    const endTimeInput = document.getElementById('end-time');
    const cutButton = document.getElementById('cut-button');
    const statusDiv = document.getElementById('status');
    const controlsGroup = document.getElementById('controls-group');
    const fileNameDiv = document.getElementById('file-name');

    let videoFile = null;

    // FFmpeg sicher laden
    async function loadFFmpeg() {
        try {
            statusDiv.innerText = "Lade Videowerkzeuge (WASM)...";
            const baseURL = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm';
            
            // Verhindert das CORS/Blockade-Problem im Browser
            await ffmpeg.load({
                coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
                wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
            });
            
            statusDiv.innerText = "Bereit! Bitte wähle ein Video aus.";
        } catch (e) {
            console.error(e);
            statusDiv.innerText = "Fehler beim Laden. Bitte stelle sicher, dass du die Seite über den Node-Server (Render) aufrufst.";
        }
    }

    loadFFmpeg();

    // Video-Auswahl verarbeiten
    videoInput.addEventListener('change', (e) => {
        videoFile = e.target.files[0];
        if (!videoFile) return;

        fileNameDiv.innerText = videoFile.name;
        const blobURL = URL.createObjectURL(videoFile);
        videoPreview.src = blobURL;
        videoPreview.style.display = "block";
        controlsGroup.style.display = "flex";
        cutButton.style.display = "block";

        videoPreview.onloadedmetadata = () => {
            const duration = Math.floor(videoPreview.duration);
            endTimeInput.value = duration;
            endTimeInput.max = duration;
            startTimeInput.max = duration - 1;
        };
    });

    // Schneidevorgang starten
    cutButton.addEventListener('click', async () => {
        if (!videoFile) return;

        const start = parseFloat(startTimeInput.value);
        const end = parseFloat(endTimeInput.value);
        const duration = end - start;

        if (start >= end) {
            alert("Die Startzeit muss vor der Endzeit liegen!");
            return;
        }

        cutButton.disabled = true;
        statusDiv.innerText = "Video wird verarbeitet... Bitte hab einen Moment Geduld.";

        try {
            // Datei einlesen und in das virtuelle System von FFmpeg schreiben
            const inputData = await videoFile.arrayBuffer();
            await ffmpeg.writeFile('input.mp4', new Uint8Array(inputData));

            // Befehl ausführen (-ss für Startzeit, -t für Dauer)
            await ffmpeg.exec(['-ss', start.toString(), '-i', 'input.mp4', '-t', duration.toString(), '-c', 'copy', 'output.mp4']);

            // Ergebnis auslesen
            const outputData = await ffmpeg.readFile('output.mp4');

            // Download anstoßen
            const resultBlob = new Blob([outputData.buffer], { type: 'video/mp4' });
            const resultUrl = URL.createObjectURL(resultBlob);
            
            const downloadAnchor = document.createElement('a');
            downloadAnchor.href = resultUrl;
            downloadAnchor.download = `gekuerzt_${videoFile.name}`;
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            document.body.removeChild(downloadAnchor);

            statusDiv.innerText = "Erfolgreich gekürzt! Der Download gestartet.";
        } catch (error) {
            console.error(error);
            statusDiv.innerText = "Fehler beim Verarbeiten des Videos.";
        } finally {
            cutButton.disabled = false;
        }
    });
</script>

</body>
</html>
