<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ghost Video Player</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

.player{
    width:min(1100px,100%);
    background:#111;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 0 40px #000;
}

.video{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
}

#youtube{
    position:absolute;
    inset:0;
}

iframe{
    width:100%;
    height:100%;
    border:0;
}

.controls{
    height:64px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    background:#151515;
}

button{
    border:0;
    background:#252525;
    color:white;
    border-radius:8px;
    padding:10px 15px;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    background:#333;
}

.title{
    margin-right:auto;
    font-size:14px;
    color:#ddd;
}
</style>
</head>

<body>

<div class="player">

    <div class="video">
        <div id="youtube"></div>
    </div>

    <div class="controls">
        <button onclick="playVideo()">▶</button>
        <button onclick="pauseVideo()">Ⅱ</button>
        <button onclick="stopVideo()">■</button>

        <span class="title">
            Video Player
        </span>

        <button onclick="fullscreen()">⛶</button>
    </div>

</div>

<script>
const VIDEO_ID = "0RTDOUF3If8";

let player;

const script = document.createElement("script");
script.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(script);

function onYouTubeIframeAPIReady(){

    player = new YT.Player("youtube",{
        videoId:VIDEO_ID,

        playerVars:{
            controls:1,
            rel:0,
            modestbranding:1,
            playsinline:1
        }
    });
}

function playVideo(){
    if(player) player.playVideo();
}

function pauseVideo(){
    if(player) player.pauseVideo();
}

function stopVideo(){
    if(player) player.stopVideo();
}

function fullscreen(){

    const iframe = document.querySelector("#youtube iframe");

    if(iframe){
        if(iframe.requestFullscreen){
            iframe.requestFullscreen();
        }
    }
}
</script>

</body>
</html>
