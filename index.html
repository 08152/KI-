<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>MECHA CHAMELEON 3D</title>
<style>
body{margin:0;overflow:hidden;background:#87cfff;font-family:Arial}
#menu{
position:absolute;inset:0;z-index:20;
display:flex;align-items:center;justify-content:center;
background:linear-gradient(#0008,#000b);
color:white;text-align:center
}
#box{
background:#101820ee;padding:40px 60px;border-radius:20px;
box-shadow:0 20px 80px #000;
}
h1{font-size:48px;margin:0 0 10px}
button{
font-size:24px;padding:15px 45px;border:0;border-radius:12px;
background:#36e878;color:#07150c;font-weight:bold;cursor:pointer
}
button:hover{transform:scale(1.05)}
#ui{
position:absolute;top:10px;left:10px;
color:white;background:#0008;padding:12px;
z-index:10;display:none
}
#crosshair{
position:absolute;left:50%;top:50%;
width:20px;height:20px;transform:translate(-50%,-50%);
z-index:5;display:none
}
#crosshair:before,#crosshair:after{
content:"";position:absolute;background:white
}
#crosshair:before{width:20px;height:2px;top:9px}
#crosshair:after{height:20px;width:2px;left:9px}
#paint{
position:absolute;right:20px;bottom:20px;
width:55px;height:55px;border-radius:50%;
background:#ff304f;border:4px solid white;
box-shadow:0 0 20px #ff304f;display:none
}
#end{
position:absolute;inset:0;z-index:30;
display:none;align-items:center;justify-content:center;
background:#000b;color:white;text-align:center
}
</style>
</head>

<body>

<div id="menu">
<div id="box">
<h1>🦎 MECHA CHAMELEON</h1>
<p>Finde die versteckten Menschen und male sie an!</p>
<p>WASD = Bewegen · Maus = Umschauen · Linksklick = Farbe</p>
<button id="start">START</button>
</div>
</div>

<div id="ui">
🎨 Gefunden: <span id="found">0</span>/8<br>
⏱ Zeit: <span id="time">90</span>
</div>

<div id="crosshair"></div>
<div id="paint"></div>

<div id="end">
<div id="box">
<h1 id="endTitle">RUNDE VORBEI</h1>
<p id="endText"></p>
<button onclick="location.reload()">NOCHMAL</button>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

<script>
/* ================= SCENE ================= */

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87cfff);
scene.fog=new THREE.Fog(0x87cfff,35,110);

const camera=new THREE.PerspectiveCamera(
75,
innerWidth/innerHeight,
0.1,
1000
);

const renderer=new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;

document.body.appendChild(renderer.domElement);


/* ================= LIGHT ================= */

scene.add(
new THREE.AmbientLight(0xffffff,1.3)
);

const sun=new THREE.DirectionalLight(
0xffffff,2.5
);

sun.position.set(30,50,20);
sun.castShadow=true;
scene.add(sun);


/* ================= PLAYER ================= */

const player=new THREE.Object3D();
player.position.set(0,2,35);
scene.add(player);

const controls=new THREE.PointerLockControls(
camera,
document.body
);

let keys={};

window.addEventListener("keydown",e=>{
keys[e.code]=true;
});

window.addEventListener("keyup",e=>{
keys[e.code]=false;
});


/* ================= GAME VARIABLES ================= */

let running=false;
let time=90;
let found=0;

let humans=[];
let shots=[];
let particles=[];


/* ================= START ================= */

document.getElementById("start").onclick=()=>{

document.getElementById("menu").style.display="none";
document.getElementById("ui").style.display="block";
document.getElementById("crosshair").style.display="block";
document.getElementById("paint").style.display="block";

running=true;

controls.lock();
};


/* ================= WORLD ================= */

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(100,100),
new THREE.MeshStandardMaterial({
color:0x4c914d,
roughness:1
})
);

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);


/* ================= ROADS ================= */

const roadMat=new THREE.MeshStandardMaterial({
color:0x30363b
});

function road(x,z,w,d){

const r=new THREE.Mesh(
new THREE.BoxGeometry(w,.08,d),
roadMat
);

r.position.set(x,.04,z);
scene.add(r);
}

road(0,0,100,12);
road(0,0,12,100);


/* ================= BUILDINGS ================= */

function building(x,z,w,d,h,color){

const b=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
new THREE.MeshStandardMaterial({
color:color,
roughness:.8
})
);

b.position.set(x,h/2,z);
b.castShadow=true;
b.receiveShadow=true;
scene.add(b);


/* roof */

const roof=new THREE.Mesh(
new THREE.BoxGeometry(w+.4,.4,d+.4),
new THREE.MeshStandardMaterial({
color:0x443a35
})
);

roof.position.set(x,h+.2,z);
roof.castShadow=true;
scene.add(roof);


/* windows */

for(let wx=-w/2+2;wx<w/2;wx+=3){

const win=new THREE.Mesh(
new THREE.BoxGeometry(1.1,1.4,.08),
new THREE.MeshStandardMaterial({
color:0x6ebbd8,
metalness:.3
})
);

win.position.set(
x+wx,
h*.62,
z-d/2-.05
);

scene.add(win);
}
}


/* detailed town */

building(-30,-27,13,12,8,0xb6a58c);
building(29,-27,15,11,7,0x8e9da5);
building(-30,28,14,13,9,0xc2b18e);
building(30,27,15,13,8,0xa38e7c);
building(-18,-5,9,8,6,0x777e86);
building(18,8,10,9,7,0x9c8f7e);


/* ================= TREES ================= */

function tree(x,z){

const g=new THREE.Group();

const trunk=new THREE.Mesh(
new THREE.CylinderGeometry(.25,.4,3,8),
new THREE.MeshStandardMaterial({
color:0x68452d
})
);

trunk.position.y=1.5;
trunk.castShadow=true;
g.add(trunk);

const leaves=new THREE.Mesh(
new THREE.IcosahedronGeometry(2.2,1),
new THREE.MeshStandardMaterial({
color:0x28723b
})
);

leaves.position.y=4;
leaves.castShadow=true;
g.add(leaves);

g.position.set(x,0,z);
scene.add(g);
}

for(let i=0;i<55;i++){

let x=(Math.random()-.5)*85;
let z=(Math.random()-.5)*85;

if(Math.abs(x)<9||Math.abs(z)<9)continue;

tree(x,z);
}


/* ================= CARS ================= */

function car(x,z,color){

const g=new THREE.Group();

const body=new THREE.Mesh(
new THREE.BoxGeometry(2.2,.7,4),
new THREE.MeshStandardMaterial({
color:color,
metalness:.5,
roughness:.3
})
);

body.position.y=.65;
g.add(body);

const cabin=new THREE.Mesh(
new THREE.BoxGeometry(1.7,.8,2),
new THREE.MeshStandardMaterial({
color:0x26343b,
metalness:.3
})
);

cabin.position.y=1.25;
g.add(cabin);

for(let sx of [-1,1]){
for(let sz of [-1.25,1.25]){

const wheel=new THREE.Mesh(
new THREE.CylinderGeometry(.35,.35,.25,12),
new THREE.MeshStandardMaterial({
color:0x111111
})
);

wheel.rotation.z=Math.PI/2;
wheel.position.set(sx,0.4,sz);
g.add(wheel);
}
}

g.position.set(x,0,z);
g.rotation.y=Math.random()*Math.PI;
scene.add(g);
}

car(-8,-18,0xb62e36);
car(10,-19,0x28578c);
car(-18,18,0xc79d27);
car(20,-20,0x555b60);


/* ================= BENCHES ================= */

function bench(x,z){

const seat=new THREE.Mesh(
new THREE.BoxGeometry(3,.25,.7),
new THREE.MeshStandardMaterial({
color:0x79502e
})
);

seat.position.set(x,1,z);
scene.add(seat);

const back=new THREE.Mesh(
new THREE.BoxGeometry(3,1,.18),
new THREE.MeshStandardMaterial({
color:0x79502e
})
);

back.position.set(x,1.45,z+.3);
scene.add(back);
}

bench(-13,-12);
bench(13,13);
bench(-35,8);
bench(35,-8);


/* ================= HUMANS ================= */

const shirtColors=[
0x315e91,
0xb63737,
0x3d7748,
0x8b612f,
0x754d8d,
0x417b83,
0x9c7728,
0x555555
];

function createHuman(x,z,id){

const h=new THREE.Group();

const skin=new THREE.MeshStandardMaterial({
color:0xd49a78
});

const shirt=new THREE.MeshStandardMaterial({
color:shirtColors[id]
});

const pants=new THREE.MeshStandardMaterial({
color:0x252e38
});


/* body */

const body=new THREE.Mesh(
new THREE.BoxGeometry(.7,1.25,.45),
shirt
);

body.position.y=1.45;
body.castShadow=true;
h.add(body);


/* head */

const head=new THREE.Mesh(
new THREE.SphereGeometry(.38,16,16),
skin
);

head.position.y=2.35;
head.castShadow=true;
h.add(head);


/* hair */

const hair=new THREE.Mesh(
new THREE.SphereGeometry(.39,16,16),
new THREE.MeshStandardMaterial({
color:0x241d19
})
);

hair.scale.y=.45;
hair.position.y=2.58;
h.add(hair);


/* arms */

for(let s of [-1,1]){

const arm=new THREE.Mesh(
new THREE.BoxGeometry(.23,1,.23),
shirt
);

arm.position.set(s*.5,1.5,0);
h.add(arm);


/* legs */

const leg=new THREE.Mesh(
new THREE.BoxGeometry(.27,1.05,.3),
pants
);

leg.position.set(s*.19,.55,0);
h.add(leg);
}


h.position.set(x,0,z);

h.userData={
painted:false,
baseX:x,
baseZ:z,
phase:Math.random()*10,
id:id
};

scene.add(h);
humans.push(h);
}

const positions=[
[-22,-21],
[23,-20],
[-23,22],
[24,21],
[-16,13],
[16,-13],
[-35,4],
[35,-4]
];

positions.forEach((p,i)=>{
createHuman(p[0],p[1],i);
});


/* ================= PAINT ================= */

function shootPaint(){

const dir=new THREE.Vector3();

camera.getWorldDirection(dir);

const shot=new THREE.Mesh(
new THREE.SphereGeometry(.13,10,10),
new THREE.MeshBasicMaterial({
color:0xff304f
})
);

shot.position.copy(camera.position);

shot.userData.velocity=
dir.multiplyScalar(45);

shot.userData.life=2;

scene.add(shot);
shots.push(shot);
}


/* ================= PAINT HUMAN ================= */

function paintHuman(h){

if(h.userData.painted)return;

h.userData.painted=true;
found++;

document.getElementById("found").textContent=found;

h.traverse(obj=>{

if(obj.isMesh){

obj.material=obj.material.clone();
obj.material.color.set(0xff304f);
}
});

paintBurst(
h.position.clone().add(
new THREE.Vector3(0,1.5,0)
)
);

if(found===humans.length){
finish(true);
}
}


/* ================= PAINT BURST ================= */

function paintBurst(pos){

for(let i=0;i<25;i++){

const p=new THREE.Mesh(
new THREE.SphereGeometry(.06,6,6),
new THREE.MeshBasicMaterial({
color:0xff304f
})
);

p.position.copy(pos);

p.userData.velocity=new THREE.Vector3(
(Math.random()-.5)*6,
Math.random()*6,
(Math.random()-.5)*6
);

p.userData.life=1;

scene.add(p);
particles.push(p);
}
}


/* ================= UPDATE SHOTS ================= */

function updateShots(dt){

for(let i=shots.length-1;i>=0;i--){

const s=shots[i];

s.position.addScaledVector(
s.userData.velocity,
dt
);

s.userData.life-=dt;

let hit=false;

for(const h of humans){

if(h.userData.painted)continue;

const center=h.position.clone();
center.y+=1.4;

if(s.position.distanceTo(center)<.9){

paintHuman(h);

scene.remove(s);
shots.splice(i,1);

hit=true;
break;
}
}

if(hit)continue;

if(s.userData.life<=0){

scene.remove(s);
shots.splice(i,1);
}
}
}


/* ================= HUMAN MOVEMENT ================= */

function updateHumans(dt){

humans.forEach(h=>{

if(h.userData.painted)return;

const u=h.userData;

u.phase+=dt;

h.position.x=
u.baseX+
Math.sin(u.phase*.6+u.id)*1.5;

h.position.z=
u.baseZ+
Math.cos(u.phase*.5+u.id)*1.5;

h.rotation.y=
Math.sin(u.phase*.7)*.6;
});
}


/* ================= PARTICLES ================= */

function updateParticles(dt){

for(let i=particles.length-1;i>=0;i--){

const p=particles[i];

p.position.addScaledVector(
p.userData.velocity,
dt
);

p.userData.velocity.y-=9*dt;
p.userData.life-=dt;

if(p.userData.life<=0){

scene.remove(p);
particles.splice(i,1);
}
}
}


/* ================= PLAYER MOVEMENT ================= */

function updatePlayer(dt){

if(!running)return;

const speed=8;

let f=0;
let r=0;

if(keys.KeyW)f++;
if(keys.KeyS)f--;
if(keys.KeyA)r--;
if(keys.KeyD)r++;

if(f||r){

const forward=new THREE.Vector3();

camera.getWorldDirection(forward);
forward.y=0;
forward.normalize();

const right=new THREE.Vector3();

right.crossVectors(
forward,
camera.up
).normalize();

player.position.addScaledVector(
forward,
f*speed*dt
);

player.position.addScaledVector(
right,
r*speed*dt
);
}

camera.position.copy(player.position);
camera.position.y=2.2;

camera.position.x=
THREE.MathUtils.clamp(
camera.position.x,-46,46
);

camera.position.z=
THREE.MathUtils.clamp(
camera.position.z,-46,46
);
}


/* ================= MOUSE SHOOT ================= */

window.addEventListener("mousedown",e=>{

if(
e.button===0 &&
running &&
controls.isLocked
){
shootPaint();
}
});


/* ================= GAME END ================= */

function finish(won){

running=false;

if(controls.isLocked)
controls.unlock();

document.getElementById("end").style.display="flex";

document.getElementById("endTitle").textContent=
won?"🏆 ALLE GEFUNDEN!":"⏱ ZEIT ABGELAUFEN";

document.getElementById("endText").innerHTML=
"Du hast <b>"+found+
"</b> von <b>"+humans.length+
"</b> Menschen gefunden.";
}


/* ================= LOOP ================= */

let last=performance.now();

function animate(){

requestAnimationFrame(animate);

const now=performance.now();
const dt=Math.min((now-last)/1000,.05);
last=now;

if(running){

time-=dt;

document.getElementById("time").textContent=
Math.ceil(time);

if(time<=0){
finish(false);
}else{
updatePlayer(dt);
updateHumans(dt);
updateShots(dt);
updateParticles(dt);
}
}

renderer.render(scene,camera);
}

animate();


/* ================= RESIZE ================= */

window.addEventListener("resize",()=>{

camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);
});
</script>
</body>
</html>
