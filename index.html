<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ghost Maps</title>

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">

<style>
html,body,#map{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,sans-serif;
}

#map{
    background:#b9dce8;
}

.search{
    position:absolute;
    z-index:10;
    top:15px;
    left:15px;
    width:360px;
    height:52px;
    background:white;
    border-radius:10px;
    box-shadow:0 2px 10px #0004;
    display:flex;
}

.search input{
    flex:1;
    border:0;
    outline:0;
    padding:0 15px;
    font-size:16px;
}

.search button{
    width:55px;
    border:0;
    background:white;
    font-size:20px;
}

.buttons{
    position:absolute;
    right:15px;
    bottom:30px;
    z-index:10;
    display:flex;
    flex-direction:column;
    gap:7px;
}

.buttons button{
    width:48px;
    height:48px;
    border:0;
    border-radius:8px;
    background:white;
    box-shadow:0 2px 8px #0004;
    font-size:22px;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="search">
    <input id="search" placeholder="Ort suchen...">
    <button onclick="searchPlace()">🔍</button>
</div>

<div class="buttons">
    <button onclick="map.zoomIn()">+</button>
    <button onclick="map.zoomOut()">−</button>
    <button onclick="locate()">📍</button>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<script>

const map = new maplibregl.Map({

    container:"map",

    style:{
        version:8,

        sources:{
            osm:{
                type:"raster",

                tiles:[
                    "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
                ],

                tileSize:256,

                attribution:"© OpenStreetMap-Mitwirkende"
            }
        },

        layers:[
            {
                id:"osm",

                type:"raster",

                source:"osm"
            }
        ]
    },

    center:[10.4515,51.1657],

    zoom:5
});

map.addControl(
    new maplibregl.NavigationControl(),
    "bottom-right"
);

function searchPlace(){

    const q=document
        .getElementById("search")
        .value
        .trim();

    if(!q)return;

    fetch(
        "https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+
        encodeURIComponent(q)
    )
    .then(r=>r.json())
    .then(data=>{

        if(!data.length){
            alert("Ort nicht gefunden");
            return;
        }

        const place=data[0];

        const lng=parseFloat(place.lon);
        const lat=parseFloat(place.lat);

        map.flyTo({
            center:[lng,lat],
            zoom:14,
            speed:1.2
        });

        new maplibregl.Marker()
            .setLngLat([lng,lat])
            .addTo(map);

    })
    .catch(()=>{
        alert("Suche fehlgeschlagen");
    });
}

function locate(){

    if(!navigator.geolocation){
        alert("Standort wird nicht unterstützt");
        return;
    }

    navigator.geolocation.getCurrentPosition(position=>{

        const lng=position.coords.longitude;
        const lat=position.coords.latitude;

        map.flyTo({
            center:[lng,lat],
            zoom:15
        });

        new maplibregl.Marker()
            .setLngLat([lng,lat])
            .addTo(map);

    });
}

</script>

</body>
</html>
