<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fishing Simulator</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#75c8ec;font-family:Arial}
canvas{display:block}

#crosshair{
position:fixed;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:8px;height:8px;
border:2px solid white;
border-radius:50%;
z-index:10;
pointer-events:none
}

#hud{
position:fixed;
top:15px;
left:15px;
padding:12px 16px;
color:#fff;
background:rgba(0,0,0,.6);
border-radius:10px;
z-index:20;
line-height:1.5
}

#prompt{
position:fixed;
left:50%;
bottom:65px;
transform:translateX(-50%);
padding:13px 22px;
color:#fff;
background:rgba(0,0,0,.8);
border-radius:12px;
font-size:18px;
z-index:30;
display:none;
text-align:center
}

#start{
position:fixed;
inset:0;
z-index:100;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
color:white;
background:linear-gradient(#061521dd,#02090eee)
}

#start h1{
font-size:50px;
margin:0 0 15px
}

#start button{
border:0;
padding:15px 35px;
border-radius:12px;
background:#168bd0;
color:white;
font-size:20px;
cursor:pointer
}

#bridgeHUD{
position:fixed;
right:15px;
top:15px;
padding:12px 16px;
background:rgba(0,0,0,.6);
color:white;
border-radius:10px;
z-index:20
}

#boatHUD{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
padding:12px 22px;
background:rgba(0,0,0,.7);
color:white;
border-radius:12px;
z-index:30;
display:none;
text-align:center
}
</style>
</head>

<body>

<div id="start">
<h1>🎣 FISHING SIMULATOR</h1>
<p>Fischerhafen • Boot • Kran • Netz</p>
<button id="startBtn">STARTEN</button>
</div>

<div id="crosshair"></div>

<div id="hud">
<b>🎣 FISHING SIMULATOR</b><br>
WASD = Bewegen<br>
Maus = Umschauen<br>
E = Interagieren<br>
R = Brücke drehen<br>
Shift = Rennen<br>
Space = Springen
</div>

<div id="prompt"></div>

<div id="bridgeHUD">
🔩 Eisenbrücke:
<b id="bridgeState">am Hafen</b>
</div>

<div id="boatHUD">
🚤 <b>BOOT STEUERN</b><br>
W/S = Fahren • A/D = Lenken<br>
E = Steuerstand verlassen
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x83ccef);
scene.fog=new THREE.Fog(0x83ccef,55,180);

const camera=new THREE.PerspectiveCamera(
75,innerWidth/innerHeight,.1,300
);

const renderer=new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);

const controls=new THREE.PointerLockControls(
camera,document.body
);

scene.add(new THREE.HemisphereLight(
0xbfeeff,0x40505a,1.5
));

const sun=new THREE.DirectionalLight(
0xffffff,1.8
);

sun.position.set(-30,50,20);
sun.castShadow=true;
sun.shadow.mapSize.width=1024;
sun.shadow.mapSize.height=1024;
scene.add(sun);


/* MATERIALIEN */

const waterMat=new THREE.MeshStandardMaterial({
color:0x167da8,
roughness:.25
});

const concreteMat=new THREE.MeshStandardMaterial({
color:0x555b5e,
roughness:.9
});

const woodMat=new THREE.MeshStandardMaterial({
color:0x704321,
roughness:.85
});

const darkWood=new THREE.MeshStandardMaterial({
color:0x352116,
roughness:.9
});

const metalMat=new THREE.MeshStandardMaterial({
color:0x777e83,
metalness:.85,
roughness:.25
});

const darkMetal=new THREE.MeshStandardMaterial({
color:0x252b2f,
metalness:.9,
roughness:.3
});

const whiteMat=new THREE.MeshStandardMaterial({
color:0xe6e6df
});

const glassMat=new THREE.MeshStandardMaterial({
color:0x67b5cf,
transparent:true,
opacity:.65,
roughness:.1
});

const netMat=new THREE.MeshStandardMaterial({
color:0x46545b,
transparent:true,
opacity:.72,
side:THREE.DoubleSide
});


/* HILFSFUNKTIONEN */

function box(w,h,d,mat,x,y,z,parent=scene){

const m=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
mat
);

m.position.set(x,y,z);
m.castShadow=true;
m.receiveShadow=true;

parent.add(m);

return m;
}

function cyl(r,h,mat,x,y,z,parent=scene,segments=16){

const m=new THREE.Mesh(
new THREE.CylinderGeometry(r,r,h,segments),
mat
);

m.position.set(x,y,z);
m.castShadow=true;
m.receiveShadow=true;

parent.add(m);

return m;
}


/* HAFEN */

box(90,.5,60,concreteMat,0,-.25,0);

const water=new THREE.Mesh(
new THREE.PlaneGeometry(180,180),
waterMat
);

water.rotation.x=-Math.PI/2;
water.position.set(0,-.72,-55);
scene.add(water);


/* HAFENKANTE */

box(70,.5,2,darkWood,0,.1,-2);
box(70,.5,2,darkWood,0,.1,13);
box(2,.5,17,darkWood,-34,.1,5.5);
box(2,.5,17,darkWood,34,.1,5.5);


/* POLLER */

for(let x=-30;x<=30;x+=10){

cyl(.35,1,darkMetal,x,.5,1.5);
cyl(.35,1,darkMetal,x,.5,10);

}


/* BOOT */

const boat=new THREE.Group();

boat.position.set(
0,.2,-7
);

scene.add(boat);

const hullMat=new THREE.MeshStandardMaterial({
color:0x263944,
roughness:.65
});

box(
10,1.5,22,
hullMat,
0,.7,0,
boat
);

const bow=new THREE.Mesh(
new THREE.ConeGeometry(5,7,4),
hullMat
);

bow.rotation.y=Math.PI/4;
bow.rotation.x=Math.PI/2;
bow.scale.z=1.4;
bow.position.set(0,.75,-12);
bow.castShadow=true;

boat.add(bow);


/* DECK */

box(
9.4,.3,20,
woodMat,
0,1.5,0,
boat
);


/* RELING */

for(let z=-9;z<=9;z+=3){

box(.15,1,.15,metalMat,-4.5,2,z,boat);
box(.15,1,.15,metalMat,4.5,2,z,boat);

}

box(9,.12,.12,metalMat,0,2.45,-9.5,boat);
box(9,.12,.12,metalMat,0,2.45,9.5,boat);


/* KAJÜTE */

const cabin=new THREE.Group();

cabin.position.set(
0,1.5,3
);

boat.add(cabin);

box(
7,3.5,5,
whiteMat,
0,1.75,0,
cabin
);

box(
7.8,.35,5.7,
darkWood,
0,3.65,0,
cabin
);


/* FENSTER */

box(
2.4,1.3,.12,
glassMat,
-1.7,2.4,-2.55,
cabin
);

box(
2.4,1.3,.12,
glassMat,
1.7,2.4,-2.55,
cabin
);

box(
.12,1.3,2.2,
glassMat,
-3.55,2.4,.3,
cabin
);

box(
.12,1.3,2.2,
glassMat,
3.55,2.4,.3,
cabin
);


/* TÜR */

const cabinDoor=new THREE.Group();

cabinDoor.position.set(
-0.85,
1.35,
2.58
);

cabin.add(cabinDoor);

box(
1.7,
2.7,
.12,
darkWood,
.85,
0,
0,
cabinDoor
);

let doorOpen=false;
let doorAnimating=false;


/* LENKRAD */

const wheel=new THREE.Group();

wheel.position.set(
0,
2.7,
.2
);

boat.add(wheel);

const ring=new THREE.Mesh(
new THREE.TorusGeometry(
1,.13,10,24
),
darkWood
);

ring.rotation.x=Math.PI/2;
wheel.add(ring);

for(let i=0;i<8;i++){

const a=i*Math.PI/4;

const spoke=box(
.12,.12,1.65,
metalMat,
Math.sin(a)*.75,
0,
Math.cos(a)*.75,
wheel
);

spoke.rotation.y=a;

}

box(
3,.9,1.2,
darkMetal,
0,2.1,.7,
boat
);

box(
3,.4,1.2,
darkWood,
0,2.25,1.8,
boat
);

box(
3,1,.3,
darkWood,
0,2.8,2.25,
boat
);


/* HINTERER ARBEITSBEREICH */

const rear=new THREE.Group();

rear.position.set(
0,0,8
);

boat.add(rear);

box(
8,.2,5,
woodMat,
0,1.7,0,
rear
);


/* NETZ AUF DEM BODEN */

const fishingNet=new THREE.Group();

fishingNet.position.set(
0,
1.85,
7.2
);

boat.add(fishingNet);

const netPlane=new THREE.Mesh(
new THREE.PlaneGeometry(5,3.5,12,8),
netMat
);

netPlane.rotation.x=-Math.PI/2;
fishingNet.add(netPlane);


/* NETZ-GITTER */

for(let x=-2.4;x<=2.4;x+=.4){

const line=box(
.025,.025,3.5,
metalMat,
x,.03,0,
fishingNet
);

line.rotation.y=.0;

}

for(let z=-1.5;z<=1.5;z+=.4){

box(
5,.025,.025,
metalMat,
0,.035,z,
fishingNet
);

}


/* KRAN */

const crane=new THREE.Group();

crane.position.set(
3.2,
1.7,
8
);

boat.add(crane);


/* KRAN-BASIS */

box(
1,
.5,
1,
darkMetal,
0,0,0,
crane
);


/* SENKRECHTER ARM */

const craneArm=new THREE.Group();

craneArm.position.set(
0,
.25,
0
);

crane.add(craneArm);

box(
.5,
4,
.5,
darkMetal,
0,
2,
0,
craneArm
);


/* AUSLEGER */

const boom=new THREE.Group();

boom.position.set(
0,
3.8,
0
);

craneArm.add(boom);

box(
4,
.4,
.4,
darkMetal,
1.7,
0,
0,
boom
);


/* SEIL */

const rope=new THREE.Mesh(
new THREE.CylinderGeometry(
.055,.055,4,8
),
metalMat
);

rope.position.set(
3.5,
-2,
0
);

boom.add(rope);


/* HAKEN */

const hook=new THREE.Group();

hook.position.set(
3.5,
-4,
0
);

boom.add(hook);

cyl(
.18,
.5,
new THREE.MeshStandardMaterial({
color:0xe2aa20,
metalness:.6
}),
0,0,0,
hook,
12
);


/* NETZ AM KRAN */

const hangingNet=new THREE.Group();

hangingNet.position.set(
0,
-.3,
0
);

hook.add(hangingNet);

const hangingNetMat=new THREE.MeshStandardMaterial({
color:0x34464e,
transparent:true,
opacity:.75,
side:THREE.DoubleSide
});

const netBasket=new THREE.Mesh(
new THREE.CylinderGeometry(
1.6,
.8,
1.5,
12,
1,
true
),
hangingNetMat
);

netBasket.rotation.x=0;
hangingNet.add(netBasket);


/* KRAN STATUS */

let craneLowered=false;
let craneAnimating=false;
let craneProgress=0;


/* EISENBRÜCKE */

const bridge=new THREE.Group();

box(
2.2,.18,5,
darkMetal,
0,.15,0,
bridge
);

for(let z=-2;z<=2;z+=1){

box(
2.2,.18,.12,
metalMat,
0,.28,z,
bridge
);

}

bridge.position.set(
-5,.25,-2.8
);

scene.add(bridge);

let bridgeState=0;
let bridgeRotation=0;


/* SPIELER */

camera.position.set(
-12,2.2,1
);

let velocityY=0;
let onGround=true;

const keys={};

addEventListener("keydown",e=>{

keys[e.code]=true;

if(e.code==="Space" && onGround){

velocityY=7;
onGround=false;

}

if(e.code==="KeyR" && bridgeState===1){

bridgeRotation+=Math.PI/2;

}

if(e.code==="KeyE"){

interact();

}

});

addEventListener("keyup",e=>{
keys[e.code]=false;
});


/* BRÜCKE AUFNEHMEN */

function pickupBridge(){

bridgeState=1;

bridge.visible=false;

document.getElementById(
"bridgeState"
).textContent="in der Hand";

}


/* GEHALTENE BRÜCKE */

function updateHeldBridge(){

if(bridgeState!==1)return;

const forward=new THREE.Vector3();

camera.getWorldDirection(forward);

forward.y=0;
forward.normalize();

const pos=camera.position.clone();

pos.addScaledVector(
forward,
2.5
);

pos.y-=.9;

bridge.position.copy(pos);

bridge.rotation.set(
0,
Math.atan2(
forward.x,
forward.z
)+bridgeRotation,
0
);

bridge.visible=true;

}


/* BRÜCKE ABLEGEN */

function placeBridge(){

bridgeState=2;

bridge.visible=true;

document.getElementById(
"bridgeState"
).textContent="platziert";

}


/* BRÜCKE AUFS BOOT */

function putBridgeOnBoat(){

bridgeState=3;

bridge.visible=true;

bridge.position.copy(
boat.position
);

bridge.position.y+=2;

bridge.position.z+=7;

bridge.rotation.set(0,0,0);

document.getElementById(
"bridgeState"
).textContent="auf dem Boot";

}


/* TÜR */

function toggleDoor(){

if(doorAnimating)return;

doorAnimating=true;

const start=doorOpen?1:0;
const end=doorOpen?0:1;

let t=0;

function anim(){

t+=.08;

const p=Math.min(t,1);

const eased=
p<.5
?2*p*p
:1-Math.pow(-2*p+2,2)/2;

cabinDoor.rotation.y=
(start+(end-start)*eased)
*(-Math.PI/2);

if(p<1){

requestAnimationFrame(anim);

}else{

doorOpen=!doorOpen;
doorAnimating=false;

}

}

anim();

}


/* KRAN ANIMATION */

function lowerCrane(){

if(craneAnimating)return;

craneAnimating=true;

let start=craneLowered?1:0;
let end=craneLowered?0:1;

let t=0;

function anim(){

t+=.025;

const p=Math.min(t,1);

const eased=
p<.5
?2*p*p
:1-Math.pow(-2*p+2,2)/2;


/*
Der Ausleger bewegt sich
nach unten und wieder hoch.
*/

const angle=
start+(end-start)*eased;

boom.rotation.z=
-angle*.45;

rope.scale.y=
1+angle*2;

rope.position.y=
-2-angle*2;

hook.position.y=
-4-angle*2;

hangingNet.position.y=
-.3-angle*1.5;

if(p<1){

requestAnimationFrame(anim);

}else{

craneLowered=!craneLowered;
craneAnimating=false;

}

}

anim();

}


/* LENKRAD */

let steering=false;
let driving=false;

function enterSteering(){

if(bridgeState!==3)return;

steering=true;
driving=true;

document.getElementById(
"boatHUD"
).style.display="block";

}


/* STEUERSTAND VERLASSEN */

function leaveSteering(){

steering=false;
driving=false;

document.getElementById(
"boatHUD"
).style.display="none";

camera.position.set(
boat.position.x-5,
boat.position.y+2.2,
boat.position.z+5
);

}


/* INTERAKTION */

function interact(){

const p=camera.position;


/* BRÜCKE */

if(
bridgeState===0 &&
p.distanceTo(bridge.position)<3
){

pickupBridge();
return;

}


/* BRÜCKE ABLEGEN */

if(bridgeState===1){

placeBridge();
return;

}


/* BRÜCKE AUFS BOOT */

if(bridgeState===2){

const bp=boat.position.clone();

if(p.distanceTo(bp)<9){

putBridgeOnBoat();
return;

}

}


/* TÜR */

const doorWorld=new THREE.Vector3();

cabinDoor.getWorldPosition(doorWorld);

if(
p.distanceTo(doorWorld)<4
){

toggleDoor();
return;

}


/* STEUERSTAND */

const wheelWorld=new THREE.Vector3();

wheel.getWorldPosition(wheelWorld);

if(
bridgeState===3 &&
p.distanceTo(wheelWorld)<5 &&
!steering
){

enterSteering();
return;

}


/* STEUERSTAND VERLASSEN */

if(steering){

leaveSteering();
return;

}


/* KRAN */

const craneWorld=new THREE.Vector3();

crane.getWorldPosition(craneWorld);

if(
p.distanceTo(craneWorld)<5 &&
bridgeState===3
){

lowerCrane();
return;

}

}


/* SPIELER */

function movePlayer(dt){

if(steering)return;

const speed=
(keys.ShiftLeft||keys.ShiftRight)
?8:4;

const dir=new THREE.Vector3();

if(keys.KeyW)dir.z-=1;
if(keys.KeyS)dir.z+=1;
if(keys.KeyA)dir.x-=1;
if(keys.KeyD)dir.x+=1;

if(dir.length()>0){

dir.normalize();

const forward=new THREE.Vector3();

camera.getWorldDirection(forward);

forward.y=0;
forward.normalize();

const right=new THREE.Vector3();

right.crossVectors(
forward,
new THREE.Vector3(0,1,0)
).normalize();

camera.position.addScaledVector(
forward,
dir.z*speed*dt
);

camera.position.addScaledVector(
right,
dir.x*speed*dt
);

}

velocityY-=18*dt;

camera.position.y+=velocityY*dt;

if(camera.position.y<=2.2){

camera.position.y=2.2;
velocityY=0;
onGround=true;

}

camera.position.x=
Math.max(-32,
Math.min(32,camera.position.x));

camera.position.z=
Math.max(-12,
Math.min(17,camera.position.z));

}


/* BOOT FAHREN */

let boatSpeed=0;
let boatRotation=0;

function driveBoat(dt){

if(!driving)return;

if(keys.KeyW)
boatSpeed+=6*dt;

if(keys.KeyS)
boatSpeed-=6*dt;

boatSpeed*=.985;

boatSpeed=Math.max(
-3,
Math.min(14,boatSpeed)
);

if(keys.KeyA){

boatRotation+=
1.2*dt*
(Math.abs(boatSpeed)+1)/8;

}

if(keys.KeyD){

boatRotation-=
1.2*dt*
(Math.abs(boatSpeed)+1)/8;

}

boat.rotation.y=boatRotation;

const direction=new THREE.Vector3(
Math.sin(boat.rotation.y),
0,
Math.cos(boat.rotation.y)
);

boat.position.addScaledVector(
direction,
boatSpeed*dt
);


/*
KAMERA BLEIBT AM BOOT
UND DREHT MIT DEM BOOT
*/

const offset=new THREE.Vector3(
0,
4.2,
3
);

offset.applyAxisAngle(
new THREE.Vector3(0,1,0),
boat.rotation.y
);

camera.position.copy(
boat.position
).add(offset);

const look=new THREE.Vector3(
0,
2,
-5
);

look.applyAxisAngle(
new THREE.Vector3(0,1,0),
boat.rotation.y
);

camera.lookAt(
boat.position.clone().add(look)
);

}


/* PROMPT */

function updatePrompt(){

const p=camera.position;
const prompt=document.getElementById("prompt");

if(steering){

prompt.style.display="none";
return;

}


/* BRÜCKE */

if(
bridgeState===0 &&
p.distanceTo(bridge.position)<3
){

showPrompt(
"E – Eisenbrücke aufnehmen"
);

return;

}

if(bridgeState===1){

showPrompt(
"E – Brücke ablegen<br>R – Brücke drehen"
);

return;

}

if(bridgeState===2){

const bp=boat.position.clone();

if(p.distanceTo(bp)<9){

showPrompt(
"E – Brücke aufs Boot legen"
);

return;

}

}


/* TÜR */

const doorWorld=new THREE.Vector3();

cabinDoor.getWorldPosition(doorWorld);

if(p.distanceTo(doorWorld)<4){

showPrompt(
"E – Tür öffnen/schließen"
);

return;

}


/* LENKRAD */

if(bridgeState===3){

const wp=new THREE.Vector3();

wheel.getWorldPosition(wp);

if(p.distanceTo(wp)<5){

showPrompt(
"E – Lenkrad greifen"
);

return;

}

}


/* KRAN */

if(
bridgeState===3 &&
p.distanceTo(
crane.getWorldPosition(new THREE.Vector3())
)<5
){

if(!craneLowered){

showPrompt(
"E – Netz mit dem Kran ins Wasser lassen"
);

}else{

showPrompt(
"E – Netz wieder hochziehen"
);

}

return;

}

prompt.style.display="none";

}


function showPrompt(text){

const p=document.getElementById("prompt");

p.style.display="block";
p.innerHTML=text;

}


/* START */

document.getElementById("startBtn").onclick=()=>{

document.getElementById("start").style.display="none";

document.getElementById("bridgeHUD").style.display="block";

controls.lock();

};


/* LOOP */

let last=performance.now();

function animate(now){

requestAnimationFrame(animate);

const dt=Math.min(
(now-last)/1000,
.033
);

last=now;

movePlayer(dt);

updateHeldBridge();

driveBoat(dt);

updatePrompt();

renderer.render(
scene,
camera
);

}

animate(performance.now());


/* RESIZE */

addEventListener("resize",()=>{

camera.aspect=
innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

});
</script>

</body>
</html>
