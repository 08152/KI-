<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>3D Raum</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:white;
}

canvas{
    display:block;
}

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    width:18px;
    height:18px;
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:10;
}

#crosshair::before,
#crosshair::after{
    content:"";
    position:absolute;
    background:#000;
}

#crosshair::before{
    width:2px;
    height:18px;
    left:8px;
    top:0;
}

#crosshair::after{
    width:18px;
    height:2px;
    left:0;
    top:8px;
}

#start{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    padding:14px 25px;
    border:2px solid #000;
    border-radius:8px;
    background:#fff;
    font-size:18px;
    cursor:pointer;
    z-index:20;
}
</style>
</head>

<body>

<div id="crosshair"></div>
<button id="start">START</button>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { PointerLockControls } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/PointerLockControls.js";


/* =========================
   SZENE
========================= */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);


/* =========================
   KAMERA
========================= */

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0,1.7,6);


/* =========================
   RENDERER
========================= */

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

document.body.appendChild(renderer.domElement);


/* =========================
   LICHT
========================= */

const ambient = new THREE.AmbientLight(
    0xffffff,
    1.8
);

scene.add(ambient);

const light = new THREE.DirectionalLight(
    0xffffff,
    2
);

light.position.set(5,10,5);
scene.add(light);


/* =========================
   MATERIAL
========================= */

const white = new THREE.MeshStandardMaterial({
    color:0xffffff,
    roughness:0.8,
    metalness:0
});


/* =========================
   RAUM
========================= */

const floor = new THREE.Mesh(
    new THREE.BoxGeometry(20,0.2,20),
    white
);

floor.position.y=-0.1;
scene.add(floor);


const ceiling = new THREE.Mesh(
    new THREE.BoxGeometry(20,0.2,20),
    white
);

ceiling.position.y=6;
scene.add(ceiling);


const backWall = new THREE.Mesh(
    new THREE.BoxGeometry(20,6,0.2),
    white
);

backWall.position.set(0,3,-10);
scene.add(backWall);


const frontWall = new THREE.Mesh(
    new THREE.BoxGeometry(20,6,0.2),
    white
);

frontWall.position.set(0,3,10);
scene.add(frontWall);


const leftWall = new THREE.Mesh(
    new THREE.BoxGeometry(0.2,6,20),
    white
);

leftWall.position.set(-10,3,0);
scene.add(leftWall);


const rightWall = new THREE.Mesh(
    new THREE.BoxGeometry(0.2,6,20),
    white
);

rightWall.position.set(10,3,0);
scene.add(rightWall);


/* =========================
   POINTER LOCK
========================= */

const controls = new PointerLockControls(
    camera,
    document.body
);

const start = document.getElementById("start");

start.addEventListener("click",()=>{
    controls.lock();
});

controls.addEventListener("lock",()=>{
    start.style.display="none";
});

controls.addEventListener("unlock",()=>{
    start.style.display="block";
});


/* =========================
   WASD
========================= */

const keys = {
    KeyW:false,
    KeyA:false,
    KeyS:false,
    KeyD:false,
    Space:false
};

document.addEventListener("keydown",(e)=>{
    if(e.code in keys){
        keys[e.code]=true;
    }
});

document.addEventListener("keyup",(e)=>{
    if(e.code in keys){
        keys[e.code]=false;
    }
});


/* =========================
   BEWEGUNG
========================= */

const velocity = new THREE.Vector3();

let canJump = true;

const speed = 5;
const gravity = 18;
const jumpPower = 7;

let previousTime = performance.now();


function move(){

    const time = performance.now();
    const delta = Math.min(
        (time-previousTime)/1000,
        0.05
    );

    previousTime=time;

    if(controls.isLocked){

        /* Vorwärts / Rückwärts */

        if(keys.KeyW){
            controls.moveForward(speed*delta);
        }

        if(keys.KeyS){
            controls.moveForward(-speed*delta);
        }

        /* Links / Rechts */

        if(keys.KeyA){
            controls.moveRight(-speed*delta);
        }

        if(keys.KeyD){
            controls.moveRight(speed*delta);
        }


        /* Gravitation */

        velocity.y -= gravity*delta;

        camera.position.y += velocity.y*delta;


        /* Boden */

        if(camera.position.y <= 1.7){

            camera.position.y=1.7;

            velocity.y=0;

            canJump=true;
        }


        /* Springen */

        if(keys.Space && canJump){

            velocity.y=jumpPower;

            canJump=false;
        }


        /* Raumbegrenzung */

        camera.position.x =
            Math.max(-9.5,
            Math.min(9.5,camera.position.x));

        camera.position.z =
            Math.max(-9.5,
            Math.min(9.5,camera.position.z));

    }

    renderer.render(scene,camera);

    requestAnimationFrame(move);
}

move();


/* =========================
   FENSTERGRÖSSE
========================= */

window.addEventListener("resize",()=>{

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});

</script>

</body>
</html>
