
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fast Block World</title>
<style>
html,body{margin:0;overflow:hidden;background:#87ceeb}
#ui{position:fixed;z-index:5;top:10px;left:10px;background:#000b;color:white;padding:10px;font:14px Arial}
button{padding:8px;margin-top:5px}
#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:white;font:22px Arial}
</style>
</head>
<body>
<div id="ui">
<b>FAST BLOCK WORLD</b><br>
<span id="info">Laden...</span><br>
<button id="new">Neue Welt</button>
</div>
<div id="cross">+</div>

<script type="importmap">
{
"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
}
}
</script>

<script type="module">
import * as THREE from "three";
import {PointerLockControls} from
"three/addons/controls/PointerLockControls.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);

const camera=new THREE.PerspectiveCamera(
75,innerWidth/innerHeight,.1,150
);
camera.position.set(0,10,10);

const renderer=new THREE.WebGLRenderer({
antialias:false,powerPreference:"high-performance"
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(1);
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x777777,1.5));

const controls=new PointerLockControls(camera,document.body);
scene.add(controls.object);

document.body.addEventListener("click",()=>{
if(!controls.isLocked)controls.lock();
});

const textureLoader=new THREE.TextureLoader();

function tex(url){
const t=textureLoader.load(url);
t.magFilter=THREE.NearestFilter;
t.minFilter=THREE.NearestFilter;
t.colorSpace=THREE.SRGBColorSpace;
return t;
}

const dirt=tex(
"https://assets.mcasset.cloud/1.21.4/assets/minecraft/textures/block/dirt.png"
);

const stone=tex(
"https://assets.mcasset.cloud/1.21.4/assets/minecraft/textures/block/stone.png"
);

const dirtMat=new THREE.MeshBasicMaterial({map:dirt});
const stoneMat=new THREE.MeshBasicMaterial({map:stone});

const geo=new THREE.BoxGeometry(1,1,1);

let dirtMesh,stoneMesh;

const SIZE=32;
const DEPTH=5;

function height(x,z){
return Math.floor(
7+
Math.sin(x*.2)*1.5+
Math.cos(z*.2)*1.5+
Math.sin((x+z)*.12)
);
}

function generate(){

if(dirtMesh)scene.remove(dirtMesh);
if(stoneMesh)scene.remove(stoneMesh);

let dirtCount=0;
let stoneCount=0;

for(let x=-SIZE/2;x<SIZE/2;x++){
for(let z=-SIZE/2;z<SIZE/2;z++){

const h=height(x,z);

for(let y=0;y<h;y++){
if(y<h-2)stoneCount++;
else dirtCount++;
}
}
}

dirtMesh=new THREE.InstancedMesh(geo,dirtMat,dirtCount);
stoneMesh=new THREE.InstancedMesh(geo,stoneMat,stoneCount);

const m=new THREE.Matrix4();
let di=0,si=0;

for(let x=-SIZE/2;x<SIZE/2;x++){
for(let z=-SIZE/2;z<SIZE/2;z++){

const h=height(x,z);

for(let y=0;y<h;y++){

m.makeTranslation(x,y,z);

if(y<h-2){
stoneMesh.setMatrixAt(si++,m);
}else{
dirtMesh.setMatrixAt(di++,m);
}

}
}
}

dirtMesh.instanceMatrix.needsUpdate=true;
stoneMesh.instanceMatrix.needsUpdate=true;

scene.add(dirtMesh,stoneMesh);

document.getElementById("info").textContent=
"Blöcke: "+(dirtCount+stoneCount);
}

generate();
document.getElementById("new").onclick=generate;

// MOVEMENT
const keys={};
addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

const clock=new THREE.Clock();

function animate(){

requestAnimationFrame(animate);

const dt=Math.min(clock.getDelta(),.05);
const speed=7;

if(controls.isLocked){

if(keys.KeyW)controls.moveForward(speed*dt);
if(keys.KeyS)controls.moveForward(-speed*dt);
if(keys.KeyA)controls.moveRight(-speed*dt);
if(keys.KeyD)controls.moveRight(speed*dt);

if(keys.Space)controls.object.position.y+=speed*dt;
if(keys.ShiftLeft)controls.object.position.y-=speed*dt;

}

renderer.render(scene,camera);
}

animate();

addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
