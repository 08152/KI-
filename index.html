<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Roter Würfel</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 900px;
    }

    .scene {
        width: 220px;
        height: 220px;
        position: relative;
        transform-style: preserve-3d;
    }

    .cube {
        width: 180px;
        height: 180px;
        position: absolute;
        left: 20px;
        top: 20px;
        transform-style: preserve-3d;
        animation: drehen 5s linear infinite;
    }

    .seite {
        position: absolute;
        width: 180px;
        height: 180px;
        background: linear-gradient(145deg, #ff3b3b, #a80000);
        border: 2px solid #700000;
        box-shadow:
            inset 0 0 25px rgba(255,255,255,0.12),
            inset 0 0 15px rgba(0,0,0,0.3);
        backface-visibility: visible;
    }

    .vorne {
        transform: translateZ(90px);
    }

    .hinten {
        transform: rotateY(180deg) translateZ(90px);
    }

    .rechts {
        transform: rotateY(90deg) translateZ(90px);
    }

    .links {
        transform: rotateY(-90deg) translateZ(90px);
    }

    .oben {
        transform: rotateX(90deg) translateZ(90px);
    }

    .unten {
        transform: rotateX(-90deg) translateZ(90px);
    }

    @keyframes drehen {
        0% {
            transform: rotateX(-20deg) rotateY(0deg);
        }

        100% {
            transform: rotateX(-20deg) rotateY(360deg);
        }
    }
</style>
</head>

<body>

<div class="scene">
    <div class="cube">
        <div class="seite vorne"></div>
        <div class="seite hinten"></div>
        <div class="seite rechts"></div>
        <div class="seite links"></div>
        <div class="seite oben"></div>
        <div class="seite unten"></div>
    </div>
</div>

</body>
</html>
