<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fishing Simulator</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#000;
}

#game{
    position:fixed;
    inset:0;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
    color:white;
}

#top{
    position:absolute;
    top:0;
    left:0;
    right:0;
    padding:18px;
    display:flex;
    justify-content:space-between;
    background:linear-gradient(#000b,transparent);
}

.panel{
    background:#0009;
    border:1px solid #ffffff33;
    padding:10px 15px;
    border-radius:10px;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:20px;
    height:20px;
    transform:translate(-50%,-50%);
}

#crosshair::before,
#crosshair::after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 0 4px black;
}

#crosshair::before{
    width:20px;
    height:2px;
    top:9px;
}

#crosshair::after{
    width:2px;
    height:20px;
    left:9px;
}

#message{
    position:absolute;
    left:50%;
    bottom:40px;
    transform:translateX(-50%);
    background:#000b;
    padding:12px 20px;
    border-radius:10px;
    font-weight:bold;
}

#loading{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#07111a;
    color:white;
    font-size:22px;
    font-weight:bold;
    z-index:100;
}

#loading small{
    display:block;
    text-align:center;
    margin-top:12px;
    font-size:13px;
    opacity:.7;
}

</style>
</head>

<body>

<div id="game"></div>

<div id="loading">
    <div>
        🚢 Schiff wird geladen...
        <small>1.glb</small>
    </div>
</div>

<div id="ui">

    <div id="top">

        <div class="panel">
            🎣 FISHING SIMULATOR
        </div>

        <div class="panel">
            WASD = Bewegen · Maus = Umschauen
        </div>

    </div>

    <div id="crosshair"></div>

    <div id="message">
        Klicke auf das Spiel, um zu starten
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>

<script>

let scene;
let camera;
let renderer;

let ship=null;

let yaw=0;
let pitch=0;

let pointerLocked=false;

const keys={
    w:false,
    a:false,
    s:false,
    d:false
};

const playerOffset=new THREE.Vector3(
    0,
    2.2,
    0
);

/* =========================================
   SZENE
========================================= */

scene=new THREE.Scene();

scene.background=new THREE.Color(
    0x76b8e8
);

scene.fog=new THREE.Fog(
    0x76b8e8,
    80,
    500
);


/* =========================================
   KAMERA
========================================= */

camera=new THREE.PerspectiveCamera(
    75,
    innerWidth/innerHeight,
    0.1,
    2000
);

camera.position.set(
    0,
    3,
    5
);


/* =========================================
   RENDERER
========================================= */

renderer=new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled=true;

document
.getElementById("game")
.appendChild(
    renderer.domElement
);


/* =========================================
   LICHT
========================================= */

const skyLight=
new THREE.HemisphereLight(
    0xffffff,
    0x244455,
    2
);

scene.add(
    skyLight
);


const sun=
new THREE.DirectionalLight(
    0xffffff,
    2
);

sun.position.set(
    100,
    150,
    80
);

sun.castShadow=true;

scene.add(
    sun
);


/* =========================================
   OZEAN
========================================= */

const oceanGeometry=
new THREE.PlaneGeometry(
    3000,
    3000,
    100,
    100
);

const oceanMaterial=
new THREE.MeshStandardMaterial({

    color:0x176b9e,

    roughness:.25,

    metalness:.15

});

const ocean=
new THREE.Mesh(
    oceanGeometry,
    oceanMaterial
);

ocean.rotation.x=
-Math.PI/2;

ocean.position.y=
0;

scene.add(
    ocean
);


/* =========================================
   WASSER-WELLEN
========================================= */

const oceanPositions=
ocean.geometry.attributes.position;

const originalOceanPositions=[];

for(
    let i=0;
    i<oceanPositions.count;
    i++
){

    originalOceanPositions.push(
        oceanPositions.getY(i)
    );

}


/* =========================================
   SCHIFF LADEN
========================================= */

const loader=
new THREE.GLTFLoader();


loader.load(

    "./1.glb",

    function(gltf){

        ship=
        gltf.scene;


        /* Schiff-Größe */

        ship.scale.set(
            1,
            1,
            1
        );


        /* Startposition */

        ship.position.set(
            0,
            0,
            0
        );


        scene.add(
            ship
        );


        /* Schatten */

        ship.traverse(
            function(object){

                if(
                    object.isMesh
                ){

                    object.castShadow=true;

                    object.receiveShadow=true;

                }

            }
        );


        document
        .getElementById("loading")
        .style.display=
        "none";


        document
        .getElementById("message")
        .textContent=
        "🚢 Schiff geladen! Klicke zum Starten";


        console.log(
            "1.glb erfolgreich geladen"
        );

    },


    function(xhr){

        if(
            xhr.total
        ){

            const percent=
            Math.round(
                xhr.loaded/
                xhr.total*
                100
            );


            document
            .getElementById("loading")
            .innerHTML=

            `
            <div>
            🚢 Schiff wird geladen...
            <small>${percent}%</small>
            </div>
            `;

        }

    },


    function(error){

        console.error(
            error
        );


        document
        .getElementById("loading")
        .innerHTML=

        `
        <div>
        ❌ 1.glb konnte nicht geladen werden
        <small>
        Prüfe, ob 1.glb im selben Ordner wie index.html liegt.
        </small>
        </div>
        `;

    }

);


/* =========================================
   POINTER LOCK
========================================= */

renderer.domElement
.addEventListener(

    "click",

    function(){

        renderer
        .domElement
        .requestPointerLock();

    }

);


document
.addEventListener(

    "pointerlockchange",

    function(){

        pointerLocked=

        document.pointerLockElement===
        renderer.domElement;


        if(
            pointerLocked
        ){

            document
            .getElementById("message")
            .textContent=
            "🎣 Du bist auf dem Schiff";

        }

    }

);


/* =========================================
   MAUS
========================================= */

document
.addEventListener(

    "mousemove",

    function(event){

        if(
            !pointerLocked
        )return;


        yaw-=
        event.movementX*
        0.0025;


        pitch-=
        event.movementY*
        0.0025;


        pitch=
        Math.max(

            -1.4,

            Math.min(
                1.4,
                pitch
            )

        );

    }

);


/* =========================================
   TASTATUR
========================================= */

document
.addEventListener(

    "keydown",

    function(event){

        const key=
        event.key.toLowerCase();


        if(
            key in keys
        ){

            keys[key]=true;

        }

    }

);


document
.addEventListener(

    "keyup",

    function(event){

        const key=
        event.key.toLowerCase();


        if(
            key in keys
        ){

            keys[key]=false;

        }

    }

);


/* =========================================
   SPIELER AUF SCHIFF BEWEGEN
========================================= */

function updatePlayer(){

    if(
        !ship
    )return;


    const speed=
    0.045;


    const forward=
    new THREE.Vector3(

        -Math.sin(yaw),
        0,
        -Math.cos(yaw)

    );


    const right=
    new THREE.Vector3(

        Math.cos(yaw),
        0,
        -Math.sin(yaw)

    );


    if(
        keys.w
    ){

        playerOffset
        .addScaledVector(
            forward,
            speed
        );

    }


    if(
        keys.s
    ){

        playerOffset
        .addScaledVector(
            forward,
            -speed
        );

    }


    if(
        keys.a
    ){

        playerOffset
        .addScaledVector(
            right,
            -speed
        );

    }


    if(
        keys.d
    ){

        playerOffset
        .addScaledVector(
            right,
            speed
        );

    }


    /* Spieler auf Deck begrenzen */

    playerOffset.x=
    Math.max(
        -4,
        Math.min(
            4,
            playerOffset.x
        )
    );


    playerOffset.z=
    Math.max(
        -6,
        Math.min(
            6,
            playerOffset.z
        )
    );


    /*
       Kamera ist mit dem
       Schiff verbunden
    */

    const worldOffset=
    playerOffset
    .clone();


    worldOffset.applyQuaternion(
        ship.quaternion
    );


    camera.position.copy(
        ship.position
    );


    camera.position.add(
        worldOffset
    );


    camera.rotation.order=
    "YXZ";


    camera.rotation.y=
    yaw;


    camera.rotation.x=
    pitch;

}


/* =========================================
   SCHIFF BEWEGUNG
========================================= */

function updateShip(time){

    if(
        !ship
    )return;


    /* Sanftes Schaukeln */

    ship.rotation.z=
    Math.sin(
        time*
        0.0007
    )*
    0.025;


    ship.rotation.x=
    Math.sin(
        time*
        0.0005
    )*
    0.015;


    ship.position.y=
    Math.sin(
        time*
        0.001
    )*
    0.12;

}


/* =========================================
   WASSER ANIMIEREN
========================================= */

function updateOcean(time){

    for(
        let i=0;
        i<oceanPositions.count;
        i++
    ){

        const x=
        oceanPositions.getX(i);


        const z=
        oceanPositions.getZ(i);


        const wave=

        Math.sin(
            x*
            0.015+
            time*
            0.001
        )*

        0.18+

        Math.cos(
            z*
            0.02+
            time*
            0.0008
        )*

        0.12;


        oceanPositions.setY(
            i,
            wave
        );

    }


    oceanPositions.needsUpdate=
    true;


    ocean.geometry
    .computeVertexNormals();

}


/* =========================================
   RENDER LOOP
========================================= */

function animate(time){

    requestAnimationFrame(
        animate
    );


    updateOcean(
        time
    );


    updateShip(
        time
    );


    updatePlayer();


    renderer.render(
        scene,
        camera
    );

}


animate(
    0
);


/* =========================================
   FENSTERGRÖSSE
========================================= */

window
.addEventListener(

    "resize",

    function(){

        camera.aspect=

        innerWidth/
        innerHeight;


        camera
        .updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }

);

</script>

</body>
</html>
