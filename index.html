<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Eigenes AR Cube Game</title>

<style>
*{
box-sizing:border-box;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,sans-serif;
background:#000;
}

#info{
position:fixed;
top:15px;
left:50%;
transform:translateX(-50%);
z-index:10;

color:white;
background:#000b;

padding:12px 18px;

border-radius:12px;

text-align:center;

max-width:90%;
}

#start{
position:fixed;

left:50%;
top:50%;

transform:translate(-50%,-50%);

z-index:20;

border:none;

border-radius:14px;

padding:18px 30px;

font-size:20px;

font-weight:bold;

cursor:pointer;
}

#gps{
position:fixed;

bottom:15px;
left:15px;

z-index:10;

color:white;

background:#000b;

padding:10px;

border-radius:10px;

font-family:monospace;

font-size:12px;
}
</style>
</head>

<body>

<div id="info">
📦 Starte AR und platziere den Würfel auf einer Fläche
</div>

<button id="start">
📷 AR STARTEN
</button>

<div id="gps">
GPS wird noch nicht geladen...
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { ARButton } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/ARButton.js";


/* =========================================
   THREE.JS
========================================= */

const scene =
new THREE.Scene();


const camera =
new THREE.PerspectiveCamera(
70,
innerWidth / innerHeight,
0.01,
100
);


const renderer =
new THREE.WebGLRenderer({

antialias:true,
alpha:true

});


renderer.setSize(
innerWidth,
innerHeight
);


renderer.xr.enabled =
true;


document.body.appendChild(
renderer.domElement
);


/* =========================================
   LICHT
========================================= */

const light =
new THREE.HemisphereLight(

0xffffff,
0x444444,
2

);


scene.add(
light
);


/* =========================================
   WÜRFEL
========================================= */

const cube =
new THREE.Mesh(

new THREE.BoxGeometry(
0.25,
0.25,
0.25
),

new THREE.MeshStandardMaterial({

color:0x00ff55,

metalness:0.3,

roughness:0.4

})

);


cube.visible =
false;


scene.add(
cube
);


/* =========================================
   RETICLE
   Zeigt erkannte Fläche
========================================= */

const reticle =
new THREE.Mesh(

new THREE.RingGeometry(
0.08,
0.1,
32
)
);


reticle.rotation.x =
-Math.PI / 2;


reticle.matrixAutoUpdate =
false;


reticle.visible =
false;


scene.add(
reticle
);


/* =========================================
   GPS
========================================= */

let latitude =
null;

let longitude =
null;


function updateGPS(){

navigator.geolocation.getCurrentPosition(

function(position){

latitude =
position.coords.latitude;

longitude =
position.coords.longitude;


document
.getElementById("gps")
.innerHTML =

"GPS<br>" +

"Lat: " +
latitude.toFixed(6) +

"<br>" +

"Lon: " +
longitude.toFixed(6);

},

function(error){

document
.getElementById("gps")
.innerHTML =

"GPS nicht verfügbar";

},

{

enableHighAccuracy:true

}

);

}


updateGPS();


setInterval(
updateGPS,
5000
);


/* =========================================
   AR START
========================================= */

let hitTestSource =
null;

let localReferenceSpace =
null;


document
.getElementById("start")
.addEventListener(

"click",

async function(){

if(
!navigator.xr
){

document
.getElementById("info")
.textContent =

"❌ WebXR wird auf diesem Gerät nicht unterstützt.";

return;

}


try{


const session =

await navigator.xr.requestSession(

"immersive-ar",

{

requiredFeatures:[

"hit-test"

],

optionalFeatures:[

"dom-overlay"

],

domOverlay:{

root:document.body

}

}

);


renderer.xr.setSession(
session
);


document
.getElementById("start")
.style.display =
"none";


document
.getElementById("info")
.textContent =

"Bewege dein Handy und suche eine erkannte Fläche.";


const viewerSpace =

await session.requestReferenceSpace(

"viewer"

);


hitTestSource =

await session.requestHitTestSource({

space:viewerSpace

});


localReferenceSpace =

await session.requestReferenceSpace(

"local"

);


session.addEventListener(

"end",

function(){

hitTestSource =
null;

localReferenceSpace =
null;

cube.visible =
false;

}

);


}catch(error){

console.error(error);


document
.getElementById("info")
.textContent =

"❌ AR konnte nicht gestartet werden.";

}

}

);


/* =========================================
   WÜRFEL PLATZIEREN
========================================= */

let placed =
false;


renderer.domElement
.addEventListener(

"click",

function(){

if(
!reticle.visible
){

return;

}


if(
placed
){

return;

}


/*
   Der Würfel wird
   auf die erkannte
   reale Fläche gesetzt
*/

cube.position.setFromMatrixPosition(

reticle.matrix

);


cube.quaternion.setFromRotationMatrix(

reticle.matrix

);


cube.position.y +=
0.125;


cube.visible =
true;


placed =
true;


document
.getElementById("info")
.textContent =

"📦 Würfel platziert!";

}

);


/* =========================================
   AR LOOP
========================================= */

renderer.setAnimationLoop(

function(

time,
frame

){

if(

frame &&

hitTestSource &&

localReferenceSpace

){


const hitTestResults =

frame.getHitTestResults(

hitTestSource

);


if(

hitTestResults.length > 0

){


const hit =

hitTestResults[0];


const pose =

hit.getPose(

localReferenceSpace

);


reticle.visible =
true;


reticle.matrix.fromArray(

pose.transform.matrix

);


}else{

reticle.visible =
false;

}

}


/*
   Würfel dreht sich
*/

if(
cube.visible
){

cube.rotation.y +=
0.01;

}


renderer.render(

scene,
camera

);

}

);


/* =========================================
   RESIZE
========================================= */

window.addEventListener(

"resize",

function(){

camera.aspect =

innerWidth /
innerHeight;


camera.updateProjectionMatrix();


renderer.setSize(

innerWidth,
innerHeight

);

}

);

</script>

</body>
</html>
