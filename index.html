<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GLB FPS World</title>

<style>
*{
box-sizing:border-box;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:Arial,sans-serif;
}

canvas{
display:block;
}

#hud{
position:fixed;
top:12px;
left:12px;
z-index:9999;

background:#000c;
color:white;

padding:12px 16px;
border-radius:10px;

font-family:monospace;
font-size:14px;

pointer-events:none;
}

#crosshair{
position:fixed;
left:50%;
top:50%;

width:20px;
height:20px;

transform:translate(-50%,-50%);

pointer-events:none;

z-index:999;
}

#crosshair::before,
#crosshair::after{
content:"";

position:absolute;

background:white;

box-shadow:0 0 4px black;
}

#crosshair::before{
width:20px;
height:2px;

left:0;
top:9px;
}

#crosshair::after{
width:2px;
height:20px;

left:9px;
top:0;
}

#start{
position:fixed;

left:50%;
top:50%;

transform:translate(-50%,-50%);

z-index:10000;

padding:18px 30px;

border:none;

border-radius:12px;

font-size:20px;
font-weight:bold;

cursor:pointer;

background:white;
color:black;
}

#start:hover{
transform:translate(-50%,-50%) scale(1.05);
}
</style>
</head>

<body>

<div id="hud">
GLB WORLD<br>
Lädt...
</div>

<div id="crosshair"></div>

<button id="start">
▶ SPIEL STARTEN
</button>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import {
GLTFLoader
} from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";


/* =========================================================
   HUD
========================================================= */

const hud =
document.getElementById("hud");

function setHUD(text){

hud.innerHTML=text;

}


/* =========================================================
   SCENE
========================================================= */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x87ceeb);

scene.fog =
new THREE.Fog(
0x87ceeb,
40,
250
);


/* =========================================================
   CAMERA
========================================================= */

const camera =
new THREE.PerspectiveCamera(

75,

innerWidth / innerHeight,

0.1,

1000

);

camera.position.set(
0,
1.7,
10
);


/* =========================================================
   RENDERER
========================================================= */

const renderer =
new THREE.WebGLRenderer({

antialias:true

});

renderer.setSize(
innerWidth,
innerHeight
);

renderer.setPixelRatio(
Math.min(
devicePixelRatio,
2
)
);

renderer.shadowMap.enabled =
true;

renderer.shadowMap.type =
THREE.PCFSoftShadowMap;

document.body.appendChild(
renderer.domElement
);


/* =========================================================
   LIGHTING
========================================================= */

const hemi =
new THREE.HemisphereLight(

0xffffff,

0x446633,

2

);

scene.add(
hemi
);


const sun =
new THREE.DirectionalLight(

0xffffff,

3

);

sun.position.set(
50,
80,
30
);

sun.castShadow =
true;

sun.shadow.mapSize.width =
2048;

sun.shadow.mapSize.height =
2048;

sun.shadow.camera.left =
-60;

sun.shadow.camera.right =
60;

sun.shadow.camera.top =
60;

sun.shadow.camera.bottom =
-60;

scene.add(
sun
);


/* =========================================================
   GROUND
========================================================= */

const groundGeometry =
new THREE.PlaneGeometry(

500,

500,

50,

50

);


const groundMaterial =
new THREE.MeshStandardMaterial({

color:0x228822,

roughness:1,

metalness:0

});


const ground =
new THREE.Mesh(

groundGeometry,

groundMaterial

);


ground.rotation.x =
-Math.PI / 2;

ground.receiveShadow =
true;

scene.add(
ground
);


/* =========================================================
   GLB LOADER
========================================================= */

const loader =
new GLTFLoader();


let model =
null;


/* =========================================================
   AUTOMATISCH 1.glb LADEN
========================================================= */

setHUD(
"🌍 GLB WORLD<br>" +
"⏳ Lade 1.glb..."
);


loader.load(

"./1.glb",


function(gltf){

model =
gltf.scene;


/* ---------------------------------------------------------
   GRÖSSE AUTOMATISCH ANPASSEN
--------------------------------------------------------- */

const box =
new THREE.Box3()
.setFromObject(
model
);


const size =
new THREE.Vector3();


box.getSize(
size
);


const maxSize =
Math.max(

size.x,

size.y,

size.z

);


/*
   Maximale Größe
*/

const targetSize =
2.2;


const scale =
targetSize /
maxSize;


model.scale.setScalar(
scale
);


/* ---------------------------------------------------------
   MODELL POSITION
--------------------------------------------------------- */

/*
   Das Modell wird
   wie eine FPS-Waffe
   vor der Kamera platziert.
*/

camera.add(
model
);


model.position.set(

0.65,

-0.55,

-1.25

);


/*
   Drehen falls nötig
*/

model.rotation.set(

0,

Math.PI,

0

);


/* ---------------------------------------------------------
   SCHATTEN
--------------------------------------------------------- */

model.traverse(

function(object){

if(
object.isMesh
){

object.castShadow =
true;

object.receiveShadow =
true;

}

}

);


/* ---------------------------------------------------------
   HUD
--------------------------------------------------------- */

setHUD(

"🌍 GLB WORLD<br>" +

"✔ 1.glb geladen<br>" +

"📦 Größe automatisch angepasst<br>" +

"WASD = Laufen<br>" +

"Maus = Umschauen<br>" +

"Linksklick = Schuss"

);


console.log(
"GLB erfolgreich geladen:",
gltf
);

},


function(progress){

if(
progress.total
){

const percent =
Math.round(

progress.loaded /

progress.total *

100

);


setHUD(

"🌍 GLB WORLD<br>" +

"⏳ Lade 1.glb... " +

percent +

"%"

);

}else{

setHUD(

"🌍 GLB WORLD<br>" +

"⏳ Lade 1.glb..."

);

}

},


function(error){

console.error(
"GLB Fehler:",
error
);


setHUD(

"❌ FEHLER<br>" +

"1.glb konnte nicht geladen werden.<br><br>" +

"Die Datei muss genau so heißen:<br>" +

"<b>1.glb</b><br><br>" +

"Und im selben Ordner wie index.html liegen."

);

}

);


/* =========================================================
   PLAYER
========================================================= */

let yaw =
0;

let pitch =
0;


let gameStarted =
false;


const keys = {

w:false,

a:false,

s:false,

d:false

};


/* =========================================================
   START BUTTON
========================================================= */

const startButton =
document.getElementById(
"start"
);


startButton.addEventListener(

"click",

function(){

gameStarted =
true;


renderer.domElement
.requestPointerLock();


startButton.style.display =
"none";


}

);


/* =========================================================
   POINTER LOCK
========================================================= */

document.addEventListener(

"pointerlockchange",

function(){

if(

document.pointerLockElement ===
renderer.domElement

){

gameStarted =
true;

}else{

gameStarted =
false;

startButton.style.display =
"block";

}

}

);


/* =========================================================
   MOUSE LOOK
========================================================= */

document.addEventListener(

"mousemove",

function(event){

if(
!gameStarted
){

return;

}


yaw -=
event.movementX *
0.0025;


pitch -=
event.movementY *
0.0025;


/*
   Nicht komplett
   nach oben/unten drehen
*/

pitch =
Math.max(

-1.45,

Math.min(

1.45,

pitch

)

);


}

);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(

"keydown",

function(event){

const key =
event.key
.toLowerCase();


if(
key === "w"
){

keys.w =
true;

}


if(
key === "a"
){

keys.a =
true;

}


if(
key === "s"
){

keys.s =
true;

}


if(
key === "d"
){

keys.d =
true;

}

}

);


document.addEventListener(

"keyup",

function(event){

const key =
event.key
.toLowerCase();


if(
key === "w"
){

keys.w =
false;

}


if(
key === "a"
){

keys.a =
false;

}


if(
key === "s"
){

keys.s =
false;

}


if(
key === "d"
){

keys.d =
false;

}

}

);


/* =========================================================
   MOVEMENT
========================================================= */

const clock =
new THREE.Clock();


function updatePlayer(){

if(
!gameStarted
){

return;

}


const delta =
clock.getDelta();


const speed =
8;


/*
   Blickrichtung
*/

const forward =
new THREE.Vector3(

-Math.sin(
yaw
),

0,

-Math.cos(
yaw
)

);


const right =
new THREE.Vector3(

Math.cos(
yaw
),

0,

-Math.sin(
yaw
)

);


/*
   WASD
*/

if(
keys.w
){

camera.position.addScaledVector(

forward,

speed *
delta

);

}


if(
keys.s
){

camera.position.addScaledVector(

forward,

-speed *
delta

);

}


if(
keys.a
){

camera.position.addScaledVector(

right,

-speed *
delta

);

}


if(
keys.d
){

camera.position.addScaledVector(

right,

speed *
delta

);

}


/*
   Kamera Rotation
*/

camera.rotation.order =
"YXZ";


camera.rotation.y =
yaw;


camera.rotation.x =
pitch;


/*
   Spieler bleibt
   auf dem Boden
*/

camera.position.y =
1.7;

}


/* =========================================================
   SCHUSS ANIMATION
========================================================= */

let shooting =
false;

let recoil =
0;


document.addEventListener(

"mousedown",

function(event){

if(
!gameStarted
){

return;

}


if(
event.button !== 0
){

return;

}


shoot();

}

);


function shoot(){

if(
!model
){

return;

}


if(
shooting
){

return;

}


shooting =
true;


recoil =
0.12;


/*
   Leichte Schussanimation
*/

setTimeout(

function(){

shooting =
false;

},

120

);

}


/* =========================================================
   UPDATE WEAPON
========================================================= */

function updateWeapon(){

if(
!model
){

return;

}


/*
   Rückstoß
*/

if(
recoil > 0
){

model.position.z =
-1.25 +
recoil;


recoil *=
0.65;


if(
recoil <
0.005
){

recoil =
0;

}

}else{

model.position.z =
-1.25;

}


/*
   Kleine Idle-Bewegung
*/

const t =
performance.now() *
0.001;


model.position.y =

-0.55 +

Math.sin(
t * 2
) *
0.008;

}


/* =========================================================
   WORLD OBJECTS
========================================================= */

const objects =
new THREE.Group();

scene.add(
objects
);


/*
   Ein paar einfache
   Hindernisse
*/

for(
let i = 0;

i < 30;

i++
){

const cube =
new THREE.Mesh(

new THREE.BoxGeometry(

2,

2 +

Math.random() * 4,

2

),

new THREE.MeshStandardMaterial({

color:
0x777777

})

);


cube.position.set(

(Math.random() - 0.5) *
150,

cube.geometry.parameters.height / 2,

(Math.random() - 0.5) *
150

);


cube.castShadow =
true;

cube.receiveShadow =
true;


objects.add(
cube
);

}


/* =========================================================
   ANIMATION LOOP
========================================================= */

function animate(){

requestAnimationFrame(
animate
);


updatePlayer();


updateWeapon();


renderer.render(

scene,

camera

);

}


animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(

"resize",

function(){

camera.aspect =

innerWidth /
innerHeight;


camera.updateProjectionMatrix();


renderer.setSize(

innerWidth,

innerHeight

);

}

);

</script>

</body>
</html>
