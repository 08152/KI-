<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Monster GO – Chromebook</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

#camera{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#222;
}

#ui{
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
}

.panel{
    background:rgba(0,0,0,.72);
    color:white;
    border-radius:15px;
    padding:12px 16px;
    box-shadow:0 4px 20px rgba(0,0,0,.3);
    backdrop-filter:blur(8px);
}

#top{
    position:absolute;
    top:15px;
    left:15px;
    right:15px;
    display:flex;
    justify-content:space-between;
    gap:10px;
}

#title{
    font-size:19px;
    font-weight:bold;
}

#status{
    font-size:13px;
    margin-top:4px;
}

#counter{
    font-weight:bold;
}

#start{
    pointer-events:auto;
    border:0;
    border-radius:18px;
    padding:16px 25px;
    background:white;
    color:#111;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

#start:active{
    transform:scale(.96);
}

#message{
    position:absolute;
    left:50%;
    bottom:105px;
    transform:translateX(-50%);
    color:white;
    background:rgba(0,0,0,.78);
    padding:11px 16px;
    border-radius:13px;
    opacity:0;
    transition:.25s;
    text-align:center;
    white-space:nowrap;
}

#message.show{
    opacity:1;
}


/* ==========================================
   MONSTER
   ========================================== */

#monsterButton{
    position:absolute;

    left:50%;
    top:64%;

    transform:translate(-50%,-50%);

    width:190px;
    height:230px;

    border:0;
    background:transparent;

    display:none;

    pointer-events:auto;

    cursor:pointer;

    filter:drop-shadow(
        0 15px 12px rgba(0,0,0,.45)
    );

    animation:monsterAppear .5s ease-out;
}

@keyframes monsterAppear{

    from{
        opacity:0;
        transform:
            translate(-50%,-35%)
            scale(.5);
    }

    to{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1);
    }
}

.monsterBody{

    position:absolute;

    left:50%;
    top:70px;

    transform:translateX(-50%);

    width:105px;
    height:105px;

    border-radius:
        48% 48% 42% 42%;

    background:
        linear-gradient(
            150deg,
            #76ef91,
            #37b95e
        );

    border:4px solid #237b3d;
}

.eye{

    position:absolute;

    top:105px;

    width:17px;
    height:23px;

    border-radius:50%;

    background:#111;

    z-index:4;
}

.eye.left{
    left:72px;
}

.eye.right{
    left:103px;
}

.eye::after{

    content:"";

    position:absolute;

    width:5px;
    height:7px;

    background:white;

    border-radius:50%;

    left:3px;
    top:3px;
}

.ear{

    position:absolute;

    top:40px;

    width:42px;
    height:60px;

    background:#49ca6b;

    border:4px solid #237b3d;

    clip-path:
        polygon(
            50% 0,
            100% 100%,
            0 100%
        );

    z-index:1;
}

.ear.left{

    left:48px;

    transform:rotate(-22deg);
}

.ear.right{

    left:105px;

    transform:rotate(22deg);
}

.mouth{

    position:absolute;

    left:50%;

    top:150px;

    transform:translateX(-50%);

    width:30px;
    height:13px;

    border-bottom:4px solid #17652f;

    border-radius:
        0 0 50% 50%;

    z-index:5;
}

.monsterShadow{

    position:absolute;

    left:50%;

    bottom:15px;

    transform:translateX(-50%);

    width:105px;
    height:25px;

    background:rgba(0,0,0,.35);

    border-radius:50%;

    filter:blur(5px);
}

#monsterName{

    position:absolute;

    top:185px;

    left:0;
    right:0;

    text-align:center;

    color:white;

    font-size:18px;

    font-weight:bold;

    text-shadow:
        0 2px 5px #000;

    z-index:10;
}


/* ==========================================
   FANGEN
   ========================================== */

#monsterButton.catching{

    animation:
        catchMonster .45s ease-in forwards;
}

@keyframes catchMonster{

    0%{
        transform:
            translate(-50%,-50%)
            scale(1);
    }

    40%{
        transform:
            translate(-50%,-50%)
            scale(1.15);
    }

    100%{
        transform:
            translate(-50%,-50%)
            scale(0);

        opacity:0;
    }
}


/* ==========================================
   STARTSCREEN
   ========================================== */

#permission{

    position:fixed;

    inset:0;

    background:
        linear-gradient(
            #10151b,
            #18231d
        );

    z-index:30;

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:25px;
}

.box{
    max-width:500px;
}

.box h1{
    font-size:32px;
}

.box p{
    line-height:1.5;
    color:#ddd;
}

.small{
    font-size:12px;
    color:#999 !important;
}
</style>
</head>


<body>

<!-- KAMERA -->
<video
    id="camera"
    autoplay
    muted
    playsinline>
</video>


<div id="ui">

    <!-- OBERE ANZEIGE -->
    <div id="top">

        <div class="panel">

            <div id="title">
                👾 MONSTER GO
            </div>

            <div id="status">
                Bereit
            </div>

        </div>

        <div class="panel">

            Gefangen:
            <span id="counter">0</span>

        </div>

    </div>


    <!-- MONSTER -->
    <button id="monsterButton">

        <div class="ear left"></div>
        <div class="ear right"></div>

        <div class="monsterBody"></div>

        <div class="eye left"></div>
        <div class="eye right"></div>

        <div class="mouth"></div>

        <div class="monsterShadow"></div>

        <div id="monsterName">
            Grünling
        </div>

    </button>


    <div id="message"></div>

</div>


<!-- START -->
<div id="permission">

    <div class="box">

        <h1>
            👾 MONSTER GO
        </h1>

        <p>
            Testversion für Chromebook
        </p>

        <p>
            Nach dem Start erscheint sofort
            ein Monster.
        </p>

        <button id="start">
            📷 SPIEL STARTEN
        </button>

        <p class="small">
            Die Kamera wird nach dem Start
            angefragt.
        </p>

    </div>

</div>


<script>

/* =========================================================
   DEINE ORTE
   =========================================================

   Später einfach eine Zeile hinzufügen:

   addLocation(
       "Park",
       48.1234,
       11.5678,
       "Grünling"
   );

   ========================================================= */

const LOCATIONS=[];


function addLocation(
    name,
    latitude,
    longitude,
    monster
){

    LOCATIONS.push({

        name:name,
        latitude:latitude,
        longitude:longitude,
        monster:monster,
        found:false

    });

}


/* ==========================================
   ELEMENTE
   ========================================== */

const video =
    document.getElementById("camera");

const permission =
    document.getElementById("permission");

const start =
    document.getElementById("start");

const status =
    document.getElementById("status");

const counter =
    document.getElementById("counter");

const message =
    document.getElementById("message");

const monsterButton =
    document.getElementById("monsterButton");

const monsterName =
    document.getElementById("monsterName");


let stream=null;

let caught=0;

let activeLocation=null;

let latitude=null;

let longitude=null;


/* ==========================================
   START
   ========================================== */

start.addEventListener(
    "click",
    async()=>{

        permission.style.display="none";

        status.textContent=
            "Kamera wird gestartet...";

        await startCamera();

        /*
           SOFORTIGES TESTMONSTER
        */

        setTimeout(
            spawnTestMonster,
            500
        );

    }
);


/* ==========================================
   KAMERA
   ========================================== */

async function startCamera(){

    try{

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            status.textContent=
                "Kamera nicht verfügbar";

            return;

        }


        stream=
            await navigator.mediaDevices
            .getUserMedia({

                video:{
                    facingMode:{
                        ideal:"environment"
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }
                },

                audio:false

            });


        video.srcObject=stream;

        await video.play();

        status.textContent=
            "👾 Suche nach Monstern...";

        startGPS();

    }
    catch(error){

        console.error(error);

        status.textContent=
            "Kamera konnte nicht gestartet werden";

    }

}


/* ==========================================
   TESTMONSTER
   ========================================== */

function spawnTestMonster(){

    if(activeLocation)
        return;


    activeLocation={

        name:"Testort",

        monster:"Grünling",

        found:true

    };


    monsterName.textContent=
        activeLocation.monster;


    monsterButton.classList.remove(
        "catching"
    );


    monsterButton.style.display=
        "block";


    status.textContent=
        "👾 Monster entdeckt!";


    showMessage(
        "👾 Ein Grünling ist aufgetaucht!"
    );

}


/* ==========================================
   MONSTER FANGEN
   ========================================== */

monsterButton.addEventListener(
    "click",
    catchMonster
);


monsterButton.addEventListener(
    "touchend",
    event=>{

        event.preventDefault();

        catchMonster();

    }
);


function catchMonster(){

    if(!activeLocation)
        return;


    monsterButton.classList.add(
        "catching"
    );


    caught++;

    counter.textContent=
        caught;


    showMessage(
        "🎉 " +
        activeLocation.monster +
        " gefangen!"
    );


    setTimeout(
        ()=>{

            monsterButton.style.display=
                "none";

            monsterButton.classList.remove(
                "catching"
            );

            activeLocation=null;

            status.textContent=
                "Monster gefangen!";

        },
        450
    );

}


/* ==========================================
   GPS
   ========================================== */

function startGPS(){

    if(!navigator.geolocation){

        status.textContent=
            "Testmodus aktiv";

        return;
    }


    navigator.geolocation.watchPosition(

        position=>{

            latitude=
                position.coords.latitude;

            longitude=
                position.coords.longitude;

            checkLocations();

        },

        ()=>{
            /*
              Kein GPS:
              Der Testmodus funktioniert trotzdem.
            */
        },

        {
            enableHighAccuracy:true,

            maximumAge:5000,

            timeout:10000

        }

    );

}


/* ==========================================
   ORTE PRÜFEN
   ========================================== */

function checkLocations(){

    if(
        latitude===null ||
        longitude===null
    )
        return;


    for(
        const location of LOCATIONS
    ){

        if(location.found)
            continue;


        const distance=
            distanceMeters(

                latitude,
                longitude,

                location.latitude,
                location.longitude

            );


        /*
           50 Meter Fangradius
        */

        if(distance<=50){

            location.found=true;

            activeLocation={
                name:location.name,
                monster:location.monster,
                found:true
            };


            monsterName.textContent=
                location.monster;


            monsterButton.style.display=
                "block";


            status.textContent=
                "👾 Monster entdeckt!";


            showMessage(
                "👾 " +
                location.monster +
                " wurde entdeckt!"
            );


            break;

        }

    }

}


/* ==========================================
   ENTFERNUNG
   ========================================== */

function distanceMeters(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R=6371000;

    const p1=
        lat1*Math.PI/180;

    const p2=
        lat2*Math.PI/180;

    const dLat=
        (lat2-lat1)*
        Math.PI/180;

    const dLon=
        (lon2-lon1)*
        Math.PI/180;


    const a=
        Math.sin(dLat/2)*
        Math.sin(dLat/2)

        +

        Math.cos(p1)*
        Math.cos(p2)*
        Math.sin(dLon/2)*
        Math.sin(dLon/2);


    return R*
        2*
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );

}


/* ==========================================
   NACHRICHT
   ========================================== */

function showMessage(text){

    message.textContent=text;

    message.classList.add("show");


    clearTimeout(
        showMessage.timer
    );


    showMessage.timer=
        setTimeout(
            ()=>{

                message.classList.remove(
                    "show"
                );

            },
            3000
        );

}


/* ==========================================
   TESTFUNKTION
   ==========================================

   In der Chrome-Konsole:

   testMonster("Feufox");

   ========================================== */

window.testMonster=function(
    name="Testmonster"
){

    activeLocation={

        name:"Test",

        monster:name,

        found:true

    };


    monsterName.textContent=name;

    monsterButton.classList.remove(
        "catching"
    );

    monsterButton.style.display=
        "block";

    status.textContent=
        "👾 Monster entdeckt!";

    showMessage(
        "👾 "+name+" ist aufgetaucht!"
    );

};

</script>

</body>
</html>
