<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>3D Fishing Simulator</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87cfff;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    width:10px;
    height:10px;
    transform:translate(-50%,-50%);
    z-index:20;
    pointer-events:none;
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:#fff;
    box-shadow:0 0 3px #000;
}

#crosshair:before{
    width:10px;
    height:2px;
    top:4px;
}

#crosshair:after{
    width:2px;
    height:10px;
    left:4px;
}

#hud,
#bucket{
    position:fixed;
    z-index:30;
    color:white;
    background:rgba(0,0,0,.62);
    border-radius:13px;
    padding:13px 17px;
}

#hud{
    left:15px;
    top:15px;
    line-height:1.6;
}

#bucket{
    right:15px;
    top:15px;
    min-width:150px;
}

#hint{
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:30;
    background:rgba(0,0,0,.65);
    color:white;
    padding:12px 20px;
    border-radius:12px;
    text-align:center;
}

#message{
    position:fixed;
    top:18%;
    left:50%;
    transform:translateX(-50%);
    z-index:50;
    background:rgba(0,0,0,.75);
    color:white;
    padding:14px 24px;
    border-radius:13px;
    font-size:21px;
    font-weight:bold;
    opacity:0;
    transition:.2s;
}

#tableHUD,
#backButton,
#putBucket{
    display:none;
    position:fixed;
    z-index:60;
}

#tableHUD{
    top:20px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    background:rgba(0,0,0,.7);
    padding:13px 20px;
    border-radius:12px;
    text-align:center;
}

#backButton{
    right:20px;
    bottom:20px;
    padding:13px 20px;
    border:0;
    border-radius:12px;
    background:#e85d5d;
    color:white;
    font-weight:bold;
}

#putBucket{
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    padding:15px 25px;
    border:0;
    border-radius:13px;
    background:#ffd83d;
    font-weight:bold;
    font-size:17px;
}
</style>
</head>

<body>

<div id="crosshair"></div>

<div id="hud">
    <b>🎣 3D FISHING</b><br>
    💰 Geld: <span id="money">0</span>€<br>
    🐟 Fische: <span id="fishCount">0</span>
</div>

<div id="bucket">
    🪣 <b>Eimer</b>
    <div id="bucketList">Leer</div>
</div>

<div id="message"></div>

<div id="hint">
    WASD = bewegen · Maus = schauen<br>
    Linksklick = auswerfen / einholen<br>
    Q = Fisch in den Eimer · E = Fischtisch
</div>

<div id="tableHUD">
    🔪 3D-FISCHTISCH<br>
    Linksklick = Bearbeiten
</div>

<button id="putBucket">
    Q – Fisch in den Eimer
</button>

<button id="backButton">
    E – Zurück zum Ufer
</button>


<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script>

/* =========================================================
   SZENE
========================================================= */

const scene=new THREE.Scene();

scene.background=
    new THREE.Color(0x87cfff);

scene.fog=
    new THREE.Fog(
        0x87cfff,
        35,
        140
    );


/* =========================================================
   KAMERA
========================================================= */

const camera=
    new THREE.PerspectiveCamera(
        75,
        innerWidth/innerHeight,
        .01,
        500
    );


/* =========================================================
   RENDERER
========================================================= */

const renderer=
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.outputEncoding=
    THREE.sRGBEncoding;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LICHT
========================================================= */

scene.add(
    new THREE.HemisphereLight(
        0xbfeaff,
        0x50703d,
        1.1
    )
);

const sun=
    new THREE.DirectionalLight(
        0xffffff,
        1.3
    );

sun.position.set(
    30,
    40,
    15
);

scene.add(sun);


/* =========================================================
   SPIELER
========================================================= */

const player=
    new THREE.Object3D();

/*
   Spawn direkt am Ufer.
*/

player.position.set(
    0,
    1.7,
    6
);

scene.add(player);

player.add(camera);


/* =========================================================
   BODEN
========================================================= */

const ground=
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            200,
            200
        ),
        new THREE.MeshStandardMaterial({
            color:0x4f9846,
            roughness:1
        })
    );

ground.rotation.x=
    -Math.PI/2;

scene.add(ground);


/* =========================================================
   SAND AM UFER
========================================================= */

const sand=
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            200,
            6
        ),
        new THREE.MeshStandardMaterial({
            color:0xc8b27a,
            roughness:1
        })
    );

sand.rotation.x=
    -Math.PI/2;

sand.position.set(
    0,
    .01,
    -1
);

scene.add(sand);


/* =========================================================
   WASSER
========================================================= */

const water=
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            200,
            100
        ),
        new THREE.MeshStandardMaterial({
            color:0x087daf,
            roughness:.25,
            metalness:.05
        })
    );

water.rotation.x=
    -Math.PI/2;

water.position.set(
    0,
    .035,
    -52
);

scene.add(water);


/* =========================================================
   KLEINE WELLEN
========================================================= */

const waves=[];

for(let i=0;i<85;i++){

    const wave=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                .7+Math.random()*1.5,
                .035
            ),
            new THREE.MeshBasicMaterial({
                color:0xa8edff,
                transparent:true,
                opacity:.20,
                side:THREE.DoubleSide
            })
        );

    wave.rotation.x=
        -Math.PI/2;

    wave.position.set(
        (Math.random()-.5)*90,
        .075,
        -3-Math.random()*95
    );

    wave.userData={
        baseX:wave.position.x,
        phase:Math.random()*Math.PI*2,
        speed:.15+Math.random()*.25
    };

    scene.add(wave);

    waves.push(wave);
}


/* =========================================================
   3D ANGEL
========================================================= */

const rodGroup=
    new THREE.Group();

/*
   WICHTIG:
   Die Angel ist jetzt gerade ausgerichtet.
   Keine schräge Grundrotation.
*/

rodGroup.position.set(
    .55,
    -.43,
    -1.15
);

rodGroup.rotation.set(
    0,
    0,
    0
);

camera.add(rodGroup);


/* =========================================================
   ANGELGRIFF
========================================================= */

const grip=
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            .075,
            .085,
            .55,
            16
        ),
        new THREE.MeshStandardMaterial({
            color:0x4c2d19,
            roughness:.8
        })
    );

grip.rotation.z=
    -Math.PI/2;

grip.position.x=
    -.2;

rodGroup.add(grip);


/* =========================================================
   RUTENBLANK
========================================================= */

const rod=
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            .014,
            .035,
            3.5,
            14
        ),
        new THREE.MeshStandardMaterial({
            color:0x222d32,
            roughness:.35,
            metalness:.25
        })
    );

rod.rotation.z=
    -Math.PI/2;

rod.position.x=
    1.65;

rodGroup.add(rod);


/* =========================================================
   RUTENSPITZE
========================================================= */

const rodTip=
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            .006,
            .015,
            .8,
            10
        ),
        new THREE.MeshStandardMaterial({
            color:0xd9e6e8,
            roughness:.25,
            metalness:.2
        })
    );

rodTip.rotation.z=
    -Math.PI/2;

rodTip.position.x=
    3.8;

rodGroup.add(rodTip);


/* =========================================================
   RINGE
========================================================= */

for(let i=0;i<6;i++){

    const ring=
        new THREE.Mesh(
            new THREE.TorusGeometry(
                .034,
                .008,
                6,
                12
            ),
            new THREE.MeshStandardMaterial({
                color:0xc8c8c8,
                metalness:.8,
                roughness:.2
            })
        );

    ring.rotation.y=
        Math.PI/2;

    ring.position.x=
        .35+i*.58;

    rodGroup.add(ring);
}


/* =========================================================
   ANGELROLLE
========================================================= */

const reel=
    new THREE.Group();

reel.position.set(
    .05,
    -.13,
    .05
);

rodGroup.add(reel);


/* Spule */

const spool=
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            .16,
            .16,
            .1,
            24
        ),
        new THREE.MeshStandardMaterial({
            color:0x30363a,
            metalness:.85,
            roughness:.22
        })
    );

spool.rotation.z=
    Math.PI/2;

reel.add(spool);


/* Rollenrahmen */

const reelFrame=
    new THREE.Mesh(
        new THREE.TorusGeometry(
            .19,
            .025,
            8,
            20
        ),
        new THREE.MeshStandardMaterial({
            color:0x555b60,
            metalness:.8,
            roughness:.25
        })
    );

reelFrame.rotation.y=
    Math.PI/2;

reel.add(reelFrame);


/* Kurbel */

const crank=
    new THREE.Group();

crank.position.set(
    0,
    0,
    -.14
);

reel.add(crank);

const crankArm=
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .28,
            .035,
            .035
        ),
        new THREE.MeshStandardMaterial({
            color:0x25292c,
            metalness:.8
        })
    );

crank.add(crankArm);

const crankHandle=
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            .035,
            .035,
            .18,
            10
        ),
        new THREE.MeshStandardMaterial({
            color:0x111315
        })
    );

crankHandle.rotation.z=
    Math.PI/2;

crankHandle.position.x=
    .14;

crank.add(crankHandle);


/* =========================================================
   SCHNUR
========================================================= */

let fishingLine=null;

const lineMaterial=
    new THREE.LineBasicMaterial({
        color:0xf5f5f5
    });


function getRodTip(){

    const p=
        new THREE.Vector3(
            4.15,
            0,
            0
        );

    rodGroup.localToWorld(p);

    return p;
}


/* =========================================================
   SCHWIMMER
========================================================= */

const bobber=
    new THREE.Group();

const bobTop=
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .11,
            16,
            12
        ),
        new THREE.MeshStandardMaterial({
            color:0xed3838
        })
    );

bobber.add(bobTop);

const bobBottom=
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .075,
            14,
            10
        ),
        new THREE.MeshStandardMaterial({
            color:0xffffff
        })
    );

bobBottom.position.y=
    -.11;

bobber.add(bobBottom);

bobber.visible=false;

scene.add(bobber);


/* =========================================================
   FISCH
========================================================= */

let fish=null;
let fishTime=0;
let caughtFish=null;

function createFish(){

    const g=
        new THREE.Group();


    const body=
        new THREE.Mesh(
            new THREE.SphereGeometry(
                1,
                28,
                18
            ),
            new THREE.MeshStandardMaterial({
                color:0x748e91,
                roughness:.62
            })
        );

    body.scale.set(
        1.5,
        .58,
        .55
    );

    g.add(body);


    const belly=
        new THREE.Mesh(
            new THREE.SphereGeometry(
                1,
                20,
                14
            ),
            new THREE.MeshStandardMaterial({
                color:0xb9c4bd,
                roughness:.75
            })
        );

    belly.scale.set(
        1.15,
        .32,
        .48
    );

    belly.position.y=
        -.28;

    g.add(belly);


    const tail=
        new THREE.Mesh(
            new THREE.ConeGeometry(
                .65,
                1,
                4
            ),
            new THREE.MeshStandardMaterial({
                color:0x506d72
            })
        );

    tail.rotation.z=
        Math.PI/2;

    tail.position.x=
        -1.4;

    g.add(tail);


    const eye=
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .09,
                14,
                10
            ),
            new THREE.MeshStandardMaterial({
                color:0x111111
            })
        );

    eye.position.set(
        1.05,
        .17,
        -.43
    );

    g.add(eye);


    const fin=
        new THREE.Mesh(
            new THREE.ConeGeometry(
                .25,
                .7,
                3
            ),
            new THREE.MeshStandardMaterial({
                color:0x607c80
            })
        );

    fin.rotation.z=
        Math.PI;

    fin.position.y=
        .48;

    g.add(fin);

    return g;
}


/* =========================================================
   FISCHE
========================================================= */

const fishTypes=[
    ["Forelle",20],
    ["Karpfen",30],
    ["Hecht",40],
    ["Zander",50],
    ["Goldforelle",100]
];

function randomFish(){

    const f=
        fishTypes[
            Math.floor(
                Math.random()*fishTypes.length
            )
        ];

    return {
        name:f[0],
        price:f[1]
    };
}


/* =========================================================
   STATUS
========================================================= */

let state="idle";

let bucket=[];

let money=0;

let castStart=null;
let castTarget=null;
let castProgress=0;

let reelProgress=0;
let reelStart=null;


/* =========================================================
   AUSWERFEN
========================================================= */

function cast(){

    if(state!=="idle")
        return;

    state="casting";

    castProgress=0;

    castStart=
        getRodTip();

    castTarget=
        new THREE.Vector3(
            (Math.random()-.5)*5,
            .08,
            -8-Math.random()*12
        );

    bobber.position.copy(
        castStart
    );

    bobber.visible=true;

    if(fishingLine)
        scene.remove(
            fishingLine
        );

    fishingLine=
        new THREE.Line(
            new THREE.BufferGeometry(),
            lineMaterial
        );

    scene.add(
        fishingLine
    );

    showMessage(
        "🎣 Auswerfen..."
    );
}


/* =========================================================
   BISS
========================================================= */

function startBite(){

    if(state!=="waiting")
        return;

    state="biting";

    showMessage(
        "🐟 BISS!"
    );

    let t=0;

    const timer=
        setInterval(()=>{

            if(state!=="biting"){
                clearInterval(timer);
                return;
            }

            t+=.8;

            bobber.position.y=
                .08+
                Math.sin(t)*.14;

        },70);

    setTimeout(()=>{

        clearInterval(timer);

        if(state==="biting")
            catchFish();

    },1100);
}


/* =========================================================
   FISCH FANGEN
========================================================= */

function catchFish(){

    state="fish";

    caughtFish=
        randomFish();

    fish=
        createFish();

    fish.scale.setScalar(
        .62
    );

    fish.position.copy(
        bobber.position
    );

    fish.position.y=
        .72;

    scene.add(
        fish
    );

    bobber.visible=false;

    if(fishingLine)
        fishingLine.visible=false;

    document.getElementById(
        "putBucket"
    ).style.display=
        "block";

    showMessage(
        "🐟 "+
        caughtFish.name+
        " hängt an der Angel!"
    );
}


/* =========================================================
   EINHOLEN
========================================================= */

function startReel(){

    if(state!=="fish")
        return;

    state="reeling";

    reelProgress=0;

    reelStart=
        fish.position.clone();

    showMessage(
        "🎣 Einholen..."
    );
}


/* =========================================================
   EIMER
========================================================= */

function putFishInBucket(){

    if(
        !caughtFish ||
        (
            state!=="fish" &&
            state!=="fishReady"
        )
    )
        return;

    bucket.push(
        caughtFish
    );

    caughtFish=null;

    if(fish){

        scene.remove(
            fish
        );

        fish=null;
    }

    document.getElementById(
        "putBucket"
    ).style.display=
        "none";

    document.getElementById(
        "fishCount"
    ).textContent=
        bucket.length;

    updateBucket();

    state="idle";

    showMessage(
        "🪣 Fisch im Eimer!"
    );
}


document.getElementById(
    "putBucket"
).onclick=
    putFishInBucket;


function updateBucket(){

    const list=
        document.getElementById(
            "bucketList"
        );

    if(bucket.length===0){

        list.textContent=
            "Leer";

        return;
    }

    list.innerHTML="";

    bucket.forEach(
        f=>{

            const d=
                document.createElement(
                    "div"
                );

            d.textContent=
                "🐟 "+f.name;

            list.appendChild(d);
        }
    );
}


/* =========================================================
   3D FISCHTISCH
========================================================= */

const tableScene=
    new THREE.Group();

tableScene.visible=false;

scene.add(
    tableScene
);


/* Tisch */

const tableTop=
    new THREE.Mesh(
        new THREE.BoxGeometry(
            9,
            .45,
            6
        ),
        new THREE.MeshStandardMaterial({
            color:0x9c6335,
            roughness:.8
        })
    );

tableTop.position.set(
    0,
    1.3,
    -5
);

tableScene.add(
    tableTop
);


/* Beine */

for(
    const x of [-3.7,3.7]
){

    for(
        const z of [-2.2,2.2]
    ){

        const leg=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .45,
                    2.6,
                    .45
                ),
                new THREE.MeshStandardMaterial({
                    color:0x60391f
                })
            );

        leg.position.set(
            x,
            0,
            -5+z
        );

        tableScene.add(
            leg
        );
    }
}


/* Schneidebrett */

const board=
    new THREE.Mesh(
        new THREE.BoxGeometry(
            5.4,
            .2,
            2.5
        ),
        new THREE.MeshStandardMaterial({
            color:0xc28c54
        })
    );

board.position.set(
    0,
    1.64,
    -5
);

tableScene.add(
    board
);


/* Tischfisch */

let tableFish=null;

function openTable(){

    if(bucket.length===0){

        showMessage(
            "🪣 Dein Eimer ist leer."
        );

        return;
    }

    state="table";

    tableScene.visible=true;

    tableFish=
        createFish();

    tableFish.scale.setScalar(
        .8
    );

    tableFish.position.set(
        0,
        1.93,
        -5
    );

    tableScene.add(
        tableFish
    );

    player.position.set(
        0,
        3.7,
        1.8
    );

    player.rotation.y=0;

    camera.rotation.x=
        -.35;

    document.getElementById(
        "tableHUD"
    ).style.display=
        "block";

    document.getElementById(
        "backButton"
    ).style.display=
        "block";

    showMessage(
        "🔪 3D-Fischtisch"
    );
}


/* =========================================================
   3D ZYLINDER-WERKZEUG
========================================================= */

const tool=
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            .13,
            .13,
            2.5,
            20
        ),
        new THREE.MeshStandardMaterial({
            color:0xbcc4c8,
            metalness:.75,
            roughness:.25
        })
    );

tool.rotation.z=
    Math.PI/2;

tool.position.set(
    -4,
    2,
    -5
);

tool.visible=false;

tableScene.add(
    tool
);


/* Griff */

const toolGrip=
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            .18,
            .18,
            .9,
            16
        ),
        new THREE.MeshStandardMaterial({
            color:0x4b301e
        })
    );

toolGrip.rotation.z=
    Math.PI/2;

toolGrip.position.x=
    -1.65;

tool.add(
    toolGrip
);


/* =========================================================
   TISCH-BEARBEITUNG
========================================================= */

let tableWorking=false;

renderer.domElement.addEventListener(
    "click",
    ()=>{

        if(
            state!=="table" ||
            tableWorking ||
            !tableFish
        )
            return;

        tableWorking=true;

        tool.visible=true;

        tool.position.set(
            -4,
            2,
            -5
        );

        const start=
            tool.position.clone();

        const end=
            new THREE.Vector3(
                1.4,
                2,
                -5
            );

        let p=0;

        function moveTool(){

            p+=.025;

            tool.position.lerpVectors(
                start,
                end,
                Math.min(p,1)
            );

            if(p<1){

                requestAnimationFrame(
                    moveTool
                );

            }else{

                setTimeout(
                    finishTable,
                    500
                );
            }
        }

        moveTool();
    }
);


/* =========================================================
   TISCH FERTIG
========================================================= */

function finishTable(){

    if(tableFish){

        tableScene.remove(
            tableFish
        );

        tableFish=null;
    }

    tool.visible=false;

    if(bucket.length>0){

        const f=
            bucket.shift();

        money+=
            Math.round(
                f.price*1.5
            );

        document.getElementById(
            "money"
        ).textContent=
            money;

        document.getElementById(
            "fishCount"
        ).textContent=
            bucket.length;

        updateBucket();
    }

    tableWorking=false;

    showMessage(
        "✅ Fisch vorbereitet!"
    );
}


/* =========================================================
   ZURÜCK ZUM UFER
========================================================= */

function closeTable(){

    tableScene.visible=false;

    if(tableFish){

        tableScene.remove(
            tableFish
        );

        tableFish=null;
    }

    tool.visible=false;

    tableWorking=false;

    document.getElementById(
        "tableHUD"
    ).style.display=
        "none";

    document.getElementById(
        "backButton"
    ).style.display=
        "none";

    player.position.set(
        0,
        1.7,
        6
    );

    player.rotation.y=0;

    camera.rotation.x=0;

    state="idle";
}

document.getElementById(
    "backButton"
).onclick=
    closeTable;


/* =========================================================
   TASTATUR
========================================================= */

const keys={};

document.addEventListener(
    "keydown",
    e=>{

        keys[e.code]=true;

        if(
            e.code==="KeyQ"
        ){

            putFishInBucket();
        }

        if(
            e.code==="KeyE"
        ){

            if(state==="idle"){

                if(bucket.length>0)
                    openTable();

            }else if(
                state==="table"
            ){

                closeTable();
            }
        }
    }
);

document.addEventListener(
    "keyup",
    e=>{
        keys[e.code]=false;
    }
);


/* =========================================================
   MAUS / POINTER LOCK
========================================================= */

document.body.addEventListener(
    "click",
    ()=>{
        if(state!=="table"){

            document.body.requestPointerLock();
        }
    }
);


document.addEventListener(
    "mousedown",
    e=>{

        if(e.button!==0)
            return;

        if(state==="idle")
            cast();

        else if(state==="fish")
            startReel();
    }
);


let yaw=0;
let pitch=0;

document.addEventListener(
    "mousemove",
    e=>{

        if(
            document.pointerLockElement!==document.body
        )
            return;

        yaw-=
            e.movementX*.002;

        pitch-=
            e.movementY*.002;

        pitch=
            Math.max(
                -Math.PI/2,
                Math.min(
                    Math.PI/2,
                    pitch
                )
            );

        player.rotation.y=
            yaw;

        camera.rotation.x=
            pitch;
    }
);


/* =========================================================
   GAME LOOP
========================================================= */

const clock=
    new THREE.Clock();

function animate(){

    requestAnimationFrame(
        animate
    );

    const delta=
        Math.min(
            clock.getDelta(),
            .05
        );


    /* -----------------------------------------
       BEWEGUNG
    ----------------------------------------- */

    if(state!=="table"){

        const dir=
            new THREE.Vector3();

        if(keys["KeyW"])
            dir.z-=1;

        if(keys["KeyS"])
            dir.z+=1;

        if(keys["KeyA"])
            dir.x-=1;

        if(keys["KeyD"])
            dir.x+=1;

        if(dir.lengthSq()>0){

            dir.normalize();

            dir.applyEuler(
                new THREE.Euler(
                    0,
                    player.rotation.y,
                    0
                )
            );

            player.position.addScaledVector(
                dir,
                4.5*delta
            );
        }


        /*
           Nicht ins Wasser laufen.
        */

        if(player.position.z<1)
            player.position.z=1;
    }


    /* -----------------------------------------
       KLEINE WELLEN
    ----------------------------------------- */

    const now=
        performance.now()*.001;

    waves.forEach(
        (w,i)=>{

            w.position.x=
                w.userData.baseX+
                Math.sin(
                    now*w.userData.speed+
                    w.userData.phase
                )*.6;

            w.rotation.z=
                Math.sin(
                    now*.5+i
                )*.05;
        }
    );


    /* -----------------------------------------
       AUSWERFEN
    ----------------------------------------- */

    if(state==="casting"){

        castProgress+=
            delta/.75;

        const p=
            Math.min(
                castProgress,
                1
            );


        const pos=
            new THREE.Vector3().lerpVectors(
                castStart,
                castTarget,
                p
            );


        /*
           Leichte Parabel.
        */

        pos.y+=
            Math.sin(
                p*Math.PI
            )*2.2;

        bobber.position.copy(
            pos
        );


        /*
           Angel bewegt sich beim
           Auswerfen nach vorne.
        */

        rodGroup.rotation.x=
            Math.sin(
                p*Math.PI
            )*.12;


        if(p>=1){

            state="waiting";

            rodGroup.rotation.x=0;

            setTimeout(
                startBite,
                2500+
                Math.random()*4500
            );
        }
    }


    /* -----------------------------------------
       SCHNUR
    ----------------------------------------- */

    if(
        fishingLine &&
        (
            state==="casting" ||
            state==="waiting" ||
            state==="biting"
        )
    ){

        const tipPos=
            getRodTip();

        const middle=
            new THREE.Vector3().lerpVectors(
                tipPos,
                bobber.position,
                .5
            );

        middle.y+=.3;

        fishingLine.geometry.dispose();

        fishingLine.geometry=
            new THREE.BufferGeometry()
                .setFromPoints([
                    tipPos,
                    middle,
                    bobber.position
                ]);
    }


    /* -----------------------------------------
       FISCH ZAPPELT
    ----------------------------------------- */

    if(
        state==="fish" ||
        state==="reeling"
    ){

        fishTime+=delta;

        if(fish){

            fish.rotation.z=
                Math.sin(
                    fishTime*6
                )*.3;

            fish.rotation.y=
                Math.sin(
                    fishTime*4
                )*.2;


            if(state==="fish"){

                fish.position.y=
                    .72+
                    Math.sin(
                        fishTime*8
                    )*.12;

                fish.position.x=
                    castTarget.x+
                    Math.sin(
                        fishTime*6
                    )*.18;
            }
        }
    }


    /* -----------------------------------------
       EINHOLEN
    ----------------------------------------- */

    if(state==="reeling"){

        reelProgress+=
            delta/.9;

        const p=
            Math.min(
                reelProgress,
                1
            );


        if(fish){

            const rodPosition=
                getRodTip();

            const target=
                rodPosition.clone();

            target.y-=.15;

            const pos=
                new THREE.Vector3().lerpVectors(
                    reelStart,
                    target,
                    p
                );

            pos.y+=
                Math.sin(
                    p*Math.PI
                )*.7;

            fish.position.copy(
                pos
            );

            fish.rotation.z=
                Math.sin(
                    fishTime*12
                )*.25;
        }


        /*
           Rolle dreht sich beim Einholen.
        */

        crank.rotation.x+=
            delta*18;

        spool.rotation.x+=
            delta*18;


        /*
           Angel leicht zurückziehen.
        */

        rodGroup.rotation.x=
            Math.sin(
                p*Math.PI
            )*.08;


        if(p>=1){

            if(fish){

                scene.remove(
                    fish
                );

                fish=null;
            }

            caughtFish=
                caughtFish||
                randomFish();

            document.getElementById(
                "putBucket"
            ).style.display=
                "block";

            state="fishReady";

            rodGroup.rotation.x=0;

            showMessage(
                "🐟 Fisch eingeholt! Q = Eimer"
            );
        }
    }


    /* -----------------------------------------
       RENDER
    ----------------------------------------- */

    renderer.render(
        scene,
        camera
    );
}

animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>

</body>
</html>
