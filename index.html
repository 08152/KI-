<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ghostgram</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* AUTH */

.auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.auth-box{
  width:380px;
  max-width:100%;
  background:#111;
  border:1px solid #292929;
  border-radius:20px;
  padding:35px;
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:800;
  margin-bottom:30px;
}

.auth-box h2{
  margin-bottom:20px;
}

.auth-box input{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  background:#1c1c1c;
  color:#fff;
  border:1px solid #333;
  border-radius:10px;
  outline:none;
}

.primary{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#0095f6;
  color:#fff;
  font-weight:bold;
}

.switch{
  width:100%;
  margin-top:20px;
  border:0;
  background:none;
  color:#0095f6;
}

.error{
  color:#ff4d67;
  font-size:14px;
  margin-bottom:12px;
}

/* APP */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:240px;
  border-right:1px solid #262626;
  padding:30px 15px;
}

.sidebar .logo{
  text-align:left;
  margin-left:15px;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.nav button{
  border:0;
  background:none;
  color:#fff;
  padding:14px;
  text-align:left;
  border-radius:12px;
}

.nav button:hover{
  background:#181818;
}

.main{
  width:630px;
  margin:auto;
  padding:30px 0 100px;
}

.stories{
  display:flex;
  gap:18px;
  overflow-x:auto;
  margin-bottom:20px;
}

.story{
  min-width:65px;
  text-align:center;
  font-size:12px;
}

.story img{
  width:60px;
  height:60px;
  border-radius:50%;
  padding:2px;
  border:3px solid #ff2878;
  object-fit:cover;
}

.post{
  border:1px solid #292929;
  border-radius:12px;
  overflow:hidden;
  margin-bottom:25px;
}

.post-header{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
}

.media{
  width:100%;
  max-height:700px;
  display:block;
  background:#000;
  object-fit:contain;
}

.post-content{
  padding:14px;
}

.actions{
  display:flex;
  gap:18px;
}

.actions button{
  background:none;
  border:0;
  color:#fff;
  font-size:28px;
}

.actions .liked{
  color:#ff3040;
}

.likes{
  font-weight:bold;
  margin:8px 0;
}

.caption{
  margin-bottom:12px;
}

.comment{
  margin:8px 0;
  font-size:14px;
}

.comment-form{
  display:flex;
  border-top:1px solid #292929;
  padding-top:10px;
  margin-top:12px;
}

.comment-form input{
  flex:1;
  background:none;
  color:white;
  border:0;
  outline:none;
}

.comment-form button{
  background:none;
  border:0;
  color:#0095f6;
  font-weight:bold;
}

.people{
  position:fixed;
  right:30px;
  top:30px;
  width:260px;
}

.people h3{
  color:#888;
  font-size:14px;
  margin-bottom:18px;
}

.person{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.person img{
  width:42px;
  height:42px;
  border-radius:50%;
}

.person span{
  font-weight:bold;
}

.create{
  position:fixed;
  right:30px;
  bottom:30px;
  width:60px;
  height:60px;
  border:0;
  border-radius:50%;
  background:#0095f6;
  color:#fff;
  font-size:30px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#000c;
  align-items:center;
  justify-content:center;
  z-index:500;
}

.modal.active{
  display:flex;
}

.modal-box{
  width:430px;
  max-width:92%;
  background:#151515;
  border:1px solid #333;
  border-radius:18px;
  padding:25px;
}

.modal-box h2{
  margin-bottom:20px;
}

.modal-box input,
.modal-box textarea{
  width:100%;
  padding:13px;
  margin-bottom:12px;
  background:#222;
  color:#fff;
  border:1px solid #333;
  border-radius:10px;
  outline:none;
}

.modal-box textarea{
  height:90px;
  resize:none;
}

.file{
  width:100%;
  padding:12px;
  background:#222;
  border-radius:10px;
  margin-bottom:12px;
}

.close{
  float:right;
  background:none;
  border:0;
  color:#fff;
  font-size:25px;
}

@media(max-width:1100px){

  .people{
    display:none;
  }

  .main{
    margin:auto;
  }
}

@media(max-width:750px){

  .sidebar{
    top:auto;
    width:100%;
    height:65px;
    padding:0;
    border-right:0;
    border-top:1px solid #292929;
    background:#000;
    z-index:100;
  }

  .sidebar .logo{
    display:none;
  }

  .nav{
    height:100%;
    flex-direction:row;
    justify-content:space-around;
    align-items:center;
  }

  .nav button{
    font-size:0;
  }

  .main{
    width:100%;
    padding:15px 0 85px;
  }

  .post{
    border-left:0;
    border-right:0;
    border-radius:0;
  }
}
</style>
</head>

<body>

<!-- LOGIN / REGISTRIERUNG -->

<section id="auth" class="auth">

  <div class="auth-box">

    <div class="logo">
      Ghostgram
    </div>

    <div id="loginBox">

      <h2>Anmelden</h2>

      <div id="loginError" class="error"></div>

      <input
        id="loginEmail"
        type="email"
        placeholder="E-Mail"
      >

      <input
        id="loginPin"
        type="password"
        inputmode="numeric"
        maxlength="8"
        placeholder="PIN"
      >

      <button
        class="primary"
        onclick="login()"
      >
        Anmelden
      </button>

      <button
        class="switch"
        onclick="showRegister()"
      >
        Noch nicht registriert? Konto erstellen
      </button>

    </div>

    <div id="registerBox" class="hidden">

      <h2>Konto erstellen</h2>

      <div id="registerError" class="error"></div>

      <input
        id="registerUsername"
        maxlength="25"
        placeholder="Benutzername"
      >

      <input
        id="registerEmail"
        type="email"
        placeholder="E-Mail"
      >

      <input
        id="registerPin"
        type="password"
        inputmode="numeric"
        maxlength="8"
        placeholder="PIN (4–8 Ziffern)"
      >

      <button
        class="primary"
        onclick="register()"
      >
        Registrieren
      </button>

      <button
        class="switch"
        onclick="showLogin()"
      >
        Ich habe bereits ein Konto
      </button>

    </div>

  </div>

</section>

<!-- APP -->

<section id="app" class="hidden">

  <aside class="sidebar">

    <div class="logo">
      Ghostgram
    </div>

    <nav class="nav">

      <button onclick="loadFeed()">
        🏠 <span>Startseite</span>
      </button>

      <button onclick="openCreate()">
        ➕ <span>Erstellen</span>
      </button>

      <button onclick="loadPeople()">
        👥 <span>Leute</span>
      </button>

      <button onclick="logout()">
        🚪 <span>Abmelden</span>
      </button>

    </nav>

  </aside>

  <main class="main">

    <div class="stories" id="stories"></div>

    <div id="feed"></div>

  </main>

  <aside class="people">

    <h3>
      Leute, die du kennen könntest
    </h3>

    <div id="peopleList"></div>

  </aside>

  <button
    class="create"
    onclick="openCreate()"
  >
    +
  </button>

</section>

<!-- POST MODAL -->

<div id="modal" class="modal">

  <div class="modal-box">

    <button
      class="close"
      onclick="closeCreate()"
    >
      ×
    </button>

    <h2>Neuer Beitrag</h2>

    <form id="postForm">

      <input
        id="media"
        class="file"
        type="file"
        accept="image/*,video/*"
        required
      >

      <textarea
        id="caption"
        placeholder="Schreibe etwas..."
      ></textarea>

      <button
        class="primary"
        type="submit"
      >
        Posten
      </button>

    </form>

  </div>

</div>

<script>

let token =
  localStorage.getItem("ghostgram_token");

let currentUser = null;

function headers(){

  return {
    "Authorization":
      "Bearer " + token
  };

}

async function checkLogin(){

  if(!token){
    showAuth();
    return;
  }

  const response =
    await fetch("/api/me",{
      headers:headers()
    });

  if(!response.ok){

    localStorage.removeItem("ghostgram_token");
    token=null;

    showAuth();

    return;
  }

  currentUser =
    await response.json();

  showApp();

}

function showAuth(){

  document
    .getElementById("auth")
    .classList.remove("hidden");

  document
    .getElementById("app")
    .classList.add("hidden");

}

function showApp(){

  document
    .getElementById("auth")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");

  loadFeed();
  loadPeople();

}

function showRegister(){

  document
    .getElementById("loginBox")
    .classList.add("hidden");

  document
    .getElementById("registerBox")
    .classList.remove("hidden");

}

function showLogin(){

  document
    .getElementById("registerBox")
    .classList.add("hidden");

  document
    .getElementById("loginBox")
    .classList.remove("hidden");

}

async function register(){

  const username =
    document
      .getElementById("registerUsername")
      .value
      .trim();

  const email =
    document
      .getElementById("registerEmail")
      .value
      .trim();

  const pin =
    document
      .getElementById("registerPin")
      .value;

  const error =
    document.getElementById("registerError");

  error.textContent="";

  const response =
    await fetch("/api/register",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        username,
        email,
        pin
      })

    });

  const data =
    await response.json();

  if(!response.ok){

    error.textContent =
      data.error || "Fehler";

    return;
  }

  token=data.token;

  localStorage.setItem(
    "ghostgram_token",
    token
  );

  currentUser=data.user;

  showApp();

}

async function login(){

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const pin =
    document
      .getElementById("loginPin")
      .value;

  const error =
    document.getElementById("loginError");

  error.textContent="";

  const response =
    await fetch("/api/login",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        email,
        pin
      })

    });

  const data =
    await response.json();

  if(!response.ok){

    error.textContent =
      data.error || "Login fehlgeschlagen";

    return;
  }

  token=data.token;

  localStorage.setItem(
    "ghostgram_token",
    token
  );

  currentUser=data.user;

  showApp();

}

async function logout(){

  await fetch("/api/logout",{
    method:"POST",
    headers:headers()
  });

  localStorage.removeItem(
    "ghostgram_token"
  );

  token=null;
  currentUser=null;

  showAuth();

}

async function loadFeed(){

  const response =
    await fetch("/api/feed",{
      headers:headers()
    });

  if(response.status===401){

    logout();
    return;

  }

  const posts =
    await response.json();

  renderFeed(posts);

}

function renderFeed(posts){

  const feed =
    document.getElementById("feed");

  if(posts.length===0){

    feed.innerHTML=`
      <div style="
        text-align:center;
        color:#888;
        padding:70px 20px;
      ">
        Noch keine Beiträge von angemeldeten Nutzern.
      </div>
    `;

    return;

  }

  feed.innerHTML =
    posts.map(post => {

      const liked =
        post.likes.includes(currentUser.id);

      const media =
        post.type==="video"

        ? `
          <video
            class="media"
            src="${post.media}"
            controls
            playsinline
          ></video>
        `

        : `
          <img
            class="media"
            src="${post.media}"
          >
        `;

      return `

        <article class="post">

          <div class="post-header">

            <img
              class="avatar"
              src="${post.avatar}"
            >

            <b>
              @${escapeHTML(post.username)}
            </b>

          </div>

          ${media}

          <div class="post-content">

            <div class="actions">

              <button
                class="${liked ? "liked" : ""}"
                onclick="likePost('${post.id}')"
              >
                ${liked ? "♥" : "♡"}
              </button>

              <button
                onclick="focusComment('${post.id}')"
              >
                💬
              </button>

              <button
                onclick="sharePost()"
              >
                ↗
              </button>

            </div>

            <div class="likes">
              ${post.likes.length} Gefällt mir
            </div>

            <div class="caption">

              <b>
                ${escapeHTML(post.username)}
              </b>

              ${escapeHTML(post.caption)}

            </div>

            ${
              post.comments.map(comment => `

                <div class="comment">

                  <b>
                    ${escapeHTML(comment.username)}
                  </b>

                  ${escapeHTML(comment.text)}

                </div>

              `).join("")
            }

            <form
              class="comment-form"
              onsubmit="
                addComment(event,'${post.id}')
              "
            >

              <input
                id="comment-${post.id}"
                placeholder="Kommentar..."
              >

              <button>
                Posten
              </button>

            </form>

          </div>

        </article>

      `;

    }).join("");

}

async function likePost(id){

  const response =
    await fetch(
      `/api/posts/${id}/like`,
      {
        method:"POST",
        headers:headers()
      }
    );

  if(response.ok){
    loadFeed();
  }

}

async function addComment(event,id){

  event.preventDefault();

  const input =
    document.getElementById(
      `comment-${id}`
    );

  const text =
    input.value.trim();

  if(!text) return;

  const response =
    await fetch(
      `/api/posts/${id}/comments`,
      {
        method:"POST",
        headers:{
          ...headers(),
          "Content-Type":
            "application/json"
        },
        body:JSON.stringify({
          text
        })
      }
    );

  if(response.ok){

    input.value="";
    loadFeed();

  }

}

function focusComment(id){

  const input =
    document.getElementById(
      `comment-${id}`
    );

  if(input){
    input.focus();
  }

}

async function loadPeople(){

  const response =
    await fetch("/api/users",{
      headers:headers()
    });

  if(!response.ok) return;

  const users =
    await response.json();

  const list =
    document.getElementById("peopleList");

  if(users.length===0){

    list.innerHTML=`
      <div style="color:#777">
        Noch keine anderen angemeldeten Nutzer online.
      </div>
    `;

    return;

  }

  list.innerHTML =
    users.map(user => `

      <div class="person">

        <img src="${user.avatar}">

        <span>
          @${escapeHTML(user.username)}
        </span>

      </div>

    `).join("");

  document.getElementById("stories").innerHTML =
    users.map(user => `

      <div class="story">

        <img src="${user.avatar}">

        <div>
          ${escapeHTML(user.username)}
        </div>

      </div>

    `).join("");

}

function openCreate(){

  document
    .getElementById("modal")
    .classList.add("active");

}

function closeCreate(){

  document
    .getElementById("modal")
    .classList.remove("active");

}

document
  .getElementById("postForm")
  .addEventListener("submit",async event => {

    event.preventDefault();

    const file =
      document.getElementById("media").files[0];

    const caption =
      document.getElementById("caption").value;

    if(!file) return;

    const formData =
      new FormData();

    formData.append(
      "media",
      file
    );

    formData.append(
      "caption",
      caption
    );

    const response =
      await fetch("/api/posts",{

        method:"POST",

        headers:headers(),

        body:formData

      });

    if(response.ok){

      document
        .getElementById("postForm")
        .reset();

      closeCreate();

      loadFeed();

    }else{

      const data =
        await response.json();

      alert(
        data.error ||
        "Upload fehlgeschlagen"
      );

    }

  });

function sharePost(){

  if(navigator.share){

    navigator.share({
      title:"Ghostgram",
      text:"Schau dir diesen Ghostgram-Beitrag an!"
    });

  }else{

    alert(
      "Teilen wird auf diesem Gerät nicht unterstützt."
    );

  }

}

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

checkLogin();

</script>

</body>
</html>
