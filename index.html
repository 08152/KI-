<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FPS Weapon</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87cfff;
    font-family:Arial;
}

canvas{
    display:block;
}

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    width:16px;
    height:16px;
    transform:translate(-50%,-50%);
    z-index:10;
    pointer-events:none;
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 0 3px black;
}

#crosshair:before{
    width:2px;
    height:16px;
    left:7px;
}

#crosshair:after{
    width:16px;
    height:2px;
    top:7px;
}

#status{
    position:fixed;
    top:10px;
    left:10px;
    z-index:100;
    background:rgba(0,0,0,.75);
    color:white;
    padding:8px 12px;
    border-radius:6px;
    font:13px monospace;
}
</style>
</head>

<body>

<div id="status">Lade weapon.glb...</div>
<div id="crosshair"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>

/* =====================================================
   SCENE
===================================================== */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x87cfff);


/* =====================================================
   CAMERA
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        75,
        innerWidth / innerHeight,
        0.01,
        5000
    );


/* =====================================================
   RENDERER
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.outputEncoding =
    THREE.sRGBEncoding;

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   LIGHT
===================================================== */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        2
    )
);

const light =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

light.position.set(
    10,
    20,
    10
);

scene.add(light);


/* =====================================================
   PLAYER
===================================================== */

const player =
    new THREE.Object3D();

scene.add(player);

player.add(camera);

camera.position.set(
    0,
    2.2,
    0
);


/* =====================================================
   WEAPON HOLDER
===================================================== */

/*
    WICHTIG:

    Dieser Container hängt DIREKT an der Kamera.

    Alles darin folgt automatisch:
    - Kamera
    - Blickrichtung
    - Drehung
    - Bewegung
*/

const weaponHolder =
    new THREE.Object3D();

camera.add(
    weaponHolder
);


/*
    Position des HOLDERS.

    Rechts
    Unten
    Vor Kamera
*/

weaponHolder.position.set(
    0.55,
    -0.45,
    -1.2
);


/*
    Der Holder selbst hat keine Rotation.
*/

weaponHolder.rotation.set(
    0,
    0,
    0
);


/* =====================================================
   WEAPON CONTAINER
===================================================== */

/*
    Noch ein Container.

    Damit können wir die GLB intern
    drehen und skalieren, ohne den
    First-Person-Punkt zu verändern.
*/

const weaponModel =
    new THREE.Object3D();

weaponHolder.add(
    weaponModel
);


/* =====================================================
   GLB LOADER
===================================================== */

const loader =
    new THREE.GLTFLoader();


loader.load(

    "./weapon.glb",

    function(gltf){

        console.log(
            "weapon.glb geladen!"
        );


        const glb =
            gltf.scene;


        /*
           ===============================================
           ALLE MESHES
           ===============================================
        */

        glb.traverse(
            function(obj){

                if(obj.isMesh){

                    obj.visible =
                        true;

                    obj.frustumCulled =
                        false;


                    if(obj.material){

                        if(
                            Array.isArray(
                                obj.material
                            )
                        ){

                            obj.material.forEach(
                                function(mat){

                                    mat.side =
                                        THREE.DoubleSide;

                                    mat.needsUpdate =
                                        true;

                                }
                            );

                        }
                        else{

                            obj.material.side =
                                THREE.DoubleSide;

                            obj.material.needsUpdate =
                                true;

                        }

                    }

                }

            }
        );


        /*
           ===============================================
           GLB ZUERST IN DIE SZENE
           ===============================================
        */

        weaponModel.add(
            glb
        );


        /*
           ===============================================
           BOUNDS NACH DEM HINZUFÜGEN
           ===============================================
        */

        glb.updateMatrixWorld(
            true
        );


        let box =
            new THREE.Box3()
            .setFromObject(
                glb
            );


        let size =
            new THREE.Vector3();


        box.getSize(
            size
        );


        console.log(
            "GLB SIZE:",
            size
        );


        /*
           ===============================================
           SCALE
           ===============================================
        */

        const largest =
            Math.max(
                size.x,
                size.y,
                size.z
            );


        /*
           Zielgröße.
        */

        const target =
            1.1;


        if(
            largest > 0 &&
            isFinite(largest)
        ){

            const s =
                target /
                largest;


            glb.scale.set(
                s,
                s,
                s
            );

        }


        /*
           ===============================================
           NACH SCALE NEUE BOUNDS
           ===============================================
        */

        glb.updateMatrixWorld(
            true
        );


        box =
            new THREE.Box3()
            .setFromObject(
                glb
            );


        const center =
            new THREE.Vector3();


        box.getCenter(
            center
        );


        /*
           ===============================================
           GLB ZENTRIEREN
           ===============================================
        */

        glb.position.x =
            -center.x;

        glb.position.y =
            -center.y;

        glb.position.z =
            -center.z;


        /*
           ===============================================
           ROTATION
           ===============================================

           Startausrichtung.

           Falls dein Modell danach noch
           seitlich liegt, können wir genau
           diese 3 Werte ändern.
        */

        glb.rotation.set(
            0,
            Math.PI / 2,
            0
        );


        /*
           ===============================================
           STATUS
           ===============================================
        */

        document.getElementById(
            "status"
        ).textContent =
            "✓ weapon.glb vor Kamera";


        console.log(
            "Weapon:",
            glb
        );


        console.log(
            "Scale:",
            glb.scale
        );


        console.log(
            "Holder:",
            weaponHolder.position
        );

    },

    function(xhr){

        if(xhr.total){

            document.getElementById(
                "status"
            ).textContent =
                "Lade weapon.glb " +
                Math.round(
                    xhr.loaded /
                    xhr.total *
                    100
                ) +
                "%";

        }

    },

    function(error){

        console.error(
            "weapon.glb FEHLER:",
            error
        );


        document.getElementById(
            "status"
        ).textContent =
            "✕ weapon.glb Fehler";

    }

);


/* =====================================================
   MOVEMENT
===================================================== */

const keys = {};

window.addEventListener(
    "keydown",
    function(e){

        keys[
            e.key.toLowerCase()
        ] = true;

        if(e.code === "Space"){

            e.preventDefault();

            if(onGround){

                velocityY =
                    0.25;

                onGround =
                    false;

            }

        }

    }
);

window.addEventListener(
    "keyup",
    function(e){

        keys[
            e.key.toLowerCase()
        ] = false;

    }
);


let yaw = 0;
let pitch = 0;

document.body.addEventListener(
    "click",
    function(){

        document.body.requestPointerLock();

    }
);


document.addEventListener(
    "mousemove",
    function(e){

        if(
            document.pointerLockElement !==
            document.body
        ){

            return;

        }


        yaw -=
            e.movementX *
            0.002;


        pitch -=
            e.movementY *
            0.002;


        pitch =
            Math.max(
                -1.2,
                Math.min(
                    1.2,
                    pitch
                )
            );


        player.rotation.y =
            yaw;


        camera.rotation.x =
            pitch;

    }
);


/* =====================================================
   GRAVITY
===================================================== */

let velocityY = 0;
let onGround = true;


function gravity(){

    velocityY -=
        0.015;


    player.position.y +=
        velocityY;


    if(
        player.position.y <= 0
    ){

        player.position.y =
            0;

        velocityY =
            0;

        onGround =
            true;

    }

}


/* =====================================================
   MOVEMENT
===================================================== */

function move(){

    const speed =
        0.15;


    let direction =
        new THREE.Vector3();


    if(keys["w"])
        direction.z -= 1;

    if(keys["s"])
        direction.z += 1;

    if(keys["a"])
        direction.x -= 1;

    if(keys["d"])
        direction.x += 1;


    if(direction.lengthSq() === 0)
        return;


    direction.normalize();


    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    forward.applyEuler(
        player.rotation
    );


    forward.y = 0;

    forward.normalize();


    const right =
        new THREE.Vector3()
        .crossVectors(
            forward,
            new THREE.Vector3(
                0,
                1,
                0
            )
        )
        .negate();


    player.position.addScaledVector(
        forward,
        direction.z *
        speed
    );


    player.position.addScaledVector(
        right,
        direction.x *
        speed
    );

}


/* =====================================================
   ANIMATION
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    move();

    gravity();


    /*
       Waffe bleibt automatisch
       am selben Punkt relativ
       zur Kamera.
    */


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            innerWidth /
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>

</body>
</html>
