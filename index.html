<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>FPS ENGINE - 1.glb</title>

<style>
body{
margin:0;
overflow:hidden;
background:#87cfff;
font-family:Arial
}

#crosshair{
position:absolute;
top:50%;
left:50%;
width:10px;
height:10px;
transform:translate(-50%,-50%);
z-index:10;
}

#crosshair:before,
#crosshair:after{
content:"";
position:absolute;
background:white
}

#crosshair:before{
width:2px;
height:10px;
left:4px
}

#crosshair:after{
width:10px;
height:2px;
top:4px
}

#coords{
position:absolute;
bottom:10px;
right:10px;
color:white;
font-size:13px;
background:rgba(0,0,0,0.4);
padding:6px;
border-radius:6px;
white-space:pre;
z-index:20;
}

#status{
position:absolute;
top:10px;
left:10px;
color:white;
background:rgba(0,0,0,.6);
padding:8px 12px;
border-radius:7px;
z-index:20;
font-family:monospace;
}
</style>
</head>

<body>

<div id="crosshair"></div>
<div id="coords"></div>
<div id="status">Lade 1.glb...</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>

/* ================= SCENE ================= */

const scene=new THREE.Scene();

scene.background=
new THREE.Color(0x87cfff);


/* ================= CAMERA ================= */

const camera=
new THREE.PerspectiveCamera(
75,
innerWidth/innerHeight,
0.1,
5000
);


/* ================= RENDERER ================= */

const renderer=
new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
innerWidth,
innerHeight
);

renderer.setPixelRatio(
Math.min(devicePixelRatio,2)
);

document.body.appendChild(
renderer.domElement
);


/* ================= LIGHT ================= */

scene.add(
new THREE.AmbientLight(
0xffffff,
1.2
)
);

const sun=
new THREE.DirectionalLight(
0xffffff,
1.5
);

sun.position.set(
10,
20,
10
);

scene.add(sun);


/* ================= GROUND ================= */

const ground=
new THREE.Mesh(

new THREE.PlaneGeometry(
5000,
5000
),

new THREE.MeshStandardMaterial({
color:0x228822
})

);

ground.rotation.x=
-Math.PI/2;

scene.add(ground);


/* ================= PLAYER ================= */

const player=
new THREE.Object3D();

scene.add(player);

player.add(camera);

camera.position.set(
0,
2,
0
);

let yaw=0;
let pitch=0;

let velY=0;
let onGround=true;


/* ================= INPUT ================= */

const keys={};

window.addEventListener(
"keydown",
e=>{
keys[e.key.toLowerCase()]=true;

if(e.code==="Space"){
jump();
e.preventDefault();
}
});

window.addEventListener(
"keyup",
e=>{
keys[e.key.toLowerCase()]=false;
});


/* ================= POINTER LOCK ================= */

document.body.addEventListener(
"click",
()=>{
document.body.requestPointerLock();
}
);


/* ================= MOUSE ================= */

document.addEventListener(
"mousemove",
e=>{

if(
document.pointerLockElement!==document.body
)return;

yaw-=e.movementX*0.002;
pitch-=e.movementY*0.002;

pitch=Math.max(
-1.2,
Math.min(1.2,pitch)
);

player.rotation.y=yaw;
camera.rotation.x=pitch;

}
);


/* ================= JUMP ================= */

function jump(){

if(!onGround)
return;

velY=.25;
onGround=false;

}


/* ================= GRAVITY ================= */

function gravity(){

velY-=.015;

player.position.y+=velY;

if(player.position.y<=0){

player.position.y=0;
velY=0;
onGround=true;

}

}


/* ================= MOVEMENT ================= */

function move(){

let dir=
new THREE.Vector3();

if(keys["w"])
dir.z-=1;

if(keys["s"])
dir.z+=1;

if(keys["a"])
dir.x-=1;

if(keys["d"])
dir.x+=1;

if(dir.length()>0)
dir.normalize();

const forward=
new THREE.Vector3(
0,
0,
-1
).applyEuler(
player.rotation
);

forward.y=0;
forward.normalize();

const right=
new THREE.Vector3()
.crossVectors(
forward,
new THREE.Vector3(0,1,0)
)
.negate();

player.position.addScaledVector(
forward,
dir.z*.15
);

player.position.addScaledVector(
right,
dir.x*.15
);

}


/* ================= MODELS ================= */

const loader=
new THREE.GLTFLoader();

let weapon=null;


/* ================= GLB IMPORT ================= */
/*
   GENAU DER IMPORT AUS DEINEM CODE.
   NUR DER DATEINAME IST 1.glb.
*/

loader.load(
"./1.glb",

(gltf)=>{

console.log(
"WEAPON LOADED"
);

weapon=
gltf.scene;

camera.add(
weapon
);

weapon.position.set(
0.5,
-0.8,
-1.2
);

document.getElementById(
"status"
).textContent=
"✔ 1.glb geladen";

},

undefined,

(err)=>{

console.error(
"WEAPON ERROR",
err
);

document.getElementById(
"status"
).textContent=
"❌ 1.glb Fehler";

}
);


/* ================= SHOOT ================= */

let shooting=false;

function shoot(){

if(shooting)
return;

shooting=true;


/* Rückstoß */

if(weapon){

weapon.position.z=
-1.08;

setTimeout(()=>{

weapon.position.z=
-1.2;

},70);

}


/* Mündungsblitz */

const flash=
new THREE.PointLight(
0xffaa33,
5,
4
);

flash.position.set(
0,
0,
-2
);

camera.add(flash);

setTimeout(()=>{

camera.remove(flash);

},60);


setTimeout(()=>{

shooting=false;

},120);

}


/* ================= MOUSE SHOOT ================= */

window.addEventListener(
"mousedown",
e=>{

if(e.button===0)
shoot();

}
);


/* ================= LOOP ================= */

function animate(){

requestAnimationFrame(
animate
);

move();

gravity();


document.getElementById(
"coords"
).innerHTML=
`X: ${player.position.x.toFixed(2)}
Y: ${player.position.y.toFixed(2)}
Z: ${player.position.z.toFixed(2)}`;


renderer.render(
scene,
camera
);

}

animate();


/* ================= RESIZE ================= */

window.addEventListener(
"resize",
()=>{

camera.aspect=
innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

}
);

</script>

</body>
</html>
