<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>3D Lockpicking Set Generator - Preview & STL Export</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87cfff;
    font-family:Arial,Helvetica,sans-serif;
}

/* =========================
   THREE CANVAS
========================= */
canvas{
    display:block;
}

/* =========================
   UI CONTROLS & DOWNLOAD PANEL
========================= */
#ui-panel {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 1000;
    background: rgba(0, 0, 0, 0.75);
    padding: 20px;
    border-radius: 10px;
    color: white;
    width: 300px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

#ui-panel h2 {
    font-size: 16px;
    margin-bottom: 5px;
    color: #87cfff;
}

#ui-panel p {
    font-size: 11px;
    margin-bottom: 15px;
    opacity: 0.8;
}

.btn-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 60vh;
    overflow-y: auto;
}

button {
    background: #333;
    color: white;
    border: 1px solid #555;
    padding: 8px 12px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
    text-align: left;
    display: flex;
    justify-content: space-between;
    transition: background 0.2s;
}

button:hover {
    background: #0077ff;
    border-color: #0077ff;
}

/* =========================
   DEBUG OVERLAY
========================= */
#debug{
    position:absolute;
    top:10px;
    right:10px;
    padding:10px;
    background:rgba(0,0,0,.55);
    color:#00ff00;
    font-size:12px;
    line-height:1.4;
    border-radius:6px;
    white-space:pre;
    z-index:1000;
}

/* =========================
   LOADING SCREEN
========================= */
#loading{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:black;
    color:white;
    font-size:30px;
    font-weight:bold;
    z-index:9999;
}
</style>

<!-- Bibliotheken direkt laden, um CORS-Sperren auf dem Chromebook zu verhindern -->
<script src="https://jsdelivr.net"></script>
<script src="https://jsdelivr.net"></script>
<script src="https://jsdelivr.net"></script>
</head>

<body>

<!-- Loading Screen -->
<div id="loading">3D MODELL LÄDT...</div>

<!-- Download UI Panel -->
<div id="ui-panel">
    <h2>3D-Print Lockpicking Set</h2>
    <p>Loch: Ø 11mm | Dicke: 2mm<br>Klicke auf ein Werkzeug, um die STL herunterzuladen:</p>
    <div class="btn-list" id="controls"></div>
</div>

<!-- Info/Debug Anzeige -->
<div id="debug">Lade 3D-Vorschau...</div>

<!-- =========================
     3D ENGINE GRAPHIK SKRIPT
========================= -->
<script>
let scene, camera, renderer, controls, exporter;
const toolsDict = {};

function init() {
    // 1. Szene & Hintergrund aus deinem CSS (Himmelblau)
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87cfff);
    exporter = new THREE.STLExporter();

    // 2. Kamera-Setup
    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 110, 140);

    // 3. WebGL-Renderer (Chromebook-schonend)
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 4. Kamera-Maussteuerung (OrbitControls)
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // 5. Beleuchtung
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
    sunLight.position.set(40, 100, 40);
    sunLight.castShadow = true;
    scene.add(sunLight);

    // 6. Virtuelles Druckbett-Raster (Blau-Weiß)
    const gridHelper = new THREE.GridHelper(160, 32, 0x0044ff, 0xffffff);
    gridHelper.position.y = -0.1;
    scene.add(gridHelper);

    // 7. Werkzeuge generieren & Buttons erstellen
    generateLockpickingSet();

    // Ladebildschirm ausblenden
    const loadingEl = document.getElementById('loading');
    if (loadingEl) loadingEl.style.display = 'none';
    
    // Debug-Text aktualisieren
    const debugEl = document.getElementById('debug');
    if (debugEl) {
        debugEl.textContent = `Vorschau & Export bereit\n3x Spanner | 4x Dietriche\nLoch-Ø: 11mm | Dicke: 2mm\nMaus/Touch zum Drehen & Zoomen`;
    }

    // Event-Listener für Fenstergröße
    window.addEventListener('resize', onWindowResize);

    // Animations-Schleife starten
    animate();
}

// Erstellt die Grundform: Griff mit präzisem 11mm Schlüsselbund-Loch
function createToolBaseShape() {
    const shape = new THREE.Shape();
    const width = 15;
    const length = 45;
    const radius = 7.5;

    shape.moveTo(-width / 2, 0);
    shape.lineTo(-width / 2, length - radius);
    shape.quadraticCurveTo(-width / 2, length, 0, length);
    shape.quadraticCurveTo(width / 2, length, width / 2, length - radius);
    shape.lineTo(width / 2, 0);
    shape.lineTo(-width / 2, 0);

    // Schlüsselbundloch: 11mm Durchmesser -> 5.5mm Radius
    const holePath = new THREE.Path();
    holePath.absarc(0, length - 10, 5.5, 0, Math.PI * 2, true);
    shape.holes.push(holePath);

    return shape;
}

// Hilfsfunktion zum Registrieren des Meshs und Erstellen des Buttons
function buildAndRegisterTool(name, shape, extrudeSettings, material, posX, posZ) {
    const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
    const mesh = new THREE.Mesh(geo, material);
    mesh.castShadow = true;
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.set(posX, 0, posZ);
    scene.add(mesh);
    
    // Speichere das Mesh für den STL-Export
    toolsDict[name] = mesh;

    // Button im Interface erzeugen
    const btn = document.createElement('button');
    btn.innerHTML = `<span>${name}</span> <span>💾 STL</span>`;
    btn.onclick = () => downloadSTL(name);
    document.getElementById('controls').appendChild(btn);
}

function generateLockpickingSet() {
    const extrudeSettings = { depth: 2, bevelEnabled: false, curveSegments: 32 };
    const material = new THREE.MeshStandardMaterial({ 
        color: 0x99aab5, 
        metalness: 0.7, 
        roughness: 0.3 
    });

    // --- 4 DIETRICHE (PICKS) ---
    const picks = ['Hook', 'Snake', 'Half-Diamond', 'City-Rake'];
    picks.forEach((type, index) => {
        const shape = createToolBaseShape();
        shape.moveTo(-1.5, 0);
        shape.lineTo(-1.5, -40);

        if (type === 'Hook') {
            shape.quadraticCurveTo(-1.5, -45, -5, -45);
            shape.lineTo(-5, -43);
            shape.quadraticCurveTo(1.5, -42, 1.5, -40);
        } else if (type === 'Snake') {
            shape.quadraticCurveTo(3, -42, -2, -45);
            shape.quadraticCurveTo(2, -48, 1.5, -40);
        } else if (type === 'Half-Diamond') {
            shape.lineTo(-5, -43);
            shape.lineTo(1.5, -40);
        } else if (type === 'City-Rake') {
            shape.lineTo(-4, -41); shape.lineTo(1.5, -42);
            shape.lineTo(-4, -43); shape.lineTo(1.5, -40);
        }
        shape.lineTo(1.5, 0);

        buildAndRegisterTool(`Dietrich: ${type}`, shape, extrudeSettings, material, index * 22 - 33, -20);
    });

    // --- 3 SPANNER ---
    const widths = [2.0, 2.8, 3.5];
    const labels = ['Schmal (2.0mm)', 'Medium (2.8mm)', 'Breit (3.5mm)'];
    widths.forEach((w, index) => {
        const shape = createToolBaseShape();
        shape.moveTo(-w / 2, 0);
        shape.lineTo(-w / 2, -35);
        shape.lineTo(-w / 2 - 12, -35);
        shape.lineTo(-w / 2 - 12, -35 + w);
        shape.lineTo(w / 2, -35 + w);
        shape.lineTo(w / 2, 0);

        buildAndRegisterTool(`Spanner: ${labels[index]}`, shape, extrudeSettings, material, index * 25 - 25, 40);
    });
}

// STL Export Logik, die den Nullpunkt für Slicer zentriert
function downloadSTL(name) {
    const mesh = toolsDict[name];
    if (!mesh) return;

    // Position merken und für sauberen Export temporär auf Null setzen
    const oldX = mesh.position.x;
    const oldZ = mesh.position.z;
    mesh.position.set(0, 0, 0);

    // Exportieren
    const result = exporter.parse(mesh, { binary: true });
    
    // Position zurücksetzen
    mesh.position.set(oldX, 0, oldZ);

    // Download anstoßen
    const blob = new Blob([result], { type: 'application/octet-stream' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `${name.replace(/[^a-zA-Z0-9]/g, "_")}.stl`;
    link.click();
}

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

// Initialisiere die 3D Ansicht direkt nach dem Laden der Seite
window.onload = init;
</script>
</body>
</html>
