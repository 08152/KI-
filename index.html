<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHOST A1 mini Control</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#101010;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    padding:20px;
    background:#181818;
    border-bottom:1px solid #333;
}

h1{
    margin:0;
    font-size:26px;
}

main{
    max-width:850px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1b1b1b;
    border:1px solid #333;
    border-radius:15px;
    padding:20px;
    margin-bottom:18px;
}

h2{
    margin-top:0;
}

input{
    background:#111;
    color:white;
    border:1px solid #555;
    border-radius:8px;
    padding:12px;
    width:100%;
    margin:7px 0 12px;
}

button{
    background:#292929;
    color:white;
    border:1px solid #555;
    border-radius:9px;
    padding:12px 18px;
    cursor:pointer;
    margin:4px;
}

button:hover{
    background:#3b3b3b;
}

.print{
    background:#087f35;
    border-color:#0aaf4c;
    font-size:18px;
}

.print:hover{
    background:#099e43;
}

.stop{
    background:#8b1717;
    border-color:#c22;
}

.status{
    padding:12px;
    border-radius:8px;
    background:#111;
    margin-top:10px;
}

.online{
    color:#55e889;
}

.offline{
    color:#ff6666;
}

pre{
    background:#080808;
    border-radius:10px;
    padding:15px;
    overflow:auto;
    min-height:80px;
}
</style>
</head>

<body>

<header>
    <h1>🖨️ GHOST A1 mini Control</h1>
</header>

<main>

<div class="card">

<h2>🔌 A1 mini verbinden</h2>

<label>
A1 mini IP-Adresse
</label>

<input
    id="printerIP"
    placeholder="z.B. 192.168.1.50"
>

<button onclick="checkConnection()">
    Verbindung testen
</button>

<div id="connection" class="status offline">
    Nicht verbunden
</div>

</div>


<div class="card">

<h2>📁 Druckdatei</h2>

<input
    id="file"
    type="file"
    accept=".gcode,.3mf"
>

<div id="fileName">
    Keine Datei ausgewählt
</div>

<br>

<button onclick="uploadFile()">
    Datei an den Druckdienst senden
</button>

</div>


<div class="card">

<h2>🖨️ Drucksteuerung</h2>

<button
    class="print"
    onclick="startPrint()"
>
    ▶ DRUCKEN
</button>

<button
    class="stop"
    onclick="stopPrint()"
>
    ■ STOPPEN
</button>

</div>


<div class="card">

<h2>📊 Status</h2>

<pre id="log">Bereit.</pre>

</div>

</main>


<script>

const SERVICE =
    "http://" + location.hostname + ":8787";


const log = message => {

    document.getElementById("log")
        .textContent = message;

};


document.getElementById("file")
.addEventListener("change", function(){

    const file = this.files[0];

    document.getElementById("fileName")
        .textContent =
        file
        ? file.name
        : "Keine Datei ausgewählt";

});


async function checkConnection(){

    const ip =
        document.getElementById("printerIP")
        .value.trim();

    if(!ip){

        log("Bitte zuerst die IP-Adresse des A1 mini eingeben.");

        return;
    }

    try{

        const response =
            await fetch(
                SERVICE +
                "/api/status?ip=" +
                encodeURIComponent(ip)
            );

        const data =
            await response.json();

        if(data.ok){

            document.getElementById("connection")
                .className =
                "status online";

            document.getElementById("connection")
                .textContent =
                "✓ Lokaler Dienst erreichbar";

        }else{

            throw new Error(data.message);

        }

        log(JSON.stringify(data,null,2));

    }catch(error){

        document.getElementById("connection")
            .className =
            "status offline";

        document.getElementById("connection")
            .textContent =
            "✕ Keine Verbindung";

        log(
            "Verbindungsfehler:\n" +
            error.message
        );

    }

}


async function uploadFile(){

    const file =
        document.getElementById("file")
        .files[0];

    if(!file){

        log("Bitte zuerst eine G-Code- oder 3MF-Datei auswählen.");

        return;
    }

    const form =
        new FormData();

    form.append(
        "file",
        file
    );

    try{

        const response =
            await fetch(
                SERVICE + "/api/upload",
                {
                    method:"POST",
                    body:form
                }
            );

        const text =
            await response.text();

        log(text);

    }catch(error){

        log(
            "Upload-Fehler:\n" +
            error.message
        );

    }

}


async function startPrint(){

    const ip =
        document.getElementById("printerIP")
        .value.trim();

    if(!ip){

        log("Bitte die A1-mini-IP eingeben.");

        return;
    }

    if(!confirm(
        "Druck wirklich starten?"
    )) return;

    try{

        const response =
            await fetch(
                SERVICE + "/api/print",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({
                        ip:ip
                    })
                }
            );

        const text =
            await response.text();

        log(text);

    }catch(error){

        log(
            "Druckfehler:\n" +
            error.message
        );

    }

}


async function stopPrint(){

    const ip =
        document.getElementById("printerIP")
        .value.trim();

    if(!ip){

        log("Bitte die A1-mini-IP eingeben.");

        return;
    }

    try{

        const response =
            await fetch(
                SERVICE + "/api/stop",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({
                        ip:ip
                    })
                }
            );

        const text =
            await response.text();

        log(text);

    }catch(error){

        log(
            "Fehler:\n" +
            error.message
        );

    }

}

</script>

</body>
</html>
