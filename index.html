<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Direktlink Upload</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: #101014;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .box {
        width: min(600px, 92vw);
        background: #1b1b22;
        border: 1px solid #33333f;
        border-radius: 20px;
        padding: 30px;
        text-align: center;
    }

    h1 {
        margin-top: 0;
        font-size: 28px;
    }

    p {
        color: #aaa;
    }

    .upload {
        display: block;
        border: 2px dashed #6c63ff;
        border-radius: 15px;
        padding: 40px 20px;
        margin: 25px 0;
        cursor: pointer;
        transition: 0.2s;
    }

    .upload:hover {
        background: #252532;
        transform: scale(1.01);
    }

    input {
        display: none;
    }

    button {
        width: 100%;
        border: 0;
        border-radius: 12px;
        padding: 15px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        background: #6c63ff;
        color: white;
    }

    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    #status {
        margin-top: 20px;
        color: #bbb;
    }

    #result {
        display: none;
        margin-top: 25px;
        padding: 20px;
        background: #121217;
        border-radius: 12px;
    }

    #link {
        display: block;
        margin-top: 12px;
        padding: 12px;
        background: #242430;
        border-radius: 8px;
        color: #8f88ff;
        word-break: break-all;
        text-decoration: none;
    }

    #copy {
        margin-top: 12px;
        background: #333344;
    }

    #preview {
        max-width: 100%;
        max-height: 300px;
        margin-top: 20px;
        border-radius: 10px;
    }

    video {
        max-width: 100%;
        max-height: 300px;
        margin-top: 20px;
        border-radius: 10px;
    }
</style>
</head>

<body>

<div class="box">

    <h1>📁 Bild & Video Direktlink</h1>

    <p>Lade ein Bild oder Video hoch und erhalte einen direkten Link.</p>

    <label class="upload">
        <strong id="fileText">Datei auswählen</strong>
        <br><br>
        Bilder oder Videos
        <input id="file" type="file" accept="image/*,video/*">
    </label>

    <button id="uploadButton" disabled>
        Hochladen
    </button>

    <div id="status"></div>

    <div id="result">

        <strong>Dein Direktlink:</strong>

        <a id="link" target="_blank"></a>

        <button id="copy">
            Direktlink kopieren
        </button>

    </div>

    <div id="previewContainer"></div>

</div>

<script>

const fileInput = document.getElementById("file");
const uploadButton = document.getElementById("uploadButton");
const fileText = document.getElementById("fileText");
const status = document.getElementById("status");
const result = document.getElementById("result");
const link = document.getElementById("link");
const copyButton = document.getElementById("copy");
const previewContainer = document.getElementById("previewContainer");

let selectedFile = null;


fileInput.addEventListener("change", () => {

    selectedFile = fileInput.files[0];

    if (!selectedFile) return;

    fileText.textContent = selectedFile.name;

    uploadButton.disabled = false;

    previewContainer.innerHTML = "";

    const url = URL.createObjectURL(selectedFile);

    if (selectedFile.type.startsWith("image/")) {

        const img = document.createElement("img");

        img.src = url;
        img.id = "preview";

        previewContainer.appendChild(img);

    }

    else if (selectedFile.type.startsWith("video/")) {

        const video = document.createElement("video");

        video.src = url;
        video.controls = true;

        previewContainer.appendChild(video);

    }

});


uploadButton.addEventListener("click", async () => {

    if (!selectedFile) return;

    const formData = new FormData();

    formData.append("file", selectedFile);

    uploadButton.disabled = true;

    status.textContent = "⬆️ Datei wird hochgeladen...";

    result.style.display = "none";

    try {

        const response = await fetch("/upload", {

            method: "POST",
            body: formData

        });

        const data = await response.json();

        if (!response.ok) {

            throw new Error(data.error || "Upload fehlgeschlagen");

        }

        status.textContent = "✅ Upload erfolgreich!";

        link.href = data.directLink;
        link.textContent = data.directLink;

        result.style.display = "block";

    }

    catch (error) {

        status.textContent = "❌ Fehler: " + error.message;

    }

    uploadButton.disabled = false;

});


copyButton.addEventListener("click", async () => {

    try {

        await navigator.clipboard.writeText(link.href);

        copyButton.textContent = "✅ Kopiert!";

        setTimeout(() => {

            copyButton.textContent = "Direktlink kopieren";

        }, 2000);

    }

    catch {

        alert("Kopiere diesen Link manuell:\n\n" + link.href);

    }

});

</script>

</body>
</html>
