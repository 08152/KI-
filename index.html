<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Video Player</title>
<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}
#open{
    position:absolute;
    inset:0;
    margin:auto;
    width:220px;
    height:60px;
    font-size:18px;
    border:0;
    border-radius:12px;
    cursor:pointer;
}
</style>
</head>
<body>

<button id="open">▶ Video öffnen</button>

<script>
const VIDEO_URL =
"https://www.youtube.com/watch?v=0RTDOUF3If8";

document.getElementById("open").onclick = () => {
    const duckduckgo =
        "https://duckduckgo.com/?q=" +
        encodeURIComponent(VIDEO_URL);

    window.location.href = duckduckgo;
};
</script>

</body>
</html>
