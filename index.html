<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>FPS Weapon Fixed</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87cfff;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    width:16px;
    height:16px;
    transform:translate(-50%,-50%);
    z-index:20;
    pointer-events:none;
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 0 3px black;
}

#crosshair:before{
    width:2px;
    height:16px;
    left:7px;
}

#crosshair:after{
    width:16px;
    height:2px;
    top:7px;
}

#status{
    position:fixed;
    top:10px;
    left:10px;
    z-index:50;
    padding:9px 12px;
    background:rgba(0,0,0,.7);
    color:white;
    border-radius:7px;
    font:13px monospace;
}

#coords{
    position:fixed;
    right:10px;
    bottom:10px;
    z-index:50;
    color:white;
    background:rgba(0,0,0,.6);
    padding:8px;
    border-radius:7px;
    font:12px monospace;
    white-space:pre;
}

#health{
    position:fixed;
    left:10px;
    bottom:10px;
    width:220px;
    height:20px;
    border:2px solid white;
    background:#222;
    z-index:50;
}

#healthFill{
    width:100%;
    height:100%;
    background:#20dd50;
}

#hitmarker{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:38px;
    display:none;
    z-index:60;
}
</style>
</head>

<body>

<div id="status">Lade weapon.glb...</div>
<div id="crosshair"></div>
<div id="hitmarker">✖</div>

<div id="coords"></div>

<div id="health">
    <div id="healthFill"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>

/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x87cfff);


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        75,
        innerWidth / innerHeight,
        0.01,
        5000
    );


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.outputEncoding =
    THREE.sRGBEncoding;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LIGHT
========================================================= */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        1.8
    )
);

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2.5
    );

sun.position.set(
    20,
    30,
    10
);

scene.add(sun);


/* =========================================================
   GROUND
========================================================= */

const grass =
    new THREE.TextureLoader().load(
        "https://threejs.org/examples/textures/terrain/grasslight-big.jpg"
    );

grass.wrapS =
    THREE.RepeatWrapping;

grass.wrapT =
    THREE.RepeatWrapping;

grass.repeat.set(
    100,
    100
);

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            5000,
            5000
        ),
        new THREE.MeshStandardMaterial({
            map:grass
        })
    );

ground.rotation.x =
    -Math.PI / 2;

scene.add(ground);


/* =========================================================
   PLAYER
========================================================= */

const player =
    new THREE.Object3D();

scene.add(player);

player.add(camera);

camera.position.set(
    0,
    2.2,
    0
);


/* =========================================================
   WEAPON HOLDER
========================================================= */

/*
    Dieser Holder sitzt DIREKT an der Kamera.

    Deshalb folgt die Waffe:
    - Drehung
    - Blickrichtung
    - Bewegung
    - Kamera
*/

const weaponHolder =
    new THREE.Object3D();

camera.add(
    weaponHolder
);


/*
    NICHT seitlich verschieben.

    Die Position der Waffe wird
    direkt am Holder eingestellt.
*/

weaponHolder.position.set(
    0,
    0,
    0
);


/* =========================================================
   WEAPON
========================================================= */

const loader =
    new THREE.GLTFLoader();

let weapon = null;

let recoil = 0;


/*
    First-Person Position.

    X:
    positiv = rechts

    Y:
    negativ = unten

    Z:
    negativ = vor Kamera
*/

const WEAPON_X = 0.42;
const WEAPON_Y = -0.48;
const WEAPON_Z = -0.95;


/*
    Zielgröße.
*/

const WEAPON_SIZE = 1.25;


/* =========================================================
   GLB LADEN
========================================================= */

loader.load(

    "./weapon.glb",

    function(gltf){

        weapon =
            gltf.scene;


        console.log(
            "weapon.glb geladen!"
        );


        /* ================================================
           SICHTBARKEIT
        ================================================ */

        weapon.visible = true;


        weapon.traverse(
            function(obj){

                if(obj.isMesh){

                    obj.visible = true;

                    obj.frustumCulled =
                        false;


                    if(obj.material){

                        if(
                            Array.isArray(
                                obj.material
                            )
                        ){

                            obj.material.forEach(
                                function(mat){

                                    mat.side =
                                        THREE.DoubleSide;

                                    mat.needsUpdate =
                                        true;

                                }
                            );

                        }
                        else{

                            obj.material.side =
                                THREE.DoubleSide;

                            obj.material.needsUpdate =
                                true;

                        }

                    }

                }

            }
        );


        /* ================================================
           ALLES AUF URSPRUNG ZENTRIEREN
        ================================================ */

        let box =
            new THREE.Box3()
            .setFromObject(
                weapon
            );


        let center =
            new THREE.Vector3();


        box.getCenter(
            center
        );


        weapon.position.sub(
            center
        );


        /* ================================================
           GRÖSSE
        ================================================ */

        let size =
            new THREE.Vector3();


        box.getSize(
            size
        );


        const largest =
            Math.max(
                size.x,
                size.y,
                size.z
            );


        if(
            largest > 0 &&
            isFinite(largest)
        ){

            const scale =
                WEAPON_SIZE /
                largest;


            weapon.scale.set(
                scale,
                scale,
                scale
            );

        }


        /* ================================================
           NACH SCALE ERNEUT ZENTRIEREN
        ================================================ */

        box =
            new THREE.Box3()
            .setFromObject(
                weapon
            );


        center =
            new THREE.Vector3();


        box.getCenter(
            center
        );


        weapon.position.sub(
            center
        );


        /* =================================================
           WICHTIG:
           DAS MODELL WIRD NICHT MEHR AUF SEINEN
           URSPRÜNGLICHEN PIVOT VERLASSEN.
        ================================================= */


        /*
           ==================================================
           WAFFENPOSITION
           ==================================================
        */

        weapon.position.set(
            WEAPON_X,
            WEAPON_Y,
            WEAPON_Z
        );


        /*
           ==================================================
           AUSRICHTUNG
           ==================================================

           Viele GLBs zeigen standardmäßig
           in eine andere Richtung.

           Deshalb drehen wir sie hier.

           Y = horizontale Drehung
           X = hoch/runter
           Z = seitliche Drehung
        */

        weapon.rotation.set(
            0,
            Math.PI,
            0
        );


        /*
           ==================================================
           HOLDER
           ==================================================
        */

        weaponHolder.add(
            weapon
        );


        /*
           ==================================================
           STATUS
           ==================================================
        */

        document.getElementById(
            "status"
        ).textContent =
            "✓ weapon.glb in Hand";


        console.log(
            "GLB Größe:",
            size
        );

        console.log(
            "Scale:",
            weapon.scale
        );

        console.log(
            "Position:",
            weapon.position
        );

    },

    function(xhr){

        if(xhr.total){

            document.getElementById(
                "status"
            ).textContent =
                "Lade weapon.glb " +
                Math.round(
                    xhr.loaded /
                    xhr.total *
                    100
                ) +
                "%";

        }

    },

    function(error){

        console.error(
            "weapon.glb Fehler:",
            error
        );

        document.getElementById(
            "status"
        ).textContent =
            "✕ weapon.glb Fehler";

    }

);


/* =========================================================
   INPUT
========================================================= */

const keys = {};

window.addEventListener(
    "keydown",
    function(e){

        keys[
            e.key.toLowerCase()
        ] = true;

        if(e.code === "Space"){

            e.preventDefault();

            if(onGround){

                velocityY =
                    0.25;

                onGround =
                    false;

            }

        }

    }
);

window.addEventListener(
    "keyup",
    function(e){

        keys[
            e.key.toLowerCase()
        ] = false;

    }
);


/* =========================================================
   LOOK
========================================================= */

let yaw = 0;
let pitch = 0;

document.body.addEventListener(
    "click",
    function(){

        document.body.requestPointerLock();

    }
);

document.addEventListener(
    "mousemove",
    function(e){

        if(
            document.pointerLockElement !==
            document.body
        ){

            return;

        }


        yaw -=
            e.movementX *
            0.002;


        pitch -=
            e.movementY *
            0.002;


        pitch =
            Math.max(
                -1.2,
                Math.min(
                    1.2,
                    pitch
                )
            );


        player.rotation.y =
            yaw;


        camera.rotation.x =
            pitch;

    }
);


/* =========================================================
   MOVEMENT
========================================================= */

function move(){

    const speed =
        0.15;


    let input =
        new THREE.Vector3();


    if(keys["w"])
        input.z -= 1;

    if(keys["s"])
        input.z += 1;

    if(keys["a"])
        input.x -= 1;

    if(keys["d"])
        input.x += 1;


    if(input.lengthSq() === 0)
        return;


    input.normalize();


    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    forward.applyEuler(
        player.rotation
    );


    forward.y = 0;

    forward.normalize();


    const right =
        new THREE.Vector3()
        .crossVectors(
            forward,
            new THREE.Vector3(
                0,
                1,
                0
            )
        )
        .negate();


    player.position.addScaledVector(
        forward,
        input.z *
        speed
    );


    player.position.addScaledVector(
        right,
        input.x *
        speed
    );

}


/* =========================================================
   GRAVITY
========================================================= */

let velocityY = 0;

let onGround = true;


function gravity(){

    velocityY -=
        0.015;


    player.position.y +=
        velocityY;


    if(
        player.position.y <= 0
    ){

        player.position.y =
            0;

        velocityY =
            0;

        onGround =
            true;

    }

}


/* =========================================================
   ENEMIES
========================================================= */

const enemies = [];


function addEnemy(
    x,
    y,
    z
){

    const enemy =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1,
                2,
                1
            ),
            new THREE.MeshStandardMaterial({
                color:0xff2222
            })
        );


    enemy.position.set(
        x,
        y,
        z
    );


    enemy.health =
        100;


    scene.add(
        enemy
    );


    enemies.push(
        enemy
    );

}


addEnemy(
    5,
    1,
    -20
);

addEnemy(
    -3,
    1,
    -15
);

addEnemy(
    8,
    1,
    -30
);


/* =========================================================
   SHOOTING
========================================================= */

const raycaster =
    new THREE.Raycaster();

let shooting =
    false;


function shoot(){

    if(shooting)
        return;


    shooting =
        true;


    recoil =
        0.15;


    raycaster.setFromCamera(
        new THREE.Vector2(
            0,
            0
        ),
        camera
    );


    const hits =
        raycaster.intersectObjects(
            enemies
        );


    if(hits.length){

        const enemy =
            hits[0].object;


        enemy.health -=
            25;


        const marker =
            document.getElementById(
                "hitmarker"
            );


        marker.style.display =
            "block";


        setTimeout(
            function(){

                marker.style.display =
                    "none";

            },
            100
        );


        if(
            enemy.health <= 0
        ){

            scene.remove(
                enemy
            );


            const i =
                enemies.indexOf(
                    enemy
                );


            if(i >= 0)
                enemies.splice(i,1);

        }

    }


    setTimeout(
        function(){

            shooting =
                false;

        },
        120
    );

}


window.addEventListener(
    "mousedown",
    function(e){

        if(
            e.button === 0
        ){

            shoot();

        }

    }
);


/* =========================================================
   UPDATE
========================================================= */

function update(){

    move();

    gravity();


    /*
       =====================================================
       WAFFE BLEIBT IMMER VOR DER KAMERA
       =====================================================
    */

    if(weapon){

        /*
           Position immer wieder festsetzen,
           damit nichts anderes sie verschiebt.
        */

        weapon.position.x =
            WEAPON_X;

        weapon.position.y =
            WEAPON_Y;

        weapon.position.z =
            WEAPON_Z +
            recoil;


        /*
           Rückstoß
        */

        weapon.rotation.x =
            recoil * 0.5;


        recoil *=
            0.72;


        if(
            Math.abs(recoil) < 0.001
        ){

            recoil = 0;

            weapon.rotation.x = 0;

        }

    }


    /* =====================================================
       COORDS
    ===================================================== */

    const dir =
        new THREE.Vector3(
            0,
            0,
            -1
        ).applyEuler(
            player.rotation
        );


    document.getElementById(
        "coords"
    ).textContent =

`X: ${player.position.x.toFixed(2)}
Y: ${player.position.y.toFixed(2)}
Z: ${player.position.z.toFixed(2)}

DIR X: ${dir.x.toFixed(2)}
DIR Z: ${dir.z.toFixed(2)}`;

}


/* =========================================================
   LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    update();


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            innerWidth /
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>

</body>
</html>
