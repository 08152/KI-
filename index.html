<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZIP → EXE</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;background:#080b12;color:#fff;
 font-family:Arial,sans-serif;display:flex;align-items:center;
 justify-content:center
}
.box{
 width:min(700px,92%);background:#111722;border:1px solid #293244;
 border-radius:20px;padding:30px;box-shadow:0 20px 60px #0008
}
h1{margin-top:0}
.sub{color:#9ca8bc}
.drop{
 margin-top:25px;border:2px dashed #53627c;border-radius:16px;
 padding:45px 20px;text-align:center;cursor:pointer
}
.drop:hover{background:#ffffff08;border-color:#728cff}
input{display:none}
button{
 width:100%;margin-top:20px;padding:15px;border:0;border-radius:12px;
 background:#586cff;color:white;font-size:16px;font-weight:bold;
 cursor:pointer
}
button:disabled{opacity:.45;cursor:not-allowed}
.status{
 margin-top:20px;padding:15px;border-radius:12px;background:#090d15;
 white-space:pre-wrap
}
.download{
 display:block;margin-top:15px;padding:14px;border-radius:12px;
 background:#1c9b62;color:white;text-decoration:none;text-align:center;
 font-weight:bold
}
.good{color:#62e6a0}
.bad{color:#ff7373}
</style>
</head>

<body>

<div class="box">

<h1>ZIP → EXE</h1>

<div class="sub">
Sichere Umwandlung einer Web-App in eine Windows-EXE
</div>

<div class="drop" id="drop">
📦<br><br>
ZIP-Datei auswählen
<br>
<small>Nur HTML/Web-Projekte</small>

<input id="file" type="file" accept=".zip">
</div>

<button id="build" disabled>
EXE erstellen
</button>

<div class="status" id="status">
Noch keine ZIP ausgewählt.
</div>

</div>

<script>

const fileInput=document.getElementById("file");
const drop=document.getElementById("drop");
const build=document.getElementById("build");
const status=document.getElementById("status");

let selectedFile=null;

drop.onclick=()=>{
    fileInput.click();
};

fileInput.onchange=()=>{
    if(fileInput.files.length){
        selectedFile=fileInput.files[0];

        status.textContent=
            "Ausgewählt: "+
            selectedFile.name+
            "\nGröße: "+
            (selectedFile.size/1024/1024).toFixed(2)+
            " MB";

        build.disabled=false;
    }
};

drop.ondragover=e=>{
    e.preventDefault();
};

drop.ondrop=e=>{
    e.preventDefault();

    if(e.dataTransfer.files.length){
        selectedFile=e.dataTransfer.files[0];

        status.textContent=
            "Ausgewählt: "+
            selectedFile.name;

        build.disabled=false;
    }
};

build.onclick=async()=>{

    if(!selectedFile)return;

    build.disabled=true;

    status.textContent=
        "ZIP wird sicher geprüft...\n"+
        "Bitte warten.";

    try{

        const form=new FormData();

        form.append("zip",selectedFile);

        const response=await fetch(
            "/api/build",
            {
                method:"POST",
                body:form
            }
        );

        const data=await response.json();

        if(!response.ok){
            throw new Error(
                data.error || "Fehler"
            );
        }

        status.innerHTML=
            '<span class="good">✓ EXE erstellt</span>'+
            '<br><br>'+
            data.message+
            '<a class="download" href="'+
            data.download+
            '" download>'+
            'EXE herunterladen'+
            '</a>';

    }catch(error){

        status.innerHTML=
            '<span class="bad">✕ Fehler</span>'+
            '<br><br>'+
            error.message;

    }

    build.disabled=false;
};

</script>

</body>
</html>
