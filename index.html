<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mini Minecraft – Infinite World</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:Arial}
canvas{display:block}

#crosshair{
 position:fixed;
 left:50%;
 top:50%;
 width:18px;
 height:18px;
 transform:translate(-50%,-50%);
 pointer-events:none;
 z-index:10
}
#crosshair:before,#crosshair:after{
 content:"";
 position:absolute;
 background:#fff;
 box-shadow:0 0 3px #000
}
#crosshair:before{width:18px;height:2px;top:8px;left:0}
#crosshair:after{width:2px;height:18px;left:8px;top:0}

#info{
 position:fixed;
 top:10px;
 left:10px;
 color:white;
 font-weight:bold;
 text-shadow:2px 2px 3px #000;
 z-index:20;
 line-height:1.5
}

#help{
 position:fixed;
 top:10px;
 right:10px;
 color:white;
 background:rgba(0,0,0,.4);
 padding:10px;
 border-radius:8px;
 text-align:right;
 z-index:20
}

#hotbar{
 position:fixed;
 bottom:15px;
 left:50%;
 transform:translateX(-50%);
 display:flex;
 gap:4px;
 z-index:20
}

.slot{
 width:58px;
 height:58px;
 background:rgba(25,25,25,.8);
 border:3px solid #555;
 position:relative;
 display:flex;
 align-items:center;
 justify-content:center
}

.slot.selected{
 border-color:white;
 transform:translateY(-4px)
}

.icon{
 width:34px;
 height:34px;
 border:2px solid #222
}

.number{
 position:absolute;
 top:2px;
 left:4px;
 color:white;
 text-shadow:2px 2px #000
}

.count{
 position:absolute;
 right:3px;
 bottom:1px;
 color:white;
 text-shadow:2px 2px #000;
 font-weight:bold
}

#start{
 position:fixed;
 inset:0;
 z-index:100;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 background:linear-gradient(#70c8f4,#d8f3ff)
}

#start h1{
 font-size:54px;
 margin:0 0 20px;
 color:white;
 text-shadow:4px 4px #555
}

#start button{
 border:0;
 padding:16px 45px;
 font-size:22px;
 font-weight:bold;
 border-radius:7px;
 background:#48a63f;
 color:white;
 cursor:pointer
}

#loading{
 position:fixed;
 inset:0;
 z-index:200;
 display:none;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 color:white;
 background:#222;
 font-size:25px
}

#message{
 position:fixed;
 left:50%;
 bottom:95px;
 transform:translateX(-50%);
 color:white;
 font-weight:bold;
 text-shadow:2px 2px #000;
 opacity:0;
 transition:.2s;
 z-index:30
}
</style>
</head>

<body>

<div id="loading">
 <b>Welt wird geladen...</b>
 <span id="loadText">Chunks werden erstellt</span>
</div>

<div id="start">
 <h1>⛏️ MINECRAFT</h1>
 <p>Eine unendliche Blockwelt</p>
 <button id="startButton">SPIELEN</button>
</div>

<div id="info">
 <div id="coords">X: 0 Y: 0 Z: 0</div>
 <div id="selectedInfo">Block: Gras</div>
 <div id="chunkInfo">Chunks: 0</div>
</div>

<div id="help">
 WASD – Laufen<br>
 SPACE – Springen<br>
 Linksklick – Abbauen<br>
 Rechtsklick – Setzen<br>
 1–9 – Block wählen<br>
 ESC – Maus freigeben
</div>

<div id="crosshair"></div>
<div id="message"></div>
<div id="hotbar"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

<script>
/* =========================================================
   THREE.JS
========================================================= */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x78c8f5);
scene.fog=new THREE.Fog(0x78c8f5,70,180);

const camera=new THREE.PerspectiveCamera(
 75,
 innerWidth/innerHeight,
 .05,
 500
);

const renderer=new THREE.WebGLRenderer({
 antialias:false,
 powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
document.body.appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(
 0xbfeaff,
 0x67503b,
 1.15
);
scene.add(hemi);

const sun=new THREE.DirectionalLight(0xffffff,1);
sun.position.set(100,200,100);
scene.add(sun);

const controls=new THREE.PointerLockControls(camera,document.body);

/* =========================================================
   BLOCKE
========================================================= */

const BLOCKS=[
 {
  id:"grass",
  name:"Gras",
  color:0x55a83b
 },
 {
  id:"dirt",
  name:"Erde",
  color:0x79502e
 },
 {
  id:"stone",
  name:"Stein",
  color:0x858585
 },
 {
  id:"sand",
  name:"Sand",
  color:0xd9c27c
 },
 {
  id:"wood",
  name:"Holz",
  color:0x8b5a2b
 },
 {
  id:"leaves",
  name:"Blätter",
  color:0x329447
 },
 {
  id:"cobble",
  name:"Bruchstein",
  color:0x696969
 },
 {
  id:"glass",
  name:"Glas",
  color:0x9edbea,
  transparent:true
 },
 {
  id:"brick",
  name:"Ziegel",
  color:0xa94334
 }
];

const materials={};

for(const block of BLOCKS){
 materials[block.id]=new THREE.MeshLambertMaterial({
  color:block.color,
  transparent:!!block.transparent,
  opacity:block.transparent?.45:1,
  depthWrite:!block.transparent
 });
}

const cubeGeo=new THREE.BoxGeometry(1,1,1);

/* =========================================================
   INVENTAR
========================================================= */

const inventory={
 grass:64,
 dirt:64,
 stone:64,
 sand:32,
 wood:32,
 leaves:32,
 cobble:32,
 glass:32,
 brick:32
};

let selectedSlot=0;

function createHotbar(){

 const bar=document.getElementById("hotbar");
 bar.innerHTML="";

 BLOCKS.forEach((block,i)=>{

  const slot=document.createElement("div");
  slot.className="slot";

  if(i===selectedSlot)
   slot.classList.add("selected");

  const num=document.createElement("div");
  num.className="number";
  num.textContent=i+1;

  const icon=document.createElement("div");
  icon.className="icon";
  icon.style.background=`
   rgb(
    ${(block.color>>16)&255},
    ${(block.color>>8)&255},
    ${block.color&255}
   )
  `;

  const count=document.createElement("div");
  count.className="count";
  count.textContent=inventory[block.id]||0;

  slot.appendChild(num);
  slot.appendChild(icon);
  slot.appendChild(count);

  bar.appendChild(slot);
 });
}

createHotbar();

function selectBlock(index){

 if(index<0||index>=BLOCKS.length)return;

 selectedSlot=index;

 createHotbar();

 document.getElementById("selectedInfo").textContent=
 "Block: "+BLOCKS[index].name;
}

/* =========================================================
   INFINITE CHUNK-WELT
========================================================= */

const CHUNK_SIZE=16;
const RENDER_DISTANCE=4;

const chunks=new Map();

function chunkKey(cx,cz){
 return cx+","+cz;
}

/* deterministischer Noise */

function hash(x,z){

 const value=Math.sin(
   x*127.1+
   z*311.7+
   17.3
 )*43758.5453123;

 return value-Math.floor(value);
}

function smoothNoise(x,z){

 const x0=Math.floor(x);
 const z0=Math.floor(z);

 const fx=x-x0;
 const fz=z-z0;

 const a=hash(x0,z0);
 const b=hash(x0+1,z0);
 const c=hash(x0,z0+1);
 const d=hash(x0+1,z0+1);

 const sx=fx*fx*(3-2*fx);
 const sz=fz*fz*(3-2*fz);

 const ab=a+(b-a)*sx;
 const cd=c+(d-c)*sx;

 return ab+(cd-ab)*sz;
}

function noise(x,z){

 let value=0;
 let amplitude=1;
 let frequency=.025;
 let total=0;

 for(let i=0;i<5;i++){

  value+=smoothNoise(
   x*frequency,
   z*frequency
  )*amplitude;

  total+=amplitude;

  amplitude*=.5;
  frequency*=2;
 }

 return value/total;
}

function getHeight(x,z){

 let n=noise(x,z);

 let height=
  5+
  Math.floor(n*10);

 const mountain=noise(
  x*.12,
  z*.12
 );

 if(mountain>.62){
  height+=Math.floor(
   (mountain-.62)*35
  );
 }

 return Math.max(
  2,
  Math.min(30,height)
 );
}

/* =========================================================
   BLOCK DATEN
========================================================= */

const worldBlocks=new Map();

function blockKey(x,y,z){
 return x+"|"+y+"|"+z;
}

function setBlockData(x,y,z,type){

 const key=blockKey(x,y,z);

 if(type===null){
  worldBlocks.delete(key);
 }else{
  worldBlocks.set(key,type);
 }
}

function getBlockData(x,y,z){

 const key=blockKey(x,y,z);

 if(worldBlocks.has(key))
  return worldBlocks.get(key);

 return null;
}

/* =========================================================
   CHUNK ERZEUGEN
========================================================= */

function generateChunk(cx,cz){

 const key=chunkKey(cx,cz);

 if(chunks.has(key))
  return;

 const group=new THREE.Group();
 group.userData.chunkKey=key;

 const blockData=[];

 const startX=cx*CHUNK_SIZE;
 const startZ=cz*CHUNK_SIZE;

 for(let lx=0;lx<CHUNK_SIZE;lx++){

  for(let lz=0;lz<CHUNK_SIZE;lz++){

   const x=startX+lx;
   const z=startZ+lz;

   const height=getHeight(x,z);

   for(let y=0;y<=height;y++){

    let type;

    if(y===height){
     type="grass";
    }
    else if(y>height-4){
     type="dirt";
    }
    else{
     type="stone";
    }

    setBlockData(x,y,z,type);

    blockData.push({
     x,y,z,type
    });
   }
  }
 }

 /* Sandflächen */

 for(let lx=0;lx<CHUNK_SIZE;lx++){

  for(let lz=0;lz<CHUNK_SIZE;lz++){

   const x=startX+lx;
   const z=startZ+lz;
   const h=getHeight(x,z);

   if(h<=4){

    setBlockData(x,h,z,"sand");

    if(h>0)
     setBlockData(x,h-1,z,"sand");
   }
  }
 }

 /* Bäume */

 for(let lx=2;lx<CHUNK_SIZE-2;lx+=3){

  for(let lz=2;lz<CHUNK_SIZE-2;lz+=3){

   const x=startX+lx;
   const z=startZ+lz;

   const r=hash(
    x*9+71,
    z*13+23
   );

   if(r>.965){

    const h=getHeight(x,z);

    if(h>5){

     for(let y=1;y<=4;y++){
      setBlockData(x,h+y,z,"wood");
     }

     for(let dx=-2;dx<=2;dx++){

      for(let dz=-2;dz<=2;dz++){

       for(let dy=3;dy<=5;dy++){

        if(
         Math.abs(dx)+
         Math.abs(dz)+
         dy<8
        ){

         const xx=x+dx;
         const yy=h+dy;
         const zz=z+dz;

         setBlockData(
          xx,yy,zz,"leaves"
         );
        }
       }
      }
     }
    }
   }
  }
 }

 buildChunkMesh(cx,cz);

 chunks.set(key,group);
 scene.add(group);
}

function buildChunkMesh(cx,cz){

 const key=chunkKey(cx,cz);

 const group=new THREE.Group();
 group.userData.chunkKey=key;

 const startX=cx*CHUNK_SIZE;
 const startZ=cz*CHUNK_SIZE;

 for(let lx=0;lx<CHUNK_SIZE;lx++){

  for(let lz=0;lz<CHUNK_SIZE;lz++){

   const x=startX+lx;
   const z=startZ+lz;

   const maxY=35;

   for(let y=0;y<=maxY;y++){

    const type=getBlockData(x,y,z);

    if(!type)continue;

    /* Nur sichtbare Blöcke */

    const neighbors=[
     [x+1,y,z],
     [x-1,y,z],
     [x,y+1,z],
     [x,y-1,z],
     [x,y,z+1],
     [x,y,z-1]
    ];

    let visible=false;

    for(const n of neighbors){

     if(!getBlockData(
      n[0],n[1],n[2]
     )){
      visible=true;
      break;
     }
    }

    if(!visible)continue;

    const mesh=new THREE.Mesh(
     cubeGeo,
     materials[type]
    );

    mesh.position.set(
     x+.5,
     y+.5,
     z+.5
    );

    mesh.userData={
     x:x,
     y:y,
     z:z,
     type:type
    };

    group.add(mesh);
   }
  }
 }

 chunks.set(key,group);

 scene.add(group);
}

/* =========================================================
   CHUNK ENTFERNEN
========================================================= */

function unloadChunk(cx,cz){

 const key=chunkKey(cx,cz);
 const chunk=chunks.get(key);

 if(!chunk)return;

 scene.remove(chunk);

 chunk.traverse(obj=>{

  if(obj.geometry){
   // Geometry gemeinsam benutzt – nicht löschen
  }
 });

 chunks.delete(key);
}

/* =========================================================
   CHUNKS AKTUALISIEREN
========================================================= */

let lastCX=null;
let lastCZ=null;

function updateChunks(){

 const px=Math.floor(
  camera.position.x/CHUNK_SIZE
 );

 const pz=Math.floor(
  camera.position.z/CHUNK_SIZE
 );

 if(px===lastCX&&pz===lastCZ)
  return;

 lastCX=px;
 lastCZ=pz;

 for(let dx=-RENDER_DISTANCE;dx<=RENDER_DISTANCE;dx++){

  for(let dz=-RENDER_DISTANCE;dz<=RENDER_DISTANCE;dz++){

   if(
    dx*dx+
    dz*dz<=
    RENDER_DISTANCE*RENDER_DISTANCE
   ){
    generateChunk(
     px+dx,
     pz+dz
    );
   }
  }
 }

 for(const key of chunks.keys()){

  const parts=key.split(",");
  const cx=Number(parts[0]);
  const cz=Number(parts[1]);

  const distance=Math.max(
   Math.abs(cx-px),
   Math.abs(cz-pz)
  );

  if(distance>RENDER_DISTANCE+1){
   unloadChunk(cx,cz);
  }
 }

 document.getElementById("chunkInfo").textContent=
  "Chunks: "+chunks.size;
}

/* =========================================================
   SPIELER
========================================================= */

camera.position.set(
 .5,
 getHeight(0,0)+2.7,
 .5
);

const player={
 speed:5,
 sprint:8,
 velocityY:0,
 grounded:false
};

const keys={
 w:false,
 a:false,
 s:false,
 d:false
};

document.addEventListener("keydown",e=>{

 if(e.code==="KeyW")keys.w=true;
 if(e.code==="KeyA")keys.a=true;
 if(e.code==="KeyS")keys.s=true;
 if(e.code==="KeyD")keys.d=true;

 if(e.code==="Space"&&player.grounded){
  player.velocityY=8;
  player.grounded=false;
 }

 if(e.key>="1"&&e.key<="9"){
  selectBlock(
   Number(e.key)-1
  );
 }
});

document.addEventListener("keyup",e=>{

 if(e.code==="KeyW")keys.w=false;
 if(e.code==="KeyA")keys.a=false;
 if(e.code==="KeyS")keys.s=false;
 if(e.code==="KeyD")keys.d=false;
});

/* =========================================================
   BLOCKKOLLISION
========================================================= */

function getGroundHeight(x,z){

 return getHeight(
  Math.floor(x),
  Math.floor(z)
 )+1;
}

function updatePlayer(dt){

 let moveX=0;
 let moveZ=0;

 if(keys.w)moveZ-=1;
 if(keys.s)moveZ+=1;
 if(keys.a)moveX-=1;
 if(keys.d)moveX+=1;

 if(moveX||moveZ){

  const length=Math.hypot(
   moveX,moveZ
  );

  moveX/=length;
  moveZ/=length;

  const direction=new THREE.Vector3();

  camera.getWorldDirection(direction);

  direction.y=0;
  direction.normalize();

  const right=new THREE.Vector3()
   .crossVectors(
    direction,
    new THREE.Vector3(0,1,0)
   )
   .normalize();

  const forwardX=direction.x;
  const forwardZ=direction.z;

  const dx=
   forwardX*moveZ+
   right.x*moveX;

  const dz=
   forwardZ*moveZ+
   right.z*moveX;

  const speed=
   keys.shift?player.sprint:player.speed;

  camera.position.x+=dx*speed*dt;
  camera.position.z+=dz*speed*dt;
 }

 /* Schwerkraft */

 player.velocityY-=20*dt;

 camera.position.y+=
  player.velocityY*dt;

 const ground=
  getGroundHeight(
   camera.position.x,
   camera.position.z
  )+1.65;

 if(camera.position.y<=ground){

  camera.position.y=ground;
  player.velocityY=0;
  player.grounded=true;
 }else{
  player.grounded=false;
 }

 /* Welt niemals verlassen */

 if(camera.position.y<-20){
  camera.position.set(
   0,
   getGroundHeight(0,0)+2,
   0
  );
  player.velocityY=0;
 }
}

/* =========================================================
   RAYCASTING
========================================================= */

const raycaster=new THREE.Raycaster();

function getTargetBlock(){

 raycaster.setFromCamera(
  new THREE.Vector2(0,0),
  camera
 );

 const objects=[];

 for(const chunk of chunks.values()){

  for(const child of chunk.children){

   if(child.isMesh)
    objects.push(child);
  }
 }

 const hits=raycaster.intersectObjects(
  objects,
  false
 );

 if(!hits.length)return null;

 if(hits[0].distance>6)return null;

 return hits[0];
}

/* =========================================================
   BLOCK ABBauen
========================================================= */

function breakBlock(){

 const hit=getTargetBlock();

 if(!hit)return;

 const data=hit.object.userData;

 if(data.y<=0)return;

 setBlockData(
  data.x,
  data.y,
  data.z,
  null
 );

 inventory[data.type]=
  (inventory[data.type]||0)+1;

 rebuildAround(
  data.x,
  data.y,
  data.z
 );

 createHotbar();

 showMessage(
  "Abgebaut: "+
  BLOCKS.find(b=>b.id===data.type).name
 );
}

/* =========================================================
   BLOCK SETZEN
========================================================= */

function placeBlock(){

 const hit=getTargetBlock();

 if(!hit)return;

 const block=
  BLOCKS[selectedSlot];

 if((inventory[block.id]||0)<=0){
  showMessage("Kein Block vorhanden!");
  return;
 }

 const normal=
  hit.face.normal.clone();

 const pos=
  hit.object.position.clone()
   .subScalar(.5)
   .add(normal);

 const x=Math.floor(pos.x);
 const y=Math.floor(pos.y);
 const z=Math.floor(pos.z);

 if(
  x===Math.floor(camera.position.x)&&
  z===Math.floor(camera.position.z)&&
  y<=Math.floor(camera.position.y)
 ){
  return;
 }

 if(getBlockData(x,y,z)){
  return;
 }

 setBlockData(
  x,y,z,
  block.id
 );

 inventory[block.id]--;

 rebuildAround(x,y,z);

 createHotbar();
}

/* =========================================================
   CHUNK MESH NEU BAUEN
========================================================= */

function rebuildAround(x,y,z){

 const c=Math.floor(x/CHUNK_SIZE);
 const d=Math.floor(z/CHUNK_SIZE);

 for(let dx=-1;dx<=1;dx++){

  for(let dz=-1;dz<=1;dz++){

   rebuildChunk(
    c+dx,
    d+dz
   );
  }
 }
}

function rebuildChunk(cx,cz){

 const key=chunkKey(cx,cz);

 const old=chunks.get(key);

 if(old){
  scene.remove(old);
  chunks.delete(key);
 }

 buildChunkMesh(cx,cz);
}

/* =========================================================
   MAUS
========================================================= */

renderer.domElement.addEventListener(
 "mousedown",
 e=>{

  if(!controls.isLocked)return;

  if(e.button===0){
   breakBlock();
  }

  if(e.button===2){
   placeBlock();
  }
 }
);

document.addEventListener(
 "contextmenu",
 e=>e.preventDefault()
);

/* =========================================================
   START
========================================================= */

document.getElementById(
 "startButton"
).onclick=()=>{

 document.getElementById(
  "start"
 ).style.display="none";

 document.getElementById(
  "loading"
 ).style.display="flex";

 setTimeout(()=>{

  updateChunks();

  document.getElementById(
   "loading"
  ).style.display="none";

  controls.lock();

 },100);

};

document.addEventListener(
 "click",
 ()=>{

  if(
   document.getElementById("start").style.display==="none" &&
   !controls.isLocked
  ){
   controls.lock();
  }

 }
);

/* =========================================================
   NACHRICHT
========================================================= */

let messageTimer;

function showMessage(text){

 const el=document.getElementById(
  "message"
 );

 el.textContent=text;
 el.style.opacity=1;

 clearTimeout(messageTimer);

 messageTimer=setTimeout(()=>{
  el.style.opacity=0;
 },1200);
}

/* =========================================================
   HUD
========================================================= */

function updateHUD(){

 document.getElementById(
  "coords"
 ).textContent=
 "X: "+
 Math.floor(camera.position.x)+
 " Y: "+
 Math.floor(camera.position.y)+
 " Z: "+
 Math.floor(camera.position.z);
}

/* =========================================================
   RENDER LOOP
========================================================= */

let previous=performance.now();

function animate(){

 requestAnimationFrame(animate);

 const now=performance.now();

 let dt=(now-previous)/1000;
 previous=now;

 dt=Math.min(dt,.05);

 if(controls.isLocked){

  updatePlayer(dt);
  updateChunks();
  updateHUD();
 }

 renderer.render(
  scene,
  camera
 );
}

animate();

/* =========================================================
   RESIZE
========================================================= */

addEventListener("resize",()=>{

 camera.aspect=
  innerWidth/innerHeight;

 camera.updateProjectionMatrix();

 renderer.setSize(
  innerWidth,
  innerHeight
 );
});
</script>

</body>
</html>
