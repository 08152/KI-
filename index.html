<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GHOST Hue Control</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#0d0f14;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
}

.panel{
  width:min(500px,94vw);
  background:#191c24;
  border-radius:25px;
  padding:25px;
  box-shadow:0 20px 70px #000;
}

h1{
  text-align:center;
  margin-top:0;
}

.status{
  background:#252934;
  padding:15px;
  border-radius:12px;
  text-align:center;
  margin-bottom:20px;
  white-space:pre-line;
}

button{
  width:100%;
  padding:16px;
  margin:6px 0;
  border:0;
  border-radius:14px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.on{
  background:#ffe45c;
  color:#111;
}

.off{
  background:#353943;
  color:white;
}

.scan{
  background:#529cff;
  color:white;
}

label{
  display:block;
  margin-top:22px;
  margin-bottom:8px;
}

input[type=range]{
  width:100%;
}

input[type=color]{
  width:100%;
  height:60px;
  border:0;
  background:none;
}

select{
  width:100%;
  padding:14px;
  border-radius:10px;
  background:#292d37;
  color:white;
  border:1px solid #444;
}
</style>
</head>

<body>

<div class="panel">

<h1>💡 GHOST Hue Control</h1>

<div id="status" class="status">
Nicht verbunden
</div>

<button class="scan" onclick="findLights()">
🔎 Lampen suchen
</button>

<label>Lampe</label>

<select id="light">
<option value="">Noch keine Lampen gefunden</option>
</select>

<button class="on" onclick="power(true)">
💡 Licht AN
</button>

<button class="off" onclick="power(false)">
🌑 Licht AUS
</button>

<label>
☀️ Helligkeit:
<span id="brightnessText">100</span>%
</label>

<input
type="range"
id="brightness"
min="1"
max="100"
value="100"
oninput="brightnessText.textContent=this.value"
onchange="setBrightness(this.value)"
>

<label>🌈 Farbe</label>

<input
type="color"
id="color"
value="#ffffff"
onchange="setColor(this.value)"
>

</div>

<script>

const statusBox =
document.getElementById("status");

const lightSelect =
document.getElementById("light");

async function api(url, options={}){

  const response =
    await fetch(url,{
      ...options,
      headers:{
        "Content-Type":"application/json",
        ...(options.headers||{})
      }
    });

  const data =
    await response.json();

  if(!response.ok){
    throw new Error(
      data.error || "Serverfehler"
    );
  }

  return data;
}


async function findLights(){

  statusBox.textContent =
    "🔎 Suche Lampen...";

  try{

    const data =
      await api("/api/lights");

    lightSelect.innerHTML="";

    const lights =
      data.lights || {};

    const ids =
      Object.keys(lights);

    if(ids.length===0){

      statusBox.textContent =
        "Keine Lampen gefunden.";

      return;
    }

    ids.forEach(id=>{

      const option =
        document.createElement("option");

      option.value=id;

      option.textContent =
        `${id} – ${lights[id].name}`;

      lightSelect.appendChild(option);

    });

    statusBox.textContent =
      `✅ ${ids.length} Lampe(n) gefunden`;

  }catch(error){

    statusBox.textContent =
      "❌ " + error.message;

  }

}


function selectedLight(){

  const id =
    lightSelect.value;

  if(!id){

    alert("Bitte zuerst eine Lampe auswählen.");

    return null;
  }

  return id;
}


async function power(on){

  const id =
    selectedLight();

  if(!id)return;

  try{

    await api(
      `/api/lights/${id}/power`,
      {
        method:"POST",
        body:JSON.stringify({
          on:on
        })
      }
    );

    statusBox.textContent =
      on ? "💡 Licht ist AN"
          : "🌑 Licht ist AUS";

  }catch(error){

    statusBox.textContent =
      "❌ " + error.message;

  }

}


async function setBrightness(value){

  const id =
    selectedLight();

  if(!id)return;

  try{

    await api(
      `/api/lights/${id}/brightness`,
      {
        method:"POST",
        body:JSON.stringify({
          brightness:Number(value)
        })
      }
    );

    statusBox.textContent =
      `☀️ Helligkeit: ${value}%`;

  }catch(error){

    statusBox.textContent =
      "❌ " + error.message;

  }

}


function hexToXY(hex){

  let r =
    parseInt(hex.substring(1,3),16)/255;

  let g =
    parseInt(hex.substring(3,5),16)/255;

  let b =
    parseInt(hex.substring(5,7),16)/255;


  r = r > 0.04045
    ? Math.pow((r+0.055)/1.055,2.4)
    : r/12.92;

  g = g > 0.04045
    ? Math.pow((g+0.055)/1.055,2.4)
    : g/12.92;

  b = b > 0.04045
    ? Math.pow((b+0.055)/1.055,2.4)
    : b/12.92;


  const X =
    r*0.664511 +
    g*0.154324 +
    b*0.162028;

  const Y =
    r*0.283881 +
    g*0.668433 +
    b*0.047685;

  const Z =
    r*0.000088 +
    g*0.072310 +
    b*0.986039;

  const sum=X+Y+Z;

  if(sum===0)
    return [0.3,0.3];

  return [
    X/sum,
    Y/sum
  ];
}


async function setColor(hex){

  const id =
    selectedLight();

  if(!id)return;

  try{

    const xy =
      hexToXY(hex);

    await api(
      `/api/lights/${id}/color`,
      {
        method:"POST",
        body:JSON.stringify({
          x:xy[0],
          y:xy[1]
        })
      }
    );

    statusBox.textContent =
      "🌈 Farbe geändert";

  }catch(error){

    statusBox.textContent =
      "❌ " + error.message;

  }

}

</script>

</body>
</html>
