<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fishing Simulator</title>
<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#75c9ec;
}
canvas{display:block}

#crosshair{
    position:fixed;
    left:50%;
    top:50%;

    height:8px;

    border:2px solid white;

}

#hud{

    left:15px;

#prompt{

    left:50%;

#start button{

    border-radius:12px;

    top:15px;

#boatControls{

    bottom:18px;
    left:50%;

    border-radius:12px;
    z-index:30;
    display:none;
    text-align:center;
}
</style>
</head>

<div id="start">
    <h1>🎣 FISHING SIMULATOR</h1>
    <p>Hafen • Fischerboot • Kran • Netz</p>
    <button id="startButton">STARTEN</button>
</div>

<div id="crosshair"></div>

<div id="hud">
    <b>🎣 FISHING SIMULATOR</b><br>
    WASD = Laufen<br>
    Maus = Umschauen<br>
    E = Interagieren<br>
    R = Brücke drehen<br>
    Shift = Rennen<br>
    Space = Springen
</div>

<div id="status">
    🔩 Brücke: <b id="bridgeStatus">am Hafen</b>
</div>

<div id="prompt"></div>

<div id="boatControls">
    🚤 <b>BOOT STEUERN</b><br>
    W/S = Gas &nbsp; A/D = Lenken<br>
    E = Steuerstand verlassen
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

sun.shadow.mapSize.height = 1024;

   MATERIALIEN

/* =========================================================
   HILFSFUNKTIONEN
========================================================= */

function createBox(
    w,h,d,
    material,
    x,y,z,
    parent=scene
){

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(w,h,d),
            material
        );

    mesh.position.set(x,y,z);

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    parent.add(mesh);

    return mesh;
}

function createCylinder(
    radius,
    height,
    material,
    x,y,z,
    parent=scene,
    segments=16
){

    const mesh =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                radius,
                radius,
                height,
                segments
            ),
            material
        );

    mesh.position.set(x,y,z);

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    parent.add(mesh);

    return mesh;
}

function worldPosition(object){

    const p =
        new THREE.Vector3();

    object.getWorldPosition(p);

    return p;
}


/* =========================================================
   HAFEN
========================================================= */

createBox(
    90,.5,60,

const water =

water.position.set(

createBox(

createBox(

/* Poller */

for(let x=-30;x<=30;x+=10){

/* =========================================================
   BOOT
========================================================= */

scene.add(boat);

/* Hauptrumpf */

createBox(

);


/* Bug */

const bow =
    new THREE.Mesh(

    );

bow.rotation.x =

bow.rotation.y =

bow.scale.z = 1.4;

bow.position.set(

bow.castShadow = true;

/* =========================================================
   BOOT-HITBOX
========================================================= */

const boatHitbox =

function updateBoatHitbox(){

/* =========================================================
   RELING
========================================================= */

for(

    z<=9;
    z+=3
){

        .15,1,.15,
        metal,
        -4.5,2,z,

    );

    createBox(

}

createBox(
    9,.12,.12,
    metal,
    0,2.45,-9.5,
    boat
);

createBox(
    9,.12,.12,
    metal,
    0,2.45,9.5,
    boat
);


/* =========================================================
   KAJÜTE
========================================================= */

const cabin =
    new THREE.Group();

cabin.position.set(
    0,
    1.5,

);

boat.add(cabin);


/* Kabinenkörper */

createBox(

    3.5,
    5,

);


/* Dach */

createBox(
    7.8,

);


/* Fenster */

createBox(
    2.4,

    .12,
    glass,

    -2.55,
    cabin
);

createBox(
    2.4,
    1.3,
    .12,
    glass,
    1.7,
    2.4,
    -2.55,
    cabin
);

createBox(
    .12,
    1.3,
    2.2,
    glass,
    -3.55,
    2.4,
    .3,
    cabin
);

createBox(
    .12,
    1.3,
    2.2,
    glass,
    3.55,
    2.4,
    .3,
    cabin
);


/* =========================================================
   TÜR MIT HITBOX
========================================================= */

const cabinDoor =
    new THREE.Group();

cabinDoor.position.set(
    -.85,
    1.35,
    2.58
);

cabin.add(cabinDoor);

createBox(
    1.7,
    2.7,
    .14,
    darkWood,
    .85,
    0,
    0,
    cabinDoor
);

let doorOpen = false;
let doorMoving = false;

function toggleDoor(){

    if(doorMoving)
        return;

    doorMoving = true;

    const start =
        doorOpen ? 1 : 0;

    const end =
        doorOpen ? 0 : 1;

    let t=0;

    function animation(){

        t += .08;

        const p =
            Math.min(t,1);

        const eased =
            p < .5
            ? 2*p*p
            : 1-Math.pow(-2*p+2,2)/2;

        cabinDoor.rotation.y =
            (start +
            (end-start)*eased)
            *(-Math.PI/2);

        if(p<1){

            requestAnimationFrame(
                animation
            );

        }else{

            doorOpen =
                !doorOpen;

            doorMoving=false;
        }
    }

    animation();
}


/* =========================================================
   STEUERSTAND
========================================================= */

const wheel =
    new THREE.Group();

wheel.position.set(
    0,
    2.7,
    .2
);

boat.add(wheel);

const ring =
    new THREE.Mesh(

ring.rotation.x =

wheel.add(ring);

            .12,
            1.65,
            metal,
            Math.sin(a)*.75,
            0,
            Math.cos(a)*.75,
            wheel
        );

/* Konsole */

);


/* Sitz */

createBox(

   HINTERER BEREICH
========================================================= */

rear.position.set(

);

boat.add(rear);

createBox(
    8,.2,5,
    wood,
    0,1.7,0,
    rear
);


/* =========================================================
   NETZ AUF DEM DECK
========================================================= */

const deckNet =

deckNet.position.set(

    1.88,
    7.5
);

boat.add(deckNet);

const netPlane =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            5,
            3.5,
            12,
            8

    );

netPlane.rotation.x =

deckNet.add(netPlane);


/* Netzlinien */

for(

){

}

for(

){

        .035,

/* =========================================================
   KRAN
========================================================= */

const crane =

crane.position.set(

);

/* Dreharm */

const craneArm =

craneArm.position.set(

);

crane.add(craneArm);

createBox(

/* Ausleger */

boom.position.set(

);

craneArm.add(boom);

);


/* Seil */

    );

rope.position.set(

);

boom.add(rope);


/* Haken */

hook.position.set(

    -4,

);

boom.add(hook);

createCylinder(
    .18,
    .5,
    new THREE.MeshStandardMaterial({
        color:0xe1a91f,
        metalness:.6
    }),

    hook,

);


/* =========================================================
   KRAN-NETZ
========================================================= */

const hangingNet =
    new THREE.Group();

hangingNet.position.set(
    0,
    -.3,
    0
);

hook.add(hangingNet);

const hangingBasket =
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            1.6,
            .8,
            1.5,
            12,
            1,
            true
        ),
        netMaterial
    );

hangingNet.add(
    hangingBasket
);


/* =========================================================
   KRAN STATUS
========================================================= */

let craneLowered=false;
let craneAnimationRunning=false;
let craneProgress=0;

function animateCrane(){

    if(craneAnimationRunning)
        return;

    craneAnimationRunning=true;

    const from =
        craneLowered ? 1 : 0;

    const to =
        craneLowered ? 0 : 1;

    let t=0;

    function step(){

        t+=.025;

        const p=
            Math.min(t,1);

        const eased =
            p<.5
            ?2*p*p
            :1-Math.pow(-2*p+2,2)/2;

        const value =
            from +
            (to-from)*eased;

        /*
          Kranarm geht nach unten.
        */

        boom.rotation.z =
            -value*.45;

        /*
          Seil wird länger.
        */

        rope.scale.y =
            1+value*2;

        rope.position.y =
            -2-value*2;

        hook.position.y =
            -4-value*2;

        hangingNet.position.y =
            -.3-value*1.5;

        if(p<1){

            requestAnimationFrame(
                step
            );

        }else{

            craneLowered =
                !craneLowered;

            craneAnimationRunning=false;
        }
    }

    step();
}


/* =========================================================
   EISENBRÜCKE
========================================================= */

const bridge =
    new THREE.Group();

createBox(
    2.2,
    .18,
    5,
    darkMetal,
    0,.15,0,
    bridge
);

for(
    let z=-2;
    z<=2;
    z+=1
){

    createBox(
        2.2,
        .18,
        .12,
        metal,
        0,.28,z,
        bridge
    );
}

bridge.position.set(
    -5,
    .25,
    -2.8
);

scene.add(bridge);


/* =========================================================
   BRÜCKEN-PHYSIK
========================================================= */

let bridgeState=0;
/*
0 = Hafen
1 = gehalten
2 = frei platziert
3 = auf Boot
*/

let bridgeVelocity =
    new THREE.Vector3();

let bridgeAngularVelocity=0;

let bridgeRotation=0;

const bridgeHalfHeight=.1;

function updateBridgePhysics(dt){

    if(
        bridgeState!==2
    )
        return;

    /*
      Schwerkraft
    */

    bridgeVelocity.y -=
        14*dt;

    bridge.position.addScaledVector(
        bridgeVelocity,
        dt
    );

    /*
      Drehung
    */

    bridge.rotation.z +=
        bridgeAngularVelocity*dt;

    bridgeAngularVelocity *=
        .985;


    /*
      Boden
    */

    const groundY=.18;

    if(
        bridge.position.y <
        groundY
    ){

        bridge.position.y=
            groundY;

        if(
            Math.abs(
                bridgeVelocity.y
            )>.3
        ){

            bridgeVelocity.y *= -.25;

        }else{

            bridgeVelocity.y=0;
        }

        bridgeAngularVelocity *= .8;
    }


    /*
      Bootdeck-Kollision
    */

    if(
        boat.position.distanceTo(
            bridge.position
        )<8 &&
        bridge.position.y>1 &&
        bridge.position.y<4
    ){

        bridgeVelocity.y *= -.3;

    }
}


/* =========================================================
   BRÜCKE AUFNEHMEN
========================================================= */

function pickupBridge(){

    bridgeState=1;

    bridge.visible=false;

    bridgeVelocity.set(
        0,0,0
    );

    bridgeAngularVelocity=0;

    document.getElementById(
        "bridgeStatus"
    ).textContent=
        "in der Hand";
}


/* =========================================================
   BRÜCKE IN HAND
========================================================= */

function updateHeldBridge(){

    if(
        bridgeState!==1
    )
        return;

    const forward =
        new THREE.Vector3();

    camera.getWorldDirection(
        forward
    );

    forward.y=0;

    if(
        forward.lengthSq()===0
    )
        return;

    forward.normalize();

    const position =
        camera.position.clone();

    position.addScaledVector(
        forward,
        2.5
    );

    position.y -= .8;

    bridge.position.copy(
        position
    );

    bridge.rotation.set(
        0,
        Math.atan2(
            forward.x,
            forward.z
        ) + bridgeRotation,
        0
    );

    bridge.visible=true;
}


/* =========================================================
   BRÜCKE ABLEGEN
========================================================= */

function dropBridge(){

    bridgeState=2;

    bridge.visible=true;

    bridgeVelocity.set(
        0,
        -1,
        0
    );

    bridgeAngularVelocity =
        0;

    document.getElementById(
        "bridgeStatus"
    ).textContent=
        "auf dem Boden";
}


/* =========================================================
   BRÜCKE AUFS BOOT
========================================================= */

function putBridgeOnBoat(){

    bridgeState=3;

    bridgeVelocity.set(
        0,0,0
    );

    bridgeAngularVelocity=0;

    bridge.visible=true;

    bridge.position.copy(
        boat.position
    );

    bridge.position.y += 2.05;

    bridge.position.z += 7;

    bridge.rotation.set(
        0,
        boat.rotation.y,
        0
    );

    document.getElementById(
        "bridgeStatus"
    ).textContent=
        "auf dem Boot";
}


/* =========================================================
   SPIELER
========================================================= */

camera.position.set(
    -12,
    2.2,
    1
);

let velocityY=0;
let onGround=true;

const keys={};

addEventListener(
    "keydown",
    event=>{

        keys[event.code]=true;

        if(
            event.code==="Space" &&
            onGround &&
            !steering
        ){

            velocityY=7;
            onGround=false;
        }


        if(
            event.code==="KeyR" &&
            bridgeState===1
        ){

            bridgeRotation +=
                Math.PI/2;
        }


        if(
            event.code==="KeyE"
        ){

            interact();
        }
    }
);

addEventListener(
    "keyup",
    event=>{
        keys[event.code]=false;
    }
);


/* =========================================================
   STEUERUNG
========================================================= */

let steering=false;
let boatSpeed=0;
let boatRotation=0;

function enterBoatControl(){

    if(
        bridgeState!==3
    )
        return;

    steering=true;

    document.getElementById(
        "boatControls"
    ).style.display="block";
}


function leaveBoatControl(){

    steering=false;

    document.getElementById(
        "boatControls"
    ).style.display="none";

    /*
      Spieler wird auf das Deck
      neben die Kabine gesetzt.
    */

    const exitOffset =
        new THREE.Vector3(
            -4,
            1,
            3
        );

    exitOffset.applyAxisAngle(
        new THREE.Vector3(0,1,0),
        boat.rotation.y
    );

    camera.position.copy(
        boat.position
    ).add(exitOffset);

    camera.position.y=
        boat.position.y+2.2;

    controls.lock();
}


/* =========================================================
   INTERAKTION
========================================================= */

function interact(){

    const player=
        camera.position;


    /* Brücke aufnehmen */

    if(
        bridgeState===0 &&
        player.distanceTo(
            bridge.position
        )<3
    ){

        pickupBridge();
        return;
    }


    /* Brücke ablegen */

    if(
        bridgeState===1
    ){

        dropBridge();
        return;
    }


    /* Brücke aufs Boot */

    if(
        bridgeState===2
    ){

        const boatPoint=
            boat.position.clone();

        boatPoint.y += 1.8;

        if(
            player.distanceTo(
                boatPoint
            )<9
        ){

            putBridgeOnBoat();
            return;
        }
    }


    /* Tür */

    const doorPoint=
        worldPosition(
            cabinDoor
        );

    if(
        player.distanceTo(
            doorPoint
        )<4
    ){

        toggleDoor();
        return;
    }


    /* Lenkrad */

    const wheelPoint=
        worldPosition(
            wheel
        );

    if(
        !steering &&
        bridgeState===3 &&
        player.distanceTo(
            wheelPoint
        )<4.5
    ){

        enterBoatControl();
        return;
    }


    /* Kran */

    const cranePoint=
        worldPosition(
            crane
        );

    if(
        bridgeState===3 &&
        player.distanceTo(
            cranePoint
        )<5
    ){

        animateCrane();
        return;
    }


    /* Steuerung verlassen */

    if(
        steering
    ){

        leaveBoatControl();
    }
}


/* =========================================================
   SPIELER-HITBOX
========================================================= */

const playerBox =
    new THREE.Box3();

function updatePlayerBox(){

    playerBox.setFromCenterAndSize(
        camera.position.clone().add(
            new THREE.Vector3(
                0,
                -1,
                0
            )
        ),
        new THREE.Vector3(
            .6,
            2,
            .6
        )
    );
}


/* =========================================================
   SPIELER-BEWEGUNG MIT KOLLISIONEN
========================================================= */

function canMoveTo(
    position
){

    const testBox =
        new THREE.Box3().setFromCenterAndSize(
            position.clone().add(
                new THREE.Vector3(
                    0,
                    -1,
                    0
                )
            ),
            new THREE.Vector3(
                .6,
                2,
                .6
            )
        );


    /* Hafenbegrenzung */

    if(
        position.x<-32 ||
        position.x>32 ||
        position.z<-12 ||
        position.z>17
    ){

        return false;
    }


    /*
      Hafenrand
    */

    const dockWall =
        new THREE.Box3(
            new THREE.Vector3(
                -35,
                -1,
                -3
            ),
            new THREE.Vector3(
                35,
                2,
                -1
            )
        );

    if(
        testBox.intersectsBox(
            dockWall
        )
    ){

        return false;
    }


    /*
      Boot-Hitbox.
      Nur blockieren, wenn Spieler
      nicht bereits auf dem Boot ist.
    */

    updateBoatHitbox();

    if(
        testBox.intersectsBox(
            boatHitbox
        )
    ){

        /*
          Erlaubt das Betreten,
          wenn die Brücke gelegt wurde.
        */

        const nearBridge =
            playerNearBridgeAccess();

        if(!nearBridge){

            return false;
        }
    }

    return true;
}


function playerNearBridgeAccess(){

    if(
        bridgeState===0 ||
        bridgeState===1
    )
        return false;

    const access =
        boat.position.clone();

    access.z -= 9;

    return camera.position.distanceTo(
        access
    )<5;
}


/* =========================================================
   SPIELER BEWEGUNG
========================================================= */

function movePlayer(dt){

    if(steering)
        return;

    const speed =
        (
            keys.ShiftLeft ||
            keys.ShiftRight
        )
        ? 8
        : 4;

    const direction =
        new THREE.Vector3();

    if(keys.KeyW)
        direction.z-=1;

    if(keys.KeyS)
        direction.z+=1;

    if(keys.KeyA)
        direction.x-=1;

    if(keys.KeyD)
        direction.x+=1;


    if(direction.lengthSq()>0){

        direction.normalize();

        const forward =
            new THREE.Vector3();

        camera.getWorldDirection(
            forward
        );

        forward.y=0;
        forward.normalize();

        const right =
            new THREE.Vector3();

        right.crossVectors(
            forward,
            new THREE.Vector3(0,1,0)
        );

        right.normalize();


        const movement =
            new THREE.Vector3();

        movement.addScaledVector(
            forward,
            direction.z*speed*dt
        );

        movement.addScaledVector(
            right,
            direction.x*speed*dt
        );


        /*
          X-Kollision
        */

        const newX =
            camera.position.clone();

        newX.x += movement.x;

        if(
            canMoveTo(newX)
        ){

            camera.position.x=
                newX.x;
        }


        /*
          Z-Kollision
        */

        const newZ =
            camera.position.clone();

        newZ.z += movement.z;

        if(
            canMoveTo(newZ)
        ){

            camera.position.z=
                newZ.z;
        }
    }


    /* Gravitation */

    velocityY -=
        18*dt;

    camera.position.y +=
        velocityY*dt;


    if(
        camera.position.y<=2.2
    ){

        camera.position.y=2.2;

        velocityY=0;

        onGround=true;
    }
}


/* =========================================================
   BOOT FAHREN
========================================================= */

function driveBoat(dt){

    if(!steering)
        return;


    if(keys.KeyW)
        boatSpeed += 6*dt;

    if(keys.KeyS)
        boatSpeed -= 6*dt;


    boatSpeed *= .985;


    boatSpeed =
        Math.max(
            -3,
            Math.min(
                14,
                boatSpeed
            )
        );


    if(keys.KeyA){

        boatRotation +=
            1.2*dt*
            (
                Math.abs(
                    boatSpeed
                )+1
            )/8;
    }


    if(keys.KeyD){

        boatRotation -=
            1.2*dt*
            (
                Math.abs(
                    boatSpeed
                )+1
            )/8;
    }


    boat.rotation.y=
        boatRotation;


    const direction =
        new THREE.Vector3(
            Math.sin(
                boat.rotation.y
            ),
            0,
            Math.cos(
                boat.rotation.y
            )
        );


    boat.position.addScaledVector(
        direction,
        boatSpeed*dt
    );


    /*
      Boot darf nicht auf den Hafen fahren.
    */

    if(
        boat.position.z>1
    ){

        boat.position.z=1;
        boatSpeed=0;
    }


    /*
      Kamera folgt dem Boot
      UND dreht sich mit.
    */

    const cameraOffset =
        new THREE.Vector3(
            0,
            4.3,
            3
        );

    cameraOffset.applyAxisAngle(
        new THREE.Vector3(0,1,0),
        boat.rotation.y
    );


    camera.position.copy(
        boat.position
    ).add(
        cameraOffset
    );


    const lookOffset =
        new THREE.Vector3(
            0,
            2,
            -5
        );

    lookOffset.applyAxisAngle(
        new THREE.Vector3(0,1,0),
        boat.rotation.y
    );


    camera.lookAt(
        boat.position.clone()
        .add(lookOffset)
    );
}


/* =========================================================
   PROMPTS
========================================================= */

function showPrompt(text){

    const p=
        document.getElementById(
            "prompt"
        );

    p.innerHTML=text;
    p.style.display="block";
}

function hidePrompt(){

    document.getElementById(
        "prompt"
    ).style.display="none";
}


function updatePrompt(){

    if(steering){

        hidePrompt();
        return;
    }

    const p=
        camera.position;


    /* Brücke */

    if(
        bridgeState===0 &&
        p.distanceTo(
            bridge.position
        )<3
    ){

        showPrompt(
            "E – Eisenbrücke aufnehmen"
        );

        return;
    }


    if(
        bridgeState===1
    ){

        showPrompt(
            "E – Brücke hier ablegen<br>R – drehen"
        );

        return;
    }


    if(
        bridgeState===2
    ){

        const bp=
            boat.position.clone();

        bp.y+=1.8;

        if(
            p.distanceTo(bp)<9
        ){

            showPrompt(
                "E – Brücke aufs Boot legen"
            );

            return;
        }
    }


    /* Tür */

    const dp=
        worldPosition(
            cabinDoor
        );

    if(
        p.distanceTo(dp)<4
    ){

        showPrompt(
            doorOpen
            ? "E – Tür schließen"
            : "E – Tür öffnen"
        );

        return;
    }


    /* Steuerung */

    if(
        bridgeState===3
    ){

        const wp=
            worldPosition(
                wheel
            );

        if(
            p.distanceTo(wp)<4.5
        ){

            showPrompt(
                "E – Lenkrad greifen"
            );

            return;
        }
    }


    /* Kran */

    if(
        bridgeState===3
    ){

        const cp=
            worldPosition(
                crane
            );

        if(
            p.distanceTo(cp)<5
        ){

            showPrompt(
                craneLowered
                ? "E – Netz hochziehen"
                : "E – Netz mit Kran ins Wasser lassen"
            );

            return;
        }
    }


    hidePrompt();
}


/* =========================================================
   START
========================================================= */

document.getElementById(
    "startButton"
).onclick=()=>{

    document.getElementById(
        "start"
    ).style.display="none";

    controls.lock();
};


/* =========================================================
   LOOP
========================================================= */

let last=
    performance.now();

function animate(now){

    requestAnimationFrame(
        animate
    );

    const dt=
        Math.min(
            (now-last)/1000,
            .033
        );

    last=now;


    movePlayer(dt);

    updateHeldBridge();

    updateBridgePhysics(dt);

    driveBoat(dt);

    updatePlayerBox();

    updatePrompt();


    renderer.render(
        scene,
        camera
    );
}

animate(
    performance.now()
);


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);
