<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D MakerLab Blaster-Konstrukteur</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* UI-Overlay über der 3D-Szene */
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            max-width: 320px;
            pointer-events: auto;
            z-index: 10;
        }
        h1 { margin: 0 0 10px 0; font-size: 20px; color: #2c3e50; }
        p { font-size: 14px; margin: 0 0 15px 0; color: #555; }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-load { background: #3498db; color: white; }
        .btn-load:hover { background: #2980b9; }
        .btn-fire { background: #e74c3c; color: white; }
        .btn-fire:hover { background: #c0392b; }
        .btn-fire:disabled { background: #bdc3c7; cursor: not-allowed; }
        
        /* GitHub Link Panel */
        .github-panel {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
            text-align: center;
        }
        .github-link {
            display: inline-block;
            background: #24292e;
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
        }
        .github-link:hover { background: #444; }
    </style>
    <!-- Three.js via CDN laden -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

<div id="ui-container">
    <h1>🛠️ 3D MakerLab Blaster</h1>
    <p>Bewege die Maus mit gedrückter Taste, um die Kamera um das 3D-Modell zu drehen.</p>
    
    <button class="btn btn-load" id="loadBtn" onclick="loadBlaster()">1. Feder spannen</button>
    <button class="btn btn-fire" id="fireBtn" onclick="fireBlaster()" disabled>2. Dart abfeuern!</button>
    
    <div class="github-panel">
        <p style="margin-bottom:8px; font-size:12px;">Echte Baupläne & Codes findest du hier:</p>
        <!-- Link direkt zu Open-Source-Projekten auf GitHub -->
        <a href="https://github.com" target="_blank" class="github-link">
            🔍 Auf GitHub ansehen
        </a>
    </div>
</div>

<script>
/* DEINE INITIALISIERUNG */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87cfff);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
// Kamera etwas zurücksetzen und anwinkeln für besseren 3D-Blick
camera.position.set(0, 3, 10); 
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* LIGHT */
scene.add(new THREE.AmbientLight(0xffffff, 1.2));

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(10, 20, 10);
scene.add(sun);


/* 3D-MODELL-ERSTELLUNG (Federdruck-Blaster) */

// 1. Das Gehäuse (Halbtransparent, um das Innere zu sehen)
const bodyGeo = new THREE.BoxGeometry(4, 1.5, 1.2);
const bodyMat = new THREE.MeshStandardMaterial({ 
    color: 0xf39c12, 
    transparent: true, 
    opacity: 0.7,
    roughness: 0.3
});
const blasterBody = new THREE.Mesh(bodyGeo, bodyMat);
scene.add(blasterBody);

// 2. Der Griff
const gripGeo = new THREE.BoxGeometry(0.8, 2, 0.8);
const gripMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50 });
const grip = new THREE.Mesh(gripGeo, gripMat);
grip.position.set(-1.2, -1.5, 0);
grip.rotation.z = -0.2; // Leicht schräg
scene.add(grip);

// 3. Der Lauf (Vorne angebracht)
const barrelGeo = new THREE.CylinderGeometry(0.4, 0.4, 3, 32);
const barrelMat = new THREE.MeshStandardMaterial({ color: 0xbdc3c7 });
const barrel = new THREE.Mesh(barrelGeo, barrelMat);
barrel.rotation.z = Math.PI / 2; // Horizontal drehen
barrel.position.set(3.5, 0, 0);
scene.add(barrel);

// 4. Die Feder (Im Inneren des Gehäuses)
const springGroup = new THREE.Group();
const numCoils = 10;
const springRadius = 0.3;
for(let i = 0; i < numCoils; i++) {
    const coilGeo = new THREE.TorusGeometry(springRadius, 0.05, 8, 24);
    const coilMat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d, metalness: 0.8 });
    const coil = new THREE.Mesh(coilGeo, coilMat);
    coil.rotation.y = Math.PI / 2;
    coil.position.x = (i * 0.2) - 1.5;
    springGroup.add(coil);
}
scene.add(springGroup);

// 5. Der Kolben / Plunger (Sitzt vor der Feder)
const plungerGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.4, 32);
const plungerMat = new THREE.MeshStandardMaterial({ color: 0xc0392b });
const plunger = new THREE.Mesh(plungerGeo, plungerMat);
plunger.rotation.z = Math.PI / 2;
plunger.position.set(0.6, 0, 0);
scene.add(plunger);

// 6. Die stumpfe Plastikpatrone (Dart mit dicker Kappe)
const dartGroup = new THREE.Group();
const dartBodyGeo = new THREE.CylinderGeometry(0.25, 0.25, 1.5, 24);
const dartBodyMat = new THREE.MeshStandardMaterial({ color: 0x3498db });
const dartBody = new THREE.Mesh(dartBodyGeo, dartBodyMat);
dartBody.rotation.z = Math.PI / 2;
dartGroup.add(dartBody);

const dartCapGeo = new THREE.SphereGeometry(0.25, 24, 24);
const dartCapMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c });
const dartCap = new THREE.Mesh(dartCapGeo, dartCapMat);
dartCap.position.x = 0.75; // Vorne auf den Dart-Körper setzen
dartGroup.add(dartCap);

// Dart in den Lauf laden
dartGroup.position.set(3, 0, 0);
scene.add(dartGroup);


/* MECHANIK-LOGIK (ANIMATIONEN) */
let isLoaded = false;
let isFlying = false;
let dartVelocity = 0;

function loadBlaster() {
    if (isLoaded) return;
    
    // Feder visuell zusammenstauchen (Skalierung auf X-Achse)
    springGroup.scale.x = 0.5;
    springGroup.position.x = -0.4;
    
    // Kolben fährt nach hinten
    plunger.position.x = -0.3;
    
    document.getElementById('loadBtn').disabled = true;
    document.getElementById('fireBtn').disabled = false;
    isLoaded = true;
}

function fireBlaster() {
    if (!isLoaded) return;
    
    // Feder entspannt sich schlagartig
    springGroup.scale.x = 1.0;
    springGroup.position.x = 0;
    
    // Kolben schnellt nach vorne
    plunger.position.x = 0.6;
    
    // Dart bekommt Fluggeschwindigkeit
    isFlying = true;
    dartVelocity = 0.8; 
    
    document.getElementById('fireBtn').disabled = true;
}


/* ANIMATIONS-LOOP & MAUS-INTERAKTION */
let angle = 0;
window.addEventListener('mousemove', (e) => {
    // Wenn die Maus gedrückt gehalten wird, rotiert die Kamera um die Szene
    if(e.buttons === 1) {
        angle += e.movementX * 0.005;
        camera.position.x = Math.sin(angle) * 10;
        camera.position.z = Math.cos(angle) * 10;
        camera.lookAt(0, 0, 0);
    }
});

function animate() {
    requestAnimationFrame(animate);
    
    // Flugphysik für den Dart simulieren
    if (isFlying) {
        dartGroup.position.x += dartVelocity;
        // Schwerkraft zieht den stumpfen Dart langsam nach unten
        if(dartGroup.position.x > 5) {
            dartVelocity -= 0.01;
            dartGroup.position.y -= 0.05;
            dartGroup.rotation.z -= 0.02; // Dreht sich im Flug leicht nach unten
        }
        
        // Reset nach dem Flug aus dem Sichtfeld
        if (dartGroup.position.x > 25) {
            isFlying = false;
            isLoaded = false;
            dartGroup.position.set(3, 0, 0);
            dartGroup.rotation.z = 0;
            dartGroup.position.y = 0;
            document.getElementById('loadBtn').disabled = false;
        }
    }
    
    renderer.render(scene, camera);
}

// Fenstergröße automatisch anpassen
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Start des Loops
animate();
</script>

</body>
</html>
