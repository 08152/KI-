<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>3D TARGET TRAINING</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#74b9e8;
}

#game{
    position:fixed;
    inset:0;
}

#loading{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:#101820;
    color:white;
    font-size:22px;
    font-weight:bold;
}

#loading small{
    margin-top:10px;
    opacity:.7;
    font-size:14px;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
    color:white;
}

#top{
    position:absolute;
    top:0;
    left:0;
    right:0;

    padding:15px;

    display:flex;
    justify-content:space-between;

    background:linear-gradient(#000b,transparent);
}

.panel{
    background:#0009;
    border:1px solid #ffffff33;
    padding:10px 15px;
    border-radius:10px;
    font-weight:bold;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:24px;
    height:24px;
    transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 0 5px #000;
}

#crosshair:before{
    width:24px;
    height:2px;
    top:11px;
}

#crosshair:after{
    width:2px;
    height:24px;
    left:11px;
}

#message{
    position:absolute;
    left:50%;
    bottom:30px;

    transform:translateX(-50%);

    background:#000b;

    padding:12px 20px;

    border-radius:12px;

    font-weight:bold;
}

#shootButton{
    display:none;
    position:absolute;

    right:25px;
    bottom:25px;

    pointer-events:auto;

    width:90px;
    height:90px;

    border-radius:50%;

    border:2px solid white;

    background:#ffffffaa;

    font-weight:bold;
    font-size:15px;
}

@media(max-width:700px){

    #shootButton{
        display:block;
    }

}

</style>
</head>

<body>

<div id="game"></div>

<div id="loading">
    3D-Modell wird geladen...
    <small>1.glb</small>
</div>

<div id="ui">

    <div id="top">

        <div class="panel">
            🎯 TARGET TRAINING
        </div>

        <div class="panel">
            Punkte: <span id="score">0</span>
        </div>

    </div>

    <div id="crosshair"></div>

    <div id="message">
        Klicke auf das Spiel zum Starten
    </div>

    <button id="shootButton">ACTION</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>

<script>

/* =====================================================
   SZENE
===================================================== */

const scene=new THREE.Scene();

scene.background=
new THREE.Color(
    0x7bc5ef
);

scene.fog=
new THREE.Fog(
    0x7bc5ef,
    100,
    600
);


/* =====================================================
   KAMERA
===================================================== */

const camera=
new THREE.PerspectiveCamera(
    75,
    innerWidth/innerHeight,
    0.1,
    1000
);

camera.position.set(
    0,
    1.7,
    0
);


/* =====================================================
   RENDERER
===================================================== */

const renderer=
new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled=true;

document
.getElementById("game")
.appendChild(
    renderer.domElement
);


/* =====================================================
   LICHT
===================================================== */

const skyLight=
new THREE.HemisphereLight(
    0xffffff,
    0x376b30,
    2
);

scene.add(
    skyLight
);


const sun=
new THREE.DirectionalLight(
    0xffffff,
    2
);

sun.position.set(
    50,
    100,
    50
);

sun.castShadow=true;

scene.add(
    sun
);


/* =====================================================
   GRÜNE FLÄCHE
===================================================== */

const ground=
new THREE.Mesh(

    new THREE.PlaneGeometry(
        1000,
        1000
    ),

    new THREE.MeshStandardMaterial({

        color:0x3c9b45,

        roughness:.9

    })

);

ground.rotation.x=
-Math.PI/2;

ground.receiveShadow=true;

scene.add(
    ground
);


/* =====================================================
   EINFACHE TRAININGSZIELE
===================================================== */

const targets=[];

function createTarget(x,z){

    const group=
    new THREE.Group();


    const stand=
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            .12,
            .12,
            1.4,
            10
        ),

        new THREE.MeshStandardMaterial({
            color:0x555555
        })

    );

    stand.position.y=.7;


    const target=
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            .8,
            .8,
            .18,
            32
        ),

        new THREE.MeshStandardMaterial({

            color:0xff5533,

            emissive:0x551100

        })

    );

    target.rotation.x=
    Math.PI/2;

    target.position.y=
    1.6;


    group.add(
        stand
    );

    group.add(
        target
    );


    group.position.set(
        x,
        0,
        z
    );


    scene.add(
        group
    );


    targets.push({

        group:group,

        target:target

    });

}


createTarget(
    -6,
    -15
);

createTarget(
    4,
    -22
);

createTarget(
    0,
    -32
);

createTarget(
    10,
    -40
);

createTarget(
    -12,
    -45
);


/* =====================================================
   1.GLB LADEN
===================================================== */

const loader=
new THREE.GLTFLoader();


let model=null;

const modelHolder=
new THREE.Group();

camera.add(
    modelHolder
);

scene.add(
    camera
);


loader.load(

    "./1.glb",

    function(gltf){

        model=
        gltf.scene;


        /*
        AUTOMATISCHE GRÖSSENANPASSUNG
        */

        const box=
        new THREE.Box3()
        .setFromObject(
            model
        );


        const size=
        new THREE.Vector3();

        box.getSize(
            size
        );


        const maxSize=
        Math.max(
            size.x,
            size.y,
            size.z
        );


        const wantedSize=
        1.5;


        const scale=
        wantedSize/
        maxSize;


        model.scale.setScalar(
            scale
        );


        /*
        POSITION IM FIRST-PERSON-BLICK
        */

        model.position.set(

            .55,

            -.55,

            -1.1

        );


        model.rotation.set(

            0,

            Math.PI,

            0

        );


        modelHolder.add(
            model
        );


        document
        .getElementById("loading")
        .style.display=
        "none";


        document
        .getElementById("message")
        .textContent=
        "Bereit · Klick zum Umschauen";


        console.log(
            "1.glb geladen"
        );

    },


    undefined,


    function(error){

        console.error(
            error
        );


        document
        .getElementById("loading")
        .innerHTML=
        `
        ❌ 1.glb konnte nicht geladen werden
        <small>
        Die Datei muss im selben Ordner wie index.html liegen.
        </small>
        `;

    }

);


/* =====================================================
   POINTER LOCK
===================================================== */

let locked=false;

let yaw=0;

let pitch=0;


renderer.domElement
.addEventListener(

    "click",

    function(){

        renderer.domElement
        .requestPointerLock();

    }

);


document
.addEventListener(

    "pointerlockchange",

    function(){

        locked=

        document.pointerLockElement===

        renderer.domElement;

    }

);


/* =====================================================
   MAUS
===================================================== */

document
.addEventListener(

    "mousemove",

    function(event){

        if(
            !locked
        )return;


        yaw-=

        event.movementX*
        .0025;


        pitch-=

        event.movementY*
        .0025;


        pitch=
        Math.max(

            -1.3,

            Math.min(
                1.3,
                pitch
            )

        );


        camera.rotation.order=
        "YXZ";


        camera.rotation.y=
        yaw;


        camera.rotation.x=
        pitch;

    }

);


/* =====================================================
   BEWEGUNG
===================================================== */

const keys={

    w:false,
    a:false,
    s:false,
    d:false

};


document
.addEventListener(

    "keydown",

    function(event){

        const key=
        event.key
        .toLowerCase();


        if(
            key in keys
        ){

            keys[key]=true;

        }

    }

);


document
.addEventListener(

    "keyup",

    function(event){

        const key=
        event.key
        .toLowerCase();


        if(
            key in keys
        ){

            keys[key]=false;

        }

    }

);


function updatePlayer(){

    const speed=
    .08;


    const forward=
    new THREE.Vector3(

        -Math.sin(yaw),

        0,

        -Math.cos(yaw)

    );


    const right=
    new THREE.Vector3(

        Math.cos(yaw),

        0,

        -Math.sin(yaw)

    );


    if(
        keys.w
    ){

        camera.position
        .addScaledVector(
            forward,
            speed
        );

    }


    if(
        keys.s
    ){

        camera.position
        .addScaledVector(
            forward,
            -speed
        );

    }


    if(
        keys.a
    ){

        camera.position
        .addScaledVector(
            right,
            -speed
        );

    }


    if(
        keys.d
    ){

        camera.position
        .addScaledVector(
            right,
            speed
        );

    }


    camera.position.y=
    1.7;

}


/* =====================================================
   SICHERE ACTION-ANIMATION
===================================================== */

let actionTimer=0;

let actionActive=false;


function doAction(){

    if(
        actionActive
    )return;


    actionActive=true;

    actionTimer=0;


    /*
    VISUELLE RÜCKSTOSS-ANIMATION
    DES 3D-MODELLS
    */

    if(
        model
    ){

        model.position.z=
        -.82;

    }


    /*
    RAYCAST NUR FÜR
    TRAININGSZIELE
    */

    const raycaster=
    new THREE.Raycaster();


    raycaster.setFromCamera(

        new THREE.Vector2(
            0,
            0
        ),

        camera

    );


    const targetMeshes=
    targets.map(
        t=>t.target
    );


    const hits=
    raycaster.intersectObjects(
        targetMeshes
    );


    if(
        hits.length>0
    ){

        const hit=
        hits[0].object;


        const data=
        targets.find(
            t=>t.target===hit
        );


        if(
            data
        ){

            scene.remove(
                data.group
            );


            targets.splice(
                targets.indexOf(data),
                1
            );


            score+=10;


            document
            .getElementById("score")
            .textContent=
            score;


            document
            .getElementById("message")
            .textContent=
            "🎯 Trainingsziel getroffen!";

        }

    }


    /*
    KURZER LICHTEFFEKT
    */

    const flash=
    new THREE.PointLight(
        0xffffff,
        3,
        5
    );


    flash.position.copy(
        camera.position
    );


    scene.add(
        flash
    );


    setTimeout(

        ()=>{

            scene.remove(
                flash
            );

        },

        70

    );

}


let score=0;


/* =====================================================
   ACTION PER MAUS
===================================================== */

renderer.domElement
.addEventListener(

    "mousedown",

    function(event){

        if(
            event.button===0
        ){

            doAction();

        }

    }

);


document
.getElementById("shootButton")
.addEventListener(

    "click",

    function(){

        doAction();

    }

);


/* =====================================================
   ANIMATION
===================================================== */

function updateAction(){

    if(
        !actionActive
    )return;


    actionTimer++;


    if(
        model
    ){

        /*
        Modell bewegt sich kurz
        nach hinten und wieder vor.
        */

        const progress=
        actionTimer/
        8;


        model.position.z=

        -.82-

        Math.sin(
            progress*
            Math.PI
        )*
        .18;

    }


    if(
        actionTimer>8
    ){

        actionActive=false;


        if(
            model
        ){

            model.position.z=
            -1.1;

        }

    }

}


/* =====================================================
   RENDER LOOP
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    updatePlayer();


    updateAction();


    /*
    Ziele bewegen sich leicht
    */

    targets.forEach(

        (data,index)=>{

            data.group.position.y=

            Math.sin(
                Date.now()*
                .002+
                index
            )*
            .08;

        }

    );


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =====================================================
   RESIZE
===================================================== */

window
.addEventListener(

    "resize",

    function(){

        camera.aspect=

        innerWidth/
        innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            innerWidth,
            innerHeight

        );

    }

);

</script>

</body>
</html>
