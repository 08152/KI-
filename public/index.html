<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GHOST Video Converter</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    background:#0b0d10;
    color:#fff;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}

.app{
    width:min(900px,94vw);
    background:#181b20;
    border:1px solid #30343d;
    border-radius:22px;
    padding:28px;
    box-shadow:0 20px 70px #0008;
}

h1{
    margin:0;
    font-size:32px;
}

.subtitle{
    color:#9da3ad;
    margin:8px 0 25px;
}

.drop{
    min-height:200px;
    border:2px dashed #555b66;
    border-radius:18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:.2s;
    text-align:center;
}

.drop:hover,
.drop.drag{
    background:#22262d;
    border-color:#fff;
}

.icon{
    font-size:52px;
    margin-bottom:12px;
}

input{
    display:none;
}

.file{
    display:none;
    margin-top:15px;
    padding:15px;
    background:#22252b;
    border-radius:12px;
    word-break:break-all;
}

.controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-top:18px;
}

label{
    color:#aaa;
    font-size:14px;
}

select{
    width:100%;
    margin-top:7px;
    padding:12px;
    background:#101216;
    color:white;
    border:1px solid #383d46;
    border-radius:10px;
}

button,
.download{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:0;
    border-radius:12px;
    background:white;
    color:#111;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
    text-align:center;
}

button:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.download{
    display:none;
    text-decoration:none;
}

.progress{
    display:none;
    margin-top:22px;
}

.progress-top{
    display:flex;
    justify-content:space-between;
    color:#aaa;
    margin-bottom:8px;
}

.bar{
    width:100%;
    height:12px;
    background:#292d34;
    border-radius:20px;
    overflow:hidden;
}

.fill{
    width:0%;
    height:100%;
    background:#fff;
    transition:width .15s;
}

.status{
    text-align:center;
    color:#aaa;
    margin-top:12px;
}

@media(max-width:600px){
    .controls{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="app">

<h1>🎬 GHOST Video Converter</h1>

<div class="subtitle">
Videos direkt im Browser in MP4 umwandeln
</div>

<div class="drop" id="drop">
    <div class="icon">📁</div>
    <strong>Video auswählen</strong>
    <span style="color:#888;margin-top:8px">
        oder Video hier hineinziehen
    </span>
</div>

<input
    id="fileInput"
    type="file"
    accept="video/*"
>

<div class="file" id="fileInfo"></div>

<div class="controls">

    <div>
        <label>Qualität</label>

        <select id="quality">
            <option value="23">Sehr hoch</option>
            <option value="26" selected>Hoch</option>
            <option value="30">Mittel</option>
            <option value="34">Kleine Datei</option>
        </select>
    </div>

    <div>
        <label>Auflösung</label>

        <select id="resolution">
            <option value="original">Original</option>
            <option value="1080">1080p</option>
            <option value="720">720p</option>
            <option value="480">480p</option>
            <option value="360">360p</option>
        </select>
    </div>

</div>

<button id="convert" disabled>
    🚀 IN MP4 UMWANDELN
</button>

<div class="progress" id="progress">

    <div class="progress-top">
        <span id="status">Vorbereitung...</span>
        <span id="percent">0%</span>
    </div>

    <div class="bar">
        <div class="fill" id="fill"></div>
    </div>

</div>

<a
    id="download"
    class="download"
>
    ⬇️ MP4 HERUNTERLADEN
</a>

</div>

<script>

const drop =
    document.getElementById("drop");

const input =
    document.getElementById("fileInput");

const fileInfo =
    document.getElementById("fileInfo");

const convert =
    document.getElementById("convert");

const progress =
    document.getElementById("progress");

const fill =
    document.getElementById("fill");

const percent =
    document.getElementById("percent");

const status =
    document.getElementById("status");

const download =
    document.getElementById("download");

let selectedFile = null;


/* Datei auswählen */

drop.addEventListener("click",()=>{
    input.click();
});


input.addEventListener("change",()=>{

    if(input.files.length > 0){
        selectVideo(input.files[0]);
    }

});


/* Drag & Drop */

drop.addEventListener("dragover",(e)=>{

    e.preventDefault();

    drop.classList.add("drag");

});


drop.addEventListener("dragleave",()=>{

    drop.classList.remove("drag");

});


drop.addEventListener("drop",(e)=>{

    e.preventDefault();

    drop.classList.remove("drag");

    const file =
        e.dataTransfer.files[0];

    if(file && file.type.startsWith("video/")){
        selectVideo(file);
    }

});


/* Video speichern */

function selectVideo(file){

    selectedFile = file;

    const size =
        (file.size / 1024 / 1024).toFixed(2);

    fileInfo.style.display = "block";

    fileInfo.innerHTML =
        "🎞️ <b>" +
        escapeHTML(file.name) +
        "</b><br>" +
        "<span style='color:#888'>" +
        size +
        " MB</span>";

    convert.disabled = false;

    download.style.display = "none";

}


/* HTML sicher darstellen */

function escapeHTML(text){

    return text.replace(/[&<>"']/g,(char)=>{

        return {
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
        }[char];

    });

}


/*
=================================================
KONVERTIERUNG
=================================================

Die eigentliche Konvertierung passiert hier.

Wichtig:
Diese Version sendet das Video an deinen Render-
Server.

Der Browser lädt also nicht selbst FFmpeg.

=================================================
*/

convert.addEventListener("click",async()=>{

    if(!selectedFile){
        return;
    }

    convert.disabled = true;

    progress.style.display = "block";

    download.style.display = "none";

    fill.style.width = "0%";
    percent.textContent = "0%";
    status.textContent = "Video wird hochgeladen...";


    try{

        const formData =
            new FormData();

        formData.append(
            "video",
            selectedFile
        );


        const response =
            await fetch("/convert",{
                method:"POST",
                body:formData
            });


        if(!response.ok){

            let message =
                "Serverfehler";

            try{
                const data =
                    await response.json();

                if(data.error){
                    message = data.error;
                }

            }catch{}

            throw new Error(message);
        }


        status.textContent =
            "MP4 wird erstellt...";


        /*
        Fortschritt beim Download
        */

        const reader =
            response.body.getReader();

        const contentLength =
            Number(
                response.headers.get(
                    "Content-Length"
                )
            );

        let received = 0;

        const chunks = [];


        while(true){

            const {
                done,
                value
            } = await reader.read();

            if(done) break;

            chunks.push(value);

            received += value.length;


            if(contentLength){

                const p =
                    Math.round(
                        received /
                        contentLength *
                        100
                    );

                fill.style.width =
                    p + "%";

                percent.textContent =
                    p + "%";
            }

        }


        const blob =
            new Blob(chunks,{
                type:"video/mp4"
            });


        const url =
            URL.createObjectURL(blob);


        download.href = url;

        download.download =
            selectedFile.name
            .replace(/\.[^/.]+$/,"")
            + ".mp4";


        fill.style.width =
            "100%";

        percent.textContent =
            "100%";

        status.textContent =
            "✅ Konvertierung fertig!";

        download.style.display =
            "block";


    }catch(error){

        console.error(error);

        status.textContent =
            "❌ Konvertierung fehlgeschlagen";

        alert(
            "Fehler: " +
            error.message
        );

    }


    convert.disabled = false;

});

</script>

</body>
</html>
