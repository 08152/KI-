<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ghost AI – Training</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#07080d;
    color:#fff;
}

body{
    padding:20px;
}

.container{
    width:min(1100px,100%);
    margin:auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.title{
    font-size:28px;
    font-weight:700;
}

.subtitle{
    color:#9296a8;
    margin-top:5px;
}

.card{
    background:rgba(18,20,29,.88);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 15px 50px rgba(0,0,0,.25);
}

textarea{
    width:100%;
    min-height:150px;
    resize:vertical;
    border:1px solid #292d3d;
    border-radius:15px;
    background:#0c0e15;
    color:#fff;
    padding:16px;
    font-size:16px;
    outline:none;
}

textarea:focus{
    border-color:#6875ff;
    box-shadow:0 0 25px rgba(104,117,255,.18);
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:15px;
}

button{
    border:0;
    border-radius:13px;
    padding:13px 18px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    color:white;
    background:#252a3b;
}

button:hover{
    filter:brightness(1.18);
}

.start{
    background:linear-gradient(135deg,#7657ff,#398cff);
}

.download{
    background:linear-gradient(135deg,#10b981,#1687ff);
}

.reset{
    background:#292d3b;
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.stat{
    background:#0c0e15;
    border:1px solid rgba(255,255,255,.06);
    border-radius:15px;
    padding:15px;
}

.statName{
    color:#85899b;
    font-size:13px;
}

.statValue{
    margin-top:7px;
    font-size:23px;
    font-weight:700;
}

.progressOuter{
    width:100%;
    height:12px;
    background:#10121a;
    border-radius:99px;
    overflow:hidden;
    margin-top:15px;
}

.progress{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#805cff,#39a5ff);
    transition:width .25s;
}

.status{
    margin-top:12px;
    color:#9ba0b3;
}

.log{
    height:260px;
    overflow:auto;
    background:#080a10;
    border:1px solid rgba(255,255,255,.06);
    border-radius:15px;
    padding:13px;
    font-family:monospace;
    font-size:13px;
    line-height:1.6;
}

.logLine{
    border-bottom:1px solid rgba(255,255,255,.035);
    padding:3px 0;
}

.good{
    color:#55e6a5;
}

.warn{
    color:#ffd166;
}

.bad{
    color:#ff7777;
}

@media(max-width:700px){
    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .header{
        align-items:flex-start;
        flex-direction:column;
    }

    .title{
        font-size:24px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div>
            <div class="title">Ghost AI Training</div>
            <div class="subtitle">
                Begriffe suchen, Bedeutungen sammeln und Trainingsdaten erstellen
            </div>
        </div>
    </div>

    <div class="card">

        <textarea
            id="words"
            placeholder="Bis zu 100 Begriffe eingeben&#10;&#10;Beispiel:&#10;Computer&#10;Internet&#10;Künstliche Intelligenz&#10;Roboter"
        ></textarea>

        <div class="buttons">
            <button class="start" id="startBtn">
                Training starten
            </button>

            <button class="download" id="downloadBtn">
                JSON herunterladen
            </button>

            <button class="reset" id="resetBtn">
                Daten zurücksetzen
            </button>
        </div>

    </div>

    <div class="card">

        <div class="stats">

            <div class="stat">
                <div class="statName">JSON-Größe</div>
                <div class="statValue" id="size">0 MB</div>
            </div>

            <div class="stat">
                <div class="statName">Begriffe</div>
                <div class="statValue" id="wordCount">0</div>
            </div>

            <div class="stat">
                <div class="statName">Suchergebnisse</div>
                <div class="statValue" id="resultCount">0</div>
            </div>

            <div class="stat">
                <div class="statName">Maximum</div>
                <div class="statValue">25 MiB</div>
            </div>

        </div>

        <div class="progressOuter">
            <div class="progress" id="progress"></div>
        </div>

        <div class="status" id="status">
            Bereit.
        </div>

    </div>

    <div class="card">

        <div class="log" id="log"></div>

    </div>

</div>

<script>
const MAX_WORDS = 100;
const MAX_RESULTS_PER_WORD = 100;
const MAX_BYTES = 25 * 1024 * 1024;

let dataset = [];
let training = false;

const wordsInput = document.getElementById("words");
const startBtn = document.getElementById("startBtn");
const downloadBtn = document.getElementById("downloadBtn");
const resetBtn = document.getElementById("resetBtn");

const sizeEl = document.getElementById("size");
const wordCountEl = document.getElementById("wordCount");
const resultCountEl = document.getElementById("resultCount");
const progressEl = document.getElementById("progress");
const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");

function jsonBytes(data){
    return new TextEncoder().encode(
        JSON.stringify(data)
    ).length;
}

function formatMB(bytes){
    return (bytes / 1024 / 1024).toFixed(3) + " MB";
}

function updateStats(){
    const bytes = jsonBytes(dataset);

    sizeEl.textContent = formatMB(bytes);

    wordCountEl.textContent = dataset.length;

    let count = 0;

    for(const item of dataset){
        count += Array.isArray(item.results)
            ? item.results.length
            : 0;

        count += Array.isArray(item.meaning)
            ? item.meaning.length
            : 0;
    }

    resultCountEl.textContent = count;

    const percent =
        Math.min(
            100,
            (bytes / MAX_BYTES) * 100
        );

    progressEl.style.width =
        percent + "%";
}

function log(text, type=""){
    const line = document.createElement("div");

    line.className =
        "logLine " + type;

    line.textContent =
        "[" + new Date().toLocaleTimeString() + "] " + text;

    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
}

function setStatus(text){
    statusEl.textContent = text;
}

function getWords(){
    return wordsInput.value
        .split(/\r?\n|,/)
        .map(x => x.trim())
        .filter(Boolean)
        .slice(0, MAX_WORDS);
}

async function trainWord(word){

    log("Suche: " + word);

    const response = await fetch(
        "/api/training/search",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                word
            })
        }
    );

    if(!response.ok){
        throw new Error(
            "Serverfehler HTTP " +
            response.status
        );
    }

    const data =
        await response.json();

    const results =
        Array.isArray(data.results)
            ? data.results
            : [];

    const meaning =
        Array.isArray(data.meaning)
            ? data.meaning
            : [];

    log(
        word +
        ": " +
        results.length +
        " Ergebnisse, " +
        meaning.length +
        " Bedeutungs-Ergebnisse",
        "good"
    );

    return {
        word:word,
        results:results,
        meaning:meaning
    };
}

startBtn.addEventListener(
    "click",
    async () => {

        if(training){
            return;
        }

        const words =
            getWords();

        if(words.length === 0){
            setStatus(
                "Bitte mindestens einen Begriff eingeben."
            );

            log(
                "Keine Begriffe eingegeben.",
                "warn"
            );

            return;
        }

        training = true;
        startBtn.disabled = true;

        setStatus(
            "Training läuft..."
        );

        log(
            "Training gestartet.",
            "good"
        );

        log(
            words.length +
            " Begriffe werden verarbeitet."
        );

        for(let i = 0; i < words.length; i++){

            if(!training){
                break;
            }

            const word = words[i];

            setStatus(
                "Verarbeite " +
                (i + 1) +
                " / " +
                words.length +
                ": " +
                word
            );

            try{

                const candidate =
                    await trainWord(word);

                const testDataset =
                    [
                        ...dataset,
                        candidate
                    ];

                const testBytes =
                    jsonBytes(
                        testDataset
                    );

                /*
                 * Wichtig:
                 * Es wird VOR dem Hinzufügen geprüft.
                 * Dadurch kann dataset niemals
                 * größer als 25 MiB werden.
                 */
                if(testBytes > MAX_BYTES){

                    log(
                        "25-MiB-Grenze erreicht. " +
                        word +
                        " wird nicht hinzugefügt.",
                        "warn"
                    );

                    setStatus(
                        "Training gestoppt: " +
                        "25-MiB-Grenze erreicht."
                    );

                    break;
                }

                dataset.push(candidate);

                updateStats();

                log(
                    word +
                    " gespeichert. " +
                    formatMB(testBytes),
                    "good"
                );

            }catch(error){

                log(
                    word +
                    ": " +
                    error.message,
                    "bad"
                );

            }

        }

        training = false;
        startBtn.disabled = false;

        updateStats();

        setStatus(
            "Training beendet."
        );

        log(
            "Training beendet.",
            "good"
        );
    }
);

downloadBtn.addEventListener(
    "click",
    () => {

        if(dataset.length === 0){

            setStatus(
                "Keine Trainingsdaten vorhanden."
            );

            log(
                "Download nicht möglich: Datensatz ist leer.",
                "warn"
            );

            return;
        }

        const json =
            JSON.stringify(
                dataset,
                null,
                2
            );

        const bytes =
            new TextEncoder().encode(
                json
            ).length;

        /*
         * Sicherheitsprüfung:
         * Niemals eine Datei über 25 MiB herunterladen.
         */
        if(bytes > MAX_BYTES){

            setStatus(
                "Download abgebrochen: JSON wäre größer als 25 MiB."
            );

            log(
                "Sicherheitsprüfung verhindert Download.",
                "bad"
            );

            return;
        }

        const blob =
            new Blob(
                [json],
                {
                    type:"application/json"
                }
            );

        const url =
            URL.createObjectURL(blob);

        const a =
            document.createElement("a");

        a.href = url;

        a.download =
            "ghost-ai-training.json";

        document.body.appendChild(a);

        a.click();

        a.remove();

        URL.revokeObjectURL(url);

        log(
            "JSON heruntergeladen: " +
            formatMB(bytes),
            "good"
        );

        /*
         * Nach erfolgreichem Download
         * wird der Datensatz automatisch geleert.
         */
        dataset = [];

        updateStats();

        setStatus(
            "Download erfolgreich. Trainingsdaten wurden zurückgesetzt."
        );

        log(
            "Trainingsdaten automatisch zurückgesetzt.",
            "good"
        );
    }
);

resetBtn.addEventListener(
    "click",
    () => {

        if(training){
            setStatus(
                "Während des Trainings kann nicht zurückgesetzt werden."
            );
            return;
        }

        dataset = [];

        updateStats();

        setStatus(
            "Trainingsdaten zurückgesetzt."
        );

        log(
            "Datensatz geleert.",
            "warn"
        );
    }
);

updateStats();
</script>

</body>
</html>
