<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ghost AI Training</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#09090e;
    color:#f5f5f7;
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
}

body:before{
    content:"";
    position:fixed;
    width:700px;
    height:700px;
    left:-250px;
    top:-300px;
    background:radial-gradient(circle,rgba(111,70,255,.24),transparent 65%);
    pointer-events:none;
}

body:after{
    content:"";
    position:fixed;
    width:600px;
    height:600px;
    right:-250px;
    bottom:-300px;
    background:radial-gradient(circle,rgba(0,180,255,.18),transparent 65%);
    pointer-events:none;
}

header{
    height:72px;
    border-bottom:1px solid #24242d;
    display:flex;
    align-items:center;
    padding:0 25px;
    background:rgba(12,12,17,.8);
}

.logo{
    font-size:23px;
    font-weight:bold;
    background:linear-gradient(90deg,#a17cff,#48c7ff);
    -webkit-background-clip:text;
    color:transparent;
}

.badge{
    margin-left:auto;
    color:#8c8c99;
    font-size:13px;
}

.container{
    width:min(1100px,calc(100% - 30px));
    margin:30px auto;
}

h1{
    font-size:35px;
    margin-bottom:8px;
}

.subtitle{
    color:#858591;
    margin-bottom:28px;
}

.panel{
    background:rgba(20,20,28,.88);
    border:1px solid #30303b;
    border-radius:22px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 10px 50px rgba(0,0,0,.2);
}

textarea{
    width:100%;
    min-height:150px;
    resize:vertical;
    background:#101017;
    color:white;
    border:1px solid #363642;
    border-radius:15px;
    outline:none;
    padding:15px;
    font-size:16px;
}

textarea:focus{
    border-color:#7660ff;
    box-shadow:0 0 0 3px rgba(118,96,255,.1);
}

.controls{
    display:flex;
    gap:12px;
    margin-top:15px;
    flex-wrap:wrap;
}

button{
    border:1px solid #3a3947;
    border-radius:13px;
    background:#191922;
    color:white;
    padding:12px 18px;
    cursor:pointer;
    font-size:14px;
}

button:hover{
    background:#252532;
}

.start{
    border:0;
    background:linear-gradient(135deg,#805cff,#16bfff);
}

.stop{
    background:#24181e;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.stat{
    background:#111118;
    border:1px solid #292933;
    border-radius:16px;
    padding:18px;
}

.label{
    color:#777783;
    font-size:12px;
    margin-bottom:8px;
}

.value{
    font-size:25px;
    font-weight:bold;
}

.progress{
    height:12px;
    background:#111118;
    border-radius:20px;
    overflow:hidden;
    margin-top:18px;
}

.bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#805cff,#19c4ff);
    transition:.2s;
}

.log{
    max-height:350px;
    overflow:auto;
    font-family:monospace;
    font-size:13px;
}

.line{
    padding:9px 0;
    border-bottom:1px solid #22222b;
    color:#a7a7b3;
}

.line b{
    color:#fff;
}

.download{
    display:none;
    margin-top:15px;
    background:linear-gradient(135deg,#5d5cff,#00baff);
    border:0;
}

@media(max-width:700px){
    .stats{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">✦ Ghost AI Training</div>
    <div class="badge">DATA COLLECTION</div>
</header>

<div class="container">

    <h1>Training Data</h1>

    <div class="subtitle">
        Wörter eingeben → DuckDuckGo durchsuchen → Daten als JSON sammeln
    </div>

    <div class="panel">

        <textarea
            id="words"
            placeholder="Bis zu 100 Wörter eingeben...

Beispiel:
Katze
Computer
Weltraum
Physik
Geschichte"
        ></textarea>

        <div class="controls">
            <button class="start" onclick="startTraining()">
                ▶ Training starten
            </button>

            <button class="stop" onclick="stopTraining()">
                ■ Stoppen
            </button>

            <button onclick="clearAll()">
                Alles löschen
            </button>
        </div>

    </div>

    <div class="panel">

        <div class="stats">

            <div class="stat">
                <div class="label">Wörter</div>
                <div class="value" id="wordCount">0 / 100</div>
            </div>

            <div class="stat">
                <div class="label">Verarbeitet</div>
                <div class="value" id="processed">0</div>
            </div>

            <div class="stat">
                <div class="label">JSON</div>
                <div class="value" id="size">0 MB</div>
            </div>

            <div class="stat">
                <div class="label">Status</div>
                <div class="value" id="status">Bereit</div>
            </div>

        </div>

        <div class="progress">
            <div class="bar" id="bar"></div>
        </div>

        <button
            class="download"
            id="download"
            onclick="downloadJSON()">
            JSON herunterladen
        </button>

    </div>

    <div class="panel">

        <h3>Verarbeitung</h3>

        <div class="log" id="log"></div>

    </div>

</div>

<script>

const MAX_BYTES = 25 * 1024 * 1024;
const MAX_WORDS = 100;

let running = false;
let dataset = [];

function byteSize(data){
    return new TextEncoder().encode(
        JSON.stringify(data)
    ).length;
}

function mb(bytes){
    return (bytes / 1024 / 1024).toFixed(3);
}

function log(text){
    const box=document.getElementById("log");

    const div=document.createElement("div");
    div.className="line";
    div.innerHTML=text;

    box.appendChild(div);
    box.scrollTop=box.scrollHeight;
}

function update(){

    const bytes=byteSize(dataset);

    document.getElementById("size").textContent =
        mb(bytes)+" MB";

    document.getElementById("processed").textContent =
        dataset.length;

    const words=
        document.getElementById("words")
        .value
        .split(/\s+/)
        .filter(Boolean)
        .slice(0,MAX_WORDS);

    document.getElementById("wordCount").textContent =
        words.length+" / "+MAX_WORDS;

    document.getElementById("bar").style.width =
        Math.min(100,(bytes/MAX_BYTES)*100)+"%";
}

async function startTraining(){

    if(running) return;

    const words=document.getElementById("words")
        .value
        .split(/\s+/)
        .map(x=>x.trim())
        .filter(Boolean)
        .slice(0,MAX_WORDS);

    if(!words.length){
        alert("Bitte Wörter eingeben.");
        return;
    }

    running=true;

    document.getElementById("status").textContent="Läuft";
    document.getElementById("download").style.display="none";

    log("<b>Training gestartet</b>");

    for(let i=0;i<words.length;i++){

        if(!running) break;

        const word=words[i];

        log("Suche: <b>"+escapeHTML(word)+"</b>");

        try{

            const response=await fetch(
                "/api/training/search",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify({
                        word:word
                    })
                }
            );

            const result=await response.json();

            if(!response.ok){
                throw new Error(result.error || "Fehler");
            }

            const candidate={
                word:word,
                results:result.results
            };

            /*
             * WICHTIG:
             * Erst komplett testen.
             * Wenn das neue JSON >25 MiB wäre,
             * wird der Datensatz NICHT hinzugefügt.
             */
            const test=[...dataset,candidate];

            const testBytes=byteSize(test);

            if(testBytes>MAX_BYTES){

                log(
                    "<b>25-MB-Grenze erreicht.</b> " +
                    "Das Wort wurde nicht mehr hinzugefügt."
                );

                break;
            }

            dataset.push(candidate);

            update();

            log(
                "✓ "+escapeHTML(word)+
                " verarbeitet — "+
                result.results.length+
                " Ergebnisse"
            );

        }catch(error){

            log(
                "⚠ Fehler bei "+
                escapeHTML(word)+
                ": "+
                escapeHTML(error.message)
            );
        }

        await new Promise(
            resolve=>setTimeout(resolve,500)
        );
    }

    running=false;

    document.getElementById("status").textContent=
        "Fertig";

    document.getElementById("download").style.display=
        dataset.length ? "inline-block" : "none";

    update();

    log(
        "<b>Fertig.</b> JSON-Größe: "+
        mb(byteSize(dataset))+
        " MB"
    );
}

function stopTraining(){

    running=false;

    document.getElementById("status").textContent=
        "Gestoppt";

    log("<b>Training gestoppt.</b>");
}

function clearAll(){

    running=false;
    dataset=[];

    document.getElementById("log").innerHTML="";
    document.getElementById("download").style.display="none";
    document.getElementById("status").textContent="Bereit";

    update();
}

function downloadJSON(){

    /*
     * Sicherheitsprüfung:
     * Es wird nur heruntergeladen, wenn das
     * tatsächliche UTF-8-JSON maximal 25 MiB ist.
     */
    const text=JSON.stringify(
        dataset,
        null,
        2
    );

    const bytes=new TextEncoder().encode(text).length;

    if(bytes>MAX_BYTES){

        alert(
            "Abbruch: Das JSON wäre größer als 25 MB."
        );

        return;
    }

    const blob=new Blob(
        [text],
        {type:"application/json"}
    );

    const url=URL.createObjectURL(blob);

    const a=document.createElement("a");

    a.href=url;
    a.download="training-data.json";

    a.click();

    URL.revokeObjectURL(url);
}

function escapeHTML(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

update();

</script>

</body>
</html>
