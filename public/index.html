<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghost AI – Training</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at 20% 10%, rgba(100,70,255,.18), transparent 30%),
        radial-gradient(circle at 80% 90%, rgba(0,180,255,.14), transparent 30%),
        #08090d;
    color: #fff;
    font-family: Arial, sans-serif;
}

.container {
    width: min(1000px, 94%);
    margin: 30px auto;
}

h1 {
    font-size: 34px;
    margin-bottom: 6px;
}

.subtitle {
    color: #9da3b4;
    margin-bottom: 25px;
}

.card {
    background: rgba(20,22,30,.88);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 22px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
}

textarea {
    width: 100%;
    min-height: 150px;
    resize: vertical;
    border: 1px solid #303442;
    border-radius: 15px;
    background: #10121a;
    color: white;
    padding: 16px;
    font-size: 16px;
    outline: none;
}

textarea:focus {
    border-color: #735cff;
    box-shadow: 0 0 25px rgba(115,92,255,.2);
}

.buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 15px;
}

button {
    border: 0;
    border-radius: 13px;
    padding: 13px 19px;
    color: white;
    background: #292d3a;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
}

button:hover {
    filter: brightness(1.15);
}

.start {
    background: linear-gradient(135deg,#715cff,#287dff);
}

.download {
    background: linear-gradient(135deg,#00a878,#00c98a);
}

.reset {
    background: #3a2025;
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 12px;
}

.stat {
    background: #10121a;
    border-radius: 15px;
    padding: 18px;
}

.stat-label {
    color: #858b9c;
    font-size: 13px;
}

.stat-value {
    font-size: 25px;
    font-weight: bold;
    margin-top: 7px;
}

.progress {
    width: 100%;
    height: 12px;
    background: #151821;
    border-radius: 99px;
    overflow: hidden;
    margin-top: 15px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(
        90deg,
        #765cff,
        #2da8ff
    );
    transition: width .2s ease;
}

#status {
    color: #b8bdcc;
    line-height: 1.6;
    white-space: pre-wrap;
}

.log {
    max-height: 300px;
    overflow-y: auto;
    background: #0b0d13;
    border-radius: 14px;
    padding: 14px;
    font-family: monospace;
    font-size: 13px;
}

.log div {
    padding: 5px 0;
    border-bottom: 1px solid rgba(255,255,255,.04);
}

.ok {
    color: #55e6a5;
}

.warn {
    color: #ffd166;
}

.error {
    color: #ff7180;
}

@media (max-width: 650px) {
    .stats {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 27px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Ghost AI Training</h1>
    <div class="subtitle">
        DuckDuckGo-Datensammlung · maximal 25 MiB JSON
    </div>

    <div class="card">

        <textarea
            id="words"
            placeholder="Bis zu 100 Wörter eingeben...
Zum Beispiel:
computer
künstliche intelligenz
roboter
raumfahrt
programmieren"
        ></textarea>

        <div class="buttons">
            <button
                class="start"
                id="startBtn"
                onclick="startTraining()"
            >
                Training starten
            </button>

            <button
                class="download"
                id="downloadBtn"
                onclick="downloadJSON()"
            >
                JSON herunterladen
            </button>

            <button
                class="reset"
                onclick="resetTraining()"
            >
                Zurücksetzen
            </button>
        </div>

    </div>

    <div class="card">

        <div class="stats">

            <div class="stat">
                <div class="stat-label">
                    JSON-Größe
                </div>

                <div
                    class="stat-value"
                    id="size"
                >
                    0 MB
                </div>
            </div>

            <div class="stat">
                <div class="stat-label">
                    Wörter
                </div>

                <div
                    class="stat-value"
                    id="wordCount"
                >
                    0 / 100
                </div>
            </div>

            <div class="stat">
                <div class="stat-label">
                    Ergebnisse
                </div>

                <div
                    class="stat-value"
                    id="resultCount"
                >
                    0
                </div>
            </div>

        </div>

        <div class="progress">
            <div
                class="progress-bar"
                id="progressBar"
            ></div>
        </div>

    </div>

    <div class="card">

        <h3>Status</h3>

        <div id="status">
            Bereit.
        </div>

    </div>

    <div class="card">

        <h3>Training-Log</h3>

        <div
            class="log"
            id="log"
        ></div>

    </div>

</div>

<script>
"use strict";

// =====================================================
// KONFIGURATION
// =====================================================

// 25 MiB = exakt 25 * 1024 * 1024 Bytes
const MAX_BYTES =
    25 * 1024 * 1024;

const MAX_WORDS = 100;

// Bis zu 100 Ergebnisse werden vom Server erwartet
const MAX_RESULTS_PER_WORD = 100;

// =====================================================
// DATEN
// =====================================================

let dataset = [];

let trainingRunning = false;

// =====================================================
// ELEMENTE
// =====================================================

const wordsInput =
    document.getElementById("words");

const startBtn =
    document.getElementById("startBtn");

const downloadBtn =
    document.getElementById("downloadBtn");

const sizeElement =
    document.getElementById("size");

const wordCountElement =
    document.getElementById("wordCount");

const resultCountElement =
    document.getElementById("resultCount");

const progressBar =
    document.getElementById("progressBar");

const statusElement =
    document.getElementById("status");

const logElement =
    document.getElementById("log");

// =====================================================
// UTF-8 BYTE-GRÖSSE
// =====================================================

function getJSONBytes(data) {

    const json =
        JSON.stringify(data);

    return new TextEncoder()
        .encode(json)
        .length;
}

// =====================================================
// MB ANZEIGE
// =====================================================

function bytesToMB(bytes) {
    return (
        bytes /
        1024 /
        1024
    ).toFixed(3);
}

// =====================================================
// UI AKTUALISIEREN
// =====================================================

function updateUI() {

    const bytes =
        getJSONBytes(dataset);

    const resultCount =
        dataset.reduce(
            (sum, item) =>
                sum +
                (
                    Array.isArray(item.results)
                        ? item.results.length
                        : 0
                ),
            0
        );

    sizeElement.textContent =
        bytesToMB(bytes) +
        " MB";

    wordCountElement.textContent =
        dataset.length +
        " / " +
        MAX_WORDS;

    resultCountElement.textContent =
        resultCount.toLocaleString(
            "de-DE"
        );

    const percent =
        Math.min(
            100,
            (
                bytes /
                MAX_BYTES
            ) * 100
        );

    progressBar.style.width =
        percent + "%";
}

// =====================================================
// LOG
// =====================================================

function addLog(
    message,
    type = ""
) {

    const line =
        document.createElement("div");

    if (type) {
        line.className = type;
    }

    const time =
        new Date()
            .toLocaleTimeString(
                "de-DE"
            );

    line.textContent =
        "[" +
        time +
        "] " +
        message;

    logElement.appendChild(line);

    logElement.scrollTop =
        logElement.scrollHeight;
}

// =====================================================
// STATUS
// =====================================================

function setStatus(text) {
    statusElement.textContent =
        text;
}

// =====================================================
// WÖRTER AUSLESEN
// =====================================================

function getWords() {

    return wordsInput.value
        .split(/[\n,;]+/)
        .map(word =>
            word.trim()
        )
        .filter(Boolean)
        .slice(
            0,
            MAX_WORDS
        );
}

// =====================================================
// TRAINING
// =====================================================

async function startTraining() {

    if (trainingRunning) {
        return;
    }

    const words =
        getWords();

    if (!words.length) {

        setStatus(
            "Bitte mindestens ein Wort eingeben."
        );

        return;
    }

    trainingRunning = true;

    startBtn.disabled = true;
    downloadBtn.disabled = true;

    addLog(
        `Training gestartet: ${words.length} Wörter`
    );

    setStatus(
        "Training läuft..."
    );

    for (
        let i = 0;
        i < words.length;
        i++
    ) {

        const word =
            words[i];

        // Bereits 100 Wörter?
        if (
            dataset.length >=
            MAX_WORDS
        ) {

            addLog(
                "100 Wörter erreicht.",
                "warn"
            );

            break;
        }

        // Aktuelle Größe prüfen
        const currentBytes =
            getJSONBytes(dataset);

        if (
            currentBytes >=
            MAX_BYTES
        ) {

            addLog(
                "25-MB-Grenze erreicht.",
                "warn"
            );

            break;
        }

        const progress =
            (
                i /
                words.length
            ) * 100;

        progressBar.style.width =
            progress + "%";

        setStatus(
            `Suche: ${word}\n` +
            `${i + 1} / ${words.length}`
        );

        addLog(
            `Suche: ${word}`
        );

        try {

            const response =
                await fetch(
                    "/api/training/search",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            word
                        })
                    }
                );

            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}`
                );
            }

            const data =
                await response.json();

            const results =
                Array.isArray(
                    data.results
                )
                    ? data.results
                    : [];

            // ==========================================
            // KANDIDAT ERSTELLEN
            // ==========================================

            const candidate = {
                word,
                results
            };

            // ==========================================
            // VOR DEM HINZUFÜGEN BYTE-GRÖSSE TESTEN
            // ==========================================

            const testDataset = [
                ...dataset,
                candidate
            ];

            const testBytes =
                getJSONBytes(
                    testDataset
                );

            // ==========================================
            // 25 MiB DARF NICHT ÜBERSCHRITTEN WERDEN
            // ==========================================

            if (
                testBytes >
                MAX_BYTES
            ) {

                addLog(
                    `"${word}" würde die 25-MB-Grenze überschreiten.`
                    ,
                    "warn"
                );

                setStatus(
                    "25-MB-Grenze erreicht. " +
                    "Training wurde sicher gestoppt."
                );

                break;
            }

            // ==========================================
            // DATEN ÜBERNEHMEN
            // ==========================================

            dataset.push(
                candidate
            );

            updateUI();

            addLog(
                `✓ ${word} verarbeitet — ${results.length} Ergebnisse`,
                "ok"
            );

        } catch (error) {

            addLog(
                `✗ ${word}: ${error.message}`,
                "error"
            );

            setStatus(
                `Fehler bei "${word}".`
            );
        }

        // Kurze Pause zwischen Wörtern
        await sleep(500);
    }

    progressBar.style.width =
        "100%";

    updateUI();

    trainingRunning = false;

    startBtn.disabled = false;
    downloadBtn.disabled =
        dataset.length === 0;

    setStatus(
        `Fertig. JSON-Größe: ${bytesToMB(
            getJSONBytes(dataset)
        )} MB`
    );

    addLog(
        `TRAINING FERTIG — ${dataset.length} Wörter`,
        "ok"
    );
}

// =====================================================
// JSON DOWNLOAD
// =====================================================

function downloadJSON() {

    if (!dataset.length) {

        setStatus(
            "Keine Trainingsdaten vorhanden."
        );

        return;
    }

    const json =
        JSON.stringify(
            dataset,
            null,
            2
        );

    const bytes =
        new TextEncoder()
            .encode(json)
            .length;

    // Sicherheitsprüfung
    if (
        bytes >
        MAX_BYTES
    ) {

        setStatus(
            "FEHLER: JSON wäre größer als 25 MiB. Download abgebrochen."
        );

        addLog(
            "Download wegen Größenüberschreitung abgebrochen.",
            "error"
        );

        return;
    }

    // ==========================================
    // DOWNLOAD
    // ==========================================

    const blob =
        new Blob(
            [json],
            {
                type:
                    "application/json;charset=utf-8"
            }
        );

    const url =
        URL.createObjectURL(
            blob
        );

    const link =
        document.createElement("a");

    link.href = url;

    link.download =
        "ghost-ai-training.json";

    document.body.appendChild(
        link
    );

    link.click();

    link.remove();

    URL.revokeObjectURL(
        url
    );

    // ==========================================
    // NACH DEM DOWNLOAD:
    // DATEN AUF 0 MB ZURÜCKSETZEN
    // ==========================================

    dataset = [];

    updateUI();

    progressBar.style.width =
        "0%";

    downloadBtn.disabled =
        true;

    setStatus(
        "JSON heruntergeladen. " +
        "Trainingsdaten wurden auf 0 MB zurückgesetzt."
    );

    addLog(
        "✓ JSON heruntergeladen.",
        "ok"
    );

    addLog(
        "✓ Trainingsdaten gelöscht — 0 MB.",
        "ok"
    );
}

// =====================================================
// MANUELLES RESET
// =====================================================

function resetTraining() {

    if (
        trainingRunning
    ) {
        return;
    }

    dataset = [];

    updateUI();

    progressBar.style.width =
        "0%";

    downloadBtn.disabled =
        true;

    setStatus(
        "Trainingsdaten zurückgesetzt: 0 MB."
    );

    addLog(
        "Trainingsdaten zurückgesetzt."
    );
}

// =====================================================
// SLEEP
// =====================================================

function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );
}

// =====================================================
// START
// =====================================================

updateUI();

downloadBtn.disabled = true;

</script>

</body>
</html>
