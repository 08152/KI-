<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ghost AI Training</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    background:#07080d;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
}

h1{
    margin:0 0 5px;
}

.sub{
    color:#8d91a3;
    margin-bottom:20px;
}

.card{
    background:#11131c;
    border:1px solid #252938;
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
}

textarea{
    width:100%;
    min-height:160px;
    resize:vertical;
    background:#090b11;
    color:white;
    border:1px solid #303447;
    border-radius:14px;
    padding:15px;
    font-size:16px;
    outline:none;
}

textarea:focus{
    border-color:#7180ff;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:14px;
}

button{
    border:0;
    border-radius:12px;
    padding:13px 18px;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

#start{
    background:linear-gradient(135deg,#7757ff,#328cff);
}

#download{
    background:linear-gradient(135deg,#0ca978,#178cff);
}

#reset{
    background:#292d3b;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.stat{
    background:#090b11;
    border-radius:13px;
    padding:14px;
}

.label{
    color:#85899b;
    font-size:13px;
}

.value{
    font-size:22px;
    font-weight:bold;
    margin-top:6px;
}

.progressBox{
    height:12px;
    margin-top:18px;
    background:#090b11;
    border-radius:20px;
    overflow:hidden;
}

#progress{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#7657ff,#32a7ff);
    transition:.2s;
}

#status{
    margin-top:12px;
    color:#a8acbb;
}

#log{
    height:280px;
    overflow:auto;
    background:#080a0f;
    border-radius:13px;
    padding:12px;
    font-family:monospace;
    font-size:13px;
}

.line{
    padding:4px 0;
    border-bottom:1px solid #151823;
}

.ok{color:#52e6a2}
.warn{color:#ffd166}
.err{color:#ff7070}

@media(max-width:700px){
    .stats{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Ghost AI Training</h1>
    <div class="sub">
        Suchdaten und Bedeutungen sammeln
    </div>

    <div class="card">

        <textarea id="words"
            placeholder="Bis zu 100 Begriffe eingeben, jeweils eine Zeile:

Computer
Internet
Roboter
Künstliche Intelligenz"></textarea>

        <div class="buttons">
            <button id="start">Training starten</button>
            <button id="download">JSON herunterladen</button>
            <button id="reset">Zurücksetzen</button>
        </div>

    </div>

    <div class="card">

        <div class="stats">

            <div class="stat">
                <div class="label">JSON-Größe</div>
                <div class="value" id="size">0 MB</div>
            </div>

            <div class="stat">
                <div class="label">Begriffe</div>
                <div class="value" id="count">0</div>
            </div>

            <div class="stat">
                <div class="label">Ergebnisse</div>
                <div class="value" id="results">0</div>
            </div>

            <div class="stat">
                <div class="label">Limit</div>
                <div class="value">25 MiB</div>
            </div>

        </div>

        <div class="progressBox">
            <div id="progress"></div>
        </div>

        <div id="status">Bereit.</div>

    </div>

    <div class="card">
        <div id="log"></div>
    </div>

</div>

<script>

const MAX_BYTES = 25 * 1024 * 1024;
const MAX_WORDS = 100;
const REQUEST_TIMEOUT = 45000;

let dataset = [];
let running = false;

const words = document.getElementById("words");
const start = document.getElementById("start");
const download = document.getElementById("download");
const reset = document.getElementById("reset");

const size = document.getElementById("size");
const count = document.getElementById("count");
const results = document.getElementById("results");
const progress = document.getElementById("progress");
const status = document.getElementById("status");
const logBox = document.getElementById("log");

function bytes(){
    return new TextEncoder()
        .encode(JSON.stringify(dataset))
        .length;
}

function mb(n){
    return (n / 1024 / 1024).toFixed(3) + " MB";
}

function log(text,type=""){
    const div = document.createElement("div");
    div.className = "line " + type;
    div.textContent =
        "[" +
        new Date().toLocaleTimeString() +
        "] " +
        text;

    logBox.appendChild(div);
    logBox.scrollTop = logBox.scrollHeight;
}

function update(){

    const b = bytes();

    size.textContent = mb(b);
    count.textContent = dataset.length;

    let total = 0;

    for(const item of dataset){

        if(Array.isArray(item.results))
            total += item.results.length;

        if(Array.isArray(item.meaning))
            total += item.meaning.length;
    }

    results.textContent = total;

    progress.style.width =
        Math.min(
            100,
            b / MAX_BYTES * 100
        ) + "%";
}

function getWords(){

    return words.value
        .split(/\r?\n|,/)
        .map(x => x.trim())
        .filter(Boolean)
        .slice(0,MAX_WORDS);
}

function timeoutFetch(url,options={}){

    const controller =
        new AbortController();

    const timer =
        setTimeout(
            () => controller.abort(),
            REQUEST_TIMEOUT
        );

    return fetch(
        url,
        {
            ...options,
            signal:controller.signal
        }
    )
    .finally(
        () => clearTimeout(timer)
    );
}

async function search(word){

    log(
        "Suche nach: " + word
    );

    status.textContent =
        "Suche nach: " + word;

    let response;

    try{

        response =
            await timeoutFetch(
                "/api/training/search",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        word:word
                    })
                }
            );

    }catch(error){

        if(error.name === "AbortError"){
            throw new Error(
                "Zeitüberschreitung nach 45 Sekunden"
            );
        }

        throw new Error(
            "Server nicht erreichbar"
        );
    }

    if(!response.ok){

        let message =
            "HTTP " + response.status;

        try{
            const error =
                await response.json();

            if(error.error)
                message = error.error;
        }catch{}

        throw new Error(message);
    }

    let data;

    try{
        data = await response.json();
    }catch{
        throw new Error(
            "Server hat kein gültiges JSON geliefert"
        );
    }

    return {
        word:word,

        results:
            Array.isArray(data.results)
                ? data.results
                : [],

        meaning:
            Array.isArray(data.meaning)
                ? data.meaning
                : []
    };
}

start.onclick = async () => {

    if(running)
        return;

    const list = getWords();

    if(!list.length){

        status.textContent =
            "Keine Begriffe eingegeben.";

        log(
            "Bitte Begriffe eingeben.",
            "warn"
        );

        return;
    }

    running = true;
    start.disabled = true;

    log(
        "Training gestartet: " +
        list.length +
        " Begriffe",
        "ok"
    );

    for(let i=0;i<list.length;i++){

        const word = list[i];

        status.textContent =
            "Begriff " +
            (i+1) +
            " / " +
            list.length +
            ": " +
            word;

        try{

            const item =
                await search(word);

            const test =
                [
                    ...dataset,
                    item
                ];

            const testBytes =
                new TextEncoder()
                    .encode(
                        JSON.stringify(test)
                    )
                    .length;

            if(testBytes > MAX_BYTES){

                log(
                    "25-MiB-Limit erreicht. " +
                    word +
                    " wurde NICHT gespeichert.",
                    "warn"
                );

                status.textContent =
                    "25-MiB-Limit erreicht.";

                break;
            }

            dataset.push(item);

            update();

            log(
                word +
                " → " +
                item.results.length +
                " Suchergebnisse + " +
                item.meaning.length +
                " Bedeutungs-Ergebnisse",
                "ok"
            );

        }catch(error){

            log(
                word +
                " → FEHLER: " +
                error.message,
                "err"
            );

            status.textContent =
                "Fehler bei " + word;

            /*
             * Wichtig:
             * Ein Fehler beendet nicht das
             * gesamte Training.
             */
        }

        /*
         * Kleine Pause zwischen Begriffen.
         */
        if(i < list.length - 1){

            await new Promise(
                resolve =>
                    setTimeout(resolve,1500)
            );
        }
    }

    running = false;
    start.disabled = false;

    update();

    status.textContent =
        "Training beendet.";

    log(
        "Training beendet.",
        "ok"
    );
};

download.onclick = () => {

    if(dataset.length === 0){

        status.textContent =
            "Keine Trainingsdaten vorhanden.";

        log(
            "Download nicht möglich: Datensatz leer.",
            "warn"
        );

        return;
    }

    const json =
        JSON.stringify(
            dataset,
            null,
            2
        );

    const sizeBytes =
        new TextEncoder()
            .encode(json)
            .length;

    if(sizeBytes > MAX_BYTES){

        log(
            "Download verhindert: JSON über 25 MiB.",
            "err"
        );

        return;
    }

    const blob =
        new Blob(
            [json],
            {
                type:"application/json"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;
    a.download =
        "ghost-ai-training.json";

    document.body.appendChild(a);
    a.click();
    a.remove();

    URL.revokeObjectURL(url);

    log(
        "JSON heruntergeladen: " +
        mb(sizeBytes),
        "ok"
    );

    /*
     * Nach erfolgreichem Download
     * automatisch leeren.
     */
    dataset = [];

    update();

    status.textContent =
        "Download erfolgreich – Daten zurückgesetzt.";

    log(
        "Trainingsdaten automatisch zurückgesetzt.",
        "ok"
    );
};

reset.onclick = () => {

    if(running){

        status.textContent =
            "Während des Trainings nicht möglich.";

        return;
    }

    dataset = [];

    update();

    status.textContent =
        "Daten zurückgesetzt.";

    log(
        "Datensatz geleert.",
        "warn"
    );
};

update();

</script>

</body>
</html>
